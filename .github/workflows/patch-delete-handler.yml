name: Patch archive delete handler
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cloned archive handler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-random-pairs.js')
          s=p.read_text()
          old="const cloned=modal.querySelector('.clean-archive-body');if(cloned){cloned.querySelectorAll('[data-clean-select]').forEach(b=>{b.onclick=()=>{selectTournament(b.getAttribute('data-clean-select'));closeArchive();};});"
          new="const cloned=modal.querySelector('.clean-archive-body');if(cloned){cloned.querySelectorAll('[data-clean-select]').forEach(b=>{b.onclick=()=>{selectTournament(b.getAttribute('data-clean-select'));closeArchive();};});cloned.querySelectorAll('[data-clean-delete]').forEach(b=>{b.onclick=async e=>{e.preventDefault();e.stopPropagation();const fn=window.eliminaTorneo;if(typeof fn!=='function'){alert('Funzione eliminazione torneo non disponibile.');return;}const ok=await fn(b.getAttribute('data-clean-delete'));if(ok){closeArchive();setTimeout(()=>openArchive(),150);}};});"
          if old not in s:
              raise SystemExit('marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-delete-handler.yml
          git add admin-random-pairs.js .github/workflows/patch-delete-handler.yml
          git commit -m 'Fix archive modal Elimina action'
          git push
