name: Fix KO layout v3

on:
  push:
    branches: [main]
    paths:
      - 'Bove.html'
      - '.github/workflows/fix-ko-layout-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Repair KO source geometry
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Remove the late override that was forcing KO columns 2 and 3 to 50.5px.
          s = re.sub(
              r'\n<style>\s*/\* BOVE MINUTES ADJACENT TO HOUR - REPAIR ONLY \*/.*?</style>\s*</head>',
              '\n</head>',
              s,
              count=1,
              flags=re.S,
          )

          # The KO tables are five real columns: Campo, Ora, Match, Ris1, Ris2.
          # Fix the two header rows in all three stages.
          for title in ('QUARTI DI FINALE', 'SEMIFINALI', 'FINALE'):
              s, n = re.subn(
                  r'(<th\s+colspan=")6("\s*>\s*' + re.escape(title) + r'\s*</th>)',
                  r'\g<1>5\g<2>',
                  s,
                  count=1,
                  flags=re.S,
              )
              if n != 1:
                  raise SystemExit(f'Titolo KO non trovato: {title}')

          s = s.replace(
              '<th colspan="2">Ris</th>',
              '<th>Ris 1</th>\n                        <th>Ris 2</th>'
          )

          # Exact desktop geometry: 53 + 82.03 + 180 + 62 + 62 = 439.03px.
          s = re.sub(
              r'(table:has\(> tbody#Q\),\s*table:has\(> tbody#S\),\s*table:has\(> tbody#finaleBox\),\s*\.koBox table,\s*\.finalContainer table\s*\{).*?\n\}',
              r'''\1
    table-layout: fixed !important;
    width: 439.03px !important;
    min-width: 439.03px !important;
    max-width: 439.03px !important;
    border-collapse: collapse !important;
    border-spacing: 0 !important;
    margin: 10px auto !important;
    box-sizing: border-box !important;
}''',
              s,
              count=2,
              flags=re.S,
          )

          mobile = r'''
/* BOVE KO MOBILE COMPACT V3 — DO NOT ALTER GIRONI */
@media (max-width:599px) {
    .finalContainer,
    .finalContainer .groups,
    .finalContainer .card,
    .koBox {
        width:100% !important;
        max-width:100% !important;
        min-width:0 !important;
        box-sizing:border-box !important;
        overflow-x:hidden !important;
    }

    .finalContainer table,
    .koBox table,
    table:has(> tbody#Q),
    table:has(> tbody#S),
    table:has(> tbody#finaleBox) {
        width:100% !important;
        min-width:0 !important;
        max-width:100% !important;
        table-layout:fixed !important;
        margin:8px 0 !important;
        border-spacing:0 !important;
    }

    .finalContainer table th,
    .finalContainer table td,
    .koBox table th,
    .koBox table td,
    table:has(> tbody#Q) th,
    table:has(> tbody#Q) td,
    table:has(> tbody#S) th,
    table:has(> tbody#S) td,
    table:has(> tbody#finaleBox) th,
    table:has(> tbody#finaleBox) td {
        padding:5px 1px !important;
        min-width:0 !important;
        box-sizing:border-box !important;
        overflow:hidden !important;
    }

    /* 12% Campo / 24% Ora / 32% Match / 16% Ris1 / 16% Ris2 */
    .finalContainer table th:nth-child(1), .finalContainer table td:nth-child(1),
    .koBox table th:nth-child(1), .koBox table td:nth-child(1),
    table:has(> tbody#Q) th:nth-child(1), table:has(> tbody#Q) td:nth-child(1),
    table:has(> tbody#S) th:nth-child(1), table:has(> tbody#S) td:nth-child(1),
    table:has(> tbody#finaleBox) th:nth-child(1), table:has(> tbody#finaleBox) td:nth-child(1) { width:12% !important; }

    .finalContainer table th:nth-child(2), .finalContainer table td:nth-child(2),
    .koBox table th:nth-child(2), .koBox table td:nth-child(2),
    table:has(> tbody#Q) th:nth-child(2), table:has(> tbody#Q) td:nth-child(2),
    table:has(> tbody#S) th:nth-child(2), table:has(> tbody#S) td:nth-child(2),
    table:has(> tbody#finaleBox) th:nth-child(2), table:has(> tbody#finaleBox) td:nth-child(2) { width:24% !important; }

    .finalContainer table th:nth-child(3), .finalContainer table td:nth-child(3),
    .koBox table th:nth-child(3), .koBox table td:nth-child(3),
    table:has(> tbody#Q) th:nth-child(3), table:has(> tbody#Q) td:nth-child(3),
    table:has(> tbody#S) th:nth-child(3), table:has(> tbody#S) td:nth-child(3),
    table:has(> tbody#finaleBox) th:nth-child(3), table:has(> tbody#finaleBox) td:nth-child(3) { width:32% !important; }

    .finalContainer table th:nth-child(4), .finalContainer table td:nth-child(4),
    .finalContainer table th:nth-child(5), .finalContainer table td:nth-child(5),
    .koBox table th:nth-child(4), .koBox table td:nth-child(4),
    .koBox table th:nth-child(5), .koBox table td:nth-child(5),
    table:has(> tbody#Q) th:nth-child(4), table:has(> tbody#Q) td:nth-child(4),
    table:has(> tbody#Q) th:nth-child(5), table:has(> tbody#Q) td:nth-child(5),
    table:has(> tbody#S) th:nth-child(4), table:has(> tbody#S) td:nth-child(4),
    table:has(> tbody#S) th:nth-child(5), table:has(> tbody#S) td:nth-child(5),
    table:has(> tbody#finaleBox) th:nth-child(4), table:has(> tbody#finaleBox) td:nth-child(4),
    table:has(> tbody#finaleBox) th:nth-child(5), table:has(> tbody#finaleBox) td:nth-child(5) { width:16% !important; }

    .campo-cell input,
    .score-cell input,
    .orario-cell input[type="time"] {
        min-width:0 !important;
        max-width:100% !important;
        box-sizing:border-box !important;
        margin:0 auto !important;
    }

    .campo-cell input { width:100% !important; height:28px !important; padding:2px !important; font-size:12px !important; }
    .orario-cell input[type="time"] { width:100% !important; height:28px !important; padding:0 !important; font-size:11px !important; }
    .score-cell input { width:100% !important; height:28px !important; padding:2px !important; font-size:12px !important; }

    .match-cell,
    table:has(> tbody#Q) .match-cell,
    table:has(> tbody#S) .match-cell,
    table:has(> tbody#finaleBox) .match-cell {
        width:auto !important;
        min-width:0 !important;
        max-width:none !important;
        padding-left:2px !important;
        padding-right:2px !important;
    }

    .match-cell .team-line {
        width:100% !important;
        max-width:100% !important;
        min-width:0 !important;
        font-size:11px !important;
        line-height:15px !important;
        white-space:normal !important;
        overflow-wrap:anywhere !important;
        word-break:break-word !important;
        overflow:hidden !important;
        margin:1px 0 !important;
    }

    .match-cell .vs-line { margin:1px 0 !important; line-height:15px !important; }
}
'''
          if 'BOVE KO MOBILE COMPACT V3' not in s:
              s = s.replace('</style>', mobile + '\n</style>', 1)

          if s == original:
              raise SystemExit('Nessuna modifica applicata')

          p.write_text(s, encoding='utf-8')
          print('KO V3 source repair applied')

      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('Bove.html').read_text(encoding='utf-8')
          assert 'BOVE KO MOBILE COMPACT V3' in s
          assert 'BOVE MINUTES ADJACENT TO HOUR - REPAIR ONLY' not in s
          assert '<th>Ris 1</th>' in s and '<th>Ris 2</th>' in s
          assert s.count('function renderMatchCard') == 1
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/bove.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/bove.js

      - name: Commit repaired Bove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html
          git diff --cached --check
          git commit -m "Fix KO result column spacing and mobile geometry"
          git push origin HEAD:main
