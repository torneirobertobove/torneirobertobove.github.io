name: One-time KO flow fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fix updateRes Q/S/F progression
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')

          replacement = r'''function updateRes(g,i,pos,val){

    const map={
        A:"Ares",
        B:"Bres",
        C:"Cres",
        D:"Dres",
        E:"Eres",
        F:"Fres",
        G:"Gres"
    };

    i=Number(i);
    pos=Number(pos);

    if(!Number.isInteger(i)||i<0)
        return;

    if(pos!==0&&pos!==1)
        return;

    const gruppo=String(g||"").toUpperCase();

    if(map[gruppo]){

        const chiave=map[gruppo];

        if(!Array.isArray(state[chiave]))
            state[chiave]=[];

        let s=state[chiave];

        if(s[i]===undefined||s[i]===null||s[i]==="")
            s[i]="-";

        let p=String(s[i]).split("-");

        if(p.length!==2)
            p=["",""];

        p[pos]=String(val??"").trim();

        s[i]=(p[0]===""&&p[1]==="")
            ? "-"
            : p[0]+"-"+p[1];

    }
    else if(gruppo==="Q"){

        if(!Array.isArray(state.qRes))
            state.qRes=Array(4).fill("-");

        while(state.qRes.length<4)
            state.qRes.push("-");

        let p=String(state.qRes[i]??"-").split("-");

        if(p.length!==2)
            p=["",""];

        p[pos]=String(val??"").trim();

        state.qRes[i]=(p[0]===""&&p[1]==="")
            ? "-"
            : p[0]+"-"+p[1];

    }
    else if(gruppo==="S"){

        if(!Array.isArray(state.sTopRes))
            state.sTopRes=Array(2).fill("-");

        while(state.sTopRes.length<2)
            state.sTopRes.push("-");

        let p=String(state.sTopRes[i]??"-").split("-");

        if(p.length!==2)
            p=["",""];

        p[pos]=String(val??"").trim();

        state.sTopRes[i]=(p[0]===""&&p[1]==="")
            ? "-"
            : p[0]+"-"+p[1];

    }
    else if(gruppo==="F"){

        let p=String(state.fTopRes??"-").split("-");

        if(p.length!==2)
            p=["",""];

        p[pos]=String(val??"").trim();

        state.fTopRes=(p[0]===""&&p[1]==="")
            ? "-"
            : p[0]+"-"+p[1];

    }
    else{
        return;
    }

    if(typeof renderClass==="function")
        renderClass();

    if(typeof renderKO==="function")
        renderKO();

    if(typeof updateAndSync==="function")
        updateAndSync();

}
'''

          pattern = r'function updateRes\(g,i,pos,val\)\s*\{.*?\n\s*\}\s*\n\s*function updateCamp\('
          text, n = re.subn(
              pattern,
              replacement + '\nfunction updateCamp(',
              text,
              count=1,
              flags=re.S
          )

          if n != 1:
              raise SystemExit('ERRORE: updateRes non trovata')

          p.write_text(text, encoding='utf-8')

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          t=Path('Bove.html').read_text(encoding='utf-8')
          required=['function updateRes(g,i,pos,val){','gruppo==="Q"','gruppo==="S"','gruppo==="F"','function renderKO(){','function getWinner(match,res){']
          for x in required:
              if x not in t:
                  raise SystemExit('MANCANTE: '+x)
          print('KO FLOW FIX VALIDATO')

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git rm .github/workflows/one-time-ko-flow-fix.yml
          git commit -m 'fix: enable automatic KO winner progression'
          git push origin HEAD:main
