name: Fix Bove

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'BOVE AUTO FIX') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Bove.html
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')

          marker = '''                console.log(\n                    "COPPIE CARICATE:",\n                    state.coppie\n                );\n'''

          insert = '''                console.log(\n                    "COPPIE CARICATE:",\n                    state.coppie\n                );\n\n\n                /*\n                ====================================================\n                FALLBACK COPPIE DAGLI ISCRITTI REALI\n                Se Supabase ha caricato gli iscritti ma la\n                configurazione non contiene ancora coppie,\n                ricostruisce le coppie senza perdere i nominativi.\n                ====================================================\n                */\n\n                if(\n                    state.coppie.length === 0 &&\n                    Array.isArray(state.partecipanti) &&\n                    state.partecipanti.length > 0\n                ){\n\n                    const coppieDaIscritti = [];\n\n                    const nomePartecipante = function(p){\n\n                        if(p === null || p === undefined)\n                            return \"\";\n\n                        if(typeof p === \"string\")\n                            return p.trim();\n\n                        if(typeof p === \"number\")\n                            return String(p);\n\n                        if(typeof p !== \"object\")\n                            return String(p).trim();\n\n                        const nome = p.nome != null ? String(p.nome).trim() : \"\";\n                        const cognome = p.cognome != null ? String(p.cognome).trim() : \"\";\n\n                        if(nome && cognome)\n                            return nome + \" \" + cognome;\n\n                        if(nome)\n                            return nome;\n\n                        if(cognome)\n                            return cognome;\n\n                        if(p.nome_giocatore != null)\n                            return String(p.nome_giocatore).trim();\n\n                        if(p.email != null)\n                            return String(p.email).trim();\n\n                        return \"\";\n\n                    };\n\n                    /* Se le righe sono già coppie, conservarle. */\n                    state.partecipanti.forEach(p => {\n\n                        if(\n                            p &&\n                            typeof p === \"object\" &&\n                            (p.giocatore1 || p.giocatore2)\n                        ){\n\n                            const n1 = nomePartecipante(p.giocatore1);\n                            const n2 = nomePartecipante(p.giocatore2);\n\n                            if(n1 || n2){\n                                coppieDaIscritti.push({\n                                    giocatore1: p.giocatore1 || {nome:n1},\n                                    giocatore2: p.giocatore2 || {nome:n2}\n                                });\n                            }\n\n                        }\n\n                    });\n\n                    /* Altrimenti abbina gli iscritti due a due nell'ordine ricevuto. */\n                    if(coppieDaIscritti.length === 0){\n\n                        for(let i = 0; i + 1 < state.partecipanti.length; i += 2){\n\n                            const g1 = state.partecipanti[i];\n                            const g2 = state.partecipanti[i + 1];\n\n                            const n1 = nomePartecipante(g1);\n                            const n2 = nomePartecipante(g2);\n\n                            if(n1 || n2){\n                                coppieDaIscritti.push({\n                                    giocatore1: g1,\n                                    giocatore2: g2\n                                });\n                            }\n\n                        }\n\n                    }\n\n                    if(coppieDaIscritti.length > 0){\n\n                        state.coppie = coppieDaIscritti;\n\n                        console.log(\n                            "COPPIE RICOSTRUITE DAGLI ISCRITTI:",\n                            state.coppie\n                        );\n\n                    }\n\n                }\n'''

          if marker not in s:
              raise SystemExit('Marker coppie non trovato')
          s = s.replace(marker, insert, 1)

          old = '''    if(error || !profilo){\n\n        console.warn(\n            "Profilo amministratore non trovato"\n        );\n'''
          new = '''    if(error || !profilo){\n\n        window.__BOVE_ADMIN_AUTH_OK = false;\n\n        console.warn(\n            "Profilo amministratore non trovato"\n        );\n'''
          if old not in s:
              raise SystemExit('Marker verifyAccess error non trovato')
          s = s.replace(old, new, 1)

          old = '''    if(profilo.ruolo !== "admin"){\n\n        console.warn(\n            "Utente senza permessi admin:",\n            profilo\n        );\n'''
          new = '''    if(profilo.ruolo !== "admin"){\n\n        window.__BOVE_ADMIN_AUTH_OK = false;\n\n        console.warn(\n            "Utente senza permessi admin:",\n            profilo\n        );\n'''
          if old not in s:
              raise SystemExit('Marker ruolo non trovato')
          s = s.replace(old, new, 1)

          old = '''    console.log(\n        "ACCESSO ADMIN:",\n        profilo.nome\n    );\n}'''
          new = '''    window.__BOVE_ADMIN_AUTH_OK = true;\n\n    console.log(\n        "ACCESSO ADMIN:",\n        profilo.nome\n    );\n}'''
          if old not in s:
              raise SystemExit('Marker accesso admin non trovato')
          s = s.replace(old, new, 1)

          old = '''function bloccaGestionale(){\n\n    document\n        .querySelectorAll(\n            'input, button, textarea, select'\n        )\n        .forEach(el => {\n\n            if(\n                !el.classList.contains("back") &&\n                el.innerText !== "Stampa"\n            ){\n\n                el.disabled = true;\n                el.style.opacity = "0.6";\n            }\n        });'''
          new = '''function bloccaGestionale(){\n\n    window.__BOVE_ADMIN_AUTH_OK = false;\n\n    document\n        .querySelectorAll(\n            'input, button, textarea, select'\n        )\n        .forEach(el => {\n\n            if(\n                el.closest("#adminHamburger") ||\n                el.classList.contains("back") ||\n                el.innerText === "Stampa"\n            ){\n                return;\n            }\n\n            el.disabled = true;\n            el.style.opacity = "0.6";\n        });'''
          if old not in s:
              raise SystemExit('Marker bloccaGestionale non trovato')
          s = s.replace(old, new, 1)

          marker = '''document.addEventListener(\n    "DOMContentLoaded",\n    initDefaults\n);'''
          insert = '''document.addEventListener(\n    "DOMContentLoaded",\n    () => {\n        verifyAccess();\n    }\n);\n\ndocument.addEventListener(\n    "DOMContentLoaded",\n    initDefaults\n);'''
          if marker not in s:
              raise SystemExit('Marker avvio non trovato')
          s = s.replace(marker, insert, 1)

          p.write_text(s, encoding='utf-8')
          print('Bove.html patched')
          PY

      - name: Syntax check
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path
          s = Path('Bove.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S | re.I)
          Path('/tmp/bove-js.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('script blocks:', len(scripts))
          PY
          node --check /tmp/bove-js.js

      - name: Commit repaired file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html
          git commit -m "BOVE AUTO FIX: repair loading and admin menu" || exit 0
          git push
