name: Restore KO rendering functions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore only missing functions
        shell: python
        run: |
          from pathlib import Path

          path = Path("Bove.html")
          text = path.read_text(encoding="utf-8")

          block = r'''function renderKO(){
    ensureRules();

    const q = document.getElementById("Q");
    const s = document.getElementById("S");
    const f = document.getElementById("finaleBox") || document.getElementById("F");

    if(!q || !s || !f) return;

    q.innerHTML = "";
    s.innerHTML = "";
    f.innerHTML = "";

    if(!Array.isArray(state.finalTop)) state.finalTop = [];
    if(state.campioneTop === undefined) state.campioneTop = null;
    if(!Array.isArray(state.quarti)) state.quarti = [];
    if(!Array.isArray(state.qRes)) state.qRes = Array(4).fill("-");
    if(!Array.isArray(state.sTopRes)) state.sTopRes = Array(2).fill("-");
    if(typeof state.fTopRes !== "string") state.fTopRes = "-";

    q.style.display = state.rules.usaQuarti === true ? "block" : "none";

    const rawTeams = getFinalQualified();
    const teams = Array.isArray(rawTeams)
        ? rawTeams.map(x => x && x.squadra !== undefined ? x.squadra : x).filter(Boolean)
        : [];

    if(teams.length < 2){
        state.quarti = [];
        state.finalTop = [];
        state.campioneTop = null;
        return;
    }

    let semifinali = [];

    if(state.rules.usaQuarti === true){

        if(teams.length < 8){
            state.quarti = [];
            state.finalTop = [];
            state.campioneTop = null;
            return;
        }

        state.quarti = [
            [teams[0], teams[7]],
            [teams[3], teams[4]],
            [teams[1], teams[6]],
            [teams[2], teams[5]]
        ];

        const vincitori = [];

        state.quarti.forEach((match,index)=>{

            q.innerHTML += renderMatchCard(
                "QUARTO " + (index + 1),
                match,
                "Q",
                index,
                state.qRes[index]
            );

            const vincitore = getWinner(match,state.qRes[index]);

            if(vincitore) vincitori.push(vincitore);
        });

        if(vincitori.length !== 4){
            state.finalTop = [];
            state.campioneTop = null;
            return;
        }

        semifinali = [
            [vincitori[0],vincitori[1]],
            [vincitori[2],vincitori[3]]
        ];

    }else if(teams.length === 4){

        state.quarti = [];
        semifinali = [
            [teams[0],teams[3]],
            [teams[1],teams[2]]
        ];

    }else if(teams.length === 2){

        state.quarti = [];
        semifinali = [[teams[0],teams[1]]];

    }else{

        state.quarti = [];
        state.finalTop = [];
        state.campioneTop = null;
        return;
    }

    const finalisti = [];

    if(state.rules.usaSemifinali === true && semifinali.length > 0){

        semifinali.forEach((match,index)=>{

            s.innerHTML += renderMatchCard(
                "SEMIFINALE " + (index + 1),
                match,
                "S",
                index,
                state.sTopRes[index]
            );

            const vincitore = getWinner(match,state.sTopRes[index]);

            if(vincitore) finalisti.push(vincitore);
        });

    }else{

        semifinali.forEach(match=>{
            match.forEach(squadra=>{
                if(squadra && !finalisti.includes(squadra)) finalisti.push(squadra);
            });
        });
    }

    if(finalisti.length === 2){
        state.finalTop = [[finalisti[0],finalisti[1]]];
    }else{
        state.finalTop = [];
        state.campioneTop = null;
    }

    if(state.rules.usaFinale !== true) return;
    if(finalisti.length !== 2) return;

    f.innerHTML = renderMatchCard(
        "🏆 FINALE",
        finalisti,
        "F",
        0,
        state.fTopRes
    );

    const campione = getWinner(finalisti,state.fTopRes);

    if(campione){
        state.campioneTop = campione;
        f.innerHTML += `
            <div class="winner-box top-win">
                🏆 CAMPIONE TORNEO:<br>
                ${escapeHtml(
                    typeof campione === "object"
                        ? (campione.n || campione.nome || "")
                        : campione
                )}
            </div>
        `;
    }else{
        state.campioneTop = null;
    }
}

function renderMatchCard(titolo,match,type,index,risultato){

    if(!Array.isArray(match) || match.length !== 2) return "";

    const res = (
        typeof risultato === "string" &&
        risultato.trim() !== ""
    ) ? risultato : "-";

    const winner = getWinner(match,res);
    const stato = winner ? "Terminata" : "Da giocare";

    function nomeSquadra(squadra){
        if(squadra === null || squadra === undefined) return "";
        if(typeof squadra === "string" || typeof squadra === "number") return String(squadra);
        if(typeof squadra !== "object") return String(squadra);

        if(squadra.squadra !== undefined && squadra.squadra !== null){
            const inner = squadra.squadra;
            if(inner && inner !== squadra) return nomeSquadra(inner);
        }

        const g1 = squadra.giocatore1 || squadra.g1 || squadra.player1 || squadra.giocatoreA;
        const g2 = squadra.giocatore2 || squadra.g2 || squadra.player2 || squadra.giocatoreB;

        if(g1 || g2){
            const n1 = nomeGiocatore(g1);
            const n2 = nomeGiocatore(g2);
            if(n1 && n2) return n1 + " / " + n2;
            if(n1) return n1;
            if(n2) return n2;
        }

        if(squadra.n !== undefined && String(squadra.n).trim() !== "") return String(squadra.n).trim();
        if(squadra.nome !== undefined && String(squadra.nome).trim() !== "") return String(squadra.nome).trim();
        if(squadra.nomeSquadra !== undefined && String(squadra.nomeSquadra).trim() !== "") return String(squadra.nomeSquadra).trim();

        return "";
    }

    const nome1 = nomeSquadra(match[0]);
    const nome2 = nomeSquadra(match[1]);
    const valore = res === "-" ? "" : escapeHtml(res);
    const nomeVincitore = winner ? nomeSquadra(winner) : "";

    return `
<tr>
<td colspan="4" style="text-align:center;font-weight:bold">${escapeHtml(titolo)}</td>
</tr>
<tr>
<td>Campo ${index + 1}</td>
<td>-</td>
<td class="match-cell">
<div class="team-line">${escapeHtml(nome1)}</div>
<div class="vs-line"><b>VS</b></div>
<div class="team-line">${escapeHtml(nome2)}</div>
</td>
<td class="db-cell">
<input type="text" value="${valore}" onchange="updateKOResult('${type}',${index},this.value)" style="width:70px;text-align:center">
</td>
</tr>
<tr>
<td colspan="4" style="text-align:center">Stato: ${stato}${winner ? ` — 🏆 Passa: ${escapeHtml(nomeVincitore)}` : ""}</td>
</tr>
`;
}

function escapeHtml(val){
    return String(val ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/\"/g,"&quot;")
        .replace(/'/g,"&#39;");
}
'''

          if text.count("function renderKO(") != 0:
              raise SystemExit("ABORT: renderKO è già presente; nessuna modifica eseguita")
          if text.count("function renderMatchCard(") != 0:
              raise SystemExit("ABORT: renderMatchCard è già presente; nessuna modifica eseguita")
          if text.count("function escapeHtml(") != 0:
              raise SystemExit("ABORT: escapeHtml è già presente; nessuna modifica eseguita")

          marker = "function creaFinale(semifinali){"
          if marker not in text:
              raise SystemExit("ABORT: punto di inserimento non trovato")

          text = text.replace(marker, block + "\n\n" + marker, 1)
          path.write_text(text, encoding="utf-8")

          if text.count("function renderKO(") != 1:
              raise SystemExit("ABORT: renderKO non ripristinata correttamente")
          if text.count("function renderMatchCard(") != 1:
              raise SystemExit("ABORT: renderMatchCard non ripristinata correttamente")
          if text.count("function escapeHtml(") != 1:
              raise SystemExit("ABORT: escapeHtml non ripristinata correttamente")

      - name: Validate
        shell: bash
        run: |
          grep -n -A4 -B2 'function renderKO' Bove.html
          grep -n -A4 -B2 'function renderMatchCard' Bove.html
          grep -n -A4 -B2 'function escapeHtml' Bove.html
          git diff --check

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/restore-ko-render.yml
          git add Bove.html .github/workflows/restore-ko-render.yml
          git commit -m "Restore KO rendering functions"
          git push
