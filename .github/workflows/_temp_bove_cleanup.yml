name: Temporary Bove UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- BOVE_PLAYER_BOARD_CLEAN_UI_V1 -->'
          if marker not in s:
              patch = r'''\n<!-- BOVE_PLAYER_BOARD_CLEAN_UI_V1 -->\n<style>\n#userBackButton, #userPrintButton { display:none !important; }\n.menu-button {\n  display:flex !important;\n  width:36px !important;\n  height:36px !important;\n  padding:0 !important;\n  align-items:center !important;\n  justify-content:center !important;\n  font-size:22px !important;\n}\n#idTorneoDisplay {\n  font-size:.8rem;\n  line-height:1.1;\n  opacity:.7;\n  margin-top:3px;\n  font-weight:500;\n  text-align:center;\n}\n</style>\n<script>\n(function(){\n  function cleanPlayerBoard(){\n    var back=document.getElementById('userBackButton');\n    var print=document.getElementById('userPrintButton');\n    if(back) back.style.display='none';\n    if(print) print.style.display='none';\n    var menu=document.querySelector('.menu-button');\n    if(menu) menu.style.display='flex';\n    var titolo=document.getElementById('titoloTorneo');\n    var id=(new URLSearchParams(window.location.search)).get('idTorneo');\n    if(titolo && id){\n      var box=document.getElementById('idTorneoDisplay');\n      if(!box){\n        box=document.createElement('div');\n        box.id='idTorneoDisplay';\n        titolo.insertAdjacentElement('afterend',box);\n      }\n      box.textContent='ID torneo: '+id;\n    }\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',cleanPlayerBoard);\n  else cleanPlayerBoard();\n  window.addEventListener('load',cleanPlayerBoard);\n})();\n</script>\n'''
              s = s.replace('</body>', patch + '</body>', 1) if '</body>' in s else s + patch
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html
          git commit -m "Clean player board controls and show tournament ID" || true
          git rm .github/workflows/_temp_bove_cleanup.yml || true
          git commit -m "Remove temporary Bove UI patch workflow" || true
          git push
