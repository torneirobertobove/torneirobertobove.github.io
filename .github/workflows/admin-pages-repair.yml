name: Admin Pages Repair Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: admin-pages-repair-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare admin page
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('admin.html').read_text(encoding='utf-8')

          # Rimuove definitivamente il secondo login locale inserito nella pagina admin.
          html = re.sub(
              r'<div id="boxLoginAdmin" class="login-wrap">.*?</div></div>\s*',
              '', html, count=1, flags=re.S
          )

          # Rimuove anche il vecchio script che faceva riapparire il login locale dopo Esci.
          html = re.sub(
              r'<!-- ADMIN_LOGOUT_VISIBILITY_FIX_V1 -->\s*<script>.*?</script>\s*',
              '', html, count=1, flags=re.S
          )

          # Rimuove eventuali blocchi residui del secondo login, anche se non hanno più l'id originale.
          html = re.sub(
              r'<div class="login-wrap">.*?(?:Admin Tornei|Accesso amministratore).*?</div>\s*',
              '', html, count=1, flags=re.S
          )

          # Mantiene una sola istanza del guard.
          html = re.sub(
              r'<script src="admin-auth-guard-v1\.js\?v=[^\"]+"></script>\s*',
              '', html
          )
          html = html.replace('</head>', '<script src="admin-auth-guard-v1.js?v=3"></script>\n</head>', 1)

          js = Path('admin-function-fixes-v1.js').read_text(encoding='utf-8')

          required = [
              'ADMIN FLOW FIX V24',
              'italiana','gironiFinale','eliminazione','svizzero','americano','mexicano','king','short','manuale',
              'afNext','formulaScelta','formulaConfig',
              "stato:'bozza'",'pubblicato:false','window.assert'
          ]
          missing=[x for x in required if x not in js]
          if missing:
              raise SystemExit('V24 validation failed: '+', '.join(missing))

          html=re.sub(r"admin-function-fixes-v1\\.js\\?v=[^\\\"']+",'admin-function-fixes-v1.js?v=24',html)

          if 'admin-delete-fix.js?v=1' not in html:
              html=html.replace('</body>','<script src="admin-delete-fix.js?v=1"></script>\n</body>',1)

          Path('admin.html').write_text(html,encoding='utf-8')

      - name: Persist normalized admin page
        shell: bash
        run: |
          if git diff --quiet -- admin.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "fix: remove duplicate admin login"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check admin-function-fixes-v1.js
          node --check admin-delete-fix.js
          node --check admin-auth-guard-v1.js
          node --check admin-master.js

      - name: Verify payload
        shell: python
        run: |
          from pathlib import Path
          html=Path('admin.html').read_text(encoding='utf-8')
          delete_js=Path('admin-delete-fix.js').read_text(encoding='utf-8')
          guard=Path('admin-auth-guard-v1.js').read_text(encoding='utf-8')
          master=Path('admin-master.js').read_text(encoding='utf-8')
          assert 'admin-function-fixes-v1.js?v=24' in html
          assert 'admin-delete-fix.js?v=1' in html
          assert 'admin-auth-guard-v1.js?v=3' in html
          assert 'boxLoginAdmin' not in html
          assert 'ADMIN_LOGOUT_VISIBILITY_FIX_V1' not in html
          assert 'Admin Tornei' not in html.split('<body>',1)[1].split('<div id="areaAdmin"',1)[0]
          assert 'eliminaTorneo' in delete_js
          assert 'admin-master.js' in html
          assert "from('profili')" in guard
          assert "role!=='admin'" in guard
          assert 'window.location.replace(\'Bove.html\')' in guard
          assert 'classList.remove("hidden")' in master
          assert 'areaAdmin.style.display = "flex"' in master

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
