name: Admin Pages Repair Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admin-pages-repair-v4
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare admin page
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('admin.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'<script src="admin-auth-guard-v1\.js\?v=[0-9]+"></script>\s*', '', html)
          html = html.replace('</head>', '<script src="admin-auth-guard-v1.js?v=6"></script>\n</head>', 1)
          html = re.sub(r'admin-function-fixes-v1\.js\?v=[0-9]+', 'admin-function-fixes-v1.js?v=26', html)
          if 'admin-delete-fix.js?v=1' not in html:
              html = html.replace('</body>', '<script src="admin-delete-fix.js?v=1"></script>\n</body>', 1)
          js = Path('admin-function-fixes-v1.js').read_text(encoding='utf-8')
          required = ['ADMIN FLOW FIX V25','italiana','gironiFinale','eliminazione','svizzero','americano','mexicano','king','short','manuale','afNext','formulaScelta','formulaConfig']
          missing = [x for x in required if x not in js]
          if missing:
              raise SystemExit('Wizard validation failed: ' + ', '.join(missing))
          path.write_text(html, encoding='utf-8')

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check admin-function-fixes-v1.js
          node --check admin-delete-fix.js
          node --check admin-auth-guard-v1.js
          node --check admin-master.js

      - name: Verify payload
        shell: python
        run: |
          from pathlib import Path
          html = Path('admin.html').read_text(encoding='utf-8')
          required = [
              'admin-function-fixes-v1.js?v=26',
              'admin-delete-fix.js?v=1',
              'admin-auth-guard-v1.js?v=6'
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('Admin payload verification failed: ' + ', '.join(missing))

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
