name: Fix tournament creation flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Fix the real admin tournament flow
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('admin-functions.js')
          text = p.read_text(encoding='utf-8')
          pattern = r'function apriRegoleNuovoTorneo\(\)\s*\{.*?\n\}\s*\n\s*async function creaNuovoTorneo\(\)\s*\{.*?\n\}\s*\n\s*function renderListaTornei\(\)'
          replacement = '''function apriRegoleNuovoTorneo(){
  return creaNuovoTorneo();
}

async function creaNuovoTorneo(){
  const nome=document.getElementById("adminNomeTorneo")?.value.trim()||"Nuovo Torneo";
  const data=document.getElementById("adminDataTorneo")?.value||"";
  const posti=Number(document.getElementById("adminPosti")?.value)||8;
  const descrizione=document.getElementById("adminDescrizione")?.value.trim()||"";
  if(!data){ alert("Inserisci la data del torneo."); return false; }
  const nuovoId=Date.now();
  const numeroGironi=Math.max(1,Math.ceil(posti/4));
  const configurazione={
    coppie:[],
    partecipanti:[],
    rules:{
      locked:false,
      tipoTorneo:"",
      formatoTorneo:"",
      numeroSquadre:posti,
      numeroGironi,
      squadrePerGirone:4,
      formulaGironi:"",
      formulaFinale:""
    }
  };
  const nuovoTorneo={
    id:nuovoId,nome,data,posti,descrizione,formula:"",stato:"bozza",
    iscritti:[],coppie:[],partecipanti:[],configurazione
  };
  adminState.tornei=Array.isArray(adminState.tornei)
    ? adminState.tornei.filter(t=>!String(t.id).startsWith("temp_"))
    : [];
  adminState.tornei.push(nuovoTorneo);
  adminState.torneoSelezionato=nuovoId;
  salvaAdminState();
  try{
    const {error}=await sb.from("tornei").insert({
      id:nuovoId,nome,data,data_torneo:data,ora_inizio:null,posti,descrizione,
      formula:null,stato:"bozza",pubblicato:false,iscrizioni_chiuse:false,configurazione
    });
    if(error) throw error;
    renderAdmin();
    window.open(
      "Bove.html?torneo="+encodeURIComponent(JSON.stringify(nuovoTorneo))
      +"&apriRegole=true",
      "_blank"
    );
    return true;
  }catch(error){
    adminState.tornei=adminState.tornei.filter(t=>String(t.id)!==String(nuovoId));
    adminState.torneoSelezionato=null;
    salvaAdminState();
    renderAdmin();
    console.error("Errore creazione torneo:",error);
    alert("Creazione torneo non riuscita: "+(error?.message||error));
    return false;
  }
}

function renderListaTornei()'''
          text, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if n != 1:
            raise SystemExit('ERRORE: funzione reale creaNuovoTorneo non trovata')
          p.write_text(text, encoding='utf-8')

          # Force the browser to fetch the corrected real source.
          for name, version in [('admin.html','20260906-flow2'),('Bove.html','20260906-flow2')]:
            q=Path(name)
            s=q.read_text(encoding='utf-8')
            s=re.sub(r'(admin-functions\.js)(?:\?v=[^"\']*)?', r'\1?v='+version, s)
            s=re.sub(r'(bove-admin-flow-fix\.js)(?:\?v=[^"\']*)?', r'\1?v='+version, s)
            q.write_text(s, encoding='utf-8')

          # One-shot repair: remove obsolete workflows and this workflow after applying the fix.
          for f in [
              '.github/workflows/one-time-save-reset-push.yml',
              '.github/workflows/pr-save-reset.yml',
              '.github/workflows/one-time-save-reset.yml',
              '.github/workflows/fix-tournament-flow.yml',
          ]:
              Path(f).unlink(missing_ok=True)

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Nessuna modifica da committare'; exit 0; }
          git commit -m 'Fix real tournament creation flow'
          git push origin HEAD:main
