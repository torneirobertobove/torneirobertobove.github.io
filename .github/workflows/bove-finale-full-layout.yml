name: Bove finale QSF repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch QSF engine only
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')

          # Install getFinalPhaseType when missing.
          if 'function getFinalPhaseType(' not in text:
              helper = r'''function getFinalPhaseType(qualificati){
    const n = Array.isArray(qualificati) ? qualificati.length : 0;
    if(n >= 8 && state?.rules?.usaQuarti === true) return 'QUARTI';
    if(n >= 4) return 'SEMIFINALI';
    if(n === 2) return 'FINALE';
    return 'NESSUNA';
}
'''
              idx = text.find('function renderKO(){')
              if idx < 0: raise SystemExit('renderKO non trovato')
              text = text[:idx] + helper + '\n' + text[idx:]

          render_match_card = r'''function renderMatchCard(titolo, match, tipo, index, risultato){
    if(!Array.isArray(match) || match.length !== 2) return '';
    const fase = String(tipo || '').toUpperCase();
    const i = Number(index) || 0;
    const squadra1 = typeof nomeSquadra === 'function' ? nomeSquadra(match[0]) : String(match[0] ?? '');
    const squadra2 = typeof nomeSquadra === 'function' ? nomeSquadra(match[1]) : String(match[1] ?? '');
    let campo='', ora='', res='-';
    if(fase==='Q'){campo=Array.isArray(state.qCamp)?(state.qCamp[i]??''):'';ora=Array.isArray(state.qTime)?(state.qTime[i]??''):'';res=Array.isArray(state.qRes)?(state.qRes[i]??'-'):'-';}
    else if(fase==='S'){campo=Array.isArray(state.sCamp)?(state.sCamp[i]??''):'';ora=Array.isArray(state.sTime)?(state.sTime[i]??''):'';res=Array.isArray(state.sTopRes)?(state.sTopRes[i]??'-'):'-';}
    else if(fase==='F'){campo=Array.isArray(state.fCamp)?(state.fCamp[i]??''):'';ora=Array.isArray(state.fTime)?(state.fTime[i]??''):'';res=state.fTopRes??'-';}
    const parti=String(res||'-').split('-');
    const ris1=parti[0]==='-'?'':(parti[0]||'').trim();
    const ris2=(parti[1]||'').trim();
    return `<tr><td><input type="text" value="${campo}" style="width:100%;max-width:100%;" onchange="updateCamp('${fase}',${i},this.value)"></td><td><input type="time" value="${ora}" style="width:100%;max-width:100%;" onchange="updateTime('${fase}',${i},this.value)"></td><td class="match-cell"><div class="team-line">${squadra1}</div><div class="vs-line"><b>VS</b></div><div class="team-line">${squadra2}</div></td><td class="db-cell"><input id="${fase}_score1_${i}" inputmode="numeric" value="${ris1}" onchange="updateKOResult('${fase}',${i},this.value,document.getElementById('${fase}_score2_${i}').value)"></td><td class="db-cell"><input id="${fase}_score2_${i}" inputmode="numeric" value="${ris2}" onchange="updateKOResult('${fase}',${i},document.getElementById('${fase}_score1_${i}').value,this.value)"></td></tr>`;
}
'''
          m = re.search(r'function renderMatchCard\(.*?(?=\n\s*function renderKO\b)', text, re.S)
          if not m: raise SystemExit('renderMatchCard non trovato')
          text = text[:m.start()] + render_match_card + '\n' + text[m.end():]

          update_ko = r'''function updateKOResult(type,index,valore,secondo){
    ensureRules();
    const fase=String(type||'').toUpperCase();
    const i=Number(index);
    if(!Number.isInteger(i)||i<0)return;
    const a=String(valore??'').trim();
    const b=String(secondo??'').trim();
    const risultato=(a===''&&b==='')?'-':`${a}-${b}`;
    if(fase==='Q'){if(!Array.isArray(state.qRes))state.qRes=[];state.qRes[i]=risultato;}
    else if(fase==='S'){if(!Array.isArray(state.sTopRes))state.sTopRes=[];state.sTopRes[i]=risultato;}
    else if(fase==='F'){state.fTopRes=risultato;}
    else return;
    renderKO();
    if(typeof updateAndSync==='function')updateAndSync();
}
'''
          m = re.search(r'function updateKOResult\(.*?(?=\n\s*function getWinner\b)', text, re.S)
          if not m: raise SystemExit('updateKOResult non trovato')
          text = text[:m.start()] + update_ko + '\n' + text[m.end():]

          render_ko = r'''function renderKO(){
    ensureRules();
    const q=document.getElementById('Q');
    const s=document.getElementById('S');
    const f=document.getElementById('finaleBox');
    if(!q||!s||!f){console.error('renderKO: contenitori Q/S/F non trovati');return;}
    const qTable=q.closest('table'), sTable=s.closest('table'), fTable=f.closest('table');
    [qTable,sTable,fTable].filter(Boolean).forEach(t=>{t.style.display='table';t.style.width='100%';t.style.minWidth='0';t.style.maxWidth='100%';t.style.tableLayout='fixed';t.style.boxSizing='border-box';t.style.overflow='hidden';});
    document.documentElement.style.overflowX='hidden'; document.body.style.overflowX='hidden';
    if(!Array.isArray(state.qRes))state.qRes=[];while(state.qRes.length<4)state.qRes.push('-');state.qRes=state.qRes.slice(0,4);
    if(!Array.isArray(state.qCamp))state.qCamp=[];if(!Array.isArray(state.qTime))state.qTime=[];
    if(!Array.isArray(state.sTopRes))state.sTopRes=[];while(state.sTopRes.length<2)state.sTopRes.push('-');state.sTopRes=state.sTopRes.slice(0,2);
    if(!Array.isArray(state.sCamp))state.sCamp=[];if(!Array.isArray(state.sTime))state.sTime=[];
    if(!Array.isArray(state.fCamp))state.fCamp=[];if(!Array.isArray(state.fTime))state.fTime=[];if(typeof state.fTopRes!=='string')state.fTopRes='-';
    function header(t,title){if(!t)return;const h=t.querySelector('thead');if(h)h.innerHTML=`<tr><th colspan="5">${title}</th></tr><tr><th>Campo</th><th>Ora</th><th>Match</th><th>Ris 1</th><th>Ris 2</th></tr>`;}
    header(qTable,'⚔️ QUARTI DI FINALE');header(sTable,'🥇 SEMIFINALI');header(fTable,'🏆 FINALE');
    const qualificati=Array.isArray(state.finalQualified)?state.finalQualified.filter(Boolean):(typeof getFinalQualified==='function'?getFinalQualified():[]);
    const n=qualificati.length;
    let quarti=[];let semifinali=[];
    if(n>=8&&state.rules?.usaQuarti===true){
      quarti=[[qualificati[0],qualificati[7]],[qualificati[3],qualificati[4]],[qualificati[1],qualificati[6]],[qualificati[2],qualificati[5]]];
      state.quarti=quarti;q.innerHTML=quarti.map((m,i)=>renderMatchCard('QUARTI',m,'Q',i,state.qRes[i])).join('');
      const w=quarti.map((m,i)=>getWinner(m,state.qRes[i]));
      semifinali=[[w[0]||'Vincitore Q1',w[1]||'Vincitore Q2'],[w[2]||'Vincitore Q3',w[3]||'Vincitore Q4']];
    }else if(n>=4){
      state.quarti=[];
      q.innerHTML=`<tr><td><input disabled></td><td><input disabled></td><td class="match-cell"><div class="team-line">QUARTI DI FINALE</div><div class="vs-line">NON PREVISTI</div></td><td class="db-cell"><input disabled></td><td class="db-cell"><input disabled></td></tr><tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:8px">4 squadre qualificate: accesso diretto alle semifinali.</td></tr>`;
      semifinali=[[qualificati[0],qualificati[3]],[qualificati[1],qualificati[2]]];
    }else{
      state.quarti=[];q.innerHTML='<tr><td colspan="5" style="text-align:center;padding:10px">Nessun numero sufficiente di qualificate.</td></tr>';
    }
    state.semifinali=semifinali;
    s.innerHTML=semifinali.map((m,i)=>renderMatchCard('SEMIFINALE',m,'S',i,state.sTopRes[i])).join('');
    const finalisti=[semifinali[0]?(getWinner(semifinali[0],state.sTopRes[0])||'Vincitore S1'):'',semifinali[1]?(getWinner(semifinali[1],state.sTopRes[1])||'Vincitore S2'):''].filter(Boolean);
    state.finalTop=finalisti;
    f.innerHTML=finalisti.length===2?renderMatchCard('FINALE',finalisti,'F',0,state.fTopRes):'<tr><td colspan="5" style="text-align:center;padding:12px;color:#94a3b8">In attesa dei finalisti</td></tr>';
    const campione=finalisti.length===2?getWinner(finalisti,state.fTopRes):null;
    state.campioneTop=campione?(typeof nomeSquadra==='function'?nomeSquadra(campione):String(campione)):null;
    const host=fTable?.parentElement;if(host){host.querySelectorAll('.winner-box[data-bove-final="1"]').forEach(e=>e.remove());if(state.campioneTop)host.insertAdjacentHTML('beforeend',`<div class="winner-box top-win" data-bove-final="1">🏆 CAMPIONE TORNEO:<br>${state.campioneTop}</div>`);}
    console.log('Q/S/F PERMANENTI:',{qualificati,quarti,semifinali,finalisti});
}
'''
          m = re.search(r'function renderKO\(\)\{.*?(?=\n\s*function updateKOResult\b)', text, re.S)
          if not m: raise SystemExit('renderKO non trovato')
          text=text[:m.start()]+render_ko+'\n'+text[m.end():]

          # Final-phase tables must never create horizontal scrolling.
          css='''\n/* BOVE FINAL QSF NO HORIZONTAL SCROLL */\n.finalContainer,.finalContainer .groups,.finalContainer .card{width:100%!important;max-width:100%!important;min-width:0!important;overflow-x:hidden!important;box-sizing:border-box!important;}\n.finalContainer table{width:100%!important;max-width:100%!important;min-width:0!important;table-layout:fixed!important;box-sizing:border-box!important;overflow:hidden!important;}\n.finalContainer th,.finalContainer td{min-width:0!important;max-width:100%!important;box-sizing:border-box!important;overflow:hidden!important;}\n@media(max-width:599px){.finalContainer th:nth-child(1),.finalContainer td:nth-child(1){width:16%!important;}.finalContainer th:nth-child(2),.finalContainer td:nth-child(2){width:17%!important;}.finalContainer th:nth-child(3),.finalContainer td:nth-child(3){width:41%!important;}.finalContainer th:nth-child(4),.finalContainer td:nth-child(4),.finalContainer th:nth-child(5),.finalContainer td:nth-child(5){width:13%!important;}.finalContainer .team-line,.finalContainer .match-cell{white-space:normal!important;overflow-wrap:anywhere!important;text-overflow:clip!important;}}\n'''
          if '/* BOVE FINAL QSF NO HORIZONTAL SCROLL */' not in text:
              text=text.replace('</style>',css+'</style>',1)

          text=text.replace('table.style.width = "458px";','table.style.width = "100%";')
          text=text.replace('table.style.minWidth = "458px";','table.style.minWidth = "0";')
          text=text.replace('table.style.maxWidth = "458px";','table.style.maxWidth = "100%";')

          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,script in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'bove_qsf_{i}.js'
              f.write_text(script,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr);raise SystemExit(f'JS syntax error script {i}')
          p.write_text(text,encoding='utf-8')
          print(f'QSF PATCH OK - {len(scripts)} SCRIPT')

      - name: Commit QSF repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          if git diff --cached --quiet; then
            echo 'NO BOVE CHANGES'
            exit 0
          fi
          git commit -m 'Fix final phase QSF flow and responsive layout'
          git push
