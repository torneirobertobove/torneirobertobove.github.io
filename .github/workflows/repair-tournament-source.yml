name: Repair tournament source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Admin to Bove flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('admin-functions.js')
          s = p.read_text(encoding='utf-8')

          old = '''function creaUrlBove(t,apriRegole=false){
  if(!t?.id){ return ""; }
  const payload=encodeURIComponent(JSON.stringify(t));
  return "Bove.html?torneo="+payload+(apriRegole?"&apriRegole=true":"");
}'''

          new = '''function creaUrlBove(t,apriRegole=false){
  if(!t?.id){ return ""; }
  const id=encodeURIComponent(String(t.id));
  const separatore=apriRegole ? "&" : "?";
  return "Bove.html?idTorneo="+id+separatore+(apriRegole?"apriRegole=true":"");
}'''

          if old not in s:
              raise SystemExit('creaUrlBove anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-functions.js
          git commit -m 'fix: usa ID torneo come sorgente Admin Bove'
          git push
