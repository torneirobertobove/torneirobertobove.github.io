name: Fix KO layout to match Gironi

on:
  push:
    paths:
      - 'Bove.html'
      - '.github/workflows/fix-ko-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply only the requested KO layout repairs
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # 1) Keep renderMatchCard at five real TDs; only repair the surrounding KO markup.
          # 2) Quarti error row: four columns -> five.
          s = s.replace('<tr><td colspan="4">Servono 8 squadre qualificate per i Quarti di Finale.</td></tr>',
                        '<tr><td colspan="5">Servono 8 squadre qualificate per i Quarti di Finale.</td></tr>')

          # 3-5) Replace only the KO column headers with five real THs.
          # Handles the old 4/5/6-column variants without touching Gironi headers.
          header_patterns = [
              r'(<thead>\s*<tr>\s*<th[^>]*colspan="\d+"[^>]*>\s*QUARTI DI FINALE.*?</tr>\s*<tr>).*?(</tr>)',
              r'(<thead>\s*<tr>\s*<th[^>]*colspan="\d+"[^>]*>\s*SEMIFINALI.*?</tr>\s*<tr>).*?(</tr>)',
              r'(<thead>\s*<tr>\s*<th[^>]*colspan="\d+"[^>]*>\s*FINALE.*?</tr>\s*<tr>).*?(</tr>)'
          ]
          for pat in header_patterns:
              m = re.search(pat, s, flags=re.S|re.I)
              if m:
                  prefix = m.group(1)
                  replacement = prefix + '<th>Campo</th><th>Ora</th><th>Match</th><th>Ris 1</th><th>Ris 2</th>' + m.group(2)
                  s = s[:m.start()] + replacement + s[m.end():]

          # Remove any remaining KO header row with the old Ris colspan, only inside
          # the tables whose tbody is Q, S or finaleBox.
          def repair_ko_table(m):
              table = m.group(0)
              table = re.sub(r'<th\s+colspan="2"\s*>\s*Ris\s*</th>',
                             '<th>Ris 1</th><th>Ris 2</th>', table, flags=re.S|re.I)
              table = re.sub(r'<th>\s*Minuti\s*</th>\s*', '', table, flags=re.S|re.I)
              table = re.sub(r'<th>\s*Ris\s*</th>', '<th>Ris 1</th><th>Ris 2</th>', table, flags=re.S|re.I)
              return table

          # 6) Q and S remain tbody elements of their existing tables; do not alter JS.
          for tbody_id in ('Q','S','finaleBox'):
              pattern = rf'<table\b[^>]*>.*?<tbody\s+id="{tbody_id}".*?</tbody>\s*</table>'
              s = re.sub(pattern, repair_ko_table, s, flags=re.S|re.I)

          # 7-11) Replace only the existing KO geometry CSS block(s) with a single
          # five-column fixed layout. The rest of the application CSS is untouched.
          start = s.find('/* ========================================================\n   LAYOUT FASE FINALE KO')
          if start != -1:
              end = s.find('/* Frecce Qualificazione */', start)
              if end == -1:
                  end = s.find('/* ========================================================\n   FRECCE DI QUALIFICAZIONE', start)
              if end != -1:
                  s = s[:start] + s[end:]

          css = r'''
/* ========================================================
   KO — STESSA STRUTTURA DEI GIRONI: 5 COLONNE
   Campo 53px | Ora 105px | Match 180px | Ris1 62px | Ris2 62px
   ======================================================== */
.koBox table, .finalContainer table {
    width: 462px !important;
    min-width: 462px !important;
    max-width: 462px !important;
    table-layout: fixed !important;
    border-collapse: collapse !important;
    border-spacing: 0 !important;
    margin: 10px auto !important;
}
.koBox table th, .koBox table td,
.finalContainer table th, .finalContainer table td {
    box-sizing: border-box !important;
    padding: 8px 4px !important;
    text-align: center !important;
    vertical-align: middle !important;
    overflow: hidden !important;
}
.koBox table th:nth-child(1), .koBox table td:nth-child(1),
.finalContainer table th:nth-child(1), .finalContainer table td:nth-child(1) { width: 53px !important; }
.koBox table th:nth-child(2), .koBox table td:nth-child(2),
.finalContainer table th:nth-child(2), .finalContainer table td:nth-child(2) { width: 105px !important; }
.koBox table th:nth-child(3), .koBox table td:nth-child(3),
.finalContainer table th:nth-child(3), .finalContainer table td:nth-child(3) { width: 180px !important; }
.koBox table th:nth-child(4), .koBox table td:nth-child(4),
.finalContainer table th:nth-child(4), .finalContainer table td:nth-child(4) { width: 62px !important; }
.koBox table th:nth-child(5), .koBox table td:nth-child(5),
.finalContainer table th:nth-child(5), .finalContainer table td:nth-child(5) { width: 62px !important; }
.campo-cell input { width: 42px !important; min-width: 42px !important; max-width: 42px !important; height: 28px !important; box-sizing: border-box !important; }
.orario-cell input[type="time"] { width: 70px !important; min-width: 70px !important; max-width: 70px !important; height: 28px !important; box-sizing: border-box !important; padding: 2px !important; }
.score-cell input { width: 42px !important; min-width: 42px !important; max-width: 42px !important; height: 28px !important; box-sizing: border-box !important; padding: 2px !important; }
.match-cell { display: table-cell !important; overflow: hidden !important; overflow-wrap: anywhere !important; word-break: break-word !important; text-align: left !important; }
.match-cell .team-line { display: block !important; width: 100% !important; white-space: normal !important; overflow-wrap: anywhere !important; }
.match-cell .vs-line { display: block !important; text-align: center !important; }
@media(max-width:599px) {
  .koBox table, .finalContainer table { width: 462px !important; min-width: 462px !important; max-width: 462px !important; margin-left: 0 !important; margin-right: 0 !important; }
}
'''
          # Insert immediately before </style>; do not alter any other CSS.
          s = s.replace('</style>', css + '\n</style>', 1)

          # 12) If finaleBox is a tbody, make the winner a valid table row.
          s = re.sub(
              r'f\.innerHTML\+=`<div class="winner-box top-win">🏆 CAMPIONE TORNEO:<br>\$\{formatCoppiaDisplay\(campione\)\}</div>`;',
              'f.innerHTML+=`<tr><td colspan="5" class="winner-box top-win">🏆 CAMPIONE TORNEO:<br>${formatCoppiaDisplay(campione)}</td></tr>`;',
              s
          )

          if s == original:
              raise SystemExit('Nessuna modifica applicata')

          p.write_text(s, encoding='utf-8')

          # Syntax check only; no application logic is changed here.
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          for i, script in enumerate(scripts):
              f = Path(f'/tmp/bove-{i}.js')
              f.write_text(script, encoding='utf-8')
              r = subprocess.run(['node','--check',str(f)], capture_output=True, text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'Syntax error nello script {i}')

          # 13-17) Structural checks requested.
          assert s.count('<th>Campo</th>') >= 3
          assert 'colspan="4">Servono 8 squadre qualificate' not in s
          print('KO repair written; five-column geometry and JS syntax checks passed.')

      - name: Commit corrected Bove.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nessuna modifica necessaria"
          else
            git commit -m "Make KO rounds match Gironi five-column layout"
            git push
          fi
