name: Fix KO layout

on:
  push:
    paths:
      - 'Bove.html'
      - '.github/workflows/fix-ko-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix KO six-column layout
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          p=Path('Bove.html')
          text=p.read_text(encoding='utf-8')
          original=text

          # Remove the broken four-column KO sizing rules.
          text=re.sub(r'/\* Final KO cell geometry \*/.*?(?=/\* ============================\s*\n\s*NUOVE CELLE PARTITE KO)', '', text, flags=re.S)
          text=re.sub(r'table:has\(> tbody#Q\) th:nth-child\(1\).*?table:has\(> tbody#finaleBox\) td:nth-child\(4\)\{width:75px !important;\}\s*', '', text, flags=re.S)
          text=re.sub(r'table:has\(> tbody#Q\) td\.db-cell,.*?table:has\(> tbody#S\) td\.db-cell input \{.*?\}', '', text, flags=re.S)

          # Headers must describe the six real body columns.
          text=re.sub(
              r'(<thead>\s*<tr>\s*<th colspan="4">\s*(?:QUARTI DI FINALE|SEMIFINALI|FINALE)\s*</th>\s*</tr>\s*)<tr>.*?</tr>(\s*</thead>)',
              lambda m: m.group(1)+'<tr><th>Campo</th><th>Ora</th><th>Minuti</th><th>Match</th><th>Ris.1</th><th>Ris.2</th></tr>'+m.group(2),
              text, flags=re.S)

          # Render exactly six cells: Campo | Ora | Minuti | Match | Ris.1 | Ris.2.
          new=r'''function renderMatchCard(titolo,match,type,index,risultato){
    const res=String(risultato || "-");
    const campKey={Q:"qCamp",S:"sTopCamp",F:"fTopCamp"}[type];
    const timeKey={Q:"qTime",S:"sTopTime",F:"fTopTime"}[type];
    const camp=Array.isArray(state[campKey]) ? (state[campKey][index] || "") : "";
    const time=Array.isArray(state[timeKey]) ? (state[timeKey][index] || "") : "";
    const parts=res.split("-");
    const scoreA=parts[0]==="-" ? "" : (parts[0] || "");
    const scoreB=parts.length>1 ? (parts[1] || "") : "";
    const tp=String(time).split(":");
    const ore=tp[0] || "";
    const minuti=tp[1] || "";
    const winner=getWinner(match,res);
    const stato=winner ? "Terminata" : "Da giocare";
    const esc=v=>String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
    return `
<tr>
    <td class="ko-field-cell"><input type="text" value="${esc(camp)}" onchange="updateKOField('${type}',${index},'camp',this.value)"></td>
    <td class="ko-time-cell"><input type="text" value="${esc(ore)}" onchange="updateKOField('${type}',${index},'time',this.value + ':' + this.parentElement.nextElementSibling.querySelector('input').value)"></td>
    <td class="ko-time-cell"><input type="text" value="${esc(minuti)}" onchange="updateKOField('${type}',${index},'time',this.parentElement.previousElementSibling.querySelector('input').value + ':' + this.value)"></td>
    <td class="match-cell">
        <div class="team-line">${formatCoppiaDisplay(match[0])}</div>
        <div class="vs-line"><b>VS</b></div>
        <div class="team-line">${formatCoppiaDisplay(match[1])}</div>
        <div style="font-size:12px;opacity:.7;margin-top:4px;">${stato}</div>
        ${winner ? `<div class="winner-box">🏆 Passa: ${formatCoppiaDisplay(winner)}</div>` : ""}
    </td>
    <td class="ko-score-cell"><input type="text" inputmode="numeric" value="${esc(scoreA)}" onchange="updateKOScore('${type}',${index},0,this.value)"></td>
    <td class="ko-score-cell"><input type="text" inputmode="numeric" value="${esc(scoreB)}" onchange="updateKOScore('${type}',${index},1,this.value)"></td>
</tr>`;
}
'''
          text,n=re.subn(r'function renderMatchCard\(titolo,match,type,index,risultato\)\{.*?\n\}\s*function applicaModelloTorneo\(',new+'\nfunction applicaModelloTorneo(',text,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderMatchCard non trovato')

          # Authoritative widths are the ones agreed for the KO table.
          css=r'''
/* KO FINAL — authoritative six-column layout */
table:has(> tbody#Q), table:has(> tbody#S), table:has(> tbody#finaleBox){table-layout:fixed !important;width:445px !important;min-width:445px !important;max-width:445px !important;box-sizing:border-box !important;border-collapse:collapse !important;}
table:has(> tbody#Q) th,table:has(> tbody#Q) td,table:has(> tbody#S) th,table:has(> tbody#S) td,table:has(> tbody#finaleBox) th,table:has(> tbody#finaleBox) td{box-sizing:border-box !important;padding:6px 3px !important;text-align:center !important;vertical-align:middle !important;}
table:has(> tbody#Q) th:nth-child(1),table:has(> tbody#Q) td:nth-child(1),table:has(> tbody#S) th:nth-child(1),table:has(> tbody#S) td:nth-child(1),table:has(> tbody#finaleBox) th:nth-child(1),table:has(> tbody#finaleBox) td:nth-child(1){width:45px !important;}
table:has(> tbody#Q) th:nth-child(2),table:has(> tbody#Q) td:nth-child(2),table:has(> tbody#S) th:nth-child(2),table:has(> tbody#S) td:nth-child(2),table:has(> tbody#finaleBox) th:nth-child(2),table:has(> tbody#finaleBox) td:nth-child(2){width:45px !important;}
table:has(> tbody#Q) th:nth-child(3),table:has(> tbody#Q) td:nth-child(3),table:has(> tbody#S) th:nth-child(3),table:has(> tbody#S) td:nth-child(3),table:has(> tbody#finaleBox) th:nth-child(3),table:has(> tbody#finaleBox) td:nth-child(3){width:45px !important;}
table:has(> tbody#Q) th:nth-child(4),table:has(> tbody#Q) td:nth-child(4),table:has(> tbody#S) th:nth-child(4),table:has(> tbody#S) td:nth-child(4),table:has(> tbody#finaleBox) th:nth-child(4),table:has(> tbody#finaleBox) td:nth-child(4){width:220px !important;}
table:has(> tbody#Q) th:nth-child(5),table:has(> tbody#Q) td:nth-child(5),table:has(> tbody#S) th:nth-child(5),table:has(> tbody#S) td:nth-child(5),table:has(> tbody#finaleBox) th:nth-child(5),table:has(> tbody#finaleBox) td:nth-child(5){width:45px !important;}
table:has(> tbody#Q) th:nth-child(6),table:has(> tbody#Q) td:nth-child(6),table:has(> tbody#S) th:nth-child(6),table:has(> tbody#S) td:nth-child(6),table:has(> tbody#finaleBox) th:nth-child(6),table:has(> tbody#finaleBox) td:nth-child(6){width:45px !important;}
table:has(> tbody#Q) .ko-field-cell input,table:has(> tbody#Q) .ko-time-cell input,table:has(> tbody#Q) .ko-score-cell input,table:has(> tbody#S) .ko-field-cell input,table:has(> tbody#S) .ko-time-cell input,table:has(> tbody#S) .ko-score-cell input,table:has(> tbody#finaleBox) .ko-field-cell input,table:has(> tbody#finaleBox) .ko-time-cell input,table:has(> tbody#finaleBox) .ko-score-cell input{width:39px !important;min-width:39px !important;max-width:39px !important;height:32px !important;margin:0 auto !important;box-sizing:border-box !important;}
'''
          text=text.replace('</style>',css+'\n</style>',1)

          if text==original: raise SystemExit('Nessuna modifica applicata')
          p.write_text(text,encoding='utf-8')

          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          for i,script in enumerate(scripts):
              f=Path(f'/tmp/bove-{i}.js'); f.write_text(script,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit(f'Syntax error script {i}')

          assert '<th>Campo</th><th>Ora</th><th>Minuti</th><th>Match</th><th>Ris.1</th><th>Ris.2</th>' in text
          assert 'width:220px !important' in text
          assert 'function renderMatchCard(titolo,match,type,index,risultato)' in text
          print('KO six-column fix validated')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html
          git diff --cached --check
          git commit -m "Fix KO six-column alignment"
          git push
