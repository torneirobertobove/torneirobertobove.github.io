name: Fix KO layout from Gironi

on:
  push:
    paths:
      - 'Bove.html'
      - 'KO_LAYOUT_TRIGGER.txt'
      - '.github/workflows/fix-ko-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy Gironi table structure to KO
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')
          original = s

          start = s.find('/* ========================================================\n   LAYOUT FASE FINALE KO')
          if start != -1:
              end = s.find('/* Frecce Qualificazione */', start)
              if end == -1:
                  raise SystemExit('KO CSS end marker not found')
              s = s[:start] + s[end:]

          s = re.sub(r'<th colspan="\d+">\s*QUARTI DI FINALE', '<th colspan="4">\n                            QUARTI DI FINALE', s)
          s = re.sub(r'<th colspan="\d+">\s*SEMIFINALI', '<th colspan="4">\n                            SEMIFINALI', s)
          s = re.sub(r'<th colspan="\d+">\s*FINALE', '<th colspan="4">\n                            FINALE', s)

          old_header = re.compile(r'<th>Campo</th>\s*<th>(?:Ore|Ora)</th>\s*<th>(?:Minuti</th>\s*<th>)?Match</th>\s*<th>(?:Ris|Ris\.1)</th>(?:\s*<th>Ris\.2</th>)?', re.S)
          s = old_header.sub('<th>Campo</th><th>Ora</th><th>Match</th><th>Ris</th>', s)

          a = s.find('function renderMatchCard')
          if a == -1:
              raise SystemExit('renderMatchCard not found')
          b = s.find('function applicaModelloTorneo', a)
          if b == -1:
              raise SystemExit('renderMatchCard end marker not found')

          fn = r'''function renderMatchCard(titolo, match, type, index, risultato){

    const risultatoStr = String(risultato || "-");
    const partiRisultato = risultatoStr.split("-");
    const risultato1 = partiRisultato[0] === "-" ? "" : (partiRisultato[0] || "");
    const risultato2 = partiRisultato[1] || "";

    const campKey = {Q:"qCamp", S:"sTopCamp", F:"fTopCamp"}[type];
    const timeKey = {Q:"qTime", S:"sTopTime", F:"fTopTime"}[type];

    const camp = Array.isArray(state[campKey]) ? (state[campKey][index] || "") : "";
    const time = Array.isArray(state[timeKey]) ? (state[timeKey][index] || "") : "";

    const winner = getWinner(match, risultatoStr);
    const stato = winner ? "Terminata" : "Da giocare";
    const safe = v => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

    return `
<tr>
<td>
<input value="${safe(camp)}" oninput="updateKOField('${type}',${index},'camp',this.value)" style="width:45px">
</td>

<td>
<input value="${safe(time)}" oninput="updateKOField('${type}',${index},'time',this.value)">
</td>

<td class="match-cell">
<div class="team-line">${formatCoppiaDisplay(match[0])}</div>
<div class="vs-line"><b>VS</b></div>
<div class="team-line">${formatCoppiaDisplay(match[1])}</div>
<div style="font-size:12px;opacity:.7;margin-top:4px;">${stato}</div>
${winner ? `<div class="winner-box">🏆 Passa: ${formatCoppiaDisplay(winner)}</div>` : ""}
</td>

<td class="db-cell">
<input value="${safe(risultato1)}" oninput="updateKOResult('${type}',${index},this.value,0)">
<input value="${safe(risultato2)}" oninput="updateKOResult('${type}',${index},this.value,1)">
</td>
</tr>`;
}

'''
          s = s[:a] + fn + s[b:]

          css = r'''
/* ========================================================
   KO — COPIA FEDELE DEL LAYOUT DEI GIRONI
   Struttura reale: Campo | Ora | Match | Ris
   ======================================================== */
.koBox, .finalContainer { overflow-x:hidden !important; }
.koBox table, .finalContainer table {
    width:100% !important;
    min-width:0 !important;
    max-width:none !important;
    table-layout:auto !important;
    border-collapse:collapse !important;
    border-spacing:0 !important;
}
.koBox table th, .koBox table td,
.finalContainer table th, .finalContainer table td {
    padding:8px 4px !important;
    box-sizing:border-box !important;
    text-align:center !important;
    vertical-align:middle !important;
}
.koBox table td:nth-child(1), .finalContainer table td:nth-child(1) { width:53px !important; }
.koBox table td:nth-child(2), .finalContainer table td:nth-child(2) { width:101px !important; }
.koBox table td:nth-child(3), .finalContainer table td:nth-child(3) { width:120px !important; }
.koBox table td:nth-child(4), .finalContainer table td:nth-child(4) { width:188px !important; }
.koBox table td:nth-child(1) input, .finalContainer table td:nth-child(1) input { width:45px !important; min-width:45px !important; max-width:45px !important; }
.koBox table td:nth-child(2) input, .finalContainer table td:nth-child(2) input { width:100% !important; max-width:none !important; }
.koBox table td.db-cell, .finalContainer table td.db-cell { width:188px !important; white-space:nowrap !important; }
.koBox table td.db-cell input, .finalContainer table td.db-cell input { width:50% !important; max-width:none !important; min-width:0 !important; box-sizing:border-box !important; }
.koBox table td.match-cell .team-line, .finalContainer table td.match-cell .team-line { display:block !important; width:100% !important; line-height:1.3 !important; white-space:normal !important; margin:2px 0 !important; }
'''
          s = s.replace('</style>', css + '\n</style>', 1)

          if s == original:
              raise SystemExit('Nessuna modifica applicata')

          p.write_text(s, encoding='utf-8')

          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          for i, script in enumerate(scripts):
              f = Path(f'/tmp/bove-{i}.js')
              f.write_text(script, encoding='utf-8')
              r = subprocess.run(['node','--check',str(f)], capture_output=True, text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'Syntax error nello script {i}')

          assert '<th>Campo</th><th>Ora</th><th>Match</th><th>Ris</th>' in s
          assert 'Struttura reale: Campo | Ora | Match | Ris' in s
          print('VERIFICA OK: KO usa la stessa struttura DOM dei Gironi')

      - name: Commit corrected Bove.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nessuna modifica necessaria"
          else
            git commit -m "Fix KO layout to match Gironi"
            git push
          fi
