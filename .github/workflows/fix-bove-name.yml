name: Fix Bove tournament header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: sincronizza nome torneo in Bove [auto]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Bove header sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')
          old = '''function closeRules(){'''
          new = '''function sincronizzaIntestazioneTorneo(){
    const nome = String(state?.nomeTorneo || '').trim();
    const input = document.getElementById('nomeTorneoInput');
    const titolo = document.getElementById('titoloTorneo');

    if(input && nome) input.value = nome;
    if(titolo && nome) titolo.textContent = '🏆 ' + nome;

    if(typeof aggiornaNomeFormulaTorneo === 'function')
        aggiornaNomeFormulaTorneo();
}
function closeRules(){'''
          if old in s and 'function sincronizzaIntestazioneTorneo()' not in s:
              s = s.replace(old, new, 1)
          else:
              print('Header helper already present or anchor missing')

          old2 = '''    if(typeof render==="function"){

        try{

            render();'''
          new2 = '''    sincronizzaIntestazioneTorneo();

    if(typeof render==="function"){

        try{

            render();'''
          if old2 in s and 'sincronizzaIntestazioneTorneo();' not in s:
              s = s.replace(old2, new2, 1)
          elif old2 in s:
              marker = '    if(typeof render==="function"){'
              pos = s.find(marker)
              if pos >= 0 and 'sincronizzaIntestazioneTorneo();' not in s[max(0,pos-80):pos]:
                  s = s[:pos] + '    sincronizzaIntestazioneTorneo();\n\n' + s[pos:]
          else:
              raise SystemExit('loadState render anchor missing')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          if git diff --cached --quiet; then
            echo 'Nessuna modifica necessaria'
            exit 0
          fi
          git commit -m 'fix: sincronizza nome torneo in Bove [auto]'
          git push
