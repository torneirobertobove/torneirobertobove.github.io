name: Fix Bove tournament header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: sincronizza nome torneo in Bove [auto]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Bove header sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="bove-tournament-name-sync">'
          if marker not in s:
              patch = r'''<script id="bove-tournament-name-sync">
(function(){
  function syncTournamentName(){
    try{
      if(typeof state === 'undefined' || !state) return false;
      const nome = String(state.nomeTorneo || '').trim();
      if(!nome) return false;
      const titolo = document.getElementById('titoloTorneo');
      if(titolo) titolo.textContent = '🏆 ' + nome;
      const input = document.getElementById('nomeTorneoInput');
      if(input && input.value !== nome) input.value = nome;
      return true;
    }catch(e){
      console.warn('Sincronizzazione nome torneo Bove:', e);
      return false;
    }
  }
  function start(){
    let tentativi = 0;
    syncTournamentName();
    const timer = setInterval(function(){
      tentativi++;
      if(syncTournamentName() || tentativi >= 50) clearInterval(timer);
    }, 100);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
'''
              if '</body>' not in s:
                  raise SystemExit('Bove.html: </body> non trovato')
              s = s.replace('</body>', patch + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Header sync already present')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          if git diff --cached --quiet; then
            echo 'Nessuna modifica necessaria'
            exit 0
          fi
          git commit -m 'fix: sincronizza nome torneo in Bove [auto]'
          git push
