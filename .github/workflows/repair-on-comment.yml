name: Repair Bove on PR comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, 'REPAIR-BOVE') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Inject final empty tournament renderer
        shell: python
        run: |
          from pathlib import Path
          p=Path('Bove.html')
          text=p.read_text(encoding='utf-8')
          marker='<!-- BOVE EMPTY TOURNAMENT PATCH V3 -->'
          if marker in text:
              print('Patch V3 gia presente')
              raise SystemExit(0)
          patch=r'''<!-- BOVE EMPTY TOURNAMENT PATCH V3 -->
<script>
(function(){
    const groups=['A','B','C','D','E','F','G'];
    function activeGroups(){return groups.slice(0,Math.max(1,Number(state?.rules?.numeroGironi)||2));}
    const rt=window.renderTables;
    window.renderTables=function(){
        if(typeof rt==='function'){try{rt();}catch(e){console.error(e);}}
        activeGroups().forEach(g=>{
            const c=document.getElementById('card'+g),r=document.getElementById(g+'rows');
            if(c)c.style.display='block';
            if(r&&!r.querySelector('tr'))r.innerHTML=Array.from({length:6},()=>'<tr><td></td><td></td><td class="match-cell"><div class="team-line">—</div><div class="vs-line"><b>VS</b></div><div class="team-line">—</div></td><td></td></tr>').join('');
        });
    };
    const rc=window.renderClass;
    window.renderClass=function(){
        if(typeof rc==='function'){try{rc();}catch(e){console.error(e);}}
        const n=Math.max(1,Number(state?.rules?.squadrePerGirone)||4);
        activeGroups().forEach(g=>{
            const c=document.getElementById('card'+g),b=document.getElementById(g+'class');
            if(c)c.style.display='block';
            if(b&&!b.querySelector('tr'))b.innerHTML=Array.from({length:n},()=>'<tr><td></td><td></td><td>0</td><td>0</td><td>0</td><td>0</td></tr>').join('');
        });
    };
    window.renderKO=function(){
        ensureRules();
        const q=document.getElementById('Q'),s=document.getElementById('S'),f=document.getElementById('finaleBox')||document.getElementById('F');
        if(!q||!s||!f)return;
        const qt=q.closest('table'),st=s.closest('table'),ft=f.closest('table');
        q.innerHTML='';s.innerHTML='';f.innerHTML='';
        if(!Array.isArray(state.qRes))state.qRes=Array(4).fill('-');
        if(!Array.isArray(state.sTopRes))state.sTopRes=Array(2).fill('-');
        while(state.qRes.length<4)state.qRes.push('-');
        while(state.sTopRes.length<2)state.sTopRes.push('-');
        if(typeof state.fTopRes!=='string')state.fTopRes='-';
        let qual=[];try{const r=getFinalQualified();if(Array.isArray(r))qual=r;}catch(e){}
        const expected=Math.max(0,Number(state.rules.numeroQualificateFinali)||((Number(state.rules.numeroGironi)||0)*(Number(state.rules.qualificatePerGirone)||0)));
        const a=Array.from({length:expected},(_,i)=>qual[i]||'');
        const qOn=state.rules.usaQuarti===true&&expected>=8,sOn=state.rules.usaSemifinali===true,fOn=state.rules.usaFinale===true;
        let sem=[];
        if(qOn){const qm=[[a[0],a[7]],[a[3],a[4]],[a[1],a[6]],[a[2],a[5]]];qm.forEach((m,i)=>q.innerHTML+=creaMatchKO(m,'q',i,state.qRes[i]));if(qt)qt.style.display='table';const w=qm.map((m,i)=>getWinner(m,state.qRes[i])).filter(Boolean);sem=w.length===4?[[w[0],w[1]],[w[2],w[3]]]:[['',''],['','']];}
        else if(expected>=4){sem=[[a[0],a[3]],[a[2],a[1]]];if(qt)qt.style.display='none';}
        else if(expected>=2){sem=[[a[0],a[1]]];if(qt)qt.style.display='none';}
        else if(qt)qt.style.display='none';
        let fin=[];
        if(sOn){if(expected>=4&&sem.length<2)sem.push(['','']);sem.slice(0,2).forEach((m,i)=>{s.innerHTML+=creaMatchKO(m,'s',i,state.sTopRes[i]);const w=getWinner(m,state.sTopRes[i]);if(w)fin.push(w);});if(st)st.style.display='table';}
        else if(expected>=2){fin=[a[0]||'',a[1]||''];if(st)st.style.display='none';}
        else if(st)st.style.display='none';
        state.finalTop=[fin[0]||'',fin[1]||''];
        if(fOn){f.innerHTML=creaMatchKO(state.finalTop,'f',0,state.fTopRes);if(ft)ft.style.display='table';}else if(ft)ft.style.display='none';
        console.log('=== BOVE EMPTY STRUCTURE V3 ===',{expected,qualificati:qual.length,qOn,sOn,fOn,qRows:q.querySelectorAll('tr').length,sRows:s.querySelectorAll('tr').length,fRows:f.querySelectorAll('tr').length});
    };
})();
</script>
'''
          text=text.replace('</body>',patch+'\n</body>',1)
          p.write_text(text,encoding='utf-8')

      - name: Commit repaired Bove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply final Bove empty tournament fix'
          git push origin HEAD:main
