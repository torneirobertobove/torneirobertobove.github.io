name: Repair Bove on PR comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, 'REPAIR-BOVE') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply global pair-name repair
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('Bove.html')
          text=p.read_text(encoding='utf-8')

          if '/* BOVE GLOBAL COPPIA NAME FIX V2 */' in text:
              print('Fix V2 gia presente')
              raise SystemExit(0)

          helper=r'''/* BOVE GLOBAL COPPIA NAME FIX V2 */
function formatNomeCoppia(squadra){
    if(squadra===null || squadra===undefined || squadra==="" || squadra==="-") return "-";

    function giocatore(g){
        if(g===null || g===undefined || g==="") return "";
        if(typeof g === "object"){
            const nome=String(g.nome ?? g.firstName ?? "").trim();
            const cognome=String(g.cognome ?? g.lastName ?? "").trim();
            if(nome && cognome) return nome.charAt(0).toUpperCase()+". "+cognome;
            return cognome || nome || "";
        }
        const s=String(g).replace(/\s+/g," ").trim();
        if(!s) return "";
        const p=s.split(" ").filter(Boolean);
        if(p.length===1) return p[0];
        return p[0].charAt(0).toUpperCase()+". "+p[p.length-1];
    }

    if(typeof squadra === "object"){
        const g1=squadra.giocatore1 ?? squadra.g1 ?? squadra.player1;
        const g2=squadra.giocatore2 ?? squadra.g2 ?? squadra.player2;
        if(g1!==undefined || g2!==undefined){
            const a=giocatore(g1), b=giocatore(g2);
            return a && b ? a+" / "+b : (a || b || "-");
        }
        if(typeof squadra.nome === "string" && squadra.nome.trim()) squadra=squadra.nome.trim();
        else return "-";
    }

    const s=String(squadra).replace(/\s+/g," ").trim();
    if(!s || s==="-") return "-";
    if(s.includes("/")) return s.split("/").map(x=>giocatore(x)).filter(Boolean).join(" / ");
    return giocatore(s);
}
'''

          marker='function renderTables(){'
          if marker not in text: raise SystemExit('renderTables non trovato')
          text=text.replace(marker,helper+'\n\n'+marker,1)

          pattern=r'''        /\*\n                    COPPIA CASA\n                \*/.*?                /\*\n                    HTML ORIGINALE\n                \*/'''
          replacement='''        /*
                    COPPIE: visualizzazione unica e coerente
                */

                const squadraCasa =
                    formatNomeCoppia(state[tag][m.casa]);

                const squadraOspite =
                    formatNomeCoppia(state[tag][m.ospite]);


                /*
                    HTML ORIGINALE
                */'''
          text,n=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('blocco COPPIA CASA/OSPITE non trovato')

          pattern2=r'''    function nomeCoppia\(squadra\)\{.*?\n    \}\n\n\n    /\*\n    ============================================================\n    LAYOUT KO'''
          replacement2='''    function nomeCoppia(squadra){
        return formatNomeCoppia(squadra);
    }


    /*
    ============================================================
    LAYOUT KO'''
          text,n=re.subn(pattern2,replacement2,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('nomeCoppia locale renderKO non trovato')

          p.write_text(text,encoding='utf-8')

      - name: Commit repaired Bove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair Bove pair names globally'
          git push origin HEAD:main
