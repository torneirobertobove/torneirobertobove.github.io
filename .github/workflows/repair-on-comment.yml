name: Repair Bove on PR comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, 'REPAIR-BOVE') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply global pair-name repair
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('Bove.html')
          text=p.read_text(encoding='utf-8')

          if '/* BOVE GLOBAL COPPIA NAME FIX V2 */' not in text:
              helper=r'''/* BOVE GLOBAL COPPIA NAME FIX V2 */
function formatNomeCoppia(squadra){
    if(squadra===null || squadra===undefined || squadra==="" || squadra==="-") return "-";
    function giocatore(g){
        if(g===null || g===undefined || g==="") return "";
        if(typeof g === "object"){
            const nome=String(g.nome ?? g.firstName ?? "").trim();
            const cognome=String(g.cognome ?? g.lastName ?? "").trim();
            if(nome && cognome) return nome.charAt(0).toUpperCase()+". "+cognome.charAt(0).toUpperCase()+cognome.slice(1).toLowerCase();
            return cognome || nome || "";
        }
        const s=String(g).replace(/\s+/g," ").trim();
        if(!s) return "";
        const p=s.split(" ").filter(Boolean);
        if(p.length===1) return p[0];
        return p[0].charAt(0).toUpperCase()+". "+p[p.length-1].charAt(0).toUpperCase()+p[p.length-1].slice(1).toLowerCase();
    }
    if(typeof squadra === "object"){
        const g1=squadra.giocatore1 ?? squadra.g1 ?? squadra.player1;
        const g2=squadra.giocatore2 ?? squadra.g2 ?? squadra.player2;
        if(g1!==undefined || g2!==undefined){
            const a=giocatore(g1), b=giocatore(g2);
            return a && b ? a+" / "+b : (a || b || "-");
        }
        if(typeof squadra.nome === "string" && squadra.nome.trim()) squadra=squadra.nome.trim();
        else return "-";
    }
    const s=String(squadra).replace(/\s+/g," ").trim();
    if(!s || s==="-") return "-";
    if(s.includes("/")) return s.split("/").map(x=>giocatore(x)).filter(Boolean).join(" / ");
    return giocatore(s);
}
'''
            marker='function renderTables(){'
            if marker not in text: raise SystemExit('renderTables non trovato')
            text=text.replace(marker,helper+'\n\n'+marker,1)

          pattern=r'''        /\*\n                    COPPIA CASA\n                \*/.*?                /\*\n                    HTML ORIGINALE\n                \*/'''
          replacement='''        /*
                    COPPIE: visualizzazione unica e coerente
                */
                const squadraCasa = formatNomeCoppia(state[tag][m.casa]);
                const squadraOspite = formatNomeCoppia(state[tag][m.ospite]);

                /*
                    HTML ORIGINALE
                */'''
          text,n=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('blocco COPPIA CASA/OSPITE non trovato')

          pattern2=r'''    function nomeCoppia\(squadra\)\{.*?\n    \}\n\n\n    /\*\n    ============================================================\n    LAYOUT KO'''
          replacement2='''    function nomeCoppia(squadra){
        return formatNomeCoppia(squadra);
    }


    /*
    ============================================================
    LAYOUT KO'''
          text,n=re.subn(pattern2,replacement2,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('nomeCoppia locale renderKO non trovato')

          p.write_text(text,encoding='utf-8')

      - name: Apply automatic KO winner progression
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('Bove.html')
          text=p.read_text(encoding='utf-8')

          replacement=r'''function updateRes(g,i,pos,val){

    const map={A:"Ares",B:"Bres",C:"Cres",D:"Dres",E:"Eres",F:"Fres",G:"Gres"};
    i=Number(i);
    pos=Number(pos);
    if(!Number.isInteger(i)||i<0) return;
    if(pos!==0&&pos!==1) return;

    const gruppo=String(g||"").toUpperCase();

    if(map[gruppo]){
        const chiave=map[gruppo];
        if(!Array.isArray(state[chiave])) state[chiave]=[];
        let s=state[chiave];
        if(s[i]===undefined||s[i]===null||s[i]==="") s[i]="-";
        let p=String(s[i]).split("-");
        if(p.length!==2) p=["",""];
        p[pos]=String(val??"").trim();
        s[i]=(p[0]===""&&p[1]==="")?"-":p[0]+"-"+p[1];
    }
    else if(gruppo==="Q"){
        if(!Array.isArray(state.qRes)) state.qRes=Array(4).fill("-");
        while(state.qRes.length<4) state.qRes.push("-");
        let p=String(state.qRes[i]??"-").split("-");
        if(p.length!==2) p=["",""];
        p[pos]=String(val??"").trim();
        state.qRes[i]=(p[0]===""&&p[1]==="")?"-":p[0]+"-"+p[1];
    }
    else if(gruppo==="S"){
        if(!Array.isArray(state.sTopRes)) state.sTopRes=Array(2).fill("-");
        while(state.sTopRes.length<2) state.sTopRes.push("-");
        let p=String(state.sTopRes[i]??"-").split("-");
        if(p.length!==2) p=["",""];
        p[pos]=String(val??"").trim();
        state.sTopRes[i]=(p[0]===""&&p[1]==="")?"-":p[0]+"-"+p[1];
    }
    else if(gruppo==="F"){
        let p=String(state.fTopRes??"-").split("-");
        if(p.length!==2) p=["",""];
        p[pos]=String(val??"").trim();
        state.fTopRes=(p[0]===""&&p[1]==="")?"-":p[0]+"-"+p[1];
    }
    else return;

    if(typeof renderClass==="function") renderClass();
    if(typeof renderKO==="function") renderKO();
    if(typeof updateAndSync==="function") updateAndSync();
}
'''
          pattern=r'function updateRes\(g,i,pos,val\)\s*\{.*?\n\s*\}\s*\n\s*function updateCamp\('
          text,n=re.subn(pattern,replacement+'\nfunction updateCamp(',text,count=1,flags=re.S)
          if n!=1: raise SystemExit('function updateRes non trovata')
          p.write_text(text,encoding='utf-8')

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          text=Path('Bove.html').read_text(encoding='utf-8')
          for x in ['function updateRes(g,i,pos,val)','gruppo==="Q"','gruppo==="S"','gruppo==="F"','function renderKO()','function getWinner(match,res)']:
              if x not in text: raise SystemExit('MANCANTE: '+x)
          print('OK: KO winner flow valido')

      - name: Commit repaired Bove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair Bove KO winner progression'
          git push origin HEAD:main
