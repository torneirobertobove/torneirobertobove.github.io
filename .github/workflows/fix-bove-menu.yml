name: Fix Bove user menu

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Bove user menu
        shell: python
        run: |
          from pathlib import Path

          path = Path("Bove.html")
          text = path.read_text(encoding="utf-8")

          start = text.find("<!-- BOVE USER MENU FINAL FIX -->")
          end_marker = "<!-- /BOVE USER MENU FINAL FIX -->"
          end = text.find(end_marker)

          patch = r'''<!-- BOVE USER MENU FINAL FIX -->
          <style id="bove-user-menu-final-fix">
          body.user-mode #menuComandi {
              background:#111827 !important;
              border:1px solid #334155 !important;
              opacity:1 !important;
          }

          body.user-mode #menuComandi button:nth-child(2),
          body.user-mode #menuComandi button:nth-child(4) {
              display:block !important;
              visibility:visible !important;
              opacity:1 !important;
              pointer-events:auto !important;
          }

          body.user-mode #menuComandi button:nth-child(1),
          body.user-mode #menuComandi button:nth-child(3),
          body.user-mode #menuComandi button:nth-child(5),
          body.user-mode #menuComandi button:nth-child(6),
          body.user-mode #menuComandi button:nth-child(7) {
              display:none !important;
              visibility:hidden !important;
              opacity:0 !important;
              pointer-events:none !important;
          }
          </style>

          <script>
          (function(){
              "use strict";

              function applyBoveUserMenu(){
                  if(!document.body.classList.contains("user-mode")) return;

                  const menu = document.getElementById("menuComandi");
                  const hamburger = document.querySelector(".menu-button");
                  if(!menu) return;

                  if(hamburger){
                      hamburger.disabled = false;
                      hamburger.style.setProperty("display","flex","important");
                      hamburger.style.setProperty("visibility","visible","important");
                      hamburger.style.setProperty("opacity","1","important");
                      hamburger.style.setProperty("pointer-events","auto","important");
                  }

                  const buttons = [...menu.querySelectorAll("button")];
                  buttons.forEach((button,index)=>{
                      const allowed = index === 1 || index === 3;
                      button.disabled = !allowed;

                      if(allowed){
                          button.style.setProperty("display","block","important");
                          button.style.setProperty("visibility","visible","important");
                          button.style.setProperty("opacity","1","important");
                          button.style.setProperty("pointer-events","auto","important");
                      }else{
                          button.style.setProperty("display","none","important");
                          button.style.setProperty("visibility","hidden","important");
                          button.style.setProperty("opacity","0","important");
                          button.style.setProperty("pointer-events","none","important");
                      }
                  });

                  menu.style.setProperty("background","#111827","important");
                  menu.style.setProperty("border","1px solid #334155","important");
              }

              window.toggleMenu = function(){
                  const menu = document.getElementById("menuComandi");
                  if(!menu) return;
                  applyBoveUserMenu();
                  menu.classList.toggle("show");
                  applyBoveUserMenu();
              };

              function start(){
                  applyBoveUserMenu();
                  setTimeout(applyBoveUserMenu,100);
                  setTimeout(applyBoveUserMenu,500);
                  setTimeout(applyBoveUserMenu,1500);
                  window.setInterval(applyBoveUserMenu,2000);
              }

              if(document.readyState === "loading"){
                  document.addEventListener("DOMContentLoaded",start,{once:true});
              }else{
                  start();
              }
          })();
          </script>
          <!-- /BOVE USER MENU FINAL FIX -->'''

          if start >= 0 and end >= 0:
              end += len(end_marker)
              text = text[:start] + patch + text[end:]
          else:
              if "</head>" in text:
                  text = text.replace("</head>", patch + "\n</head>", 1)
              else:
                  text += "\n" + patch

          path.write_text(text, encoding="utf-8")

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html
          git diff --cached --quiet && exit 0
          git commit -m "Repair Bove user menu"
          git push
