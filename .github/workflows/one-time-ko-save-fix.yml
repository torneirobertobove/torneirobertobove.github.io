name: One-time Bove KO save fix
on:
  push:
    branches:
      - main
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix salvataggio campi e orari KO in Bove'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Bove
        run: python .github/scripts/patch_bove_ko.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html
          git diff --cached --check
          git commit -m "Fix salvataggio campi e orari KO in Bove"
          git push
