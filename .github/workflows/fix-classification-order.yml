name: Fix gironi classification match order

on:
  push:
    paths:
      - '.github/workflows/fix-classification-order.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch classification renderer
        shell: python
        run: |
          from pathlib import Path
          p = Path('bove-admin-flow-fix.js')
          s = p.read_text(encoding='utf-8')

          marker = '  patchRenderKOForPersistence();'
          if 'window.__BOVE_CLASSIFICATION_ORDER_PATCHED__' in s:
              print('classification patch already present')
          elif marker not in s:
              raise SystemExit('target marker not found; file left unchanged')
          else:
              patch = r'''
  function patchRenderClassForMatchOrder() {
    try {
      if (typeof window.renderClass !== 'function' || window.__BOVE_CLASSIFICATION_ORDER_PATCHED__) return;

      const originalRenderClass = window.renderClass;
      window.__BOVE_CLASSIFICATION_ORDER_PATCHED__ = true;

      window.renderClass = function () {
        const saved = {};
        const calcOrder = [0, 2, 4, 5, 3, 1];
        ['A','B','C','D','E','F','G'].forEach(tag => {
          const key = tag + 'res';
          if (typeof state !== 'undefined' && Array.isArray(state[key]) && state[key].length === 6) {
            saved[key] = state[key].slice();
            state[key] = calcOrder.map(i => saved[key][i]);
          }
        });

        try {
          return originalRenderClass.apply(this, arguments);
        } finally {
          Object.keys(saved).forEach(key => {
            if (typeof state !== 'undefined') state[key] = saved[key];
          });
        }
      };
    } catch (e) {
      console.error('Errore patch ordine risultati classifiche:', e);
    }
  }

  patchRenderClassForMatchOrder();
'''
              s = s.replace(marker, patch + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
              print('classification patch inserted')

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('bove-admin-flow-fix.js').read_text(encoding='utf-8')
          Path('/tmp/patch.js').write_text(s,encoding='utf-8')
          PY
          node --check /tmp/patch.js

      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name 'Bove Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bove-admin-flow-fix.js
          git rm .github/workflows/fix-classification-order.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix classification results match order'
          git push
