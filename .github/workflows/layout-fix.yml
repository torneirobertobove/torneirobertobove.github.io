name: Restore Bove classification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layout-fix.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore renderClass only
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')
          if re.search(r'function\s+renderClass\s*\(', s):
              print('renderClass already present')
          else:
              fn = r'''function renderClass(){

    ensureRules();

    [
        "A",
        "B",
        "C",
        "D",
        "E",
        "F",
        "G"
    ].forEach(tag=>{

        if(
            !Array.isArray(state[tag]) ||
            state[tag].length===0
        ){
            state["rank"+tag]=[];
            return;
        }

        let box = document.getElementById(tag+"class");
        if(!box) return;

        let risultati = Array.isArray(state[tag+"res"]) ? state[tag+"res"] : [];
        let classifica = calc(state[tag], risultati);

        if(!Array.isArray(classifica)) classifica=[];

        state["rank"+tag] = classifica;

        box.innerHTML = classifica.map(x=>`
<tr>
<td>
<span class="${x.qual ? "qual-arrow-up" : "qual-arrow-down"}">
${x.qual ? "▲" : "▼"}
</span>
${String(x.n || "")}
</td>
<td>${x.pt}</td>
<td>${x.gf}</td>
<td>${x.gs}</td>
<td>${x.df}</td>
</tr>
`).join("");

    });

}
'''
              marker = 'function render(){'
              pos = s.find(marker)
              if pos == -1:
                  raise SystemExit('function render() not found; Bove.html left unchanged')
              s = s[:pos] + fn + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
              print('renderClass restored')
      - name: Validate Bove.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('Bove.html').read_text(encoding='utf-8')
          if s.count('function renderClass(') != 1: raise SystemExit('renderClass count invalid')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/bove.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/bove.js
      - name: Commit Bove and cleanup
        shell: bash
        run: |
          git config user.name 'Bove Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git rm .github/workflows/layout-fix.yml
          git commit -m 'Restore classification renderer without changing other functions'
          git push
