name: fix-user-menu

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair Bove user menu
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')

          # Remove all previous injected menu fixes.
          s = re.sub(r'<style id="bove-user-menu-[^"]+">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<script id="bove-user-menu-toggle">.*?</script>\s*', '', s, flags=re.S)
          s = re.sub(r'<!-- BOVE USER MENU FINAL FIX -->.*?<!-- /BOVE USER MENU FINAL FIX -->\s*', '', s, flags=re.S)

          # Replace the current non-admin menu block with a deterministic USER mode:
          # ONLY PRINT + EXIT. ADMIN keeps the complete existing menu.
          start = s.find('    if(\n        String(profilo.ruolo)')
          if start == -1:
              raise SystemExit('Blocco controllo ruolo non trovato')

          end = s.find('        console.log(\n            "=== ACCESSO USER:', start)
          if end == -1:
              raise SystemExit('Fine blocco user non trovata')

          end2 = s.find('        );', end)
          if end2 == -1:
              raise SystemExit('Fine log user non trovata')
          end2 += len('        );')

          replacement = '''    if(\n        String(profilo.ruolo)\n            .toLowerCase()\n            .trim() !== "admin"\n    ){\n\n        console.warn(\n            "Utente senza permessi admin:",\n            profilo\n        );\n\n        bloccaGestionale();\n        document.body.classList.add("user-mode");\n\n        const hamburger = document.querySelector(".menu-button");\n        const menu = document.getElementById("menuComandi");\n\n        if(hamburger){\n            hamburger.disabled = false;\n            hamburger.style.setProperty("display", "flex", "important");\n            hamburger.style.setProperty("visibility", "visible", "important");\n            hamburger.style.setProperty("opacity", "1", "important");\n            hamburger.style.setProperty("pointer-events", "auto", "important");\n        }\n\n        if(menu){\n            const buttons = [...menu.querySelectorAll("button")];\n\n            buttons.forEach(function(button, index){\n                const testo = (button.textContent || "").trim();\n                const isPrint = /stampa/i.test(testo);\n                const isExit = index === buttons.length - 1 || /uscita/i.test(testo);\n                const allowed = isPrint || isExit;\n\n                button.classList.toggle("user-print", isPrint);\n                button.classList.toggle("user-exit", isExit && !isPrint);\n                button.disabled = !allowed;\n\n                button.style.setProperty(\n                    "display",\n                    allowed ? "block" : "none",\n                    "important"\n                );\n                button.style.setProperty(\n                    "visibility",\n                    allowed ? "visible" : "hidden",\n                    "important"\n                );\n                button.style.setProperty(\n                    "pointer-events",\n                    allowed ? "auto" : "none",\n                    "important"\n                );\n\n                if(isExit && !isPrint){\n                    button.textContent = "🚪 Uscita";\n                    button.onclick = function(){\n                        window.location.href = "index.html";\n                    };\n                }\n            });\n        }\n\n        console.log(\n            "=== ACCESSO USER: SOLO STAMPA E USCITA ==="\n        );'''

          s = s[:start] + replacement + s[end2:]

          # One final CSS block. No Regole, no other admin functions for USER.
          css = '''<style id="bove-user-menu-stable">\nbody.user-mode .menu-container {\n    position: fixed !important;\n    top: 75px !important;\n    right: 20px !important;\n    left: auto !important;\n    z-index: 99999 !important;\n}\nbody.user-mode .menu-button {\n    display: flex !important;\n    visibility: visible !important;\n    opacity: 1 !important;\n    pointer-events: auto !important;\n}\nbody.user-mode #menuComandi {\n    display: none !important;\n    visibility: hidden !important;\n    opacity: 0 !important;\n    pointer-events: none !important;\n    position: absolute !important;\n    top: 45px !important;\n    right: 0 !important;\n    width: 220px !important;\n    padding: 10px !important;\n    background: #111827 !important;\n    border: 1px solid #334155 !important;\n    border-radius: 12px !important;\n    box-shadow: 0 10px 25px rgba(0,0,0,.5) !important;\n    flex-direction: column !important;\n    gap: 8px !important;\n}\nbody.user-mode #menuComandi.show {\n    display: flex !important;\n    visibility: visible !important;\n    opacity: 1 !important;\n    pointer-events: auto !important;\n}\nbody.user-mode #menuComandi button {\n    display: none !important;\n}\nbody.user-mode #menuComandi button.user-print,\nbody.user-mode #menuComandi button.user-exit {\n    display: block !important;\n    visibility: visible !important;\n    opacity: 1 !important;\n    pointer-events: auto !important;\n    width: 100% !important;\n    min-height: 42px !important;\n    box-sizing: border-box !important;\n}\n</style>\n'''
          s = s.replace('</head>', css + '</head>', 1)

          # Definitive toggle: USER can only see/click PRINT + EXIT.
          toggle = '''<script id="bove-user-menu-toggle">\nwindow.toggleMenu = function(){\n    const menu = document.getElementById("menuComandi");\n    if(!menu) return;\n\n    if(document.body.classList.contains("user-mode")){\n        const buttons = [...menu.querySelectorAll("button")];\n        buttons.forEach(function(button, index){\n            const text = (button.textContent || "").trim();\n            const print = /stampa/i.test(text);\n            const exit = button.classList.contains("user-exit") || index === buttons.length - 1 || /uscita/i.test(text);\n            const allowed = print || exit;\n\n            button.classList.toggle("user-print", print);\n            button.classList.toggle("user-exit", exit && !print);\n            button.disabled = !allowed;\n            button.style.setProperty("display", allowed ? "block" : "none", "important");\n            button.style.setProperty("visibility", allowed ? "visible" : "hidden", "important");\n            button.style.setProperty("pointer-events", allowed ? "auto" : "none", "important");\n\n            if(exit && !print){\n                button.textContent = "🚪 Uscita";\n                button.onclick = function(){ window.location.href = "index.html"; };\n            }\n        });\n    }\n\n    menu.classList.toggle("show");\n};\n</script>\n'''
          s = s.replace('</head>', toggle + '</head>', 1)

          p.write_text(s, encoding='utf-8')
          print('Bove.html repaired: USER = PRINT + EXIT only; ADMIN = full access')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix user access to print and exit only"
          git push
