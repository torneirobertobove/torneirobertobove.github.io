name: Fix Bove user menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch Bove.html
        shell: python
        run: |
          from pathlib import Path

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')

          marker = 'document.body.classList.add("bove-user-mode");'
          if marker not in text:
              needle = '''    if(
        String(profilo.ruolo)
            .toLowerCase()
            .trim() !== "admin"
    ){'''
              replacement = needle + '\n\n        document.body.classList.add("bove-user-mode");'
              if needle not in text:
                  raise SystemExit('Blocco ruolo user non trovato')
              text = text.replace(needle, replacement, 1)

          css = '''
<style id="bove-user-menu-final-fix">
/* USER: il menu hamburger resta visibile, ma tutte le funzioni admin sono nascoste. */
body.bove-user-mode #menuComandi button {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
}

body.bove-user-mode .menu-button {
    display: flex !important;
    visibility: visible !important;
    pointer-events: auto !important;
    opacity: 1 !important;
}
</style>
'''

          if 'id="bove-user-menu-final-fix"' not in text:
              if '</head>' not in text:
                  raise SystemExit('</head> non trovato')
              text = text.replace('</head>', css + '</head>', 1)

          p.write_text(text, encoding='utf-8')

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          text = Path('Bove.html').read_text(encoding='utf-8')
          assert 'document.body.classList.add("bove-user-mode");' in text
          assert 'id="bove-user-menu-final-fix"' in text
          assert 'body.bove-user-mode #menuComandi button' in text
          print('USER MENU FIX VALIDATED')

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git rm .github/workflows/fix-user-menu.yml
          git commit -m 'Fix user menu visibility in Bove'
          git push origin HEAD:main
