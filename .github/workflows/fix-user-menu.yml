name: fix-user-menu

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair Bove user menu
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')

          # In user mode there are currently no menu functions available.
          # Hide the entire admin menu and its hamburger. Admin mode is untouched.
          start = s.find('        /*\n        MENU UTENTE: consentite solo le funzioni di consultazione.')
          if start == -1:
              start = s.find('        /*\n        MENU UTENTE: consentite solo le funzioni di consultazione.')
          if start == -1:
              raise SystemExit('Blocco user menu non trovato')

          end_marker = '        console.log(\n            "=== ACCESSO USER:'
          end = s.find(end_marker, start)
          if end == -1:
              raise SystemExit('Fine blocco user menu non trovata')
          end2 = s.find('        );', end)
          if end2 == -1:
              raise SystemExit('Fine console.log user non trovata')
          end2 += len('        );')

          replacement = '''        /*
        MENU UTENTE:
        nessuna funzione amministrativa deve essere mostrata.
        Regole, Stampa, Formato, Squadre, Salva, Reset e Torna ad Admin
        restano completamente nascosti per gli utenti normali.
        */

        const hamburger = document.querySelector(".menu-button");
        const menu = document.getElementById("menuComandi");

        if(hamburger){
            hamburger.style.setProperty("display", "none", "important");
            hamburger.disabled = true;
            hamburger.style.pointerEvents = "none";
        }

        if(menu){
            menu.classList.remove("show");
            menu.style.setProperty("display", "none", "important");
            menu.style.setProperty("visibility", "hidden", "important");
            menu.style.setProperty("opacity", "0", "important");
            menu.style.setProperty("pointer-events", "none", "important");

            menu.querySelectorAll("button, a").forEach(function(button){
                button.disabled = true;
                button.style.setProperty("display", "none", "important");
                button.style.setProperty("visibility", "hidden", "important");
                button.style.setProperty("pointer-events", "none", "important");
            });
        }

        console.log(
            "=== ACCESSO USER: MENU AMMINISTRATIVO NASCOSTO ==="
        );'''

          s = s[:start] + replacement + s[end2:]

          # Ensure the blocking function also leaves the user menu inaccessible.
          s = re.sub(
              r'if\(\s*!el\.classList\.contains\("back"\).*?\n\s*\}',
              '''if(\n            !el.classList.contains("back") &&\n            !el.classList.contains("menu-button")\n        ){\n\n            el.disabled = true;\n            el.style.opacity = "0.6";\n\n        }''',
              s,
              count=1,
              flags=re.S
          )

          # Remove previous conflicting user-menu style blocks.
          s = re.sub(r'<style id="bove-user-menu-stable">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<style id="bove-user-menu-fix">.*?</style>\s*', '', s, flags=re.S)
          s = re.sub(r'<style>\s*/\* BOVE USER MENU FINAL FIX \*/.*?</style>\s*', '', s, count=1, flags=re.S)
          s = re.sub(r'<style>\s*/\* USER MODE - MENU DI CONSULTAZIONE \*/.*?</style>\s*', '', s, count=1, flags=re.S)
          s = re.sub(r'<style>\s*/\* USER MODE - NASCONDE LE FUNZIONI AMMINISTRATIVE \*/.*?</style>\s*', '', s, count=1, flags=re.S)

          css = '''<style id="bove-user-menu-hidden">
          /* USER: nessun menu amministrativo visibile o cliccabile. */
          body.user-mode .menu-button,
          body.user-mode #menuComandi,
          body.user-mode #menuComandi.show {
              display: none !important;
              visibility: hidden !important;
              opacity: 0 !important;
              pointer-events: none !important;
          }
          </style>'''
          s = re.sub(r'<style id="bove-user-menu-hidden">.*?</style>\s*', '', s, flags=re.S)
          s = s.replace('</head>', css + '\n</head>', 1)

          # Remove any previously injected replacement toggle.
          s = re.sub(r'<script id="bove-user-menu-toggle">.*?</script>\s*', '', s, flags=re.S)

          p.write_text(s, encoding='utf-8')
          print('Bove.html: user menu hidden')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Hide admin menu for users"
          git push
