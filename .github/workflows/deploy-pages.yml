name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final empty-tournament rendering patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- BOVE EMPTY TOURNAMENT PATCH -->'

          if marker not in text:
              patch = r'''<!-- BOVE EMPTY TOURNAMENT PATCH -->
<script>
(function(){
    function activeGroups(){
        const n=Math.max(1,Number(state?.rules?.numeroGironi)||2);
        return ["A","B","C","D","E","F","G"].slice(0,n);
    }

    const originalRenderTables=window.renderTables;
    window.renderTables=function(){
        if(typeof originalRenderTables==="function"){
            try{ originalRenderTables(); }catch(e){ console.error("renderTables originale:",e); }
        }

        const groups=activeGroups();
        groups.forEach(tag=>{
            const card=document.getElementById("card"+tag);
            const rows=document.getElementById(tag+"rows");
            if(card) card.style.display="block";
            if(!rows) return;

            if(rows.querySelectorAll("tr").length===0){
                const emptyMatches=[
                    ["", ""],["", ""],["", ""],
                    ["", ""],["", ""],["", ""]
                ];
                rows.innerHTML=emptyMatches.map((m,i)=>`
<tr>
<td><input value="" style="width:45px" onchange="updateCamp('${tag}',${i},this.value)"></td>
<td><input value="" placeholder="--:--" onchange="updateTime('${tag}',${i},this.value)"></td>
<td class="match-cell"><div class="team-line"></div><div class="vs-line"><b>VS</b></div><div class="team-line"></div></td>
<td class="db-cell"><input value="" oninput="updateRes('${tag}',${i},0,this.value)"><input value="" oninput="updateRes('${tag}',${i},1,this.value)"></td>
</tr>`).join("");
            }
        });
    };

    const originalRenderClass=window.renderClass;
    window.renderClass=function(){
        if(typeof originalRenderClass==="function"){
            try{ originalRenderClass(); }catch(e){ console.error("renderClass originale:",e); }
        }

        const per=Math.max(1,Number(state?.rules?.squadrePerGirone)||4);
        activeGroups().forEach(tag=>{
            const box=document.getElementById(tag+"class");
            const card=document.getElementById("card"+tag);
            if(card) card.style.display="block";
            if(!box) return;
            if(box.querySelectorAll("tr").length===0){
                box.innerHTML=Array.from({length:per},()=>`
<tr><td></td><td></td><td>0</td><td>0</td><td>0</td><td>0</td></tr>`).join("");
            }
        });
    };

    window.renderKO=function(){
        ensureRules();
        const q=document.getElementById("Q");
        const s=document.getElementById("S");
        const f=document.getElementById("finaleBox") || document.getElementById("F");
        if(!q||!s||!f) return;

        const qt=q.closest("table"),st=s.closest("table"),ft=f.closest("table");
        q.innerHTML="";s.innerHTML="";f.innerHTML="";
        document.querySelectorAll(".winner-box.top-win").forEach(e=>e.remove());

        if(!Array.isArray(state.qRes)) state.qRes=Array(4).fill("-");
        while(state.qRes.length<4) state.qRes.push("-");
        state.qRes=state.qRes.slice(0,4);
        if(!Array.isArray(state.sTopRes)) state.sTopRes=Array(2).fill("-");
        while(state.sTopRes.length<2) state.sTopRes.push("-");
        state.sTopRes=state.sTopRes.slice(0,2);
        if(typeof state.fTopRes!=="string" || !state.fTopRes.trim()) state.fTopRes="-";

        const expected=Math.max(0,Number(state.rules.numeroQualificateFinali)||((Number(state.rules.numeroGironi)||0)*(Number(state.rules.qualificatePerGirone)||0)));
        let qualificati=[];
        try{
            const r=getFinalQualified();
            if(Array.isArray(r)) qualificati=r;
        }catch(e){ console.error("getFinalQualified:",e); }

        const slot=Array.from({length:expected},(_,i)=>qualificati[i]||"");
        const usaQuarti=state.rules.usaQuarti===true && expected>=8;
        const usaSemifinali=state.rules.usaSemifinali===true;
        const usaFinale=state.rules.usaFinale===true;
        let semifinali=[];

        if(usaQuarti){
            const quarti=[
                [slot[0]||"",slot[7]||""],
                [slot[3]||"",slot[4]||""],
                [slot[1]||"",slot[6]||""],
                [slot[2]||"",slot[5]||""]
            ];
            quarti.forEach((m,i)=>{
                q.innerHTML+=creaMatchKO(m,"q",i,state.qRes[i]);
            });
            if(qt) qt.style.display="table";
            const winners=quarti.map((m,i)=>getWinner(m,state.qRes[i])).filter(Boolean);
            semifinali=winners.length===4
                ? [[winners[0],winners[1]],[winners[2],winners[3]]]
                : [["",""] ,["",""]];
        }else if(expected>=4){
            semifinali=[[slot[0]||"",slot[3]||""],[slot[2]||"",slot[1]||""]];
            if(qt) qt.style.display="none";
        }else if(expected>=2){
            semifinali=[[slot[0]||"",slot[1]||""]];
            if(qt) qt.style.display="none";
        }else{
            if(qt) qt.style.display="none";
        }

        let finalisti=[];
        if(usaSemifinali){
            if(expected>=4 && semifinali.length<2) semifinali.push(["",""]);
            semifinali.slice(0,2).forEach((m,i)=>{
                s.innerHTML+=creaMatchKO(m,"s",i,state.sTopRes[i]);
                const w=getWinner(m,state.sTopRes[i]);
                if(w) finalisti.push(w);
            });
            if(st) st.style.display="table";
        }else if(expected>=2){
            finalisti=[slot[0]||"",slot[1]||""];
            if(st) st.style.display="none";
        }else{
            if(st) st.style.display="none";
        }

        state.finalTop=[finalisti[0]||"",finalisti[1]||""];

        if(usaFinale){
            f.innerHTML=creaMatchKO(state.finalTop,"f",0,state.fTopRes);
            if(ft) ft.style.display="table";
            const campione=getWinner(state.finalTop,state.fTopRes);
            state.campioneTop=campione||null;
            if(campione&&ft){
                ft.insertAdjacentHTML("afterend",`<div class="winner-box top-win">🏆 CAMPIONE TORNEO:<br>${campione}</div>`);
            }
        }else{
            if(ft) ft.style.display="none";
            state.campioneTop=null;
        }

        console.log("=== STRUTTURA TORNEO VUOTO ===",{
            gironi:activeGroups(),
            attesi:expected,
            qualificati:qualificati.length,
            usaQuarti,
            usaSemifinali,
            usaFinale,
            righeQ:q.querySelectorAll("tr").length,
            righeS:s.querySelectorAll("tr").length,
            righeF:f.querySelectorAll("tr").length
        });
    };
})();
</script>
'''
              text=text.replace('</body>',patch+'\n</body>',1)
              p.write_text(text,encoding='utf-8')
              print('Empty tournament patch injected')
          else:
              print('Empty tournament patch already present')

      - name: Apply definitive three fixes without replacing existing application functions
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('Bove.html')
          text=p.read_text(encoding='utf-8')

          css=r'''
/* DEFINITIVE FIX: allineamento righe gironi */
#Arows .team-line,#Brows .team-line,#Crows .team-line,#Drows .team-line,#Erows .team-line,#Frows .team-line,#Grows .team-line{
    display:block;width:100%;height:1.35em;line-height:1.35em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
#Arows .match-cell,#Brows .match-cell,#Crows .match-cell,#Drows .match-cell,#Erows .match-cell,#Frows .match-cell,#Grows .match-cell{vertical-align:middle;}
'''
          if '/* DEFINITIVE FIX: allineamento righe gironi */' not in text:
              text=text.replace('</style>',css+'\n</style>',1)

          new_update=r'''function updateKOResult(type,index,valore){
    ensureRules();
    valore=String(valore ?? "").trim();
    if(!valore) valore="-";
    if(type==="Q"){
        if(!Array.isArray(state.qRes)) state.qRes=Array(4).fill("-");
        state.qRes[index]=valore;
    }else if(type==="S"){
        if(!Array.isArray(state.sTopRes)) state.sTopRes=Array(2).fill("-");
        state.sTopRes[index]=valore;
    }else if(type==="F"){
        state.fTopRes=valore;
    }
    renderKO();
    updateAndSync();
}

function updateKOScore(type,index,pos,valore){
    ensureRules();
    let key=null;
    if(type==="Q") key="qRes";
    else if(type==="S") key="sTopRes";
    else if(type==="F") key="fTopRes";
    else return;
    let corrente;
    if(key==="fTopRes") corrente=String(state.fTopRes ?? "-");
    else{
        if(!Array.isArray(state[key])) state[key]=key==="qRes" ? Array(4).fill("-") : Array(2).fill("-");
        corrente=String(state[key][index] ?? "-");
    }
    let parti=corrente.split("-");
    if(parti.length!==2) parti=["",""];
    parti[pos]=String(valore ?? "").trim();
    const risultato=(parti[0]==="" && parti[1]==="") ? "-" : (parti[0]+"-"+parti[1]);
    if(key==="fTopRes") state.fTopRes=risultato;
    else state[key][index]=risultato;
    renderKO();
    updateAndSync();
}
'''
          text,n=re.subn(r'function updateKOResult\(type,index,valore\)\{.*?\n\}\s*function getWinner\(',new_update+'\nfunction getWinner(',text,count=1,flags=re.S)
          if n!=1: raise SystemExit('updateKOResult non trovato: stop sicuro')

          new_card=r'''function renderMatchCard(titolo,match,type,index,risultato){
    const res=risultato || "-";
    const campKey={Q:"qCamp",S:"sTopCamp",F:"fTopCamp"}[type];
    const timeKey={Q:"qTime",S:"sTopTime",F:"fTopTime"}[type];
    const camp=Array.isArray(state[campKey]) ? (state[campKey][index] || "") : "";
    const time=Array.isArray(state[timeKey]) ? (state[timeKey][index] || "") : "";
    const parti=String(res).split("-");
    const scoreA=parti[0] === "-" ? "" : (parti[0] || "");
    const scoreB=parti.length>1 ? (parti[1] || "") : "";
    const winner=getWinner(match,res);
    const stato=winner ? "Terminata" : "Da giocare";
    return `
<tr>
    <td><input value="${String(camp).replace(/"/g,"&quot;")}" style="width:45px" onchange="updateKOField('${type}',${index},'camp',this.value)"></td>
    <td><input value="${String(time).replace(/"/g,"&quot;")}" style="width:80px" onchange="updateKOField('${type}',${index},'time',this.value)"></td>
    <td class="match-cell">
        <div class="team-line">${formatCoppiaDisplay(match[0])}</div>
        <div class="vs-line"><b>VS</b></div>
        <div class="team-line">${formatCoppiaDisplay(match[1])}</div>
        <div style="font-size:12px;opacity:.7;margin-top:4px;">${stato}</div>
        ${winner ? `<div class="winner-box">🏆 Passa: ${formatCoppiaDisplay(winner)}</div>` : ""}
    </td>
    <td class="db-cell">
        <input type="text" inputmode="numeric" value="${String(scoreA).replace(/"/g,"&quot;")}" placeholder="0" aria-label="Risultato primo giocatore" onchange="updateKOScore('${type}',${index},0,this.value)" style="width:35px;text-align:center">
        <input type="text" inputmode="numeric" value="${String(scoreB).replace(/"/g,"&quot;")}" placeholder="0" aria-label="Risultato secondo giocatore" onchange="updateKOScore('${type}',${index},1,this.value)" style="width:35px;text-align:center">
    </td>
</tr>`;
}
'''
          text,n=re.subn(r'function renderMatchCard\(titolo,match,type,index,risultato\)\{.*?\n\}\s*function applicaModelloTorneo\(',new_card+'\nfunction applicaModelloTorneo(',text,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderMatchCard non trovato: stop sicuro')

          text=text.replace('const {data:torneo,error}=await sb.from("tornei").select("*").eq("id",Number(idParam)).single();','const {data:torneo,error}=await sb.from("tornei").select("*").eq("id",Number(idParam)).maybeSingle();',1)
          marker='''                    state.coppie=Array.isArray(configurazione.coppie)?configurazione.coppie:[];
                    state.partecipanti=Array.isArray(configurazione.partecipanti)?configurazione.partecipanti:[];
                }
            }catch(err){console.error("Errore recupero torneo Supabase:",err);}'''
          replacement='''                    state.coppie=Array.isArray(configurazione.coppie)?configurazione.coppie:[];
                    state.partecipanti=Array.isArray(configurazione.partecipanti)?configurazione.partecipanti:[];
                }else{
                    console.warn("TORNEO REMOTO NON TROVATO:",idParam);
                    state.idTorneo=Number(idParam);
                    state.nomeTorneo="";
                    state.dataTorneo="";
                    state.coppie=[];
                    state.partecipanti=[];
                    state.iscritti=[];
                    state.rules={...(state.rules||{}),numeroSquadre:0,numeroGironi:0,squadrePerGirone:0,formatoTorneo:""};
                    configurazione=null;
                }
            }catch(err){console.error("Errore recupero torneo Supabase:",err);}'''
          if marker not in text: raise SystemExit('Blocco torneo remoto non trovato: stop sicuro')
          text=text.replace(marker,replacement,1)

          old_guard='''                let vecchioCompleto =

                    Array.isArray(vecchio.A) &&
                    vecchio.A.length>0 &&

                    Array.isArray(vecchio.B) &&
                    vecchio.B.length>0;



                let nuovoVuoto =

                    !Array.isArray(state.A) ||
                    state.A.length===0 ||

                    !Array.isArray(state.B) ||
                    state.B.length===0;



                if(
                    vecchioCompleto &&
                    nuovoVuoto
                ){'''
          new_guard='''                const stessoTorneo = vecchio.idTorneo != null && state.idTorneo != null && String(vecchio.idTorneo) === String(state.idTorneo);

                let vecchioCompleto =

                    Array.isArray(vecchio.A) &&
                    vecchio.A.length>0 &&

                    Array.isArray(vecchio.B) &&
                    vecchio.B.length>0;



                let nuovoVuoto =

                    !Array.isArray(state.A) ||
                    state.A.length===0 ||

                    !Array.isArray(state.B) ||
                    state.B.length===0;



                if(
                    stessoTorneo &&
                    vecchioCompleto &&
                    nuovoVuoto
                ){'''
          if old_guard not in text: raise SystemExit('Protezione updateAndSync non trovata: stop sicuro')
          text=text.replace(old_guard,new_guard,1)

          init_marker='''        let salvato =
            idTorneo
                ? null
                : localStorage.getItem(
                    "torneoState"
                );'''
          init_replacement='''        let salvato =
            idTorneo
                ? null
                : localStorage.getItem(
                    "torneoState"
                );

        if(salvato){
            try{
                const locale=JSON.parse(salvato);
                if(locale && state.idTorneo != null && locale.idTorneo != null && String(locale.idTorneo)!==String(state.idTorneo)){
                    salvato=null;
                    localStorage.removeItem("torneoState");
                    localStorage.removeItem("savedTeams");
                }
            }catch(e){
                salvato=null;
                localStorage.removeItem("torneoState");
            }
        }'''
          if init_marker in text: text=text.replace(init_marker,init_replacement,1)

          p.write_text(text,encoding='utf-8')
          print('DEFINITIVE FIXES APPLIED')

      - name: Remove obsolete repair workflows
        shell: bash
        run: |
          for f in \
            .github/workflows/apply-tabellone-fix.yml \
            .github/workflows/bove-repair.yml \
            .github/workflows/final-bove-repair.yml \
            .github/workflows/fix-empty-structure.yml \
            .github/workflows/fix-pair-names.yml \
            .github/workflows/layout-fix.yml \
            .github/workflows/one-time-admin-fix.yml \
            .github/workflows/one-time-bove-repair.yml \
            .github/workflows/one-time-ko-flow-fix.yml \
            .github/workflows/one-time-ko-winner-fix.yml \
            .github/workflows/one-time-pair-name-fix.yml \
            .github/workflows/one-time-save-reset.yml \
            .github/workflows/one-time-save-reset-push.yml \
            .github/workflows/repair-on-comment.yml \
            .github/workflows/repair-on-pr.yml \
            .github/workflows/repair-classification.yml \
            .github/workflows/restore-renderclass.yml \
            .github/workflows/definitive-bove-fix.yml \
            .github/workflows/definitive-bove-fix2.yml; do
              [ -f "$f" ] && rm -f "$f" || true
          done

      - name: Validate JavaScript
        shell: python
        run: |
          import re, subprocess, tempfile
          from pathlib import Path
          html=Path('Bove.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          for i,src in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'bove_{i}.js'
              f.write_text(src,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'Sintassi JS non valida nello script {i}')
          print('SINTASSI JS OK')

      - name: Commit repaired Bove and workflow cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html .github/workflows
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Definitive tournament display and state fixes'
            git push
          else
            echo 'Nessuna modifica da committare'
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
