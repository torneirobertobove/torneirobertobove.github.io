name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final empty-tournament rendering patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- BOVE EMPTY TOURNAMENT PATCH -->'

          if marker not in text:
              patch = r'''<!-- BOVE EMPTY TOURNAMENT PATCH -->
<script>
(function(){
    function activeGroups(){
        const n=Math.max(1,Number(state?.rules?.numeroGironi)||2);
        return ["A","B","C","D","E","F","G"].slice(0,n);
    }

    const originalRenderTables=window.renderTables;
    window.renderTables=function(){
        if(typeof originalRenderTables==="function"){
            try{ originalRenderTables(); }catch(e){ console.error("renderTables originale:",e); }
        }

        const groups=activeGroups();
        groups.forEach(tag=>{
            const card=document.getElementById("card"+tag);
            const rows=document.getElementById(tag+"rows");
            if(card) card.style.display="block";
            if(!rows) return;

            if(rows.querySelectorAll("tr").length===0){
                const emptyMatches=[
                    ["", ""],["", ""],["", ""],
                    ["", ""],["", ""],["", ""]
                ];
                rows.innerHTML=emptyMatches.map((m,i)=>`
<tr>
<td><input value="" style="width:45px" onchange="updateCamp('${tag}',${i},this.value)"></td>
<td><input value="" placeholder="--:--" onchange="updateTime('${tag}',${i},this.value)"></td>
<td class="match-cell"><div class="team-line"></div><div class="vs-line"><b>VS</b></div><div class="team-line"></div></td>
<td class="db-cell"><input value="" oninput="updateRes('${tag}',${i},0,this.value)"><input value="" oninput="updateRes('${tag}',${i},1,this.value)"></td>
</tr>`).join("");
            }
        });
    };

    const originalRenderClass=window.renderClass;
    window.renderClass=function(){
        if(typeof originalRenderClass==="function"){
            try{ originalRenderClass(); }catch(e){ console.error("renderClass originale:",e); }
        }

        const per=Math.max(1,Number(state?.rules?.squadrePerGirone)||4);
        activeGroups().forEach(tag=>{
            const box=document.getElementById(tag+"class");
            const card=document.getElementById("card"+tag);
            if(card) card.style.display="block";
            if(!box) return;
            if(box.querySelectorAll("tr").length===0){
                box.innerHTML=Array.from({length:per},()=>`
<tr><td></td><td></td><td>0</td><td>0</td><td>0</td><td>0</td></tr>`).join("");
            }
        });
    };

    window.renderKO=function(){
        ensureRules();
        const q=document.getElementById("Q");
        const s=document.getElementById("S");
        const f=document.getElementById("finaleBox") || document.getElementById("F");
        if(!q||!s||!f) return;

        const qt=q.closest("table"),st=s.closest("table"),ft=f.closest("table");
        q.innerHTML="";s.innerHTML="";f.innerHTML="";
        document.querySelectorAll(".winner-box.top-win").forEach(e=>e.remove());

        if(!Array.isArray(state.qRes)) state.qRes=Array(4).fill("-");
        while(state.qRes.length<4) state.qRes.push("-");
        state.qRes=state.qRes.slice(0,4);
        if(!Array.isArray(state.sTopRes)) state.sTopRes=Array(2).fill("-");
        while(state.sTopRes.length<2) state.sTopRes.push("-");
        state.sTopRes=state.sTopRes.slice(0,2);
        if(typeof state.fTopRes!=="string" || !state.fTopRes.trim()) state.fTopRes="-";

        const expected=Math.max(0,Number(state.rules.numeroQualificateFinali)||((Number(state.rules.numeroGironi)||0)*(Number(state.rules.qualificatePerGirone)||0)));
        let qualificati=[];
        try{
            const r=getFinalQualified();
            if(Array.isArray(r)) qualificati=r;
        }catch(e){ console.error("getFinalQualified:",e); }

        const slot=Array.from({length:expected},(_,i)=>qualificati[i]||"");
        const usaQuarti=state.rules.usaQuarti===true && expected>=8;
        const usaSemifinali=state.rules.usaSemifinali===true;
        const usaFinale=state.rules.usaFinale===true;
        let semifinali=[];

        if(usaQuarti){
            const quarti=[
                [slot[0]||"",slot[7]||""],
                [slot[3]||"",slot[4]||""],
                [slot[1]||"",slot[6]||""],
                [slot[2]||"",slot[5]||""]
            ];
            quarti.forEach((m,i)=>{
                q.innerHTML+=creaMatchKO(m,"q",i,state.qRes[i]);
            });
            if(qt) qt.style.display="table";
            const winners=quarti.map((m,i)=>getWinner(m,state.qRes[i])).filter(Boolean);
            semifinali=winners.length===4
                ? [[winners[0],winners[1]],[winners[2],winners[3]]]
                : [["",""] ,["",""]];
        }else if(expected>=4){
            semifinali=[[slot[0]||"",slot[3]||""],[slot[2]||"",slot[1]||""]];
            if(qt) qt.style.display="none";
        }else if(expected>=2){
            semifinali=[[slot[0]||"",slot[1]||""]];
            if(qt) qt.style.display="none";
        }else{
            if(qt) qt.style.display="none";
        }

        let finalisti=[];
        if(usaSemifinali){
            if(expected>=4 && semifinali.length<2) semifinali.push(["",""]);
            semifinali.slice(0,2).forEach((m,i)=>{
                s.innerHTML+=creaMatchKO(m,"s",i,state.sTopRes[i]);
                const w=getWinner(m,state.sTopRes[i]);
                if(w) finalisti.push(w);
            });
            if(st) st.style.display="table";
        }else if(expected>=2){
            finalisti=[slot[0]||"",slot[1]||""];
            if(st) st.style.display="none";
        }else{
            if(st) st.style.display="none";
        }

        state.finalTop=[finalisti[0]||"",finalisti[1]||""];

        if(usaFinale){
            f.innerHTML=creaMatchKO(state.finalTop,"f",0,state.fTopRes);
            if(ft) ft.style.display="table";
            const campione=getWinner(state.finalTop,state.fTopRes);
            state.campioneTop=campione||null;
            if(campione&&ft){
                ft.insertAdjacentHTML("afterend",`<div class="winner-box top-win">🏆 CAMPIONE TORNEO:<br>${campione}</div>`);
            }
        }else{
            if(ft) ft.style.display="none";
            state.campioneTop=null;
        }

        console.log("=== STRUTTURA TORNEO VUOTO ===",{
            gironi:activeGroups(),
            attesi:expected,
            qualificati:qualificati.length,
            usaQuarti,
            usaSemifinali,
            usaFinale,
            righeQ:q.querySelectorAll("tr").length,
            righeS:s.querySelectorAll("tr").length,
            righeF:f.querySelectorAll("tr").length
        });
    };
})();
</script>
'''
              text=text.replace('</body>',patch+'\n</body>',1)
              p.write_text(text,encoding='utf-8')
              print('Empty tournament patch injected')
          else:
              print('Empty tournament patch already present')

      - name: Validate JavaScript
        shell: python
        run: |
          import re, subprocess, tempfile
          from pathlib import Path
          html=Path('Bove.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          for i,src in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'bove_{i}.js'
              f.write_text(src,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'Sintassi JS non valida nello script {i}')
          print('SINTASSI JS OK')

      - name: Commit repaired Bove
        shell: bash
        run: |
          if git diff --quiet -- Bove.html; then
            echo 'Bove gia aggiornato'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git commit -m 'Fix empty tournament visual structure'
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
