name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Bove empty tournament structure
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')

          render_class = r'''function renderClass(){
    ensureRules();
    const gironi=["A","B","C","D","E","F","G"];
    const perGirone=Math.max(1,Number(state.rules.squadrePerGirone)||4);
    const qualificate=Math.max(0,Number(state.rules.qualificatePerGirone)||0);
    function soloCognomi(v){
        if(v===null||v===undefined)return "";
        if(typeof v==="object"){
            if(v.cognome!==undefined&&v.cognome!==null&&String(v.cognome).trim())return String(v.cognome).trim();
            const a=soloCognomi(v.giocatore1||v.g1||v.player1||null),b=soloCognomi(v.giocatore2||v.g2||v.player2||null);
            return a&&b?a+"/"+b:a||b||"";
        }
        const t=String(v).replace(/\t/g," ").replace(/\s+/g," ").trim();
        if(!t)return "";
        return t.split("/").map(x=>{const p=x.trim().split(/\s+/).filter(Boolean);return p.length?p[p.length-1]:"";}).filter(Boolean).join("/");
    }
    gironi.forEach(tag=>{
        const tbody=document.getElementById(tag+"class"),card=document.getElementById("card"+tag);
        if(!tbody)return;
        const idx=gironi.indexOf(tag);
        if(idx>=Number(state.rules.numeroGironi||0)){tbody.innerHTML="";if(card)card.style.display="none";state["rank"+tag]=[];return;}
        if(card)card.style.display="block";
        tbody.innerHTML="";
        const squadre=Array.isArray(state[tag])?state[tag]:[];
        const risultati=Array.isArray(state[tag+"res"])?state[tag+"res"]:[];
        let classifica=[];
        if(squadre.length){try{classifica=calc(squadre,risultati);}catch(e){console.error(e);}}
        if(!Array.isArray(classifica))classifica=[];
        state["rank"+tag]=classifica;
        for(let i=0;i<perGirone;i++){
            const x=classifica[i]||{n:"",pt:0,gf:0,gs:0,df:0};
            const tr=document.createElement("tr");
            const cells=[document.createElement("td"),document.createElement("td"),document.createElement("td"),document.createElement("td"),document.createElement("td"),document.createElement("td")];
            cells[0].textContent=soloCognomi(x.n||"");
            cells[1].textContent=x.n?(i<qualificate?"▲":"▼"):"";
            cells[1].style.textAlign="center";
            cells[2].textContent=String(Number(x.pt)||0);
            cells[3].textContent=String(Number(x.gf)||0);
            cells[4].textContent=String(Number(x.gs)||0);
            cells[5].textContent=String(Number(x.df)||0);
            cells.forEach(c=>tr.appendChild(c));
            tbody.appendChild(tr);
        }
    });
}
'''

          text,n=re.subn(r'function renderClass\(\)\s*\{.*?\n\}\s*\n\s*function render\(\)',render_class+'\nfunction render()',text,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderClass non trovato')

          old='''        let squadre =\n            state[tag];\n\n\n        if(\n            !Array.isArray(squadre) ||\n            squadre.length<2\n        ){\n\n            continue;\n\n        }\n\n\n        let partite=[];'''
          new='''        let squadre=Array.isArray(state[tag])?state[tag]:[];\n        const strutturaVuota=squadre.length<2;\n        const numeroPostiGirone=Math.max(2,Number(state.rules.squadrePerGirone)||4);\n        let partite=[];'''
          if old not in text: raise SystemExit('renderTables squadre non trovato')
          text=text.replace(old,new,1)

          old='''        /*\n            USA LE PARTITE GIÀ PRESENTI (ma controllando che non siano troncate a 12)\n        */\n\n        if(\n            state.partiteGironi &&\n            Array.isArray(\n                state.partiteGironi[tag]\n            ) &&\n            state.partiteGironi[tag].length>0 &&\n            state.partiteGironi[tag].length >= (squadre.length * (squadre.length - 1) / (state.rules.garaAndataRitorno ? 1 : 2)) // Forza ricalcolo se le vecchie partite erano parziali\n        ){\n\n            partite =\n                state.partiteGironi[tag];\n\n        }\n\n\n\n        /*\n            SE NON ESISTONO O ERANO TRONCATE,\n            CREA IL ROUND ROBIN COMPLETO SULLE 8 SQUADRE\n        */\n\n        else{\n\n            let rounds =\n                generaRoundRobin(\n                    squadre.length\n                );'''
          new='''        if(strutturaVuota){\n            let rounds=generaRoundRobin(numeroPostiGirone);\n            rounds.forEach(round=>round.forEach(match=>partite.push({casa:match[0],ospite:match[1]})));\n        }\n        else if(state.partiteGironi&&Array.isArray(state.partiteGironi[tag])&&state.partiteGironi[tag].length>0&&state.partiteGironi[tag].length>=(squadre.length*(squadre.length-1)/(state.rules.garaAndataRitorno?1:2))){\n            partite=state.partiteGironi[tag];\n        }\n        else{\n            let rounds=generaRoundRobin(squadre.length);'''
          if old not in text: raise SystemExit('renderTables calendario non trovato')
          text=text.replace(old,new,1)

          old='''        if(card){\n\n            card.style.display =\n\n                (\n                    Array.isArray(\n                        state[tag]\n                    )\n                    &&\n                    state[tag].length>0\n                )\n\n                ?\n\n                "block"\n\n                :\n\n                "none";\n\n        }'''
          new='''        if(card){\n            card.style.display=lettereGironi.indexOf(tag)<numeroGironi?"block":"none";\n        }'''
          if old not in text: raise SystemExit('visibilita card non trovata')
          text=text.replace(old,new,1)

          render_ko=r'''function renderKO(){
    ensureRules();
    const q=document.getElementById("Q"),s=document.getElementById("S"),f=document.getElementById("finaleBox");
    if(!q||!s||!f)return;
    const qt=q.closest("table"),st=s.closest("table"),ft=f.closest("table");
    q.innerHTML="";s.innerHTML="";f.innerHTML="";
    document.querySelectorAll(".winner-box.top-win").forEach(e=>e.remove());
    if(!Array.isArray(state.qRes))state.qRes=Array(4).fill("-");while(state.qRes.length<4)state.qRes.push("-");state.qRes=state.qRes.slice(0,4);
    if(!Array.isArray(state.sTopRes))state.sTopRes=Array(2).fill("-");while(state.sTopRes.length<2)state.sTopRes.push("-");state.sTopRes=state.sTopRes.slice(0,2);
    if(!Array.isArray(state.qCamp))state.qCamp=[];if(!Array.isArray(state.qTime))state.qTime=[];if(!Array.isArray(state.sCamp))state.sCamp=[];if(!Array.isArray(state.sTime))state.sTime=[];if(!Array.isArray(state.fCamp))state.fCamp=[];if(!Array.isArray(state.fTime))state.fTime=[];if(typeof state.fTopRes!=="string"||!state.fTopRes.trim())state.fTopRes="-";
    function row(m,g,i,r){const a=m[0]?String(m[0]):"",b=m[1]?String(m[1]):"",ck=g==="q"?"qCamp":g==="s"?"sCamp":"fCamp",tk=g==="q"?"qTime":g==="s"?"sTime":"fTime",c=Array.isArray(state[ck])?(state[ck][i]??""):"",t=Array.isArray(state[tk])?(state[tk][i]??""):"",v=r&&r!=="-"?String(r):"";return `<tr><td><input value="${c}" style="width:45px" onchange="updateCamp('${g.toUpperCase()}',${i},this.value)"></td><td><input type="time" value="${t}" onchange="updateTime('${g.toUpperCase()}',${i},this.value)"></td><td class="match-cell"><div class="team-line">${a}</div><div class="vs-line"><b>VS</b></div><div class="team-line">${b}</div></td><td class="db-cell"><input value="${v}" placeholder="Ris" oninput="updateKOResult('${g.toUpperCase()}',${i},this.value)"></td></tr>`;}
    const expected=Math.max(0,Number(state.rules.numeroQualificateFinali)||((Number(state.rules.numeroGironi)||0)*(Number(state.rules.qualificatePerGirone)||0)));let ql=[];try{const x=getFinalQualified();if(Array.isArray(x))ql=x;}catch(e){console.error(e);}const slots=Array.from({length:expected},(_,i)=>ql[i]||"");const uq=state.rules.usaQuarti===true&&expected>=8,us=state.rules.usaSemifinali===true,uf=state.rules.usaFinale===true;let sem=[];
    if(uq){const m=[[slots[0]||"",slots[7]||""],[slots[3]||"",slots[4]||""],[slots[1]||"",slots[6]||""],[slots[2]||"",slots[5]||""]];m.forEach((x,i)=>q.innerHTML+=row(x,"q",i,state.qRes[i]));qt.style.display="table";sem=[[getWinner(m[0],state.qRes[0])||"",getWinner(m[1],state.qRes[1])||""],[getWinner(m[2],state.qRes[2])||"",getWinner(m[3],state.qRes[3])||""]];}
    else if(expected>=4){sem=[[slots[0]||"",slots[3]||""],[slots[2]||"",slots[1]||""]];}
    else if(expected>=2){sem=[[slots[0]||"",slots[1]||""]];}
    let fin=[];if(us){if(sem.length<2&&expected>=4)sem.push(["",""]);sem.slice(0,2).forEach((m,i)=>{s.innerHTML+=row(m,"s",i,state.sTopRes[i]);const w=getWinner(m,state.sTopRes[i]);if(w)fin.push(w);});st.style.display="table";}else if(expected>=2){fin=[slots[0]||"",slots[1]||""];}
    state.finalTop=[fin[0]||"",fin[1]||""];if(uf){f.innerHTML=row(state.finalTop,"f",0,state.fTopRes);ft.style.display="table";const c=getWinner(state.finalTop,state.fTopRes);state.campioneTop=c||null;if(c)ft.insertAdjacentHTML("afterend",`<div class="winner-box top-win">🏆 CAMPIONE TORNEO:<br>${c}</div>`);}else{ft.style.display="none";state.campioneTop=null;}
    console.log("=== STRUTTURA KO ===",{attesi:expected,qualificati:ql.length,quarti:uq,semifinali:us,finale:uf,righeQ:q.querySelectorAll("tr").length,righeS:s.querySelectorAll("tr").length,righeF:f.querySelectorAll("tr").length});
}
'''
          text,n=re.subn(r'function renderKO\(\)\s*\{.*?\n\}\s*\n\s*function updateKOResult\(',render_ko+'\nfunction updateKOResult(',text,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderKO non trovato')

          p.write_text(text,encoding='utf-8')
          print('Bove repair applied in Pages workspace')

      - name: Validate JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess,tempfile
          html=Path('Bove.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          for i,s in enumerate(scripts,1):
            f=Path(tempfile.gettempdir())/f'bove_{i}.js';f.write_text(s,encoding='utf-8')
            r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
            if r.returncode:
              print(r.stderr);raise SystemExit(f'Sintassi non valida script {i}')
          print('SINTASSI OK')

      - name: Commit repaired Bove
        shell: bash
        run: |
          if git diff --quiet -- Bove.html; then
            echo 'Bove gia corretto'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git commit -m 'Fix empty tournament groups and knockout skeleton'
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
