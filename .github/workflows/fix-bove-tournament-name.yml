# One-time repair workflow for the Bove tournament name.
name: Fix Bove tournament name sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Bove name rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="bove-tournament-name-sync">'
          if marker in s:
              print('Patch already present')
              raise SystemExit(0)
          patch = r'''<script id="bove-tournament-name-sync">
(function(){
  function syncTournamentName(){
    try{
      if(typeof state === 'undefined' || !state) return false;
      const nome = String(state.nomeTorneo || '').trim();
      if(!nome) return false;
      const titolo = document.getElementById('titoloTorneo');
      if(titolo) titolo.textContent = '🏆 ' + nome;
      const input = document.getElementById('nomeTorneoInput');
      if(input && input.value !== nome) input.value = nome;
      return true;
    }catch(e){
      console.warn('Sincronizzazione nome torneo Bove:', e);
      return false;
    }
  }
  function start(){
    let tentativi = 0;
    syncTournamentName();
    const timer = setInterval(function(){
      tentativi++;
      if(syncTournamentName() || tentativi >= 50) clearInterval(timer);
    }, 100);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
'''
          s = s.replace('</body>', patch + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da committare'
          else
            git commit -m 'Fix Bove tournament name sync'
            git push
          fi
