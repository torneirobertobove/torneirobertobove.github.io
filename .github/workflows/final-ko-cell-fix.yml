name: Final KO cell alignment repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-ko-cell-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix KO table cell display
        shell: python
        run: |
          from pathlib import Path
          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')
          old = '.db-cell{display:flex; gap:2px;}'
          new = '.db-cell{display:table-cell; vertical-align:middle; text-align:center; white-space:nowrap;}'
          if old in s:
              s = s.replace(old, new, 1)
          elif '.db-cell{display:table-cell;' not in s:
              raise SystemExit('Expected .db-cell CSS not found; Bove.html left unchanged')
          marker = '/* ========================================================\n   FIX ALLINEAMENTO TABELLE FASE FINALE KO\n   ======================================================== */'
          extra = '''\n\n/* Final KO cell geometry */\ntable:has(> tbody#Q) td.db-cell,\ntable:has(> tbody#S) td.db-cell,\ntable:has(> tbody#finaleBox) td.db-cell{\n    width:75px !important;\n    min-width:75px !important;\n    max-width:75px !important;\n    display:table-cell !important;\n    vertical-align:middle !important;\n    text-align:center !important;\n}\n\ntable:has(> tbody#Q) td.db-cell input,\ntable:has(> tbody#S) td.db-cell input,\ntable:has(> tbody#finaleBox) td.db-cell input{\n    width:35px !important;\n    max-width:35px !important;\n    margin:0 auto !important;\n    box-sizing:border-box !important;\n}\n'''
          if extra.strip() not in s:
              pos = s.find(marker)
              if pos == -1:
                  raise SystemExit('KO alignment marker not found; Bove.html left unchanged')
              end = pos + len(marker)
              s = s[:end] + extra + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Validate HTML scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('Bove.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S | re.I)
          Path('/tmp/bove.js').write_text('\n\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/bove.js
      - name: Commit Bove fix and remove workflow
        shell: bash
        run: |
          git config user.name 'Bove Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git rm .github/workflows/final-ko-cell-fix.yml
          git commit -m 'Fix KO result cell alignment'
          git push