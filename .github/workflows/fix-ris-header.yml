name: Fix RIS header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix RIS header only
        shell: python
        run: |
          from pathlib import Path
          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')

          old_header = '''<tr>\n\n                        <th>Campo</th>\n\n                        <th>Ora</th>\n\n                        <th>Match</th>\n\n                        <th>Ris</th>\n\n                    </tr>'''
          new_header = '''<tr>\n\n                        <th>Campo</th>\n\n                        <th colspan="2">Ora</th>\n\n                        <th>Match</th>\n\n                        <th colspan="2">Ris</th>\n\n                    </tr>'''

          if s.count(old_header) != 2:
              raise SystemExit(f'Header atteso 2 volte, trovato {s.count(old_header)}')
          s = s.replace(old_header, new_header)

          old_hide = '''table:has(> tbody#Q) th:nth-child(6), table:has(> tbody#S) th:nth-child(6), table:has(> tbody#finaleBox) th:nth-child(6),\n.koBox table th:nth-child(6), .finalContainer table th:nth-child(6) { width: 0px !important; display: none !important; }'''
          new_hide = '''table:has(> tbody#Q) th:nth-child(6), table:has(> tbody#S) th:nth-child(6), table:has(> tbody#finaleBox) th:nth-child(6),\n.koBox table th:nth-child(6), .finalContainer table th:nth-child(6) { width: 97px !important; display: table-cell !important; }'''

          if s.count(old_hide) != 1:
              raise SystemExit('Regola th:nth-child(6) attesa non trovata una sola volta')
          s = s.replace(old_hide, new_hide)

          old_td_hide = '''table:has(> tbody#Q) td:nth-child(6), table:has(> tbody#S) td:nth-child(6), table:has(> tbody#finaleBox) td:nth-child(6),\n.koBox table td:nth-child(6), .finalContainer table td:nth-child(6) { width: 97px !important; }'''
          # Nessuna modifica necessaria: la cella 6 e' gia' larga 97px e resta visibile.
          if s.count(old_td_hide) != 1:
              raise SystemExit('Regola td:nth-child(6) attesa non trovata')

          p.write_text(s, encoding='utf-8')

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-ris-header.yml .fix-ris-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html .github/workflows/fix-ris-header.yml .fix-ris-trigger
          git diff --cached --quiet && exit 0
          git commit -m 'Fix RIS header alignment'
          git push
