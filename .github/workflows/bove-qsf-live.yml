name: Bove QSF live repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qsf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install verified QSF override
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')
          marker = '/* BOVE QSF LIVE OVERRIDE START */'

          if marker not in text:
              block = r'''<style>
/* BOVE QSF NO SCROLL */
html,body{overflow-x:hidden!important}
.finalContainer,.finalContainer .groups,.finalContainer .card,.finalContainer table{width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box!important;overflow-x:hidden!important}
.finalContainer table{table-layout:fixed!important}
.finalContainer th,.finalContainer td{min-width:0!important;max-width:100%!important;box-sizing:border-box!important}
.finalContainer th:nth-child(1),.finalContainer td:nth-child(1){width:14%!important}
.finalContainer th:nth-child(2),.finalContainer td:nth-child(2){width:16%!important}
.finalContainer th:nth-child(3),.finalContainer td:nth-child(3){width:44%!important}
.finalContainer th:nth-child(4),.finalContainer td:nth-child(4),.finalContainer th:nth-child(5),.finalContainer td:nth-child(5){width:13%!important}
.finalContainer .team-line,.finalContainer .match-cell{white-space:normal!important;overflow-wrap:anywhere!important;overflow:hidden!important;text-overflow:clip!important}
.finalContainer input{width:100%!important;min-width:0!important;max-width:100%!important;box-sizing:border-box!important}
</style>
<script>
/* BOVE QSF LIVE OVERRIDE START */
(function(){
function team(x){if(x==null)return '';if(typeof x==='string')return x;if(Array.isArray(x))return x.map(team).filter(Boolean).join(' / ');if(typeof x==='object'){if(x.giocatore1||x.player1||x.g1||x.giocatore2||x.player2||x.g2){return [team(x.giocatore1||x.player1||x.g1),team(x.giocatore2||x.player2||x.g2)].filter(Boolean).join(' / ')}return ((x.nome||x.name||'')+' '+(x.cognome||x.surname||'')).trim()||(x.squadra||x.n||'')}return String(x)}
function win(m,r){if(!Array.isArray(m)||m.length!==2)return null;var p=String(r||'').trim().split(/[-:\/]/);if(p.length!==2)return null;var a=Number(p[0]),b=Number(p[1]);if(!Number.isFinite(a)||!Number.isFinite(b)||a===b)return null;return a>b?m[0]:m[1]}
function setRes(type,i,a,b){var f=String(type||'').toUpperCase(),r=(String(a??'').trim()===''&&String(b??'').trim()==='')?'-':String(a??'').trim()+'-'+String(b??'').trim();if(f==='Q'){if(!Array.isArray(state.qRes))state.qRes=[];state.qRes[i]=r}else if(f==='S'){if(!Array.isArray(state.sTopRes))state.sTopRes=[];state.sTopRes[i]=r}else if(f==='F')state.fTopRes=r}
window.getFinalPhaseType=function(q){var n=Array.isArray(q)?q.length:0;return n>=8&&state.rules?.usaQuarti===true?'QUARTI':n>=4?'SEMIFINALI':n===2?'FINALE':'NESSUNA'};
window.updateFinalField=function(type,i,field,v){var f=String(type||'').toUpperCase(),k=(f==='Q'?{camp:'qCamp',time:'qTime'}:f==='S'?{camp:'sCamp',time:'sTime'}:{camp:'fCamp',time:'fTime'})[field];if(!k)return;if(!Array.isArray(state[k]))state[k]=[];state[k][i]=String(v||'');if(typeof updateAndSync==='function')updateAndSync()};
window.renderMatchCard=function(t,m,f,i,r){if(!Array.isArray(m)||m.length!==2)return '';var c='',o='';if(f==='Q'){c=state.qCamp?.[i]||'';o=state.qTime?.[i]||''}else if(f==='S'){c=state.sCamp?.[i]||'';o=state.sTime?.[i]||''}else{c=state.fCamp?.[i]||'';o=state.fTime?.[i]||''}var p=String(r||'-').split('-');return '<tr><td><input value="'+String(c).replace(/"/g,'&quot;')+'" onchange="updateFinalField(\''+f+'\','+i+',\'camp\',this.value)"></td><td><input type="time" value="'+String(o).replace(/"/g,'&quot;')+'" onchange="updateFinalField(\''+f+'\','+i+',\'time\',this.value)"></td><td class="match-cell"><div class="team-line">'+team(m[0])+'</div><div class="vs-line"><b>VS</b></div><div class="team-line">'+team(m[1])+'</div></td><td class="db-cell"><input inputmode="numeric" value="'+(p[0]==='-'?'':(p[0]||''))+'" onchange="updateKOResult(\''+f+'\','+i+',this.value,document.getElementById(\''+f+'_2_'+i+'\').value)"></td><td class="db-cell"><input id="'+f+'_2_'+i+'" inputmode="numeric" value="'+(p[1]||'')+'" onchange="updateKOResult(\''+f+'\','+i+',document.getElementById(\''+f+'_1_'+i+'\').value,this.value)"></td></tr>'};
window.updateKOResult=function(type,i,a,b){setRes(type,i,a,b);if(typeof renderKO==='function')renderKO();if(typeof updateAndSync==='function')updateAndSync()};
window.renderKO=function(){
  ensureRules();
  var q=document.getElementById('Q'),s=document.getElementById('S'),f=document.getElementById('finaleBox');if(!q||!s||!f)return;
  [q.closest('table'),s.closest('table'),f.closest('table')].filter(Boolean).forEach(function(t){t.style.display='table';t.style.width='100%';t.style.minWidth='0';t.style.maxWidth='100%';t.style.tableLayout='fixed';t.style.overflow='hidden'});
  document.documentElement.style.overflowX='hidden';document.body.style.overflowX='hidden';
  var qual=Array.isArray(state.finalQualified)?state.finalQualified:(typeof getFinalQualified==='function'?getFinalQualified():[]);var n=qual.length;
  if(!Array.isArray(state.qRes))state.qRes=[];while(state.qRes.length<4)state.qRes.push('-');
  if(!Array.isArray(state.sTopRes))state.sTopRes=[];while(state.sTopRes.length<2)state.sTopRes.push('-');
  if(!Array.isArray(state.qCamp))state.qCamp=[];if(!Array.isArray(state.qTime))state.qTime=[];if(!Array.isArray(state.sCamp))state.sCamp=[];if(!Array.isArray(state.sTime))state.sTime=[];if(!Array.isArray(state.fCamp))state.fCamp=[];if(!Array.isArray(state.fTime))state.fTime=[];if(typeof state.fTopRes!=='string')state.fTopRes='-';
  var qs=[],ss=[],ff=[];
  q.innerHTML='<tr><th colspan="5">⚔️ QUARTI DI FINALE</th></tr>';
  if(n>=8&&state.rules?.usaQuarti===true){qs=[[qual[0],qual[7]],[qual[3],qual[4]],[qual[1],qual[6]],[qual[2],qual[5]]];q.insertAdjacentHTML('beforeend',qs.map(function(m,i){return renderMatchCard('Q',m,'Q',i,state.qRes[i])}).join(''));var w=qs.map(function(m,i){return win(m,state.qRes[i])});ss=[[w[0]||'Vincitore Q1',w[1]||'Vincitore Q2'],[w[2]||'Vincitore Q3',w[3]||'Vincitore Q4']]}else{state.quarti=[];q.insertAdjacentHTML('beforeend','<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:12px">Quarti non attivi: accesso diretto alle semifinali.</td></tr>');if(n>=4)ss=[[qual[0],qual[3]],[qual[1],qual[2]]]}
  state.quarti=qs;state.semifinali=ss;s.innerHTML='<tr><th colspan="5">🥇 SEMIFINALI</th></tr>'+(ss.length?ss.map(function(m,i){return renderMatchCard('S',m,'S',i,state.sTopRes[i])}).join(''):'<tr><td colspan="5">In attesa delle qualificate</td></tr>');
  ff=ss.length===2?[win(ss[0],state.sTopRes[0])||'Vincitore S1',win(ss[1],state.sTopRes[1])||'Vincitore S2']:[];state.finalTop=ff;f.innerHTML='<tr><th colspan="5">🏆 FINALE</th></tr>'+(ff.length?renderMatchCard('F',ff,'F',0,state.fTopRes):'<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:12px">In attesa dei finalisti</td></tr>');var champ=win(ff,state.fTopRes);state.campioneTop=champ||null;console.log('BOVE QSF LIVE',{qualificati:qual,quarti:state.quarti,semifinali:state.semifinali,finalTop:state.finalTop});
};
setTimeout(function(){if(window.renderKO)window.renderKO()},400);
})();
/* BOVE QSF LIVE OVERRIDE END */
</script>
'''
              text = text.replace('</body>', block + '</body>', 1)

          # syntax check all inline scripts
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S|re.I)
          for i, code in enumerate(scripts, 1):
              f = Path(tempfile.gettempdir()) / ('bove_qsf_%d.js' % i)
              f.write_text(code, encoding='utf-8')
              r = subprocess.run(['node','--check',str(f)], capture_output=True, text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit('JS syntax error in inline script %d' % i)

          p.write_text(text, encoding='utf-8')
          print('QSF LIVE OVERRIDE INSTALLED; SYNTAX OK')

      - name: Commit Bove QSF repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git commit -m 'Fix live Quarti Semifinali Finale flow'
          git push
