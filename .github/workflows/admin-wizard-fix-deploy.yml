name: Admin Wizard Fix Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: admin-wizard-fix
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare and validate real admin wizard V24.1
        shell: python
        run: |
          from pathlib import Path
          import re

          js = Path('admin-function-fixes-v1.js')
          s = js.read_text(encoding='utf-8')
          h = Path('admin.html')
          hs = h.read_text(encoding='utf-8')

          if 'ADMIN FLOW FIX V24' not in s:
              raise SystemExit('Expected ADMIN FLOW FIX V24 is missing')
          required = [
              'italiana','gironiFinale','eliminazione','svizzero','americano','mexicano','king','short','manuale',
              'id=\'afNext\'','formulaScelta','formulaConfig',"stato:'bozza'",'pubblicato:false','window.assert'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Admin wizard validation failed: ' + ', '.join(missing))

          hs = re.sub(r'admin-function-fixes-v1\\.js\\?v=[^"\\\']+', 'admin-function-fixes-v1.js?v=24', hs)
          if 'data-admin-favicon' not in hs:
              hs = hs.replace('</head>', '<link rel="icon" data-admin-favicon href="data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text y="52" font-size="52">🏆</text></svg>">\n</head>', 1)
          h.write_text(hs, encoding='utf-8')

      - name: Ensure admin-master.js
        shell: bash
        run: |
          cat > admin-master.js <<'EOF'
          /* Compatibility entry point for the real admin tournament wizard. */
          window.adminMasterLoaded = true;
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
