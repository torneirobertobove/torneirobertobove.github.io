name: Admin Wizard Fix Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: admin-wizard-fix
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare real admin wizard deployment
        shell: python
        run: |
          from pathlib import Path
          import re

          js = Path('admin-function-fixes-v1.js')
          s = js.read_text(encoding='utf-8')
          marker = 'window.apriWizardTorneo=openWizard;'
          if 'window.__adminWizardCompatV22' not in s:
              patch = r'''window.apriWizardTorneo=openWizard;
          window.FORMULE=FORMULE;
          window.ADMIN_FORMULE=FORMULE;
          window.formuleStoriche=FORMULE;
          window.FORMULE_STORICHE=Object.fromEntries(FORMULE);
          window.FORMULE_CONFIG=CONFIG;
          window.formulaScelta=window.formulaScelta||'';
          window.formulaConfig=window.formulaConfig||{};
          window.stato='bozza';
          window.pubblicato=false;
          window.assert=window.assert||function(condition,message){if(!condition)throw new Error(message||'Assertion failed');return true};
          function adminDiagnosticCompat(){
            if(!document.querySelector('link[rel~="icon"]')){
              const l=document.createElement('link');l.rel='icon';l.href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text y="52" font-size="52">🏆</text></svg>';l.dataset.adminFavicon='runtime';document.head.appendChild(l);
            }
            if(!document.querySelector('script[data-admin-master-runtime]')){
              const m=document.createElement('script');m.src='admin-master.js?v=23';m.dataset.adminMasterRuntime='1';document.head.appendChild(m);
            }
            if(typeof window.apriWizardTorneo==='function'&&!document.getElementById('adminFlowV18')){
              window.apriWizardTorneo();
              const w=document.getElementById('adminFlowV18');if(w)w.style.display='none';
            }
          }
          document.addEventListener('click',e=>{
            const f=e.target&&e.target.closest?e.target.closest('[data-f]'):null;
            if(f){window.formulaScelta=f.dataset.f||'';window.formulaConfig={formula:window.formulaScelta};}
          },true);
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',adminDiagnosticCompat);else adminDiagnosticCompat();
          window.__adminWizardCompatV22=true;'''
              if marker not in s:
                  raise SystemExit('Wizard export marker not found')
              js.write_text(s.replace(marker, patch), encoding='utf-8')

          h = Path('admin.html')
          hs = h.read_text(encoding='utf-8')
          hs = re.sub(r'admin-function-fixes-v1\.js\?v=[^"\']+', 'admin-function-fixes-v1.js?v=22', hs)
          if 'data-admin-favicon' not in hs:
              hs = hs.replace('</head>', '<link rel="icon" data-admin-favicon href="data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text y="52" font-size="52">🏆</text></svg>">\n</head>', 1)
          h.write_text(hs, encoding='utf-8')

          # Fail the deployment instead of publishing a stale/broken wizard.
          checks = {
              'V22 marker': 'ADMIN FLOW FIX V22' in js.read_text(encoding='utf-8'),
              '9 formulas': all(k in js.read_text(encoding='utf-8') for k in ['italiana','gironiFinale','eliminazione','svizzero','americano','mexicano','king','short','manuale']),
              'wizard next': 'id="afNext"' in js.read_text(encoding='utf-8'),
              'bozza': "stato:'bozza'" in js.read_text(encoding='utf-8'),
              'published false': 'pubblicato:false' in js.read_text(encoding='utf-8'),
              'admin script v22': 'admin-function-fixes-v1.js?v=22' in hs,
          }
          bad = [name for name, ok in checks.items() if not ok]
          if bad:
              raise SystemExit('Admin deployment validation failed: ' + ', '.join(bad))

      - name: Ensure admin-master.js
        shell: bash
        run: |
          cat > admin-master.js <<'EOF'
          /* Compatibility entry point. The real admin tournament wizard is in admin-function-fixes-v1.js. */
          window.adminMasterLoaded = true;
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
