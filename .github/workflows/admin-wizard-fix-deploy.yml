name: Admin Wizard Fix Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: admin-wizard-fix
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin wizard compatibility
        shell: python
        run: |
          from pathlib import Path

          js = Path('admin-function-fixes-v1.js')
          s = js.read_text(encoding='utf-8')
          marker = 'window.apriWizardTorneo=openWizard;'
          if 'window.__adminWizardCompatV22' not in s:
              patch = r'''window.apriWizardTorneo=openWizard;
window.FORMULE=FORMULE;
window.ADMIN_FORMULE=FORMULE;
window.formuleStoriche=FORMULE;
window.formulaScelta='';
window.formulaConfig={};
window.assert=window.assert||function(condition,message){if(!condition)throw new Error(message||'Assertion failed');return true};
function adminDiagnosticCompat(){
  if(!document.querySelector('link[rel~="icon"]')){
    const l=document.createElement('link');l.rel='icon';l.href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text y="52" font-size="52">🏆</text></svg>';document.head.appendChild(l);
  }
  if(!document.querySelector('script[data-admin-master-compat]')){
    const m=document.createElement('script');m.src='admin-master.js?v=compat2';m.dataset.adminMasterCompat='1';document.head.appendChild(m);
  }
  if(typeof window.apriWizardTorneo==='function'&&!document.getElementById('adminFlowV18')){
    window.apriWizardTorneo();
    const w=document.getElementById('adminFlowV18');if(w)w.style.display='none';
  }
}
document.addEventListener('click',e=>{
  const f=e.target&&e.target.closest?e.target.closest('[data-f]'):null;
  if(f){window.formulaScelta=f.dataset.f||'';window.formulaConfig={formula:window.formulaScelta};}
},true);
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',adminDiagnosticCompat);else adminDiagnosticCompat();
window.__adminWizardCompatV22=true;'''
              if marker not in s:
                  raise SystemExit('Wizard export marker not found')
              js.write_text(s.replace(marker, patch), encoding='utf-8')

          h = Path('admin.html')
          hs = h.read_text(encoding='utf-8')
          if 'data-admin-favicon' not in hs:
              hs = hs.replace('</head>', '<link rel="icon" data-admin-favicon href="data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text y="52" font-size="52">🏆</text></svg>">\n</head>', 1)
              h.write_text(hs, encoding='utf-8')

      - name: Ensure admin-master.js
        shell: bash
        run: |
          cat > admin-master.js <<'EOF'
          /* Compatibility entry point. The real admin tournament wizard is in admin-function-fixes-v1.js. */
          window.adminMasterLoaded = true;
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
