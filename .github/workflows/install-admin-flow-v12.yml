name: Install Admin Flow V12
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install V12 script in admin.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="admin-flow-v12.js?v=12"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('admin.html: </body> not found')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
              print('Admin Flow V12 installed')
          else:
              print('Admin Flow V12 already installed')
      - name: Commit installation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No installation changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'fix: load Admin Flow V12'
          git push
