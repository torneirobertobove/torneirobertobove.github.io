name: One-time Bove syntax repair
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair missing getFinalQualified wrapper
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('Bove.html')
          t=p.read_text(encoding='utf-8')
          if 'function getFinalQualified()' not in t:
              marker='\nensureRules();\n\nconst qualificati = [];'
              if marker not in t:
                  marker='\nensureRules();\n\n\nconst qualificati = [];'
              if marker not in t:
                  raise SystemExit('Blocco qualificati non trovato')
              t=t.replace(marker,'\nfunction getFinalQualified(){\n\n    ensureRules();\n\nconst qualificati = [];',1)
              p.write_text(t,encoding='utf-8')
          else:
              print('getFinalQualified() già presente')
          html=p.read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          for i,s in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'bove_{i}.js'; f.write_text(s,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: raise SystemExit(r.stderr)
          print('SINTASSI OK')
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair getFinalQualified syntax wrapper'
          git push
