name: Fix live admin wizard version

on:
  push:
    paths:
      - '.github/workflows/fix-live-admin-wizard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update admin wizard reference
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          old = 'admin-function-fixes-v1.js?v=19'
          new = 'admin-function-fixes-v1.js?v=21'
          if old not in s:
              raise SystemExit(f'Expected {old} not found in admin.html')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print(f'Updated {old} -> {new}')

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'Bove Admin Fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git rm .github/workflows/fix-live-admin-wizard.yml
          git commit -m 'Load V20 admin tournament wizard'
          git push
