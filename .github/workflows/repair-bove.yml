name: Repair Bove tournament flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'AUTO-REPAIR BOVE') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair tournament loading flow
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          changed = False

          # -----------------------------
          # ADMIN: fix players-count event
          # -----------------------------
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          old = 'onchange="aggiornaGiocatoriAdmin"'
          new = 'onchange="aggiornaGiocatoriAdmin()"'
          if old in s:
              s = s.replace(old, new)
              changed = True
              print('ADMIN: corretto onchange aggiornaGiocatoriAdmin()')
          p.write_text(s, encoding='utf-8')

          # -----------------------------
          # BOVE: approved registrations
          # -----------------------------
          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')

          patterns = [
              ('.eq(\"approvato\", true)', '.or(\"stato.eq.approvato,approvato.eq.true\")'),
              (".eq('approvato', true)", ".or('stato.eq.approvato,approvato.eq.true')"),
          ]
          for old, new in patterns:
              if old in s:
                  s = s.replace(old, new)
                  changed = True
                  print('BOVE: corretto filtro iscritti approvati')

          # Initialize iscritti in state if the state object has no field yet.
          if 'iscritti:[]' not in s and 'iscritti: []' not in s:
              m = re.search(r'(const|let|var)\s+state\s*=\s*\{', s)
              if m:
                  pos = m.end()
                  s = s[:pos] + '\n    iscritti:[],\n' + s[pos:]
                  changed = True
                  print('BOVE: inizializzato state.iscritti')

          # When approved registrations are loaded, expose them as participants.
          marker = 'state.iscritti=\n    Array.isArray(iscritti)\n    ? iscritti\n    : [];'
          if marker in s and 'state.partecipanti=state.iscritti' not in s:
              replacement = marker + '\n\nif(Array.isArray(state.iscritti)){\n\n    state.partecipanti = state.iscritti;\n\n}'
              s = s.replace(marker, replacement, 1)
              changed = True
              print('BOVE: sincronizzati partecipanti con iscritti approvati')

          p.write_text(s, encoding='utf-8')

          if changed:
              print('Modifiche applicate.')
          else:
              print('Nessuna modifica necessaria.')
          PY

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('Bove.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          Path('/tmp/bove-js.js').write_text('\n\n'.join(scripts), encoding='utf-8')
          print(f'Script blocks: {len(scripts)}')
          PY
          node --check /tmp/bove-js.js

      - name: Commit repairs
        run: |
          git config user.name 'Bove Auto Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html admin.html
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da committare.'
          else
            git commit -m 'AUTO-REPAIR BOVE: torneo e iscritti'
            git push
          fi
