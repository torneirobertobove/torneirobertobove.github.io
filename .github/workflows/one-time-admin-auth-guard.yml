name: Deploy admin auth guard
on:
  push:
    paths:
      - 'admin-auth-guard-v1.js'
      - '.github/workflows/one-time-admin-auth-guard.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject guard into admin.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="admin-auth-guard-v1.js?v=1"></script>'
          if tag not in s:
              marker='</head>'
              if marker not in s:
                  raise SystemExit('admin.html: </head> non trovato')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet || git commit -m 'fix: enforce admin role on admin panel'
          git push
