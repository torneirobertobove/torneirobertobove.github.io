name: Fix mobile KO overflow

on:
  push:
    paths:
      - 'Bove.html'
      - '.github/workflows/fix-mobile-ko-overflow.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply mobile KO fit fix
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* MOBILE KO FIT FIX — 2026-08-30 */'

          if marker not in s:
              css = r'''
/* MOBILE KO FIT FIX — 2026-08-30 */
@media (max-width: 599px) {
    html,
    body {
        width: 100% !important;
        max-width: 100% !important;
        overflow-x: hidden !important;
    }

    .ko {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        overflow: visible !important;
    }

    .koBox,
    .finalContainer {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        padding: 8px !important;
        box-sizing: border-box !important;
        overflow: visible !important;
    }

    .koBox table,
    .finalContainer table,
    table:has(> tbody#Q),
    table:has(> tbody#S),
    table:has(> tbody#finaleBox) {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
        table-layout: fixed !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
    }

    .koBox table th,
    .koBox table td,
    .finalContainer table th,
    .finalContainer table td,
    table:has(> tbody#Q) th,
    table:has(> tbody#Q) td,
    table:has(> tbody#S) th,
    table:has(> tbody#S) td,
    table:has(> tbody#finaleBox) th,
    table:has(> tbody#finaleBox) td {
        min-width: 0 !important;
        max-width: none !important;
        box-sizing: border-box !important;
        padding: 6px 2px !important;
        overflow: hidden !important;
    }

    /* 5 colonne: Campo | Ora | Match | Ris 1 | Ris 2 */
    .koBox table th:nth-child(1),
    .koBox table td:nth-child(1),
    .finalContainer table th:nth-child(1),
    .finalContainer table td:nth-child(1),
    table:has(> tbody#Q) th:nth-child(1),
    table:has(> tbody#Q) td:nth-child(1),
    table:has(> tbody#S) th:nth-child(1),
    table:has(> tbody#S) td:nth-child(1),
    table:has(> tbody#finaleBox) th:nth-child(1),
    table:has(> tbody#finaleBox) td:nth-child(1) {
        width: 13% !important;
        min-width: 0 !important;
        max-width: none !important;
    }

    .koBox table th:nth-child(2),
    .koBox table td:nth-child(2),
    .finalContainer table th:nth-child(2),
    .finalContainer table td:nth-child(2),
    table:has(> tbody#Q) th:nth-child(2),
    table:has(> tbody#Q) td:nth-child(2),
    table:has(> tbody#S) th:nth-child(2),
    table:has(> tbody#S) td:nth-child(2),
    table:has(> tbody#finaleBox) th:nth-child(2),
    table:has(> tbody#finaleBox) td:nth-child(2) {
        width: 20% !important;
        min-width: 0 !important;
        max-width: none !important;
        white-space: nowrap !important;
    }

    .koBox table th:nth-child(3),
    .koBox table td:nth-child(3),
    .finalContainer table th:nth-child(3),
    .finalContainer table td:nth-child(3),
    table:has(> tbody#Q) th:nth-child(3),
    table:has(> tbody#Q) td:nth-child(3),
    table:has(> tbody#S) th:nth-child(3),
    table:has(> tbody#S) td:nth-child(3),
    table:has(> tbody#finaleBox) th:nth-child(3),
    table:has(> tbody#finaleBox) td:nth-child(3) {
        width: 40% !important;
        min-width: 0 !important;
        max-width: none !important;
    }

    .koBox table th:nth-child(4),
    .koBox table td:nth-child(4),
    .finalContainer table th:nth-child(4),
    .finalContainer table td:nth-child(4),
    table:has(> tbody#Q) th:nth-child(4),
    table:has(> tbody#Q) td:nth-child(4),
    table:has(> tbody#S) th:nth-child(4),
    table:has(> tbody#S) td:nth-child(4),
    table:has(> tbody#finaleBox) th:nth-child(4),
    table:has(> tbody#finaleBox) td:nth-child(4),
    .koBox table th:nth-child(5),
    .koBox table td:nth-child(5),
    .finalContainer table th:nth-child(5),
    .finalContainer table td:nth-child(5),
    table:has(> tbody#Q) th:nth-child(5),
    table:has(> tbody#Q) td:nth-child(5),
    table:has(> tbody#S) th:nth-child(5),
    table:has(> tbody#S) td:nth-child(5),
    table:has(> tbody#finaleBox) th:nth-child(5),
    table:has(> tbody#finaleBox) td:nth-child(5) {
        width: 13.5% !important;
        min-width: 0 !important;
        max-width: none !important;
    }

    .orario-cell input[type="time"] {
        width: 100% !important;
        max-width: 70px !important;
        min-width: 0 !important;
        height: 28px !important;
        padding: 1px !important;
        box-sizing: border-box !important;
    }

    .campo-cell input,
    .score-cell input {
        width: 100% !important;
        max-width: 42px !important;
        min-width: 0 !important;
        height: 28px !important;
        padding: 1px !important;
        box-sizing: border-box !important;
    }

    .match-cell {
        width: auto !important;
        min-width: 0 !important;
        max-width: none !important;
        padding-left: 3px !important;
        padding-right: 3px !important;
        overflow: hidden !important;
        box-sizing: border-box !important;
    }

    .match-cell .team-line {
        width: 100% !important;
        max-width: 100% !important;
        white-space: normal !important;
        overflow-wrap: anywhere !important;
        word-break: break-word !important;
        line-height: 1.15 !important;
    }

    .match-cell .vs-line {
        margin: 2px 0 !important;
    }
}
'''
              s = s.replace('</style>', css + '\n</style>', 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Mobile KO fit fix already present')

      - name: Commit mobile KO fit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Bove.html change needed"
          else
            git commit -m "Fit KO phases inside smartphone viewport"
            git push
          fi
