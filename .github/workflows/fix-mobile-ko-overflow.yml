name: Fix mobile KO overflow
on:
  push:
    paths:
      - 'Bove.html'
      - '.github/workflows/fix-mobile-ko-overflow.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe archive delete patch and restore workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-random-pairs.js')
          s=p.read_text()
          old="const cloned=modal.querySelector('.clean-archive-body');if(cloned){cloned.querySelectorAll('[data-clean-select]').forEach(b=>{b.onclick=()=>{selectTournament(b.getAttribute('data-clean-select'));closeArchive();};});"
          new="const cloned=modal.querySelector('.clean-archive-body');if(cloned){cloned.querySelectorAll('[data-clean-select]').forEach(b=>{b.onclick=()=>{selectTournament(b.getAttribute('data-clean-select'));closeArchive();};});cloned.querySelectorAll('[data-clean-delete]').forEach(b=>{b.onclick=async e=>{e.preventDefault();e.stopPropagation();const fn=window.eliminaTorneo;if(typeof fn!=='function'){alert('Funzione eliminazione torneo non disponibile.');return;}const ok=await fn(b.getAttribute('data-clean-delete'));if(ok){closeArchive();setTimeout(()=>openArchive(),150);}};});"
          if old not in s: raise SystemExit('archive marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          git checkout HEAD^ -- .github/workflows/fix-mobile-ko-overflow.yml
          rm -f .github/workflows/patch-delete-handler.yml .archive-delete-patch-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-random-pairs.js .github/workflows/fix-mobile-ko-overflow.yml .github/workflows/patch-delete-handler.yml .archive-delete-patch-trigger
          git diff --cached --check
          git commit -m 'Fix archive modal Elimina action'
          git push
