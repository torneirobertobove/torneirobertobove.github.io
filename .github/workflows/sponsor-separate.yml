name: Separate sponsor admin

on:
  push:
    paths:
      - 'SPONSOR_SEPARATE_TRIGGER.txt'

permissions:
  contents: write

jobs:
  separate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Separate sponsor from admin.html
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(r'\n<div id="gestioneSponsorStandalone">.*?\n</div>\n\n<script>', re.S)
          replacement = '''

<div class="card">

<h2>🏆 Gestione Sponsor</h2>

<p>Gestione sponsor separata dal gestionale tornei.</p>

<button type="button" class="btn-green" onclick="window.open('sponsor.html','_blank')">
🏆 APRI GESTIONE SPONSOR
</button>

</div>

<script>'''

          if not pattern.search(s):
              raise SystemExit('Blocco gestione sponsor non trovato in admin.html')

          s = pattern.sub(replacement, s, count=1)
          p.write_text(s, encoding='utf-8')

          print('admin.html aggiornato: gestione sponsor resa autonoma')

      - name: Validate admin.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('admin.html').read_text(encoding='utf-8')
          if 'id="gestioneSponsorStandalone"' in s:
              raise SystemExit('Blocco sponsor interno ancora presente')
          if "sponsor.html" not in s:
              raise SystemExit('Collegamento sponsor.html non presente')
          print('Verifica sponsor OK')
          PY

      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name 'Bove Sponsor Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git rm .github/workflows/sponsor-separate.yml SPONSOR_SEPARATE_TRIGGER.txt
          git commit -m 'Separate sponsor management from admin dashboard'
          git push
