name: Restore Bove classification

on:
  push:
    paths:
      - '.github/workflows/sponsor-separate.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore renderClass only
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')

          if re.search(r'function\s+renderClass\s*\(', s):
              print('renderClass already present: no change')
          else:
              fn = r'''function renderClass(){

    ensureRules();

    [
        "A",
        "B",
        "C",
        "D",
        "E",
        "F",
        "G"
    ].forEach(tag=>{

        if(
            !Array.isArray(state[tag]) ||
            state[tag].length===0
        ){

            state["rank"+tag]=[];
            return;

        }

        let box =
            document.getElementById(
                tag+"class"
            );

        if(!box)
            return;

        let risultati =
            Array.isArray(state[tag+"res"])
            ? state[tag+"res"]
            : [];

        let classifica =
            calc(
                state[tag],
                risultati
            );

        if(!Array.isArray(classifica)){
            classifica=[];
        }

        state["rank"+tag] =
            classifica;

        box.innerHTML =
            classifica.map(x=>`
<tr>
<td>
<span class="${
    x.qual
    ?
    "qual-arrow-up"
    :
    "qual-arrow-down"
}">
${
    x.qual
    ?
    "▲"
    :
    "▼"
}
</span>
${String(x.n || "")}
</td>
<td>${x.pt}</td>
<td>${x.gf}</td>
<td>${x.gs}</td>
<td>${x.df}</td>
</tr>
`).join("");

    });

}
'''

              marker = 'function render(){'
              pos = s.find(marker)
              if pos == -1:
                  raise SystemExit('function render() not found; Bove.html left unchanged')

              s = s[:pos] + fn + '\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
              print('renderClass restored')

      - name: Fix delete action in cloned tournament archive
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin-random-pairs.js')
          s = p.read_text(encoding='utf-8')
          old = "if(cloned){cloned.querySelectorAll('[data-clean-select]').forEach(b=>b.onclick=()=>{selectTournament(b.getAttribute('data-clean-select'));closeArchive();});const cy=cloned.querySelector('#cleanYear')"
          new = "if(cloned){cloned.querySelectorAll('[data-clean-select]').forEach(b=>b.onclick=()=>{selectTournament(b.getAttribute('data-clean-select'));closeArchive();});cloned.querySelectorAll('[data-clean-delete]').forEach(b=>b.onclick=async e=>{e.preventDefault();e.stopPropagation();const fn=window.eliminaTorneo;if(typeof fn!=='function'){alert('Funzione eliminazione torneo non disponibile.');return;}const ok=await fn(b.getAttribute('data-clean-delete'));if(ok){closeArchive();setTimeout(()=>openArchive(),150);}});const cy=cloned.querySelector('#cleanYear')"
          if old not in s:
              raise SystemExit('delete-handler target not found; admin-random-pairs.js left unchanged')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('archive delete handler patched')

      - name: Validate Bove.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('Bove.html').read_text(encoding='utf-8')
          if s.count('function renderClass(') != 1:
              raise SystemExit('renderClass count is not exactly 1')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/bove-js.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          print('renderClass OK; script blocks:', len(scripts))
          PY
          node --check /tmp/bove-js.js

      - name: Commit Bove, archive fix and cleanup
        shell: bash
        run: |
          git config user.name 'Bove Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html admin-random-pairs.js
          git rm .github/workflows/sponsor-separate.yml
          if [ -f .github/workflows/fix-archive-delete.yml ]; then git rm .github/workflows/fix-archive-delete.yml; fi
          if git ls-files --error-unmatch SPONSOR_SEPARATE_TRIGGER.txt >/dev/null 2>&1; then git rm SPONSOR_SEPARATE_TRIGGER.txt; fi
          git diff --cached --quiet || git commit -m 'Fix delete action in archive modal'
          git push
