name: One-time admin logout visibility fix
on:
  push:
    paths:
      - '.github/workflows/one-time-admin-logout-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin logout visibility
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- ADMIN_LOGOUT_VISIBILITY_FIX_V1 -->'
          if marker not in s:
              block = r'''<!-- ADMIN_LOGOUT_VISIBILITY_FIX_V1 -->
              <script>
              (function(){
                function syncLoginBox(){
                  const loginBox=document.getElementById('boxLoginAdmin');
                  const areaAdmin=document.getElementById('areaAdmin');
                  if(!loginBox || !areaAdmin) return;
                  if(areaAdmin.classList.contains('hidden') || areaAdmin.style.display==='none'){
                    loginBox.classList.remove('hidden');
                    loginBox.style.display='flex';
                  }
                }
                document.addEventListener('DOMContentLoaded',syncLoginBox);
                const start=function(){
                  const areaAdmin=document.getElementById('areaAdmin');
                  if(!areaAdmin) return;
                  new MutationObserver(syncLoginBox).observe(areaAdmin,{attributes:true,attributeFilter:['class','style']});
                  syncLoginBox();
                };
                if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
              })();
              </script>
              '''
              s = s.replace('</body>', block + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Logout visibility fix already present')
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git rm .github/workflows/one-time-admin-logout-fix.yml
          git commit -m "fix: restore admin login box after logout"
          git push
