name: Fix Bove syntax

on:
  push:
    paths:
      - '.github/workflows/fix-bove-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicated block
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')

          duplicate = '''\n\n   \n\n    /*\n        ============================\n        RITORNO\n        ============================\n    */\n\n    let modal =\n        document.getElementById(\n            "rulesModal"\n        );\n\n\n    if(modal)\n\n        modal.style.display="none";\n\n}\n'''

          if duplicate not in text:
              raise SystemExit('Duplicated RITORNO block not found; refusing to modify Bove.html')

          text = text.replace(duplicate, '\n', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-bove-syntax.yml

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html .github/workflows/fix-bove-syntax.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove duplicated applyRules closing block"
          git push