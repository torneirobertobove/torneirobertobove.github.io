name: One-time admin logout visibility fix v2
on:
  push:
    paths:
      - '.github/workflows/one-time-admin-logout-fix-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin logout visibility
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- ADMIN_LOGOUT_VISIBILITY_FIX_V1 -->'
          if marker not in s:
              block = r'''\n<!-- ADMIN_LOGOUT_VISIBILITY_FIX_V1 -->\n<script>\n(function(){\n  function syncLoginBox(){\n    const loginBox=document.getElementById('boxLoginAdmin');\n    const areaAdmin=document.getElementById('areaAdmin');\n    if(!loginBox || !areaAdmin) return;\n    if(areaAdmin.classList.contains('hidden') || areaAdmin.style.display==='none'){\n      loginBox.classList.remove('hidden');\n      loginBox.style.display='flex';\n    }\n  }\n  function start(){\n    const areaAdmin=document.getElementById('areaAdmin');\n    if(!areaAdmin) return;\n    new MutationObserver(syncLoginBox).observe(areaAdmin,{attributes:true,attributeFilter:['class','style']});\n    syncLoginBox();\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);\n  else start();\n})();\n</script>\n'''
              s += block
              p.write_text(s, encoding='utf-8')
          else:
              print('Logout visibility fix already present')
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git rm .github/workflows/one-time-admin-logout-fix-v2.yml
          git commit -m "fix: restore admin login box after logout"
          git push
# trigger
