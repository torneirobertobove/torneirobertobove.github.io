name: Clean Admin Desktop Override

on:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - '.github/workflows/apply-admin-desktop-layout.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[admin-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove obsolete desktop override
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Remove the obsolete ADMIN_DESKTOP_APPROVED_V2 script block,
          # including the literal escaped newlines that were accidentally stored.
          pattern = r'(?:\\n)?<!-- ADMIN_DESKTOP_APPROVED_V2 -->(?:\\n)?<script>.*?</script>(?:\\n)?'
          s = re.sub(pattern, '', s, count=1, flags=re.S)

          # Remove the duplicate admin-desktop stylesheet include.
          link = '<link rel="stylesheet" href="admin-desktop.css?v=4">'
          first = s.find(link)
          if first >= 0:
              second = s.find(link, first + len(link))
              if second >= 0:
                  s = s[:second] + s[second + len(link):]

          # Clean accidental literal \n sequences left by the old injector.
          s = s.replace('\\n<!-- ADMIN_DESKTOP_APPROVED_V2 -->\\n', '')

          if s != original:
              p.write_text(s, encoding='utf-8')
              print('admin.html cleaned')
          else:
              print('admin.html already clean')
      - name: Verify obsolete override is gone
        shell: python
        run: |
          from pathlib import Path
          s = Path('admin.html').read_text(encoding='utf-8')
          assert 'ADMIN_DESKTOP_APPROVED_V2' not in s
          assert s.count('<link rel="stylesheet" href="admin-desktop.css?v=4">') <= 1
          assert '\\n<!--' not in s
          print('admin.html verification passed')
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove obsolete admin desktop override [admin-cleanup]'
          git push
