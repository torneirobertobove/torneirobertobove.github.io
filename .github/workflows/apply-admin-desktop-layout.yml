name: Apply Admin Desktop Layout

on:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - '.github/workflows/apply-admin-desktop-layout.yml'

permissions:
  contents: write

jobs:
  apply-layout:
    if: ${{ !contains(github.event.head_commit.message, '[admin-desktop]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply approved desktop shell
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- ADMIN_DESKTOP_APPROVED_V2 -->'
          if marker in s:
              print('Approved V2 already present')
              raise SystemExit(0)
          block=r'''\n<!-- ADMIN_DESKTOP_APPROVED_V2 -->\n<script>\n(function(){\n  let done=false;\n  function apply(){\n    if(done)return;\n    const area=document.getElementById('areaAdmin');\n    if(!area||area.classList.contains('hidden'))return;\n    const children=[...area.children];\n    const title=children.find(e=>e.tagName==='H1');\n    const panels=children.filter(e=>e.tagName==='DETAILS');\n    const manage=document.getElementById('gestioneTorneoAdmin');\n    if(!title||panels.length<4||!manage)return;\n    done=true;\n    const [create,tournaments,news,sponsor]=panels;\n    create.id='adminDesktopCreate';\n    tournaments.id='adminDesktopTournaments';\n    news.id='adminDesktopNews';\n    sponsor.id='adminDesktopSponsor';\n    const st=document.createElement('style');\n    st.id='adminDesktopApprovedStyle';\n    st.textContent=`\n      html,body{margin:0!important;padding:0!important;background:#080d14!important;color:#edf2f7!important;overflow-x:hidden!important}\n      .container{width:100%!important;max-width:none!important;margin:0!important;padding:0!important}\n      .btn-indietro{display:none!important}\n      #areaAdmin{display:grid!important;grid-template-columns:248px minmax(0,1fr)!important;grid-template-rows:72px minmax(0,1fr)!important;min-height:100vh!important;width:100%!important;max-width:none!important;margin:0!important;padding:0!important;background:#080d14!important}\n      #areaAdmin>h1{display:none!important}\n      #adminDesktopSidebar{grid-column:1;grid-row:1/3;background:#0d141d;border-right:1px solid #263442;padding:20px 14px;display:flex;flex-direction:column;gap:6px}\n      #adminDesktopBrand{font-size:17px;font-weight:800;letter-spacing:.7px;padding:2px 9px 18px;border-bottom:1px solid #263442;margin-bottom:10px}\n      #adminDesktopBrand small{display:block;color:#788697;font-size:10px;letter-spacing:1px;margin-top:5px}\n      .adminDesktopNav{width:100%;margin:0!important;padding:12px 13px!important;border:1px solid transparent!important;border-radius:9px!important;background:transparent!important;color:#aeb9c6!important;text-align:left!important;font-weight:700!important;cursor:pointer}\n      .adminDesktopNav:hover,.adminDesktopNav.active{background:#172331!important;border-color:#2d3c4c!important;color:#fff!important}\n      #adminDesktopTop{grid-column:2;grid-row:1;background:#0d141d;border-bottom:1px solid #263442;padding:0 24px;display:flex;align-items:center}\n      #adminDesktopTop strong{font-size:16px}\n      #adminDesktopTop span{display:block;color:#788697;font-size:11px;margin-top:4px}\n      #adminDesktopMain{grid-column:2;grid-row:2;min-width:0;padding:24px;overflow:auto}\n      #adminDesktopMain>details,#adminDesktopMain>#gestioneTorneoAdmin{max-width:1180px;margin:0 auto 16px!important;background:#101923!important;border:1px solid #263442!important;border-radius:12px!important;padding:16px!important;box-shadow:0 10px 30px rgba(0,0,0,.22)!important}\n      #adminDesktopMain summary{color:#fff!important;font-weight:800!important;cursor:pointer!important}\n      #adminDesktopMain input,#adminDesktopMain select,#adminDesktopMain textarea{background:#091019!important;color:#fff!important;border:1px solid #314052!important;border-radius:8px!important}\n      @media(max-width:850px){#areaAdmin{display:block!important;min-height:100vh!important}#adminDesktopSidebar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-right:0;border-bottom:1px solid #263442}#adminDesktopTop{height:68px}#adminDesktopMain{padding:12px}}\n    `;\n    document.head.appendChild(st);\n    const side=document.createElement('aside');side.id='adminDesktopSidebar';side.innerHTML='<div id="adminDesktopBrand">🎾 ADMIN<small>PADEL TOURNAMENT MANAGER</small></div>';\n    const top=document.createElement('header');top.id='adminDesktopTop';top.innerHTML='<div><strong>Dashboard amministrazione</strong><span>Gestione completa dei tornei</span></div>';\n    const main=document.createElement('main');main.id='adminDesktopMain';\n    function add(icon,label,target){const b=document.createElement('button');b.type='button';b.className='adminDesktopNav';b.textContent=icon+' '+label;b.onclick=()=>{document.querySelectorAll('.adminDesktopNav').forEach(x=>x.classList.remove('active'));b.classList.add('active');const el=document.getElementById(target);if(el){if(el.tagName==='DETAILS')el.open=true;el.scrollIntoView({behavior:'smooth',block:'start'})}};side.appendChild(b);return b}\n    const first=add('➕','Nuovo torneo','adminDesktopCreate');add('📋','Tornei creati','adminDesktopTournaments');add('👥','Gestione torneo','gestioneTorneoAdmin');add('📰','News','adminDesktopNews');add('🏆','Sponsor','adminDesktopSponsor');first.classList.add('active');\n    area.innerHTML='';area.append(side,top,main);[create,tournaments,manage,news,sponsor].forEach(x=>main.appendChild(x));\n    console.log('ADMIN DESKTOP APPROVED V2: nuova struttura applicata; JavaScript originale invariato');\n  }\n  const obs=new MutationObserver(apply);obs.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});\n  document.addEventListener('DOMContentLoaded',apply);[200,700,1500,3000].forEach(t=>setTimeout(apply,t));\n})();\n</script>\n'''
          s=s.replace('</body>',block+'\n</body>')
          p.write_text(s,encoding='utf-8')
      - name: Commit desktop shell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply approved admin desktop shell [admin-desktop]'
          git push
