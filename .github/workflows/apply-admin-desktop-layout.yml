name: Clean Admin Desktop Override

on:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - '.github/workflows/apply-admin-desktop-layout.yml'
      - '.github/workflows/final-admin-runtime-fix.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove obsolete desktop override
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          original = s

          pattern = r'(?:\\n)?<!-- ADMIN_DESKTOP_APPROVED_V2 -->(?:\\n)?<script>.*?</script>(?:\\n)?'
          s = re.sub(pattern, '', s, flags=re.S)
          s = s.replace('\\n<!-- ADMIN_DESKTOP_APPROVED_V2 -->\\n', '')

          link = '<link rel="stylesheet" href="admin-desktop.css?v=4">'
          first = s.find(link)
          if first >= 0:
              prefix = s[:first + len(link)]
              suffix = s[first + len(link):].replace(link, '')
              s = prefix + suffix

          if s != original:
              p.write_text(s, encoding='utf-8')
              print('admin.html cleaned')
          else:
              print('admin.html already clean')
      - name: Verify admin.html
        shell: python
        run: |
          from pathlib import Path
          s = Path('admin.html').read_text(encoding='utf-8')
          assert 'ADMIN_DESKTOP_APPROVED_V2' not in s
          assert s.count('<link rel="stylesheet" href="admin-desktop.css?v=4">') == 1
          assert '\\n<!--' not in s
          print('admin.html verification passed')
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove obsolete admin desktop override'
          git push
