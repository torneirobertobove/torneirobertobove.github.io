name: Hide card horizontal scrollbar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-hide-card-scrollbar.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide visible card scrollbar
        shell: python
        run: |
          from pathlib import Path
          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')
          marker = '.card{background:#111827;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:15px;overflow-x:auto;}'
          replacement = '.card{background:#111827;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:15px;overflow-x:auto;scrollbar-width:none;} .card::-webkit-scrollbar{display:none;}'
          if marker not in s:
              raise SystemExit('Expected .card CSS not found; Bove.html left unchanged')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          grep -q 'scrollbar-width:none' Bove.html
          grep -q '.card::-webkit-scrollbar{display:none;}' Bove.html
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name 'Bove Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git rm .github/workflows/one-time-hide-card-scrollbar.yml
          git commit -m 'Hide card horizontal scrollbar'
          git push
