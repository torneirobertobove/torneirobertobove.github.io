name: Restore tournament creation flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-tournament-flow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair real Bove tournament flow
        shell: python
        run: |
          from pathlib import Path
          a = Path('admin-function-fixes-v1.js')
          s = a.read_text(encoding='utf-8')
          old = "window.open('Bove.html?idTorneo='+encodeURIComponent(id)+'&apriRegole=true','_blank');"
          new = "window.open('Bove.html?torneo='+encodeURIComponent(JSON.stringify(t))+'&apriRegole=true','_blank');"
          if old in s:
              s = s.replace(old, new, 1)
          a.write_text(s, encoding='utf-8')
          b = Path('Bove.html')
          s = b.read_text(encoding='utf-8')
          s = s.replace('rulesAdmin.formatoTorneo ||\n                            "gironiFinale"', 'rulesAdmin.formatoTorneo ??\n                            "gironiFinale"', 1)
          s = s.replace('rulesAdmin.tipoTorneo ||\n                            "gironiFinale"', 'rulesAdmin.tipoTorneo ??\n                            "gironiFinale"', 1)
          tag = '<script src="bove-admin-flow-fix.js?v=1"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>', 1)
          b.write_text(s, encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          a=Path('admin-function-fixes-v1.js').read_text(encoding='utf-8')
          b=Path('Bove.html').read_text(encoding='utf-8')
          assert "Bove.html?torneo='+encodeURIComponent(JSON.stringify(t))+'&apriRegole=true" in a
          assert 'rulesAdmin.tipoTorneo ||' not in b
          assert 'rulesAdmin.formatoTorneo ||' not in b
          assert 'bove-admin-flow-fix.js?v=1' in b
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-function-fixes-v1.js Bove.html
          git diff --cached --quiet || git commit -m 'fix: restore real tournament formula flow'
          git push
