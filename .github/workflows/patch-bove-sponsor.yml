name: Patch sponsor globali

on:
  push:
    paths:
      - '.github/workflows/patch-bove-sponsor.yml'
      - 'sponsor-global-fix.js'
      - 'sponsor-public-v2.js'
      - '2Page.html'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inserisci script sponsor globali
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = ['Bove.html', '2Page.html']
          tags = [
              '<script src="tabellone-fix.js?v=sponsor3"></script>',
              '<script src="sponsor-global-fix.js?v=3"></script>',
              '<script src="sponsor-public-v2.js?v=1"></script>'
          ]
          for name in files:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              for tag in tags:
                  if tag not in s:
                      s = s.replace('</body>', '  ' + tag + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit sponsor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html 2Page.html
          git diff --cached --quiet || git commit -m 'Attiva sponsor globali su home e tabellone'
          git push
