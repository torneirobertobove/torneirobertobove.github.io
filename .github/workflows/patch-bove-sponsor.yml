name: Patch sponsor globali

on:
  push:
    paths:
      - '.github/workflows/patch-bove-sponsor.yml'
      - 'sponsor-public-v2.js'
      - '2Page.html'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installa il gestore sponsor senza modificare le funzioni del tabellone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch_page(filename):
              p=Path(filename)
              s=p.read_text(encoding='utf-8')

              # Rimuove eventuali vecchi script sponsor/fix dal markup della pagina.
              s=re.sub(r'\s*<script[^>]+(?:tabellone-fix\.js|sponsor-global-fix\.js|sponsor-public-v2\.js)[^>]*></script>', '', s, flags=re.I)

              # Espone il SOLO client Supabase già creato dalla pagina.
              # Non modifica alcuna funzione del torneo.
              s=s.replace('const sb = supabase.createClient(', 'const sb = window.sb = supabase.createClient(', 1)
              s=s.replace('const sb=supabase.createClient(', 'const sb=window.sb=supabase.createClient(', 1)

              # Carica esclusivamente il gestore sponsor pubblico.
              s=s.replace('</body>', '  <script src="sponsor-public-v2.js?v=6"></script>\n</body>', 1)
              p.write_text(s,encoding='utf-8')

          patch_page('Bove.html')
          patch_page('2Page.html')
          PY

      - name: Commit sponsor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html 2Page.html
          git diff --cached --quiet || git commit -m 'Mostra sponsor globali senza toccare il tabellone'
          git push
