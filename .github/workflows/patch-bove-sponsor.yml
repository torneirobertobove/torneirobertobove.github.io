name: Patch sponsor globali

on:
  push:
    paths:
      - '.github/workflows/patch-bove-sponsor.yml'
      - 'sponsor-global-fix.js'
      - 'sponsor-public-v2.js'
      - '2Page.html'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installa gli script sponsor senza duplicati
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 2Page deve avere SOLO lo script pubblico sponsor.
          p=Path('2Page.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<script[^>]+(?:tabellone-fix\.js|sponsor-global-fix\.js|sponsor-public-v2\.js)[^>]*></script>', '', s, flags=re.I)
          s=s.replace('</body>', '  <script src="sponsor-public-v2.js?v=3"></script>\n</body>')
          p.write_text(s,encoding='utf-8')

          # Bove: conserva il tabellone e aggiunge i due gestori sponsor.
          p=Path('Bove.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<script[^>]+(?:tabellone-fix\.js|sponsor-global-fix\.js|sponsor-public-v2\.js)[^>]*></script>', '', s, flags=re.I)
          tags='  <script src="tabellone-fix.js?v=sponsor5"></script>\n  <script src="sponsor-global-fix.js?v=5"></script>\n  <script src="sponsor-public-v2.js?v=3"></script>\n'
          s=s.replace('</body>', tags+'</body>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit sponsor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html 2Page.html
          git diff --cached --quiet || git commit -m 'Corregge caricamento sponsor e carosello'
          git push
