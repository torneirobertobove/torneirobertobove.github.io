name: One-time Bove formula fix

on:
  push:
    paths:
      - automation/formula-fix.trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch formula flow
        shell: python
        run: |
          from pathlib import Path

          p = Path('admin-functions.js')
          s = p.read_text(encoding='utf-8')

          old = '''  const descrizione=document.getElementById("adminDescrizione")?.value.trim()||"";\n  const tempId="temp_"+Date.now();\n  const torneoTemp={id:tempId,nome,data,posti,descrizione,formula:"gironiFinale",stato:"bozza",iscritti:[],coppie:[],partecipanti:[],configurazione:{rules:{numeroSquadre:posti,numeroGironi:Math.ceil(posti/4),squadrePerGirone:4}}};'''
          new = '''  const descrizione=document.getElementById("adminDescrizione")?.value.trim()||"";\n  const formula=document.getElementById("adminFormulaTorneo")?.value||"italiana";\n  const tempId="temp_"+Date.now();\n  const torneoTemp={id:tempId,nome,data,posti,descrizione,formula,stato:"bozza",iscritti:[],coppie:[],partecipanti:[],configurazione:{rules:{numeroSquadre:posti,numeroGironi:Math.ceil(posti/4),squadrePerGirone:4,tipoTorneo:formula,formatoTorneo:formula,formulaGironi:"tuttiControTutti",formulaFinale:"eliminazioneDiretta",qualificatePerGirone:2,numeroQualificateFinali:Math.max(2,Math.ceil(posti/4)*2),usaQuarti:true,usaSemifinali:true,usaFinale:true}}};'''
          if old not in s:
              raise SystemExit('apriRegoleNuovoTorneo pattern not found')
          s = s.replace(old, new, 1)

          old = '''  const descrizione=document.getElementById("adminDescrizione")?.value.trim()||"";\n  const nuovoId=Date.now();\n  const numeroGironi=Math.ceil(posti/4);\n  const nuovoTorneo={id:nuovoId,nome,data,posti,descrizione,formula:"gironiFinale",stato:"bozza",iscritti:[],coppie:[],partecipanti:[],configurazione:{coppie:[],partecipanti:[],rules:{locked:false,tipoTorneo:"gironiFinale",formatoTorneo:"gironiFinale",numeroSquadre:posti,numeroGironi,squadrePerGirone:4,formulaGironi:"italiana",formulaFinale:"eliminazione_diretta",w:3,d:1,l:0,qualificatePerGirone:2,numeroQualificateFinali:numeroGironi*2,usaQuarti:true,usaSemifinali:true,usaFinale:true,killerPoint:false,rigori:true,tempoSupplementare:true,garaAndataRitorno:false,start:"20:00",duration:30,crit1:"df",crit2:"gf",crit3:"gs",mostraQuarti:true}}};'''
          new = '''  const descrizione=document.getElementById("adminDescrizione")?.value.trim()||"";\n  const formula=document.getElementById("adminFormulaTorneo")?.value||"italiana";\n  const nuovoId=Date.now();\n  const numeroGironi=Math.ceil(posti/4);\n  const nuovoTorneo={id:nuovoId,nome,data,posti,descrizione,formula,stato:"bozza",iscritti:[],coppie:[],partecipanti:[],configurazione:{coppie:[],partecipanti:[],rules:{locked:false,tipoTorneo:formula,formatoTorneo:formula,numeroSquadre:posti,numeroGironi,squadrePerGirone:4,formulaGironi:"tuttiControTutti",formulaFinale:"eliminazioneDiretta",w:3,d:1,l:0,qualificatePerGirone:2,numeroQualificateFinali:Math.max(2,numeroGironi*2),usaQuarti:true,usaSemifinali:true,usaFinale:true,killerPoint:false,rigori:true,tempoSupplementare:true,garaAndataRitorno:false,start:"20:00",duration:30,crit1:"df",crit2:"gf",crit3:"gs",mostraQuarti:true}}};'''
          if old not in s:
              raise SystemExit('creaNuovoTorneo pattern not found')
          s = s.replace(old, new, 1)

          old = '''    descrizione,formula:"gironiFinale",\n    stato:"bozza",'''
          new = '''    descrizione,formula,\n    stato:"bozza",'''
          if old not in s:
              raise SystemExit('supabase formula pattern not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          needle = '<div class="field"><label>Posti disponibili</label><select id="adminPosti" onchange="aggiornaGiocatoriAdmin()"><option value="8">8</option><option value="12">12</option><option value="16">16</option><option value="20">20</option><option value="24">24</option></select></div></div>'
          repl = '<div class="field"><label>Posti disponibili</label><select id="adminPosti" onchange="aggiornaGiocatoriAdmin()"><option value="8">8</option><option value="12">12</option><option value="16">16</option><option value="20">20</option><option value="24">24</option></select></div><div class="field"><label>Formula torneo</label><select id="adminFormulaTorneo"><option value="italiana">🇮🇹 Torneo all\'italiana</option><option value="gironiFinale">🏆 Gironi + Fase Finale</option><option value="eliminazione">⚔️ Eliminazione Diretta</option><option value="svizzero">🇨🇭 Torneo Svizzero</option><option value="americano">🎾 Americano Padel</option><option value="mexicano">🇲🇽 Mexicano Padel</option><option value="king">👑 King of the Court</option><option value="short">⏱ Short Format</option><option value="manuale">⚙️ Torneo Personalizzato</option></select></div></div>'
          if needle not in s:
              raise SystemExit('admin formula UI pattern not found')
          s = s.replace(needle, repl, 1)
          p.write_text(s, encoding='utf-8')

          Path('automation/formula-fix.trigger').unlink()
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-functions.js admin.html automation/formula-fix.trigger .github/workflows/one-time-formula-fix.yml
          git commit -m "Fix tournament formula flow between Admin and Bove"
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-formula-fix.yml
          git add .github/workflows/one-time-formula-fix.yml
          git diff --cached --quiet || (git commit -m "Remove one-time formula fix workflow" && git push)
