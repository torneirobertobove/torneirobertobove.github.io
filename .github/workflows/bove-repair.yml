name: Bove repair and validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Bove display and empty tournament structure
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')

          # Remove obsolete temporary helpers if still present.
          text = re.sub(
              r'function normalizzaCognomiGironi\(\)\s*\{.*?\n\}\s*',
              '', text, count=1, flags=re.S
          )
          text = re.sub(
              r'function soloCognome\(valore\)\s*\{.*?\n\}\s*',
              '', text, count=1, flags=re.S
          )

          # Remove an old duplicated applyRules() tail if it exists.
          text, n = re.subn(
              r'\n\s*/\*\s*=+\s*\n\s*RITORNO\s*\n\s*=+\s*\n\s*\*/\s*\n\s*let modal\s*=.*?\n\s*if\(modal\).*?\n\s*modal\.style\.display="none";\s*\n\s*\}\s*\n\s*function loadSavedTeams\(\)',
              '\n\nfunction loadSavedTeams()', text, count=1, flags=re.S
          )
          if n:
              print('PATCH APPLICATA: rimossa la chiusura duplicata di applyRules()')

          # renderClass: always render the configured number of rows, even when a group is empty.
          render_class = r'''function renderClass(){

    ensureRules();

    const gironi = ["A","B","C","D","E","F","G"];
    const perGirone = Math.max(1, Number(state.rules.squadrePerGirone) || 4);
    const qualificate = Math.max(0, Number(state.rules.qualificatePerGirone) || 0);

    function soloCognomiClassifica(valore){
        if(valore === null || valore === undefined) return "";
        if(typeof valore === "object"){
            if(valore.cognome !== undefined && valore.cognome !== null){
                const c = String(valore.cognome).trim();
                if(c) return c;
            }
            const g1 = valore.giocatore1 || valore.g1 || valore.player1 || null;
            const g2 = valore.giocatore2 || valore.g2 || valore.player2 || null;
            const c1 = soloCognomiClassifica(g1);
            const c2 = soloCognomiClassifica(g2);
            if(c1 && c2) return c1 + "/" + c2;
            return c1 || c2 || "";
        }
        const testo = String(valore).replace(/\t/g," ").replace(/\s+/g," ").trim();
        if(!testo) return "";
        return testo.split("/").map(parte=>{
            const parole = parte.trim().split(/\s+/).filter(Boolean);
            return parole.length ? parole[parole.length-1] : "";
        }).filter(Boolean).join("/");
    }

    gironi.forEach(tag => {
        const tbody = document.getElementById(tag + "class");
        const card = document.getElementById("card" + tag);
        if(!tbody) return;

        const indice = gironi.indexOf(tag);
        if(indice >= Number(state.rules.numeroGironi || 0)){
            tbody.innerHTML = "";
            if(card) card.style.display = "none";
            state["rank" + tag] = [];
            return;
        }

        if(card) card.style.display = "block";
        tbody.innerHTML = "";

        const squadre = Array.isArray(state[tag]) ? state[tag] : [];
        const risultati = Array.isArray(state[tag + "res"]) ? state[tag + "res"] : [];
        let classifica = [];

        if(squadre.length > 0){
            try{
                classifica = calc(squadre, risultati);
            }catch(e){
                console.error("Errore calc() nel girone " + tag + ":", e);
            }
        }

        if(!Array.isArray(classifica)) classifica = [];
        state["rank" + tag] = classifica;

        for(let i = 0; i < perGirone; i++){
            const x = classifica[i] || {
                n: "",
                pt: 0,
                gf: 0,
                gs: 0,
                df: 0,
                qual: i < qualificate
            };

            const tr = document.createElement("tr");
            const tdNome = document.createElement("td");
            const tdFreccia = document.createElement("td");
            const tdPt = document.createElement("td");
            const tdGf = document.createElement("td");
            const tdGs = document.createElement("td");
            const tdDf = document.createElement("td");

            tdNome.textContent = soloCognomiClassifica(x.n || "");
            tdFreccia.style.textAlign = "center";
            tdFreccia.style.fontWeight = "700";
            tdFreccia.textContent = x.n ? (i < qualificate ? "▲" : "▼") : "";
            tdFreccia.style.color = i < qualificate ? "#22c55e" : "#ef4444";
            tdPt.textContent = String(Number(x.pt) || 0);
            tdGf.textContent = String(Number(x.gf) || 0);
            tdGs.textContent = String(Number(x.gs) || 0);
            tdDf.textContent = String(Number(x.df) || 0);

            tr.appendChild(tdNome);
            tr.appendChild(tdFreccia);
            tr.appendChild(tdPt);
            tr.appendChild(tdGf);
            tr.appendChild(tdGs);
            tr.appendChild(tdDf);
            tbody.appendChild(tr);
        }
    });
}
'''

          text, n = re.subn(
              r'function renderClass\(\)\s*\{.*?\n\}\s*\n\s*function render\(\)',
              render_class + '\nfunction render()',
              text, count=1, flags=re.S
          )
          if n != 1:
              raise SystemExit('Blocco renderClass non trovato')

          # renderTables: generate an empty 4-team round-robin skeleton for every active group.
          old = '''        let squadre =\n            state[tag];\n\n\n        if(\n            !Array.isArray(squadre) ||\n            squadre.length<2\n        ){\n\n            continue;\n\n        }\n\n\n        let partite=[];'''
          new = '''        let squadre =\n            Array.isArray(state[tag])\n                ? state[tag]\n                : [];\n\n        const strutturaVuota =\n            squadre.length < 2;\n\n        const numeroPostiGirone =\n            Math.max(2, Number(state.rules.squadrePerGirone) || 4);\n\n        let partite=[];'''
          if old not in text:
              raise SystemExit('Blocco squadre renderTables non trovato')
          text = text.replace(old, new, 1)

          old2 = '''        /*\n            USA LE PARTITE GIÀ PRESENTI (ma controllando che non siano troncate a 12)\n        */\n\n        if(\n            state.partiteGironi &&\n            Array.isArray(\n                state.partiteGironi[tag]\n            ) &&\n            state.partiteGironi[tag].length>0 &&\n            state.partiteGironi[tag].length >= (squadre.length * (squadre.length - 1) / (state.rules.garaAndataRitorno ? 1 : 2)) // Forza ricalcolo se le vecchie partite erano parziali\n        ){\n\n            partite =\n                state.partiteGironi[tag];\n\n        }\n\n\n\n        /*\n            SE NON ESISTONO O ERANO TRONCATE,\n            CREA IL ROUND ROBIN COMPLETO SULLE 8 SQUADRE\n        */\n\n        else{\n\n            let rounds =\n                generaRoundRobin(\n                    squadre.length\n                );'''
          new2 = '''        /*\n            GRUPPO VUOTO:\n            creiamo SOLO la struttura grafica del calendario,\n            senza inserire squadre fittizie nello stato.\n        */\n        if(strutturaVuota){\n\n            let rounds =\n                generaRoundRobin(\n                    numeroPostiGirone\n                );\n\n            rounds.forEach(round=>{\n                round.forEach(match=>{\n                    partite.push({\n                        casa: match[0],\n                        ospite: match[1]\n                    });\n                });\n            });\n\n        }\n\n        /*\n            GRUPPO POPOLATO:\n            usa le partite esistenti oppure genera il round robin completo.\n        */\n        else if(\n            state.partiteGironi &&\n            Array.isArray(state.partiteGironi[tag]) &&\n            state.partiteGironi[tag].length > 0 &&\n            state.partiteGironi[tag].length >= (squadre.length * (squadre.length - 1) / (state.rules.garaAndataRitorno ? 1 : 2))\n        ){\n\n            partite = state.partiteGironi[tag];\n\n        }\n\n        else{\n\n            let rounds =\n                generaRoundRobin(\n                    squadre.length\n                );'''
          if old2 not in text:
              raise SystemExit('Blocco calendario renderTables non trovato')
          text = text.replace(old2, new2, 1)

          old3 = '''        if(card){\n\n            card.style.display =\n\n                (\n                    Array.isArray(\n                        state[tag]\n                    )\n                    &&\n                    state[tag].length>0\n                )\n\n                ?\n\n                "block"\n\n                :\n\n                "none";\n\n        }'''
          new3 = '''        if(card){\n\n            card.style.display =\n                (\n                    lettereGironi.indexOf(tag) <\n                    numeroGironi\n                )\n                    ? "block"\n                    : "none";\n\n        }'''
          if old3 not in text:
              raise SystemExit('Blocco visibilita card non trovato')
          text = text.replace(old3, new3, 1)

          # renderKO: always draw the configured bracket skeleton; never invent a team name.
          render_ko = r'''function renderKO(){

    ensureRules();

    const q = document.getElementById("Q");
    const s = document.getElementById("S");
    const f = document.getElementById("finaleBox");

    if(!q || !s || !f){
        console.error("renderKO: contenitori fase finale non trovati");
        return;
    }

    const qTable = q.closest("table");
    const sTable = s.closest("table");
    const fTable = f.closest("table");

    q.innerHTML = "";
    s.innerHTML = "";
    f.innerHTML = "";

    document.querySelectorAll(".winner-box.top-win").forEach(el=>el.remove());

    if(!Array.isArray(state.qRes)) state.qRes = Array(4).fill("-");
    while(state.qRes.length < 4) state.qRes.push("-");
    state.qRes = state.qRes.slice(0,4);
    if(!Array.isArray(state.qCamp)) state.qCamp = [];
    if(!Array.isArray(state.qTime)) state.qTime = [];

    if(!Array.isArray(state.sTopRes)) state.sTopRes = Array(2).fill("-");
    while(state.sTopRes.length < 2) state.sTopRes.push("-");
    state.sTopRes = state.sTopRes.slice(0,2);
    if(!Array.isArray(state.sCamp)) state.sCamp = [];
    if(!Array.isArray(state.sTime)) state.sTime = [];

    if(typeof state.fTopRes !== "string" || !state.fTopRes.trim()) state.fTopRes = "-";
    if(!Array.isArray(state.fCamp)) state.fCamp = [];
    if(!Array.isArray(state.fTime)) state.fTime = [];

    function creaMatchKO(match, gruppo, index, risultato){
        if(!Array.isArray(match) || match.length !== 2) return "";

        const squadra1 = match[0] ? String(match[0]) : "";
        const squadra2 = match[1] ? String(match[1]) : "";

        const campKey = gruppo === "q" ? "qCamp" : gruppo === "s" ? "sCamp" : "fCamp";
        const timeKey = gruppo === "q" ? "qTime" : gruppo === "s" ? "sTime" : "fTime";
        const resKey = gruppo === "q" ? "qRes" : gruppo === "s" ? "sTopRes" : null;

        const campo = Array.isArray(state[campKey]) ? (state[campKey][index] ?? "") : "";
        const ora = Array.isArray(state[timeKey]) ? (state[timeKey][index] ?? "") : "";
        const ris = risultato && risultato !== "-" ? String(risultato) : "";

        return `
<tr>
<td><input type="text" value="${campo}" style="width:45px" onchange="updateCamp('${gruppo.toUpperCase()}',${index},this.value)"></td>
<td><input type="time" value="${ora}" onchange="updateTime('${gruppo.toUpperCase()}',${index},this.value)"></td>
<td class="match-cell"><div class="team-line">${squadra1}</div><div class="vs-line"><b>VS</b></div><div class="team-line">${squadra2}</div></td>
<td class="db-cell"><input value="${ris}" placeholder="Ris" oninput="updateKOResult('${gruppo.toUpperCase()}',${index},this.value)"></td>
</tr>`;
    }

    function layout(table){
        if(!table) return;
        table.style.display = "table";
        table.style.width = "100%";
        table.style.tableLayout = "fixed";
    }

    const expected = Math.max(
        0,
        Number(state.rules.numeroQualificateFinali) ||
        (Number(state.rules.numeroGironi) || 0) * (Number(state.rules.qualificatePerGirone) || 0)
    );

    let qualificati = [];
    try{
        const ottenuti = getFinalQualified();
        if(Array.isArray(ottenuti)) qualificati = ottenuti;
    }catch(e){
        console.error("Errore recupero qualificati:", e);
    }

    const slots = Array.from({length: expected}, (_,i)=>qualificati[i] || "");

    const usaQuarti = state.rules.usaQuarti === true && expected >= 8;
    const usaSemifinali = state.rules.usaSemifinali === true;
    const usaFinale = state.rules.usaFinale === true;

    let semifinali = [];

    if(usaQuarti){
        const quarti = [
            [slots[0] || "", slots[7] || ""],
            [slots[3] || "", slots[4] || ""],
            [slots[1] || "", slots[6] || ""],
            [slots[2] || "", slots[5] || ""]
        ];

        quarti.forEach((match,index)=>{
            q.innerHTML += creaMatchKO(match,"q",index,state.qRes[index]);
        });
        layout(qTable);

        const vincitori = quarti.map((match,index)=>getWinner(match,state.qRes[index]) || "");
        semifinali = [
            [vincitori[0],vincitori[1]],
            [vincitori[2],vincitori[3]]
        ];
    }
    else if(expected >= 4){
        semifinali = [
            [slots[0] || "", slots[3] || ""],
            [slots[2] || "", slots[1] || ""]
        ];
    }
    else if(expected >= 2){
        semifinali = [[slots[0] || "", slots[1] || ""]];
    }

    let finalisti = [];

    if(usaSemifinali){
        while(semifinali.length < 2 && expected >= 4) semifinali.push(["",""]);

        semifinali.slice(0,2).forEach((match,index)=>{
            s.innerHTML += creaMatchKO(match,"s",index,state.sTopRes[index]);
            const vincitore = getWinner(match,state.sTopRes[index]);
            if(vincitore) finalisti.push(vincitore);
        });
        layout(sTable);
    }
    else if(expected >= 2){
        finalisti = [slots[0] || "", slots[1] || ""];
    }

    state.finalTop = [finalisti[0] || "", finalisti[1] || ""];

    if(usaFinale){
        f.innerHTML = creaMatchKO(state.finalTop,"f",0,state.fTopRes);
        layout(fTable);

        const campione = getWinner(state.finalTop,state.fTopRes);
        if(campione){
            state.campioneTop = campione;
            if(fTable){
                fTable.insertAdjacentHTML("afterend", `<div class="winner-box top-win">🏆 CAMPIONE TORNEO:<br>${campione}</div>`);
            }
        }else{
            state.campioneTop = null;
        }
    }
    else{
        if(fTable) fTable.style.display = "none";
        state.campioneTop = null;
    }

    console.log("=== QUARTI CONFIGURATI ===",{
        attivi: usaQuarti,
        numeroRighe: q.querySelectorAll("tr").length,
        qualificati: qualificati.length,
        semifinali: semifinali.length,
        finalisti: finalisti.length
    });
}
'''

          text, n = re.subn(
              r'function renderKO\(\)\s*\{.*?\n\}\s*\n\s*function updateKOResult\(',
              render_ko + '\nfunction updateKOResult(',
              text, count=1, flags=re.S
          )
          if n != 1:
              raise SystemExit('Blocco renderKO non trovato')

          p.write_text(text, encoding='utf-8')
          print('PATCH APPLICATA: struttura vuota gironi + classifiche + tabellone KO')

      - name: JavaScript syntax test
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('Bove.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('Nessun blocco script trovato')
          for i, script in enumerate(scripts, 1):
              f = Path(tempfile.gettempdir()) / f'bove_script_{i}.js'
              f.write_text(script, encoding='utf-8')
              r = subprocess.run(['node', '--check', str(f)], text=True, capture_output=True)
              if r.returncode != 0:
                  print(r.stdout)
                  print(r.stderr)
                  raise SystemExit(f'Sintassi JavaScript non valida nello script {i}')
          print(f'SINTASSI OK: {len(scripts)} blocchi script')

      - name: Structural validation
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path('Bove.html').read_text(encoding='utf-8')
          required = [
              'function loadState()',
              'function initDefaults()',
              'function renderTables()',
              'function renderClass()',
              'function renderKO()',
              'function updateCamp(',
              'function updateRes(',
              'function getFinalQualified()',
              'function creaFinale(semifinali)',
              'id="titoloTorneo"',
              'id="nomeTorneoInput"',
              'id="Q"',
              'id="S"',
              'id="finaleBox"'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Elementi mancanti: ' + ', '.join(missing))
          if 'function normalizzaCognomiGironi()' in text:
              raise SystemExit('Helper temporaneo normalizzaCognomiGironi ancora presente')
          if 'function soloCognome(valore)' in text:
              raise SystemExit('Helper temporaneo soloCognome ancora presente')
          print('VALIDAZIONE STRUTTURA OK')

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- Bove.html; then
            echo 'Nessuna modifica necessaria.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git commit -m 'Fix empty tournament bracket and group rendering'
          git push
