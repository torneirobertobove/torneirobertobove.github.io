name: Bove repair and validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair idTorneo loading path
        shell: python
        run: |
          from pathlib import Path

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')

          marker = 'const torneoDaAdmin =\n            params.get("torneo");'
          guard = '''const idTorneoParam =\n            params.get("idTorneo");\n\n\n        /*\n        ============================================================\n        TORNEO APERTO DA ADMIN TRAMITE ID\n        Delegare tutto a loadState(), che carica anche le iscrizioni\n        reali da Supabase e ricostruisce le coppie quando necessario.\n        ============================================================\n        */\n\n        if(idTorneoParam){\n\n            await loadState();\n\n            return;\n\n        }\n\n\n        const torneoDaAdmin =\n            params.get("torneo");'''

          if 'const idTorneoParam =' not in text:
              if marker not in text:
                  raise SystemExit('Marker initDefaults non trovato')
              text = text.replace(marker, guard, 1)
              p.write_text(text, encoding='utf-8')
              print('PATCH APPLICATA: initDefaults delega idTorneo a loadState()')
          else:
              print('PATCH GIA PRESENTE')

      - name: Repair surname-only display
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')

          surname_helper = r'''function soloCognomiTabellone(valore){

    if(valore === null || valore === undefined)
        return "";

    if(typeof valore === "object"){

        const g1 =
            valore.giocatore1 ||
            valore.g1 ||
            valore.player1 ||
            null;

        const g2 =
            valore.giocatore2 ||
            valore.g2 ||
            valore.player2 ||
            null;

        const cognome = g => {

            if(g === null || g === undefined)
                return "";

            if(typeof g === "object"){

                if(g.cognome !== undefined && g.cognome !== null)
                    return String(g.cognome).trim();

                if(g.nome_giocatore !== undefined && g.nome_giocatore !== null){
                    const t = String(g.nome_giocatore).trim();
                    const p = t.split(/\s+/).filter(Boolean);
                    return p.length ? p[p.length - 1] : "";
                }

                return "";
            }

            const t = String(g).replace(/\s+/g," ").trim();
            if(!t) return "";
            const p = t.split(/\s+/).filter(Boolean);
            return p.length ? p[p.length - 1] : "";
        };

        const c1 = cognome(g1);
        const c2 = cognome(g2);

        if(c1 && c2) return c1 + " / " + c2;
        return c1 || c2 || "";
    }

    const testo = String(valore)
        .replace(/\t/g," ")
        .replace(/\s+/g," ")
        .trim();

    if(!testo) return "";

    return testo
        .split("/")
        .map(parte => {
            const p = parte.trim().split(/\s+/).filter(Boolean);
            return p.length ? p[p.length - 1] : "";
        })
        .filter(Boolean)
        .join(" / ");
}

'''

          if 'function soloCognomiTabellone(' not in text:
              marker = 'function renderTables(){'
              if marker not in text:
                  raise SystemExit('renderTables non trovato')
              text = text.replace(marker, surname_helper + marker, 1)

          pattern = re.compile(r'function renderTables\(\)\s*\{.*?\n\}\s*\n\s*function getFinalQualified\(\)', re.S)
          m = pattern.search(text)
          if not m:
              raise SystemExit('Blocco renderTables non trovato')

          block = m.group(0)
          block = block.replace('soloCognomi(\n                    state[tag]?.[m.casa] ?? ""\n                )', 'soloCognomiTabellone(\n                    state[tag]?.[m.casa] ?? ""\n                )')
          block = block.replace('soloCognomi(\n                    state[tag]?.[m.ospite] ?? ""\n                )', 'soloCognomiTabellone(\n                    state[tag]?.[m.ospite] ?? ""\n                )')
          text = text[:m.start()] + block + text[m.end()-len('function getFinalQualified()'):]

          pattern_class = re.compile(r'function renderClass\(\)\s*\{.*?\n\}\s*\n\s*function updateKOResult\(', re.S)
          mc = pattern_class.search(text)
          if not mc:
              raise SystemExit('Blocco renderClass non trovato')

          old = mc.group(0)
          new = old
          new = re.sub(
              r'let cognome = "";.*?tdNome\.textContent =\s*cognome;',
              '''let cognome = soloCognomiTabellone(x?.n ?? "");\n\n            tdNome.textContent =\n                cognome;''',
              new,
              count=1,
              flags=re.S
          )
          if new == old:
              raise SystemExit('Punto di sostituzione cognome in renderClass non trovato')

          text = text[:mc.start()] + new + text[mc.end()-len('function updateKOResult('):]

          p.write_text(text, encoding='utf-8')
          print('PATCH APPLICATA: gironi e classifiche mostrano solo i cognomi')

      - name: JavaScript syntax test
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile

          html = Path('Bove.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('Nessun blocco script trovato')

          for i, script in enumerate(scripts, 1):
              f = Path(tempfile.gettempdir()) / f'bove_script_{i}.js'
              f.write_text(script, encoding='utf-8')
              r = subprocess.run(['node', '--check', str(f)], text=True, capture_output=True)
              if r.returncode != 0:
                  print(r.stdout)
                  print(r.stderr)
                  raise SystemExit(f'Sintassi JavaScript non valida nello script {i}')
          print(f'SINTASSI OK: {len(scripts)} blocchi script')

      - name: Structural tests
        shell: python
        run: |
          from pathlib import Path
          import re

          text = Path('Bove.html').read_text(encoding='utf-8')

          required = [
              'function loadState()',
              'function initDefaults()',
              'function renderTables()',
              'function renderClass()',
              'function soloCognomiTabellone(',
              'function updateCamp(',
              'function updateRes(',
              'function toggleAdminMenu()',
              'function verifyAccess()',
              'id="adminMenuButton"',
              'id="adminMenu"',
              'id="titoloTorneo"',
              'id="nomeTorneoInput"',
              'type="date"',
          ]

          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Elementi mancanti: ' + ', '.join(missing))

          for ident in ['teamModal', 'adminMenuButton', 'adminMenu']:
              n = len(re.findall(r'id=["\']' + re.escape(ident) + r'["\']', text))
              if n != 1:
                  raise SystemExit(f'ID duplicato/assente: {ident} ({n})')

          if 'const idTorneoParam =' not in text:
              raise SystemExit('Riparazione idTorneo non presente')

          print('TEST STRUTTURALI OK')

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- Bove.html; then
            echo 'Nessuna modifica necessaria.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git commit -m 'Fix surname-only tournament display'
          git push
