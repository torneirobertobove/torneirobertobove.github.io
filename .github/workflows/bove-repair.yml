name: Bove repair and validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Bove display cleanly
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')

          # Rimuove SOLO i due helper temporanei aggiunti durante le prove.
          text = re.sub(
              r'function normalizzaCognomiGironi\(\)\s*\{.*?\n\}\s*',
              '',
              text,
              count=1,
              flags=re.S
          )
          text = re.sub(
              r'function soloCognome\(valore\)\s*\{.*?\n\}\s*',
              '',
              text,
              count=1,
              flags=re.S
          )

          # Corregge SOLO la chiusura duplicata di applyRules() che causa
          # "Unexpected token '}'" prima di loadSavedTeams().
          text, n = re.subn(
              r'\n\s*/\*\s*=+\s*\n\s*RITORNO\s*\n\s*=+\s*\n\s*\*/\s*\n\s*let modal\s*=.*?\n\s*if\(modal\).*?\n\s*modal\.style\.display="none";\s*\n\s*\}\s*\n\s*function loadSavedTeams\(\)',
              '\n\nfunction loadSavedTeams()',
              text,
              count=1,
              flags=re.S
          )
          if n:
              print('PATCH APPLICATA: rimossa la chiusura duplicata di applyRules()')

          # Corregge renderClass senza modificare calc() o lo stato del torneo.
          render_class = r'''function renderClass(){

    ensureRules();

    const gironi = ["A","B","C","D","E","F","G"];

    function soloCognomiClassifica(valore){

        if(valore === null || valore === undefined)
            return "";

        if(typeof valore === "object"){

            if(valore.cognome !== undefined && valore.cognome !== null){
                const c = String(valore.cognome).trim();
                if(c) return c;
            }

            const g1 = valore.giocatore1 || valore.g1 || valore.player1 || null;
            const g2 = valore.giocatore2 || valore.g2 || valore.player2 || null;

            const c1 = soloCognomiClassifica(g1);
            const c2 = soloCognomiClassifica(g2);

            if(c1 && c2) return c1 + "/" + c2;
            return c1 || c2 || "";
        }

        const testo = String(valore)
            .replace(/\t/g," ")
            .replace(/\s+/g," ")
            .trim();

        if(!testo) return "";

        return testo
            .split("/")
            .map(parte => {
                const parole = parte.trim().split(/\s+/).filter(Boolean);
                return parole.length ? parole[parole.length - 1] : "";
            })
            .filter(Boolean)
            .join("/");
    }

    gironi.forEach(tag => {

        const tbody = document.getElementById(tag + "class");
        if(!tbody) return;

        tbody.innerHTML = "";

        const squadre = Array.isArray(state[tag]) ? state[tag] : [];
        if(squadre.length === 0) return;

        const risultati = Array.isArray(state[tag + "res"])
            ? state[tag + "res"]
            : [];

        const classifica = calc(squadre, risultati);
        if(!Array.isArray(classifica) || classifica.length === 0)
            return;

        classifica.forEach((x, indice) => {

            const tr = document.createElement("tr");

            const tdPos = document.createElement("td");
            tdPos.textContent = String(indice + 1);

            const tdNome = document.createElement("td");
            tdNome.textContent = soloCognomiClassifica(x?.n ?? "");

            const tdFreccia = document.createElement("td");
            tdFreccia.style.width = "24px";
            tdFreccia.style.textAlign = "center";
            tdFreccia.style.fontWeight = "700";
            tdFreccia.textContent = x?.qual ? "↑" : "↓";
            tdFreccia.style.color = x?.qual ? "#22c55e" : "#ef4444";

            const tdPt = document.createElement("td");
            tdPt.textContent = String(Number(x?.pt) || 0);

            const tdGf = document.createElement("td");
            tdGf.textContent = String(Number(x?.gf) || 0);

            const tdGs = document.createElement("td");
            tdGs.textContent = String(Number(x?.gs) || 0);

            const tdDf = document.createElement("td");
            tdDf.textContent = String(Number(x?.df) || 0);

            tr.appendChild(tdPos);
            tr.appendChild(tdNome);
            tr.appendChild(tdFreccia);
            tr.appendChild(tdPt);
            tr.appendChild(tdGf);
            tr.appendChild(tdGs);
            tr.appendChild(tdDf);

            tbody.appendChild(tr);
        });
    });

    console.log("RENDERCLASS — SOLO COGNOMI", {
        A: document.getElementById("Aclass")?.innerText || "",
        B: document.getElementById("Bclass")?.innerText || ""
    });
}
'''

          pattern = re.compile(
              r'function renderClass\(\)\s*\{.*?\n\}\s*\n\s*function updateKOResult\(',
              re.S
          )
          m = pattern.search(text)
          if not m:
              raise SystemExit('Blocco renderClass non trovato')

          text = text[:m.start()] + render_class + '\nfunction updateKOResult(' + text[m.end():]

          p.write_text(text, encoding='utf-8')
          print('PATCH APPLICATA: helper temporanei rimossi e renderClass corretto')

      - name: JavaScript syntax test
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile

          html = Path('Bove.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('Nessun blocco script trovato')

          for i, script in enumerate(scripts, 1):
              f = Path(tempfile.gettempdir()) / f'bove_script_{i}.js'
              f.write_text(script, encoding='utf-8')
              r = subprocess.run(['node', '--check', str(f)], text=True, capture_output=True)
              if r.returncode != 0:
                  print(r.stdout)
                  print(r.stderr)
                  raise SystemExit(f'Sintassi JavaScript non valida nello script {i}')

          print(f'SINTASSI OK: {len(scripts)} blocchi script')

      - name: Structural validation
        shell: python
        run: |
          from pathlib import Path
          import re

          text = Path('Bove.html').read_text(encoding='utf-8')

          required = [
              'function loadState()',
              'function initDefaults()',
              'function renderTables()',
              'function renderClass()',
              'function updateCamp(',
              'function updateRes(',
              'function getFinalQualified()',
              'function creaFinale(semifinali)',
              'function toggleAdminMenu()',
              'function verifyAccess()',
              'id="adminMenuButton"',
              'id="adminMenu"',
              'id="titoloTorneo"',
              'id="nomeTorneoInput"',
              'type="date"'
          ]

          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Elementi mancanti: ' + ', '.join(missing))

          pos_get = text.find('function getFinalQualified()')
          pos_finale = text.find('function creaFinale(semifinali)')
          if pos_get == -1 or pos_finale == -1 or pos_get >= pos_finale:
              raise SystemExit('Ordine fase finale non valido: getFinalQualified() deve precedere creaFinale(semifinali)')

          for ident in ['teamModal', 'adminMenuButton', 'adminMenu']:
              n = len(re.findall(r'id=["\']' + re.escape(ident) + r'["\']', text))
              if n != 1:
                  raise SystemExit(f'ID duplicato/assente: {ident} ({n})')

          if 'function normalizzaCognomiGironi()' in text:
              raise SystemExit('Helper temporaneo normalizzaCognomiGironi ancora presente')

          if 'function soloCognome(valore)' in text:
              raise SystemExit('Helper temporaneo soloCognome ancora presente')

          print('VALIDAZIONE STRUTTURA OK — getFinalQualified() presente prima di creaFinale()')

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- Bove.html; then
            echo 'Nessuna modifica necessaria.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git commit -m 'Clean surname display helpers and fix renderClass'
          git push
