name: Fix Bove pair names

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-pair-names:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch pair-name rendering only
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')
          original = text

          helper = r'''function nomeCoppia(squadra){

    if(
        squadra === null ||
        squadra === undefined ||
        squadra === "" ||
        squadra === "-"
    ){
        return "-";
    }

    if(typeof squadra === "object"){

        if(
            typeof squadra.nome === "string" &&
            squadra.nome.trim() !== ""
        ){
            return squadra.nome.trim();
        }

        function nomeGiocatore(g){
            if(!g) return "";

            const cognome = String(g.cognome ?? "").trim();
            const nome = String(g.nome ?? "").trim();

            if(cognome !== "" && nome !== ""){
                return nome.charAt(0).toUpperCase() + ". " + cognome;
            }

            if(cognome !== "") return cognome;
            return nome;
        }

        const p1 = nomeGiocatore(
            squadra.giocatore1 ?? squadra.g1 ?? squadra.player1
        );
        const p2 = nomeGiocatore(
            squadra.giocatore2 ?? squadra.g2 ?? squadra.player2
        );

        if(p1 && p2) return p1 + " / " + p2;
        if(p1) return p1;
        if(p2) return p2;
        return "-";
    }

    return String(squadra).trim() || "-";
}
'''

          # Add one global normalizer before renderTables if none exists globally.
          if not re.search(r'(?m)^function nomeCoppia\(squadra\)\s*\{', text):
              marker = 'function renderTables(){'
              if marker not in text:
                  raise SystemExit('renderTables non trovato')
              text = text.replace(marker, helper + '\n' + marker, 1)

          # In renderTables, replace the two long object-to-string blocks with the
          # single canonical pair formatter. This preserves the existing HTML,
          # results, fields and times.
          casa_pattern = re.compile(
              r'(?s)(\n\s*/\*\s*\n\s*COPPIA CASA\s*\n\s*\*/\s*\n\s*)'
              r'let casa\s*=\s*state\[tag\]\[m\.casa\];.*?'
              r'(?=\n\s*/\*\s*\n\s*COPPIA OSPITE\s*\n\s*\*/)',
              re.S
          )
          casa_replacement = r'''\1const casa = state[tag][m.casa];

                const squadraCasa =
                    nomeCoppia(casa);

'''
          text, n1 = casa_pattern.subn(casa_replacement, text, count=1)

          ospite_pattern = re.compile(
              r'(?s)(\n\s*/\*\s*\n\s*COPPIA OSPITE\s*\n\s*\*/\s*\n\s*)'
              r'let ospite\s*=\s*state\[tag\]\[m\.ospite\];.*?'
              r'(?=\n\s*/\*\s*\n\s*HTML ORIGINALE\s*\n\s*\*/)',
              re.S
          )
          ospite_replacement = r'''\1const ospite = state[tag][m.ospite];

                const squadraOspite =
                    nomeCoppia(ospite);

'''
          text, n2 = ospite_pattern.subn(ospite_replacement, text, count=1)

          # Also correct the common renderKO conversion if present.
          text = text.replace(
              'const squadra1 = match[0] ? String(match[0]) : "";',
              'const squadra1 = nomeCoppia(match[0]);',
              1
          )
          text = text.replace(
              'const squadra2 = match[1] ? String(match[1]) : "";',
              'const squadra2 = nomeCoppia(match[1]);',
              1
          )

          if text == original:
              print('NESSUNA MODIFICA NECESSARIA')
              raise SystemExit(0)

          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Patch renderTables incompleta: casa={n1}, ospite={n2}')

          p.write_text(text, encoding='utf-8')
          print('PATCH NOMI COPPIE APPLICATA: renderTables + renderKO')

      - name: Syntax check
        shell: python
        run: |
          from pathlib import Path
          import re
          t = Path('Bove.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', t, re.S | re.I)
          js = '\n'.join(scripts)
          # Basic structural checks; browser validation remains authoritative.
          if js.count('{') != js.count('}'):
              raise SystemExit('Errore bilanciamento parentesi graffe')
          if 'function renderTables()' not in js:
              raise SystemExit('renderTables mancante')
          if 'function nomeCoppia(squadra)' not in js:
              raise SystemExit('nomeCoppia mancante')
          print('SYNTAX CHECK OK')

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- Bove.html; then
            echo 'Nessun commit necessario'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git commit -m 'Fix pair-name rendering in Bove'
          git push
