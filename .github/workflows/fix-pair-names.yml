name: Fix Bove pair rendering

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-pair-rendering:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Bove pair rendering') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Repair renderMatchCard safely
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')
          marker = '/* BOVE PAIR RENDER PATCH V2 */'

          if marker in text:
              print('Patch gia presente')
              raise SystemExit(0)

          patch = r'''

/* BOVE PAIR RENDER PATCH V2 */
function boveNomeCoppia(squadra){
    if(squadra === null || squadra === undefined || squadra === '' || squadra === '-') return '-';

    if(typeof squadra === 'object'){
        const g1 = squadra.giocatore1 ?? squadra.g1 ?? squadra.player1;
        const g2 = squadra.giocatore2 ?? squadra.g2 ?? squadra.player2;

        if(g1 !== undefined || g2 !== undefined){
            const nomeGiocatore = g => {
                if(g === null || g === undefined) return '';
                if(typeof g === 'object'){
                    const nome = String(g.nome ?? '').trim();
                    const cognome = String(g.cognome ?? '').trim();
                    if(nome && cognome) return nome.charAt(0).toUpperCase() + '. ' + cognome;
                    return cognome || nome;
                }
                return String(g).trim();
            };
            const a = nomeGiocatore(g1);
            const b = nomeGiocatore(g2);
            if(a && b) return a + ' / ' + b;
            return a || b || '-';
        }

        if(typeof squadra.nome === 'string' && squadra.nome.trim()) return squadra.nome.trim();
        return '-';
    }

    return String(squadra).trim() || '-';
}

/* Override globale: impedisce qualsiasi String(object) -> [object Object]. */
function renderMatchCard(titolo, match, tipo, index, risultato){
    if(!Array.isArray(match) || match.length !== 2) return '';

    const fase = String(tipo || '').toUpperCase();
    const i = Number(index) || 0;
    const squadra1 = boveNomeCoppia(match[0]);
    const squadra2 = boveNomeCoppia(match[1]);

    let campo = '';
    let ora = '';

    if(fase === 'Q'){
        campo = Array.isArray(state.qCamp) && state.qCamp[i] !== undefined ? state.qCamp[i] : '';
        ora = Array.isArray(state.qTime) && state.qTime[i] !== undefined ? state.qTime[i] : '';
    }else if(fase === 'S'){
        campo = Array.isArray(state.sCamp) && state.sCamp[i] !== undefined ? state.sCamp[i] : '';
        ora = Array.isArray(state.sTime) && state.sTime[i] !== undefined ? state.sTime[i] : '';
    }else if(fase === 'F'){
        campo = Array.isArray(state.fCamp) && state.fCamp[i] !== undefined ? state.fCamp[i] : '';
        ora = Array.isArray(state.fTime) && state.fTime[i] !== undefined ? state.fTime[i] : '';
    }

    const ris = risultato !== undefined && risultato !== null ? String(risultato) : '-';

    return `
<tr>
<td><input value="${campo}" style="width:45px" onchange="updateCamp('${fase}',${i},this.value)"></td>
<td><input type="time" value="${ora}" onchange="updateTime('${fase}',${i},this.value)"></td>
<td class="match-cell"><div class="team-line">${squadra1}</div><div class="vs-line"><b>VS</b></div><div class="team-line">${squadra2}</div></td>
<td class="db-cell"><input value="${ris === '-' ? '' : ris}" placeholder="Ris" oninput="updateKOResult('${fase}',${i},this.value)"></td>
</tr>`;
}
'''

          # Replace only the existing renderMatchCard declaration, preserving the rest.
          pattern = re.compile(r'function\s+renderMatchCard\s*\([^)]*\)\s*\{.*?\n\}\s*(?=\n\s*function\s+aggiornaDescrizioneTipoTorneo)', re.S)
          text, n = pattern.subn('', text, count=1)
          if n != 1:
              raise SystemExit(f'renderMatchCard originale non trovato: {n}')

          marker_pos = text.find('function aggiornaDescrizioneTipoTorneo')
          if marker_pos < 0:
              raise SystemExit('Punto di inserimento non trovato')
          text = text[:marker_pos] + patch + '\n' + text[marker_pos:]

          p.write_text(text, encoding='utf-8')
          print('PATCH NOMI COPPIE APPLICATA')

      - name: Validate structure
        shell: python
        run: |
          from pathlib import Path
          t = Path('Bove.html').read_text(encoding='utf-8')
          if '/* BOVE PAIR RENDER PATCH V2 */' not in t:
              raise SystemExit('Patch non presente')
          if t.count('function renderMatchCard(') != 1:
              raise SystemExit('renderMatchCard duplicata o assente')
          print('VALIDAZIONE OK')

      - name: Commit repaired Bove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git commit -m 'Fix Bove pair rendering'
          git push origin HEAD:main
