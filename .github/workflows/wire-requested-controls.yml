name: Wire requested tournament controls
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: github.event.head_commit.message != 'Wire requested tournament controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire scripts without replacing existing code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          mappings={
            'Bove.html':['tournament-controls-v1.js'],
            'admin.html':['tournament-controls-v1.js'],
            'visitatore.html':['visitor-capacity-v1.js'],
            'iscrizione.html':['registration-capacity-v1.js'],
          }
          for name,scripts in mappings.items():
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              for script in scripts:
                  tag=f'<script src="{script}"></script>'
                  if tag not in s:
                      pos=s.lower().rfind('</body>')
                      if pos<0:
                          s += '\n'+tag+'\n'
                      else:
                          s=s[:pos]+tag+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
          git add Bove.html admin.html visitatore.html iscrizione.html tournament-controls-v1.js registration-capacity-v1.js visitor-capacity-v1.js
          git rm .github/workflows/wire-requested-controls.yml
          git commit -m 'Wire requested tournament controls'
          git push