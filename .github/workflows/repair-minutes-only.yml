name: Repair minutes position only

on:
  push:
    paths:
      - '.github/workflows/repair-minutes-only.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply only minutes/hour spacing repair
        shell: python
        run: |
          from pathlib import Path
          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')
          marker = '/* BOVE MINUTES ADJACENT TO HOUR - REPAIR ONLY */'
          if marker in text:
              raise SystemExit('Repair already present')
          css = '''\n<style>\n/* BOVE MINUTES ADJACENT TO HOUR - REPAIR ONLY */\ntable:has(> tbody#Q) th:nth-child(2), table:has(> tbody#Q) td:nth-child(2),\ntable:has(> tbody#S) th:nth-child(2), table:has(> tbody#S) td:nth-child(2),\ntable:has(> tbody#finaleBox) th:nth-child(2), table:has(> tbody#finaleBox) td:nth-child(2),\n.koBox table th:nth-child(2), .koBox table td:nth-child(2),\n.finalContainer table th:nth-child(2), .finalContainer table td:nth-child(2) { width:50.5px !important; }\n\ntable:has(> tbody#Q) th:nth-child(3), table:has(> tbody#Q) td:nth-child(3),\ntable:has(> tbody#S) th:nth-child(3), table:has(> tbody#S) td:nth-child(3),\ntable:has(> tbody#finaleBox) th:nth-child(3), table:has(> tbody#finaleBox) td:nth-child(3),\n.koBox table th:nth-child(3), .koBox table td:nth-child(3),\n.finalContainer table th:nth-child(3), .finalContainer table td:nth-child(3) { width:50.5px !important; }\n</style>\n'''
          if '</head>' not in text:
              raise SystemExit('head non trovato')
          p.write_text(text.replace('</head>', css + '</head>', 1), encoding='utf-8')
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/repair-minutes-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html .github/workflows/repair-minutes-only.yml
          git diff --cached --check
          git commit -m "Repair minutes position next to hour"
          git push origin HEAD:main
