name: Inspect RIS layout

on:
  push:
    branches: [main]

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect match table rows
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('Bove.html').read_text(encoding='utf-8')
          for m in re.finditer(r'<tr[^>]*>(.*?)</tr>', s, re.S|re.I):
              row = m.group(1)
              if 'match-cell' in row or 'db-cell' in row:
                  cells = re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', row, re.S|re.I)
                  clean = [re.sub(r'<[^>]+>', ' ', c).replace('\\n',' ').strip() for c in cells]
                  print('CELLS:', len(clean), clean)
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/inspect-ris-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/inspect-ris-layout.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Remove temporary RIS layout inspector'
          git push
