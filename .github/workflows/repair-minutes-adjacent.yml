name: Repair minutes adjacent to hour

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-minutes-adjacent.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Move only minutes cell next to hour cell
        shell: python
        run: |
          from pathlib import Path
          p=Path('Bove.html')
          text=p.read_text(encoding='utf-8')
          old='''<th>Campo</th>\n\n                        <th colspan="2">Ora</th>\n\n                        <th>Match</th>'''
          new='''<th>Campo</th>\n\n                        <th>Ora</th>\n\n                        <th>Minuti</th>\n\n                        <th>Match</th>'''
          if text.count(old) != 3:
              raise SystemExit(f'Header target inatteso: trovati {text.count(old)}, attesi 3')
          text=text.replace(old,new)
          p.write_text(text,encoding='utf-8')
      - name: Commit only Bove.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html
          git diff --cached --check
          git commit -m "Place minutes cell next to hour"
          git push origin HEAD:main
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/repair-minutes-adjacent.yml || true
          git commit -m "Remove temporary minutes repair workflow" || true
          git push origin HEAD:main || true
