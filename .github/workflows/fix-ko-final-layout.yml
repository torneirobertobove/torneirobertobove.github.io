name: Fix KO final layout
on:
  push:
    paths:
      - '.github/workflows/fix-ko-final-layout.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Bove.html KO layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Bove.html')
          s=p.read_text()

          start=s.index('/* ========================================================\n   LAYOUT FASE FINALE KO')
          end=s.index('/* ============================\n\n   NUOVE CELLE PARTITE KO', start)
          css='''/* ========================================================
   LAYOUT FASE FINALE KO — STESSO MODELLO DEI GIRONI
   Campo | Ora | Minuti | Match | Ris.1 | Ris.2
   ======================================================== */

table:has(> tbody#Q),
table:has(> tbody#S),
table:has(> tbody#finaleBox){
    table-layout:fixed !important;
    width:462px !important;
    min-width:462px !important;
    max-width:462px !important;
    border-collapse:collapse !important;
    border-spacing:0 !important;
}

table:has(> tbody#Q) col:nth-child(1), table:has(> tbody#S) col:nth-child(1), table:has(> tbody#finaleBox) col:nth-child(1){width:53px !important;}
table:has(> tbody#Q) col:nth-child(2), table:has(> tbody#S) col:nth-child(2), table:has(> tbody#finaleBox) col:nth-child(2){width:50px !important;}
table:has(> tbody#Q) col:nth-child(3), table:has(> tbody#S) col:nth-child(3), table:has(> tbody#finaleBox) col:nth-child(3){width:51px !important;}
table:has(> tbody#Q) col:nth-child(4), table:has(> tbody#S) col:nth-child(4), table:has(> tbody#finaleBox) col:nth-child(4){width:120px !important;}
table:has(> tbody#Q) col:nth-child(5), table:has(> tbody#S) col:nth-child(5), table:has(> tbody#finaleBox) col:nth-child(5){width:94px !important;}
table:has(> tbody#Q) col:nth-child(6), table:has(> tbody#S) col:nth-child(6), table:has(> tbody#finaleBox) col:nth-child(6){width:94px !important;}

table:has(> tbody#Q) th, table:has(> tbody#Q) td,
table:has(> tbody#S) th, table:has(> tbody#S) td,
table:has(> tbody#finaleBox) th, table:has(> tbody#finaleBox) td{
    box-sizing:border-box !important;
    padding:8px 4px !important;
    text-align:center !important;
    vertical-align:middle !important;
}

table:has(> tbody#Q) td input,
table:has(> tbody#S) td input,
table:has(> tbody#finaleBox) td input{
    width:45px !important;
    min-width:45px !important;
    max-width:45px !important;
    height:34px !important;
    margin:0 auto !important;
    padding:4px !important;
    box-sizing:border-box !important;
    text-align:center !important;
}

table:has(> tbody#Q) td.match-cell,
table:has(> tbody#S) td.match-cell,
table:has(> tbody#finaleBox) td.match-cell{
    width:120px !important;
    min-width:120px !important;
    max-width:120px !important;
}

'''
          s=s[:start]+css+s[end:]

          s=s.replace('<th colspan="4">\n\n                            QUARTI DI FINALE','<th colspan="6">\n\n                            QUARTI DI FINALE')
          s=s.replace('<th colspan="4">\n\n                            SEMIFINALI','<th colspan="6">\n\n                            SEMIFINALI')
          s=s.replace('<th colspan="4">\n\n                            FINALE','<th colspan="6">\n\n                            FINALE')

          a=s.index('function renderMatchCard(titolo, match, type, index, risultato){')
          b=s.index('function applicaModelloTorneo(){', a)
          fn='''function renderMatchCard(titolo, match, type, index, risultato){

    const res=String(risultato || "-").split("-");
    const risultato1=res[0] || "";
    const risultato2=res[1] || "";

    const campKey={Q:"qCamp",S:"sTopCamp",F:"fTopCamp"}[type];
    const timeKey={Q:"qTime",S:"sTopTime",F:"fTopTime"}[type];
    const camp=Array.isArray(state[campKey]) ? (state[campKey][index] || "") : "";
    const time=Array.isArray(state[timeKey]) ? (state[timeKey][index] || "") : "";
    const winner=getWinner(match,risultato);
    const stato=winner ? "Terminata" : "Da giocare";
    const partiOra=String(time || "").split(":");
    const ore=partiOra[0] || "";
    const minuti=partiOra[1] || "";

    const inputStyle=`width:45px !important;min-width:45px !important;max-width:45px !important;height:34px !important;padding:4px !important;margin:0 auto !important;box-sizing:border-box !important;text-align:center !important;`;

    return `
<tr>
    <td><input type="text" value="${String(camp).replace(/"/g,"&quot;")}" onchange="updateKOField('${type}',${index},'camp',this.value)" style="${inputStyle}"></td>
    <td><input type="text" value="${String(ore).replace(/"/g,"&quot;")}" onchange="updateKOField('${type}',${index},'time',this.value + ':' + this.parentElement.nextElementSibling.querySelector('input').value)" style="${inputStyle}"></td>
    <td><input type="text" value="${String(minuti).replace(/"/g,"&quot;")}" onchange="updateKOField('${type}',${index},'time',this.parentElement.previousElementSibling.querySelector('input').value + ':' + this.value)" style="${inputStyle}"></td>
    <td class="match-cell"><div class="team-line">${formatCoppiaDisplay(match[0])}</div><div class="vs-line"><b>VS</b></div><div class="team-line">${formatCoppiaDisplay(match[1])}</div><div style="font-size:12px;opacity:.7;margin-top:4px;">${stato}</div>${winner ? `<div class="winner-box">🏆 Passa: ${formatCoppiaDisplay(winner)}</div>` : ""}</td>
    <td><input type="text" value="${String(risultato1).replace(/"/g,"&quot;")}" onchange="updateKOResult('${type}',${index},this.value,0)" style="${inputStyle}"></td>
    <td><input type="text" value="${String(risultato2).replace(/"/g,"&quot;")}" onchange="updateKOResult('${type}',${index},this.value,1)" style="${inputStyle}"></td>
</tr>`;
}

'''
          s=s[:a]+fn+s[b:]
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Bove.html
          git diff --cached --quiet || git commit -m 'Fix KO final six-column layout'
          git push
