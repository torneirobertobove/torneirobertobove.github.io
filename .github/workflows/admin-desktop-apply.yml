name: Apply Admin Desktop Layout

on:
  push:
    paths:
      - '.github/workflows/admin-desktop-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject desktop layout into existing admin.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- ADMIN_DESKTOP_LAYOUT_V1 -->'
          if marker in s:
              print('Desktop layout already present; nothing to do.')
              raise SystemExit(0)

          script = r'''<!-- ADMIN_DESKTOP_LAYOUT_V1 -->
          <script>
          (function(){
            let applicato = false;
            function applicaDesktop(){
              if(applicato) return;
              const area = document.getElementById('areaAdmin');
              if(!area || area.classList.contains('hidden')) return;
              const direct = [...area.children];
              const title = direct.find(e => e.tagName === 'H1');
              const details = direct.filter(e => e.tagName === 'DETAILS');
              const gestione = document.getElementById('gestioneTorneoAdmin');
              if(!title || details.length < 4 || !gestione) return;
              applicato = true;

              const nuovo = details[0];
              const tornei = details[1];
              const news = details[2];
              const sponsor = details[3];
              nuovo.id='desktopNuovoTorneo';
              tornei.id='desktopTornei';
              news.id='desktopNews';
              sponsor.id='desktopSponsor';

              const style=document.createElement('style');
              style.id='adminDesktopFinalStyle';
              style.textContent=`
                html,body{background:#070b11!important;color:#eef3f8!important;overflow-x:hidden!important}
                body{padding:0!important;margin:0!important;min-height:100vh!important}
                .btn-indietro{display:none!important}
                .container{max-width:none!important;width:100%!important;margin:0!important;padding:0!important}
                #areaAdmin{width:100%!important;max-width:none!important;margin:0!important;padding:0!important;display:grid!important;grid-template-columns:240px minmax(0,1fr)!important;grid-template-rows:68px minmax(0,1fr)!important;min-height:100vh!important;background:#070b11!important}
                #areaAdmin>h1{display:none!important}
                #adminDesktopSidebar{grid-column:1;grid-row:1 / 3;background:#0d131c;border-right:1px solid #293646;padding:20px 14px;display:flex;flex-direction:column;gap:7px}
                #adminDesktopBrand{padding:3px 8px 20px;margin-bottom:10px;border-bottom:1px solid #293646;font-weight:800;letter-spacing:1px}
                #adminDesktopBrand small{display:block;color:#7f8b9a;font-size:10px;letter-spacing:0;margin-top:4px}
                .adminDesktopNavBtn{width:100%;margin:0;padding:12px;border:1px solid transparent;border-radius:9px;background:transparent;color:#cbd5e1;text-align:left;font-weight:700;cursor:pointer}
                .adminDesktopNavBtn:hover,.adminDesktopNavBtn.active{background:#1b2735;border-color:#344456;color:#fff}
                #adminDesktopTopbar{grid-column:2;grid-row:1;background:#0d131c;border-bottom:1px solid #293646;padding:0 22px;display:flex;align-items:center;justify-content:space-between}
                #adminDesktopTopbar strong{font-size:16px}
                #adminDesktopTopbar span{display:block;color:#7f8b9a;font-size:11px;margin-top:4px}
                #adminDesktopWorkspace{grid-column:2;grid-row:2;min-width:0;padding:22px;overflow:auto}
                #adminDesktopWorkspace>details,#adminDesktopWorkspace>#gestioneTorneoAdmin{max-width:1200px;margin:0 auto 14px;background:#111923;border:1px solid #293646;border-radius:12px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
                #adminDesktopWorkspace summary{color:#fff;font-weight:800;cursor:pointer}
                #adminDesktopWorkspace input,#adminDesktopWorkspace select,#adminDesktopWorkspace textarea{background:#0a1017;color:#fff;border:1px solid #303d4c;border-radius:8px}
                #adminDesktopWorkspace button{border-radius:8px}
                @media(max-width:850px){#areaAdmin{display:block!important}#adminDesktopSidebar{border-right:0;border-bottom:1px solid #293646;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}#adminDesktopTopbar{height:64px}#adminDesktopWorkspace{padding:12px}}
              `;
              document.head.appendChild(style);

              const sidebar=document.createElement('aside');
              sidebar.id='adminDesktopSidebar';
              sidebar.innerHTML='<div id="adminDesktopBrand">🎾 ADMIN<small>PADEL MANAGER</small></div>';
              const topbar=document.createElement('header');
              topbar.id='adminDesktopTopbar';
              topbar.innerHTML='<div><strong>Gestione amministrazione</strong><span>Configurazione e gestione tornei</span></div>';
              const workspace=document.createElement('main');
              workspace.id='adminDesktopWorkspace';

              function addNav(icon,label,target){
                const b=document.createElement('button');
                b.type='button'; b.className='adminDesktopNavBtn'; b.textContent=icon+' '+label;
                b.onclick=()=>{
                  document.querySelectorAll('.adminDesktopNavBtn').forEach(x=>x.classList.remove('active'));
                  b.classList.add('active');
                  const el=document.getElementById(target);
                  if(el){ if('open' in el) el.open=true; el.scrollIntoView({behavior:'smooth',block:'start'}); }
                };
                sidebar.appendChild(b); return b;
              }
              const b1=addNav('➕','Nuovo torneo','desktopNuovoTorneo');
              addNav('📋','Tornei creati','desktopTornei');
              addNav('👥','Gestione torneo','gestioneTorneoAdmin');
              addNav('📰','News','desktopNews');
              addNav('🏆','Sponsor','desktopSponsor');
              b1.classList.add('active');

              area.innerHTML='';
              area.appendChild(sidebar); area.appendChild(topbar); area.appendChild(workspace);
              workspace.appendChild(nuovo); workspace.appendChild(tornei); workspace.appendChild(gestione); workspace.appendChild(news); workspace.appendChild(sponsor);
              console.log('ADMIN DESKTOP LAYOUT APPLICATO — FUNZIONI ORIGINALI INVARIATE');
            }
            const observer=new MutationObserver(applicaDesktop);
            observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
            document.addEventListener('DOMContentLoaded',applicaDesktop);
            setTimeout(applicaDesktop,300); setTimeout(applicaDesktop,1000); setTimeout(applicaDesktop,2500);
          })();
          </script>
          '''
          s = s.replace('</body>', script + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit desktop layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Apply real desktop layout to admin" || exit 0
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/admin-desktop-apply.yml
          git commit -m "Remove one-time desktop layout workflow"
          git push
