name: Bove direct QSF repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-qsf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Bove.html without modifying it
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          p = Path('Bove.html')
          if not p.exists():
              raise SystemExit('Bove.html non trovato')

          text = p.read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)

          print(f'Script inline trovati: {len(scripts)}')

          for i, code in enumerate(scripts, 1):
              f = Path(tempfile.gettempdir()) / f'bove_qsf_validate_{i}.js'
              f.write_text(code, encoding='utf-8')
              r = subprocess.run(['node', '--check', str(f)], capture_output=True, text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'Errore JavaScript nello script {i}')

          print('BOVE.html: verifica sintattica completata senza modifiche')
