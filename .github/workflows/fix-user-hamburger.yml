name: Fix user hamburger

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fix user hamburger visibility
        shell: python
        run: |
          from pathlib import Path

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')

          old = '''body.user-mode #menuComandi {\n    visibility: hidden !important;\n}'''

          new = '''body.user-mode #menuComandi {\n    visibility: visible !important;\n}\n\nbody.user-mode #menuComandi.show {\n    visibility: visible !important;\n    opacity: 1 !important;\n    transform: translateY(0) !important;\n    display: flex !important;\n}'''

          if old not in text:
              raise SystemExit('Blocco CSS menu user non trovato')

          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')

      - name: Validate
        shell: bash
        run: |
          grep -q 'body.user-mode #menuComandi {' Bove.html
          grep -q 'body.user-mode #menuComandi.show {' Bove.html

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git rm .github/workflows/fix-user-hamburger.yml
          git commit -m 'Fix user hamburger menu opening'
          git push origin HEAD:main
