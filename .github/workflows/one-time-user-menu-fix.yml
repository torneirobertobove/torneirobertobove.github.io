name: One-time user menu fix

on:
  push:
    paths:
      - '.github/workflows/one-time-user-menu-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Bove.html
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')

          old = '''        bloccaGestionale();\n\n\n        const hamburger =\n            document.querySelector(".menu-button");'''
          new = '''        bloccaGestionale();\n\n        // Modalita utente: il menu amministrativo deve essere invisibile.\n        document.body.classList.add("user-mode");\n\n        const hamburger =\n            document.querySelector(".menu-button");'''

          if old not in s:
              raise SystemExit('verifyAccess patch point not found')
          s = s.replace(old, new, 1)

          marker = '''<style>\n/* BOVE MINUTES ADJACENT TO HOUR - REPAIR ONLY */'''
          css = '''<style>\n/* USER MODE - NASCONDE LE FUNZIONI AMMINISTRATIVE */\nbody.user-mode #menuComandi button,\nbody.user-mode #menuComandi a {\n    display: none !important;\n    visibility: hidden !important;\n}\n\nbody.user-mode #menuComandi {\n    visibility: hidden !important;\n}\n\nbody.user-mode .menu-button {\n    display: flex !important;\n    visibility: visible !important;\n    opacity: 1 !important;\n    pointer-events: auto !important;\n}\n\n/* BOVE MINUTES ADJACENT TO HOUR - REPAIR ONLY */'''

          if marker not in s:
              raise SystemExit('CSS marker not found')
          s = s.replace(marker, css, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Bove.html').read_text(encoding='utf-8')
          assert 'document.body.classList.add("user-mode")' in s
          assert 'body.user-mode #menuComandi button' in s
          assert s.count('async function verifyAccess') == 1
          print('Patch verificata')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git rm .github/workflows/one-time-user-menu-fix.yml
          git commit -m 'Fix user menu visibility'
          git push
