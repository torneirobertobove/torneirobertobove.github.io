name: Bove flow repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Bove flow
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')

          # 1) NEVER preserve an incomplete saved coppie array.
          #    When approved players are complete, rebuild 2 players -> 1 team.
          marker = re.compile(
              r'\s*/\*\s*=+\s*\n\s*IMPORTANTE\s*\n\s*=+\s*\n\s*SE IL TORNEO HA GIÀ LE COPPIE SALVATE.*?\n\s*/\*\s*=+\s*\n\s*SE NON ESISTONO COPPIE SALVATE,\s*\n\s*POSSIAMO CREARLE DALLE ISCRIZIONI\.\s*\n\s*=+\s*\n\s*\*/\s*\n',
              re.S
          )
          replacement = '''
                    /*
                    ==================================================
                    COPPIE: 2 GIOCATORI = 1 SQUADRA
                    ==================================================
                    */

                    const numeroSquadre =
                        Number(state.rules?.numeroSquadre) || 8;

                    const giocatoriAttesi =
                        numeroSquadre * 2;

                    const coppieSalvateValide =
                        Array.isArray(state.coppie) &&
                        state.coppie.length === numeroSquadre;

                    if(coppieSalvateValide){

                        console.log(
                            "=== COPPIE DEL TORNEO MANTENUTE ===",
                            state.coppie
                        );

                    }
                    else if(state.iscritti.length === giocatoriAttesi){

                        const coppieDaIscritti = [];

                        for(let i = 0; i < state.iscritti.length; i += 2){

                            const giocatore1 = state.iscritti[i];
                            const giocatore2 = state.iscritti[i + 1];

                            if(!giocatore1 || !giocatore2)
                                continue;

                            const nome1 =
                                (`${giocatore1.nome || ""} ${giocatore1.cognome || ""}`).trim()
                                || giocatore1.nome_giocatore
                                || "Giocatore 1";

                            const nome2 =
                                (`${giocatore2.nome || ""} ${giocatore2.cognome || ""}`).trim()
                                || giocatore2.nome_giocatore
                                || "Giocatore 2";

                            coppieDaIscritti.push([nome1, nome2]);
                        }

                        if(coppieDaIscritti.length === numeroSquadre){

                            state.coppie = coppieDaIscritti;

                            console.log(
                                "=== COPPIE RICOSTRUITE DA ISCRITTI ===",
                                state.coppie
                            );
                        }
                    }
                    else if(Array.isArray(state.coppie) && state.coppie.length > 0){

                        console.warn(
                            "COPPIE SALVATE INCOMPLETE: non vengono usate per popolare i gironi.",
                            {
                                coppieSalvate: state.coppie.length,
                                squadreRichieste: numeroSquadre,
                                iscritti: state.iscritti.length,
                                iscrittiAttesi: giocatoriAttesi
                            }
                        );
                    }

'''
          text2, n = marker.subn('\n' + replacement, text, count=1)
          if n != 1:
              raise SystemExit('Blocco formazione coppie non trovato')
          text = text2

          # 2) Populate groups only with a complete set of teams.
          text, n = re.subn(
              r'Array\.isArray\(state\.coppie\)\s*&&\s*state\.coppie\.length\s*>\s*0',
              'Array.isArray(state.coppie) && state.coppie.length === totaleNecessario',
              text,
              count=1
          )
          if n != 1:
              raise SystemExit('Condizione popolamento gironi non trovata')

          # 3) loadSavedTeams must support every supported group A-G.
          text = text.replace(
              '[\n        "A",\n        "B",\n        "C",\n        "D"\n\n    ].forEach((g,i)=>{',
              '[\n        "A",\n        "B",\n        "C",\n        "D",\n        "E",\n        "F",\n        "G"\n\n    ].forEach((g,i)=>{'
          )
          text = text.replace(
              '''\n    if(numeroGironi < 3)\n\n        state.C=[];\n\n\n    if(numeroGironi < 4)\n\n        state.D=[];\n''',
              ''
          )
          text = text.replace(
              '''[\n        "A",\n        "B",\n        "C",\n        "D"\n\n    ].forEach(g=>{''',
              '''[\n        "A",\n        "B",\n        "C",\n        "D",\n        "E",\n        "F",\n        "G"\n\n    ].forEach(g=>{'''
          )

          # 4) Add the globally visible phase-type helper only if absent.
          if 'function getFinalPhaseType()' not in text:
              helper = '''\nfunction getFinalPhaseType(){\n\n    ensureRules();\n\n    const n = Number(state.rules.numeroQualificateFinali) || 0;\n\n    if(n >= 8 && state.rules.usaQuarti === true)\n        return "quarti";\n\n    if(n >= 4 && state.rules.usaSemifinali === true)\n        return "semifinali";\n\n    if(n >= 2 && state.rules.usaFinale === true)\n        return "finale";\n\n    return null;\n}\n\n'''
              pos = text.find('function renderKO(){')
              if pos < 0:
                  raise SystemExit('renderKO non trovato per inserire getFinalPhaseType')
              text = text[:pos] + helper + text[pos:]

          # 5) Validate JavaScript blocks before committing.
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          if not scripts:
              raise SystemExit('Nessun blocco script')
          for i, script in enumerate(scripts, 1):
              f = Path(tempfile.gettempdir()) / f'bove_{i}.js'
              f.write_text(script, encoding='utf-8')
              r = subprocess.run(['node','--check',str(f)], capture_output=True, text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'Syntax error nello script {i}')

          p.write_text(text, encoding='utf-8')
          print('PATCH BOVE COMPLETATA')

      - name: Commit repaired Bove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- Bove.html; then
            echo 'Nessuna modifica a Bove.html'
            exit 0
          fi
          git add Bove.html
          git commit -m 'Fix complete team pairing and group population flow'
          git push
