name: Fix minutes layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put minutes immediately after hour
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')

          # The knockout tables already have dedicated time columns 2 (hour) and 3 (minutes).
          # The previous CSS hid column 3, making the minutes appear detached from the hour.
          # Restore column 3 and rebalance only these table columns so team names get the space.
          s2 = s
          s2 = re.sub(
              r'(table:has\(> tbody#Q\) th:nth-child\(3\), table:has\(> tbody#S\) th:nth-child\(3\), table:has\(> tbody#finaleBox\) th:nth-child\(3\),\s*\.koBox table th:nth-child\(3\), \.finalContainer table th:nth-child\(3\)) \{ width: 0px !important; display: none !important; \}',
              r'\1 { width: 45px !important; display: table-cell !important; }',
              s2
          )
          s2 = re.sub(
              r'(table:has\(> tbody#Q\) th:nth-child\(4\), table:has\(> tbody#Q\) td:nth-child\(4\),\s*table:has\(> tbody#S\) th:nth-child\(4\), table:has\(> tbody#S\) td:nth-child\(4\),\s*table:has\(> tbody#finaleBox\) th:nth-child\(4\), table:has\(> tbody#finaleBox\) td:nth-child\(4\),\s*\.koBox table th:nth-child\(4\), \.koBox table td:nth-child\(4\),\s*\.finalContainer table th:nth-child\(4\), \.finalContainer table td:nth-child\(4\)) \{\s*width: 125px !important;\s*\}',
              r'\1 { width: 150px !important; }',
              s2,
              flags=re.S
          )

          if s2 == s:
              raise SystemExit('Layout rules non trovate: nessuna modifica eseguita.')

          p.write_text(s2, encoding='utf-8')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/move-minutes-next-to-hour.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html .github/workflows/move-minutes-next-to-hour.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Move minutes next to hour in match tables'
          git push
