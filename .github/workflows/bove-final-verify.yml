name: Bove final verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair known JavaScript and team-flow regressions
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')

          patterns = [
              (r'Array\.from\(\s*\{\s*length\s*:\s*n\s*\}\s*,\s*\(\s*,\s*i\s*\)\s*=>\s*i\s*\)', 'Array.from({length:n}, (_,i)=>i)'),
              (r'Array\.from\(\s*\{\s*length\s*:\s*n\s*\}\s*,\s*\(\s*,\s*i\s*\)\s*=>\s*i\s*;', 'Array.from({length:n}, (_,i)=>i);')
          ]
          for pattern, replacement in patterns:
              s, n = re.subn(pattern, replacement, s, count=1)
              if n:
                  print('RIPRISTINO Array.from() applicato')

          bad_apply = re.compile(
              r'\n\s*/\*\s*=+\s*\n\s*CONTROLLO QUARTI\s*\n\s*=+\s*\*/\s*\n\s*/\*\s*\n\s*I QUARTI RICHIEDONO 8 QUALIFICATE\.[\s\S]*?\n\s*\}\s*\n', re.M)
          s2, n = bad_apply.subn('\n', s, count=1)
          if n:
              print('RIMOSSO AUTO-DISATTIVAZIONE usaQuarti da applyRules')
              s = s2

          bad_render = re.compile(
              r'\n\s*/\*\s*=+\s*\n\s*CONTROLLO QUARTI[\s\S]*?state\.rules\.usaQuarti = false;[\s\S]*?usaQuarti\.checked = false;\s*\n\s*\}\s*\n', re.M)
          s2, n = bad_render.subn('\n', s, count=1)
          if n:
              print('RIMOSSO RESET usaQuarti da renderKO')
              s = s2

          # Never fabricate one-player teams from the iscrizioni table.
          old = '''                    const coppieEsistenti =
                        Array.isArray(state.coppie)
                            ? state.coppie
                            : [];


                    if(
                        coppieEsistenti.length === 0 &&
                        state.iscritti.length > 0
                    ){

                        state.coppie =
                            state.iscritti.map(
                                item => {

                                    if(
                                        item.nome &&
                                        item.cognome
                                    ){

                                        return (
                                            item.nome +
                                            " " +
                                            item.cognome
                                        );

                                    }


                                    return (
                                        item.nome ||
                                        item.nome_giocatore ||
                                        item.coppia ||
                                        "Squadra"
                                    );

                                }
                            );

                    }
'''
          new = '''                    const coppieEsistenti =
                        Array.isArray(state.coppie)
                            ? state.coppie
                            : [];


                    if(
                        coppieEsistenti.length === 0 &&
                        state.iscritti.length > 0
                    ){

                        const coppieDaIscritti =
                            state.iscritti
                                .filter(item => {

                                    if(!item || typeof item !== "object")
                                        return false;

                                    return !!(
                                        (item.giocatore1 && item.giocatore2) ||
                                        (item.g1 && item.g2) ||
                                        (
                                            typeof item.coppia === "string" &&
                                            item.coppia.split("/").filter(Boolean).length === 2
                                        )
                                    );

                                })
                                .map(item =>
                                    item.giocatore1 && item.giocatore2
                                        ? item
                                        : item.g1 && item.g2
                                            ? item
                                            : item.coppia
                                );


                        if(coppieDaIscritti.length > 0){

                            state.coppie =
                                coppieDaIscritti;

                        }
                        else{

                            console.warn(
                                "ISCRITTI PRESENTI MA NESSUNA COPPIA VALIDA: non creo squadre fittizie."
                            );

                            state.coppie = [];

                        }

                    }
'''
          if old in s:
              s = s.replace(old, new, 1)
              print('CORRETTO FALLBACK ISCRITTI -> COPPIE')
          elif 'Nessuna coppia valida: non creo squadre fittizie' in s:
              print('FALLBACK COPPIE GIÀ CORRETTO')
          else:
              print('ATTENZIONE: fallback coppie non trovato')

          p.write_text(s, encoding='utf-8')

      - name: JavaScript syntax validation
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('Bove.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('Nessun blocco JavaScript trovato')
          for i, script in enumerate(scripts, 1):
              f = Path(tempfile.gettempdir()) / f'bove_{i}.js'
              f.write_text(script, encoding='utf-8')
              r = subprocess.run(['node', '--check', str(f)], text=True, capture_output=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'Sintassi JavaScript non valida: script {i}')
          print(f'SINTASSI OK: {len(scripts)} blocchi')

      - name: Critical structure and team-flow validation
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('Bove.html').read_text(encoding='utf-8')
          required = [
              'function loadState()', 'function initDefaults()', 'function ensureRules()',
              'function applyRules()', 'function applicaModelloTorneo()', 'function renderTables()',
              'function renderClass()', 'function renderKO()', 'function getFinalQualified()',
              'function getWinner(', 'function updateRes(', 'function updateCamp(',
              'function updateKOResult(', 'function updateTime(', 'function updateAndSync()',
              'function render()', 'id="Q"', 'id="S"', 'id="finaleBox"'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Funzioni/elementi mancanti: ' + ', '.join(missing))
          for ident in ('teamModal','adminMenuButton','adminMenu'):
              n = len(re.findall(r'id=["\']' + re.escape(ident) + r'["\']', s))
              if n != 1:
                  raise SystemExit(f'ID duplicato/assente: {ident} ({n})')

          if 'state.rules.usaQuarti === true' not in s:
              raise SystemExit('Logica usaQuarti assente')
          if 'qualificati.length >= 8' not in s:
              raise SystemExit('Controllo 8 qualificate assente')
          if 'state.qRes' not in s or 'state.sTopRes' not in s or 'state.fTopRes' not in s:
              raise SystemExit('Stato risultati KO incompleto')
          if re.search(r'CONTROLLO QUARTI[\s\S]{0,1200}state\.rules\.usaQuarti\s*=\s*false', s):
              raise SystemExit('usaQuarti viene ancora azzerato automaticamente')
          if '"ISCRITTI PRESENTI MA NESSUNA COPPIA VALIDA: non creo squadre fittizie."' not in s:
              raise SystemExit('Protezione coppie/iscritti assente')
          print('STRUTTURA + QUARTI + INTEGRITÀ COPPIE OK')

      - name: Commit repaired Bove
        shell: bash
        run: |
          if git diff --quiet -- Bove.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git commit -m 'Repair Bove team integrity and validate flow'
          git push
