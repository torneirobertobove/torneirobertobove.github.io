name: One-time KO render fix
on:
  push:
    paths:
      - '.github/workflows/one-time-ko-render-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact KO row layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('Bove.html')
          s = p.read_text()

          start = s.find('/* ========================================================\n   LAYOUT FASE FINALE KO')
          if start == -1:
              raise SystemExit('KO layout CSS marker not found')
          end = s.find('/* Frecce Qualificazione */', start)
          if end == -1:
              raise SystemExit('KO CSS end marker not found')

          css = r'''/* ========================================================
   LAYOUT FASE FINALE KO — STESSA STRUTTURA DEI GIRONI
   Campo | Ore | Minuti | Match | Ris.1 | Ris.2
   ======================================================== */

.finalContainer .card{
    overflow-x:hidden !important;
    scrollbar-width:none !important;
}
.finalContainer .card::-webkit-scrollbar{display:none !important;}

table:has(> tbody#Q),
table:has(> tbody#S),
table:has(> tbody#finaleBox){
    table-layout:fixed !important;
    width:445px !important;
    min-width:445px !important;
    max-width:445px !important;
    border-collapse:collapse !important;
    border-spacing:0 !important;
    margin:10px auto !important;
}

table:has(> tbody#Q) th:nth-child(1), table:has(> tbody#Q) td:nth-child(1),
table:has(> tbody#S) th:nth-child(1), table:has(> tbody#S) td:nth-child(1),
table:has(> tbody#finaleBox) th:nth-child(1), table:has(> tbody#finaleBox) td:nth-child(1),
.koBox table th:nth-child(1), .koBox table td:nth-child(1),
.finalContainer table th:nth-child(1), .finalContainer table td:nth-child(1){width:45px !important;min-width:45px !important;max-width:45px !important;}

table:has(> tbody#Q) th:nth-child(2), table:has(> tbody#Q) td:nth-child(2),
table:has(> tbody#S) th:nth-child(2), table:has(> tbody#S) td:nth-child(2),
table:has(> tbody#finaleBox) th:nth-child(2), table:has(> tbody#finaleBox) td:nth-child(2),
.koBox table th:nth-child(2), .koBox table td:nth-child(2),
.finalContainer table th:nth-child(2), .finalContainer table td:nth-child(2){width:45px !important;min-width:45px !important;max-width:45px !important;}

table:has(> tbody#Q) th:nth-child(3), table:has(> tbody#Q) td:nth-child(3),
table:has(> tbody#S) th:nth-child(3), table:has(> tbody#S) td:nth-child(3),
table:has(> tbody#finaleBox) th:nth-child(3), table:has(> tbody#finaleBox) td:nth-child(3),
.koBox table th:nth-child(3), .koBox table td:nth-child(3),
.finalContainer table th:nth-child(3), .finalContainer table td:nth-child(3){width:45px !important;min-width:45px !important;max-width:45px !important;}

table:has(> tbody#Q) th:nth-child(4), table:has(> tbody#Q) td:nth-child(4),
table:has(> tbody#S) th:nth-child(4), table:has(> tbody#S) td:nth-child(4),
table:has(> tbody#finaleBox) th:nth-child(4), table:has(> tbody#finaleBox) td:nth-child(4),
.koBox table th:nth-child(4), .koBox table td:nth-child(4),
.finalContainer table th:nth-child(4), .finalContainer table td:nth-child(4){width:220px !important;min-width:220px !important;max-width:220px !important;}

table:has(> tbody#Q) th:nth-child(5), table:has(> tbody#Q) td:nth-child(5),
table:has(> tbody#S) th:nth-child(5), table:has(> tbody#S) td:nth-child(5),
table:has(> tbody#finaleBox) th:nth-child(5), table:has(> tbody#finaleBox) td:nth-child(5),
.koBox table th:nth-child(5), .koBox table td:nth-child(5),
.finalContainer table th:nth-child(5), .finalContainer table td:nth-child(5){width:45px !important;min-width:45px !important;max-width:45px !important;}

table:has(> tbody#Q) th:nth-child(6), table:has(> tbody#Q) td:nth-child(6),
table:has(> tbody#S) th:nth-child(6), table:has(> tbody#S) td:nth-child(6),
table:has(> tbody#finaleBox) th:nth-child(6), table:has(> tbody#finaleBox) td:nth-child(6),
.koBox table th:nth-child(6), .koBox table td:nth-child(6),
.finalContainer table th:nth-child(6), .finalContainer table td:nth-child(6){width:45px !important;min-width:45px !important;max-width:45px !important;}

table:has(> tbody#Q) th, table:has(> tbody#Q) td,
table:has(> tbody#S) th, table:has(> tbody#S) td,
table:has(> tbody#finaleBox) th, table:has(> tbody#finaleBox) td,
.koBox table th, .koBox table td,
.finalContainer table th, .finalContainer table td{
    box-sizing:border-box !important;
    padding:8px 3px !important;
    text-align:center !important;
    vertical-align:middle !important;
}

table:has(> tbody#Q) td input,
table:has(> tbody#S) td input,
table:has(> tbody#finaleBox) td input,
.koBox table td input,
.finalContainer table td input{
    width:39px !important;
    min-width:39px !important;
    max-width:39px !important;
    height:30px !important;
    margin:0 auto !important;
    padding:3px !important;
    box-sizing:border-box !important;
    text-align:center !important;
}

table:has(> tbody#Q) td.match-cell,
table:has(> tbody#S) td.match-cell,
table:has(> tbody#finaleBox) td.match-cell,
.koBox table td.match-cell,
.finalContainer table td.match-cell{
    width:220px !important;
    min-width:220px !important;
    max-width:220px !important;
}

table:has(> tbody#Q) td.match-cell .team-line,
table:has(> tbody#S) td.match-cell .team-line,
table:has(> tbody#finaleBox) td.match-cell .team-line,
.koBox table td.match-cell .team-line,
.finalContainer table td.match-cell .team-line{
    display:block !important;
    width:100% !important;
    line-height:1.3 !important;
    white-space:normal !important;
    margin:2px 0 !important;
    font-weight:500 !important;
}

table:has(> tbody#Q) td.match-cell .vs-line,
table:has(> tbody#S) td.match-cell .vs-line,
table:has(> tbody#finaleBox) td.match-cell .vs-line,
.koBox table td.match-cell .vs-line,
.finalContainer table td.match-cell .vs-line{
    display:block !important;
    margin:4px 0 !important;
}

/* IMPORTANTE: nessuna vecchia regola nasconde la 3a o 6a colonna. */
table:has(> tbody#Q) th:nth-child(3),
table:has(> tbody#Q) td:nth-child(3),
table:has(> tbody#Q) th:nth-child(6),
table:has(> tbody#Q) td:nth-child(6),
table:has(> tbody#S) th:nth-child(3),
table:has(> tbody#S) td:nth-child(3),
table:has(> tbody#S) th:nth-child(6),
table:has(> tbody#S) td:nth-child(6),
table:has(> tbody#finaleBox) th:nth-child(3),
table:has(> tbody#finaleBox) td:nth-child(3),
table:has(> tbody#finaleBox) th:nth-child(6),
table:has(> tbody#finaleBox) td:nth-child(6){display:table-cell !important;}

'''
          s = s[:start] + css + s[end:]

          # Fix all three KO headers.
          s = re.sub(r'<th colspan="\d+">\s*QUARTI DI FINALE', '<th colspan="6">\n                            QUARTI DI FINALE', s)
          s = re.sub(r'<th colspan="\d+">\s*SEMIFINALI', '<th colspan="6">\n                            SEMIFINALI', s)
          s = re.sub(r'<th colspan="\d+">\s*FINALE', '<th colspan="6">\n                            FINALE', s)

          header_old = '''<th>Campo</th>

                        <th>Ora</th>

                        <th>Match</th>

                        <th>Ris</th>'''
          header_new = '''<th>Campo</th>

                        <th>Ore</th>

                        <th>Minuti</th>

                        <th>Match</th>

                        <th>Ris.1</th>

                        <th>Ris.2</th>'''
          s = s.replace(header_old, header_new)

          # Guarantee six real columns by adding colgroup to every KO table.
          for body in ('Q','S','finaleBox'):
              marker = f'<tbody id="{body}"'
              pos = s.find(marker)
              if pos == -1:
                  continue
              tstart = s.rfind('<table', 0, pos)
              table_end = s.find('>', tstart) + 1
              head_end = s.find('</thead>', tstart)
              if head_end == -1:
                  continue
              existing = s[tstart:head_end]
              colgroup = '<colgroup><col><col><col><col><col><col></colgroup>'
              if '<colgroup>' in existing:
                  existing = re.sub(r'<colgroup>.*?</colgroup>', colgroup, existing, flags=re.S)
                  s = s[:tstart] + existing + s[head_end:]
              else:
                  s = s[:table_end] + '\n                ' + colgroup + s[table_end:]

          # Exact six-cell KO row renderer.
          a = s.find('function renderMatchCard')
          if a == -1:
              raise SystemExit('renderMatchCard not found')
          b = s.find('function applicaModelloTorneo', a)
          if b == -1:
              raise SystemExit('renderMatchCard end marker not found')

          fn = r'''function renderMatchCard(titolo, match, type, index, risultato){
    const res=String(risultato || "-").split("-");
    const risultato1=res[0] === "-" ? "" : (res[0] || "");
    const risultato2=res[1] || "";
    const campKey={Q:"qCamp",S:"sTopCamp",F:"fTopCamp"}[type];
    const timeKey={Q:"qTime",S:"sTopTime",F:"fTopTime"}[type];
    const camp=Array.isArray(state[campKey]) ? (state[campKey][index] || "") : "";
    const time=Array.isArray(state[timeKey]) ? (state[timeKey][index] || "") : "";
    const winner=getWinner(match,risultato);
    const stato=winner ? "Terminata" : "Da giocare";
    const partiOra=String(time || "").split(":");
    const ore=partiOra[0] || "";
    const minuti=partiOra[1] || "";
    const safe=v=>String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

    return `
<tr>
<td><input value="${safe(camp)}" oninput="updateKOField('${type}',${index},'camp',this.value)" style="width:39px;height:30px"></td>
<td><input value="${safe(ore)}" oninput="updateKOField('${type}',${index},'time',this.value + ':' + this.parentElement.nextElementSibling.querySelector('input').value)" style="width:39px;height:30px"></td>
<td><input value="${safe(minuti)}" oninput="updateKOField('${type}',${index},'time',this.parentElement.previousElementSibling.querySelector('input').value + ':' + this.value)" style="width:39px;height:30px"></td>
<td class="match-cell"><div class="team-line">${formatCoppiaDisplay(match[0])}</div><div class="vs-line"><b>VS</b></div><div class="team-line">${formatCoppiaDisplay(match[1])}</div><div style="font-size:12px;opacity:.7;margin-top:4px;">${stato}</div>${winner ? `<div class="winner-box">🏆 Passa: ${formatCoppiaDisplay(winner)}</div>` : ""}</td>
<td><input value="${safe(risultato1)}" oninput="updateKOResult('${type}',${index},this.value,0)" style="width:39px;height:30px"></td>
<td><input value="${safe(risultato2)}" oninput="updateKOResult('${type}',${index},this.value,1)" style="width:39px;height:30px"></td>
</tr>`;
}

'''
          s = s[:a] + fn + s[b:]
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Bove.html
          git diff --cached --quiet || git commit -m 'Fix KO six-column layout to match Gironi'
          git push
