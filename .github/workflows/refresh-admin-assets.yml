name: Refresh admin asset versions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump admin script cache versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('admin-function-fixes-v1.js?v=12', 'admin-function-fixes-v1.js?v=18')
          s2 = s2.replace('admin-desktop-v3.js?v=4', 'admin-desktop-v3.js?v=10')
          if s2 == s:
              print('No admin asset version changes needed')
          else:
              p.write_text(s2, encoding='utf-8')
              print('Admin asset versions refreshed')
          PY
      - name: Commit refreshed admin HTML
        run: |
          if git diff --quiet -- admin.html; then
            echo 'Nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Bump admin script cache versions'
          git push origin main
