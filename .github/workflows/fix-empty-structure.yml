name: Fix empty Bove tournament structure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix LAST renderKO definition
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')

          fixed = r'''function renderKO(){
    ensureRules();

    const q=document.getElementById("Q");
    const s=document.getElementById("S");
    const f=document.getElementById("finaleBox") || document.getElementById("F");
    if(!q || !s || !f) return;

    const qTable=q.closest("table");
    const sTable=s.closest("table");
    const fTable=f.closest("table");

    q.innerHTML="";
    s.innerHTML="";
    f.innerHTML="";
    document.querySelectorAll(".winner-box.top-win").forEach(el=>el.remove());

    if(!Array.isArray(state.qRes)) state.qRes=Array(4).fill("-");
    while(state.qRes.length<4) state.qRes.push("-");
    state.qRes=state.qRes.slice(0,4);

    if(!Array.isArray(state.sTopRes)) state.sTopRes=Array(2).fill("-");
    while(state.sTopRes.length<2) state.sTopRes.push("-");
    state.sTopRes=state.sTopRes.slice(0,2);

    if(!Array.isArray(state.qCamp)) state.qCamp=[];
    if(!Array.isArray(state.qTime)) state.qTime=[];
    if(!Array.isArray(state.sCamp)) state.sCamp=[];
    if(!Array.isArray(state.sTime)) state.sTime=[];
    if(!Array.isArray(state.fCamp)) state.fCamp=[];
    if(!Array.isArray(state.fTime)) state.fTime=[];
    if(typeof state.fTopRes!=="string" || !state.fTopRes.trim()) state.fTopRes="-";

    let qualificati=[];
    try{
        const risultato=getFinalQualified();
        if(Array.isArray(risultato)) qualificati=risultato;
    }catch(e){
        console.error("Errore qualificati fase finale:",e);
    }

    const attesi=Math.max(
        0,
        Number(state.rules.numeroQualificateFinali) ||
        ((Number(state.rules.numeroGironi)||0) * (Number(state.rules.qualificatePerGirone)||0))
    );

    const slot = Array.from(
        {length:attesi},
        (_,i)=>qualificati[i] || ""
    );

    const usaQuarti = state.rules.usaQuarti === true && attesi >= 8;
    const usaSemifinali = state.rules.usaSemifinali === true;
    const usaFinale = state.rules.usaFinale === true;

    let semifinali=[];

    if(usaQuarti){
        const quarti=[
            [slot[0]||"",slot[7]||""],
            [slot[3]||"",slot[4]||""],
            [slot[1]||"",slot[6]||""],
            [slot[2]||"",slot[5]||""]
        ];

        quarti.forEach((match,index)=>{
            q.innerHTML += creaMatchKO(
                "QUARTO " + (index+1),
                match,
                "q",
                index,
                state.qRes[index]
            );
        });

        if(qTable) qTable.style.display="table";

        const vincitori=[];
        quarti.forEach((match,index)=>{
            const vincitore=getWinner(match,state.qRes[index]);
            if(vincitore) vincitori.push(vincitore);
        });

        semifinali = vincitori.length===4
            ? [[vincitori[0],vincitori[1]],[vincitori[2],vincitori[3]]]
            : [["",""] , ["",""]];
    }
    else if(attesi>=4){
        semifinali=[
            [slot[0]||"",slot[3]||""],
            [slot[2]||"",slot[1]||""]
        ];
    }
    else if(attesi>=2){
        semifinali=[[slot[0]||"",slot[1]||""]];
    }

    let finalisti=[];

    if(usaSemifinali){
        if(attesi>=4 && semifinali.length<2) semifinali.push(["",""]);

        semifinali.slice(0,2).forEach((match,index)=>{
            s.innerHTML += creaMatchKO(
                "SEMIFINALE " + (index+1),
                match,
                "s",
                index,
                state.sTopRes[index]
            );

            const vincitore=getWinner(match,state.sTopRes[index]);
            if(vincitore) finalisti.push(vincitore);
        });

        if(sTable) sTable.style.display="table";
    }
    else if(attesi>=2){
        finalisti=[slot[0]||"",slot[1]||""];
    }

    state.finalTop=[finalisti[0]||"",finalisti[1]||""];

    if(usaFinale){
        f.innerHTML=creaMatchKO(
            "FINALE",
            state.finalTop,
            "f",
            0,
            state.fTopRes
        );

        if(fTable) fTable.style.display="table";

        const campione=getWinner(state.finalTop,state.fTopRes);
        state.campioneTop=campione || null;

        if(campione && fTable){
            fTable.insertAdjacentHTML(
                "afterend",
                `<div class="winner-box top-win">🏆 CAMPIONE TORNEO:<br>${campione}</div>`
            );
        }
    }
    else{
        if(fTable) fTable.style.display="none";
        state.campioneTop=null;
    }

    console.log("=== STRUTTURA KO ===",{
        attesi,
        qualificati:qualificati.length,
        usaQuarti,
        usaSemifinali,
        usaFinale,
        righeQ:q.querySelectorAll("tr").length,
        righeS:s.querySelectorAll("tr").length,
        righeF:f.querySelectorAll("tr").length
    });
}
'''

          matches=list(re.finditer(r'function renderKO\(\)\s*\{.*?\n\}\s*\n\s*function updateKOResult\(',text,re.S))
          if not matches:
              raise SystemExit('Nessuna renderKO trovata')

          m=matches[-1]
          replacement=fixed+'\nfunction updateKOResult('
          text=text[:m.start()]+replacement+text[m.end():]
          p.write_text(text,encoding='utf-8')
          print('renderKO definitions found:',len(matches))
          print('LAST renderKO replaced successfully')

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check <(python - <<'PY'
          import re
          from pathlib import Path
          t=Path('Bove.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S|re.I)
          # Check the large application script containing renderKO.
          target=max(scripts,key=len)
          print(target)
          PY
          )

      - name: Commit repaired Bove
        shell: bash
        run: |
          if git diff --quiet -- Bove.html; then
            echo 'Nessuna modifica necessaria'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git commit -m 'Fix active empty knockout skeleton'
          git push
