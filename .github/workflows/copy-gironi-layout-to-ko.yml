name: Copy Gironi layout to KO
on: push
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy Gironi layout exactly to KO
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Bove.html')
          s=p.read_text()
          start=s.index('/* ========================================================\n   LAYOUT FASE FINALE KO')
          end=s.index('/* ============================\n\n   NUOVE CELLE PARTITE KO', start)
          css='''/* ========================================================
   LAYOUT FASE FINALE KO — COPIA FEDELE DEI GIRONI
   Campo | Ore | Minuti | Match | Ris.1 | Ris.2
   ======================================================== */
.finalContainer .card{overflow-x:hidden !important;scrollbar-width:none !important;}
.finalContainer .card::-webkit-scrollbar{display:none !important;}
table:has(> tbody#Q),table:has(> tbody#S),table:has(> tbody#finaleBox){table-layout:fixed !important;width:100% !important;max-width:445px !important;min-width:0 !important;border-collapse:collapse !important;border-spacing:0 !important;}
table:has(> tbody#Q) col:nth-child(1),table:has(> tbody#S) col:nth-child(1),table:has(> tbody#finaleBox) col:nth-child(1){width:10.1124% !important;}
table:has(> tbody#Q) col:nth-child(2),table:has(> tbody#S) col:nth-child(2),table:has(> tbody#finaleBox) col:nth-child(2){width:10.1124% !important;}
table:has(> tbody#Q) col:nth-child(3),table:has(> tbody#S) col:nth-child(3),table:has(> tbody#finaleBox) col:nth-child(3){width:10.1124% !important;}
table:has(> tbody#Q) col:nth-child(4),table:has(> tbody#S) col:nth-child(4),table:has(> tbody#finaleBox) col:nth-child(4){width:49.4382% !important;}
table:has(> tbody#Q) col:nth-child(5),table:has(> tbody#S) col:nth-child(5),table:has(> tbody#finaleBox) col:nth-child(5){width:10.1124% !important;}
table:has(> tbody#Q) col:nth-child(6),table:has(> tbody#S) col:nth-child(6),table:has(> tbody#finaleBox) col:nth-child(6){width:10.1124% !important;}
table:has(> tbody#Q) th,table:has(> tbody#Q) td,table:has(> tbody#S) th,table:has(> tbody#S) td,table:has(> tbody#finaleBox) th,table:has(> tbody#finaleBox) td{box-sizing:border-box !important;padding:8px 4px !important;text-align:center !important;vertical-align:middle !important;}
table:has(> tbody#Q) td input,table:has(> tbody#S) td input,table:has(> tbody#finaleBox) td input{width:45px !important;min-width:45px !important;max-width:45px !important;height:34px !important;margin:0 auto !important;padding:4px !important;box-sizing:border-box !important;text-align:center !important;}
table:has(> tbody#Q) td.match-cell,table:has(> tbody#S) td.match-cell,table:has(> tbody#finaleBox) td.match-cell{min-width:0 !important;max-width:none !important;width:auto !important;}
'''
          s=s[:start]+css+s[end:]
          s=s.replace('<th colspan="4">\n\n                            QUARTI DI FINALE','<th colspan="6">\n\n                            QUARTI DI FINALE')
          s=s.replace('<th colspan="4">\n\n                            SEMIFINALI','<th colspan="6">\n\n                            SEMIFINALI')
          s=s.replace('<th colspan="4">\n\n                            FINALE','<th colspan="6">\n\n                            FINALE')
          s=re.sub(r'<th>Campo</th>\s*<th>Ora</th>\s*<th>Match</th>\s*<th>Ris</th>','<th>Campo</th><th>Ore</th><th>Minuti</th><th>Match</th><th>Ris.1</th><th>Ris.2</th>',s)
          for body in ('Q','S','finaleBox'):
              pos=s.index(f'<tbody id="{body}"')
              tstart=s.rfind('<table',0,pos)
              ttag_end=s.index('>',tstart)+1
              head_end=s.index('</thead>',tstart)+len('</thead>')
              head=s[tstart:head_end]
              if '<colgroup>' in head:
                  head=re.sub(r'<colgroup>.*?</colgroup>','<colgroup><col><col><col><col><col><col></colgroup>',head,flags=re.S)
                  s=s[:tstart]+head+s[head_end:]
              else:
                  s=s[:ttag_end]+'<colgroup><col><col><col><col><col><col></colgroup>'+s[ttag_end:]
          a=s.index('function renderMatchCard')
          b=s.index('function applicaModelloTorneo',a)
          fn='''function renderMatchCard(titolo, match, type, index, risultato){
    const res=String(risultato || "-").split("-");
    const risultato1=res[0] || "";
    const risultato2=res[1] || "";
    const campKey={Q:"qCamp",S:"sTopCamp",F:"fTopCamp"}[type];
    const timeKey={Q:"qTime",S:"sTopTime",F:"fTopTime"}[type];
    const camp=Array.isArray(state[campKey]) ? (state[campKey][index] || "") : "";
    const time=Array.isArray(state[timeKey]) ? (state[timeKey][index] || "") : "";
    const winner=getWinner(match,risultato);
    const stato=winner ? "Terminata" : "Da giocare";
    const partiOra=String(time || "").split(":");
    const ore=partiOra[0] || "";
    const minuti=partiOra[1] || "";
    const safe=v=>String(v ?? "").replace(/"/g,"&quot;");
    const inputStyle="width:45px !important;min-width:45px !important;max-width:45px !important;height:34px !important;padding:4px !important;margin:0 auto !important;box-sizing:border-box !important;text-align:center !important;";
    return `
<tr>
    <td><input type="text" value="${safe(camp)}" onchange="updateKOField('${type}',${index},'camp',this.value)" style="${inputStyle}"></td>
    <td><input type="text" value="${safe(ore)}" onchange="updateKOField('${type}',${index},'time',this.value + ':' + this.parentElement.nextElementSibling.querySelector('input').value)" style="${inputStyle}"></td>
    <td><input type="text" value="${safe(minuti)}" onchange="updateKOField('${type}',${index},'time',this.parentElement.previousElementSibling.querySelector('input').value + ':' + this.value)" style="${inputStyle}"></td>
    <td class="match-cell"><div class="team-line">${formatCoppiaDisplay(match[0])}</div><div class="vs-line"><b>VS</b></div><div class="team-line">${formatCoppiaDisplay(match[1])}</div><div style="font-size:12px;opacity:.7;margin-top:4px;">${stato}</div>${winner ? `<div class="winner-box">🏆 Passa: ${formatCoppiaDisplay(winner)}</div>` : ""}</td>
    <td><input type="text" value="${safe(risultato1)}" onchange="updateKOResult('${type}',${index},this.value,0)" style="${inputStyle}"></td>
    <td><input type="text" value="${safe(risultato2)}" onchange="updateKOResult('${type}',${index},this.value,1)" style="${inputStyle}"></td>
</tr>`;
}

'''
          s=s[:a]+fn+s[b:]
          p.write_text(s)
          PY
      - name: Commit KO fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Bove.html
          git diff --cached --quiet || git commit -m 'Make KO renderer identical to Gironi layout'
          git push
