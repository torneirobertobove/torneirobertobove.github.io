name: One-time Bove repair

on:
  push:
    paths:
      - '.github/workflows/one-time-bove-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair Bove loadState
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')
          original = s

          old = '''                    state.iscritti =
                        Array.isArray(iscritti)
                        ? iscritti
                        : [];


                    console.log(
                        "ISCRITTI APPROVATI CARICATI:",
                        state.iscritti
                    );'''

          new = '''                    state.iscritti =
                        Array.isArray(iscritti)
                        ? iscritti
                        : [];


                    if(
                        state.iscritti.length > 0 &&
                        (!Array.isArray(state.partecipanti) ||
                         state.partecipanti.length === 0)
                    ){

                        state.partecipanti =
                            state.iscritti.slice();

                    }


                    console.log(
                        "ISCRITTI APPROVATI CARICATI:",
                        state.iscritti
                    );'''

          if old not in s:
              raise SystemExit('Target sincronizzazione iscritti non trovato')
          s = s.replace(old, new, 1)

          marker = '''                console.log(
                    "GIRONI GENERATI:",
                    state.A,
                    state.B,
                    state.C,
                    state.D
                );'''

          insertion = marker + '''


                if(
                    typeof generaPartiteGironi === "function"
                ){

                    generaPartiteGironi();

                }'''

          if marker not in s:
              raise SystemExit('Target generazione gironi non trovato')
          s = s.replace(marker, insertion, 1)

          p.write_text(s, encoding='utf-8')
          print('Bove.html corretto:', s != original)

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('Bove.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/bove-js.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          print('Script blocks:', len(scripts))
          PY
          node --check /tmp/bove-js.js

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'Bove Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git rm .github/workflows/one-time-bove-repair.yml
          git commit -m 'Repair Bove approved registrations and tournament generation'
          git push
