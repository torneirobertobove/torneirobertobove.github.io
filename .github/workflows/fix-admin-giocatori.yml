name: Fix admin giocatori ammessi

on:
  push:
    paths:
      - '.github/workflows/fix-admin-giocatori.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correggi selettore giocatori ammessi
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          old = '<select id="adminPosti" onchange="aggiornaGiocatoriAdmin">'
          new = '<select id="adminPosti" onchange="aggiornaGiocatoriAdmin()">'
          if old not in s:
              raise SystemExit('Selettore adminPosti non trovato')
          s = s.replace(old, new, 1)

          marker = '<input id="adminGiocatori" type="number" readonly>'
          insertion = marker + '''\n\n<script>\ndocument.addEventListener("DOMContentLoaded", function(){\n    if(typeof aggiornaGiocatoriAdmin === "function"){\n        aggiornaGiocatoriAdmin();\n    }\n});\n</script>'''
          if marker not in s:
              raise SystemExit('Campo adminGiocatori non trovato')
          s = s.replace(marker, insertion, 1)
          p.write_text(s, encoding='utf-8')

      - name: Verifica modifica
        shell: bash
        run: |
          grep -F 'onchange="aggiornaGiocatoriAdmin()"' admin.html
          grep -F 'aggiornaGiocatoriAdmin();' admin.html

      - name: Salva modifica e rimuovi workflow
        shell: bash
        run: |
          git config user.name 'Bove Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git rm .github/workflows/fix-admin-giocatori.yml
          git commit -m 'Fix visualizzazione giocatori ammessi in admin'
          git push
