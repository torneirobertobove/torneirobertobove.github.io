name: Fix Bove access script

on:
  push:
    paths:
      - ".github/workflows/fix-bove-access-trigger.txt"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Bove.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')
          marker = '\n   </script>\n\n\n<style>\n/* BOVE MINUTES ADJACENT TO HOUR - REPAIR ONLY */'
          insertion = '\n    verifyAccess();\n\n});\n   </script>\n\n\n<style>\n/* BOVE MINUTES ADJACENT TO HOUR - REPAIR ONLY */'
          if '    verifyAccess();\n\n});\n   </script>' not in s:
              if marker not in s:
                  raise SystemExit('Marker not found; refusing to modify Bove.html')
              s = s.replace(marker, insertion, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-bove-access-trigger.txt
          rm -f .github/workflows/fix-bove-access.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html .github/workflows/fix-bove-access.yml .github/workflows/fix-bove-access-trigger.txt
          git diff --cached --quiet && exit 0
          git commit -m "Fix Bove access script closure"
          git push
