name: Final Bove repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Bove
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Bove.html')
          text = p.read_text(encoding='utf-8')

          # 1) Restore the missing global tournament-model handler.
          applica = r'''function applicaModelloTorneo(){

    ensureRules();

    const select = document.getElementById("tipoTorneo");
    if(!select || !select.value) return;

    const tipo = select.value;
    state.rules.tipoTorneo = tipo;
    state.rules.formatoTorneo = tipo;

    state.rules.formulaGironi = "";
    state.rules.formulaFinale = "";
    state.rules.usaQuarti = false;
    state.rules.usaSemifinali = false;
    state.rules.usaFinale = false;

    switch(tipo){
        case "italiana":
        case "gironiFinale":
            state.rules.formulaGironi = "tuttiControTutti";
            state.rules.formulaFinale = "eliminazioneDiretta";
            state.rules.qualificatePerGirone = 2;
            state.rules.numeroQualificateFinali =
                (Number(state.rules.numeroGironi) || 0) * 2;
            if(state.rules.numeroQualificateFinali >= 8){
                state.rules.usaQuarti = true;
                state.rules.usaSemifinali = true;
                state.rules.usaFinale = true;
            }else if(state.rules.numeroQualificateFinali >= 4){
                state.rules.usaSemifinali = true;
                state.rules.usaFinale = true;
            }else if(state.rules.numeroQualificateFinali >= 2){
                state.rules.usaFinale = true;
            }
            break;
        case "eliminazione":
            state.rules.formulaFinale = "eliminazioneDiretta";
            state.rules.numeroQualificateFinali = Number(state.rules.numeroSquadre) || 0;
            if(state.rules.numeroQualificateFinali >= 8){
                state.rules.usaQuarti = true;
                state.rules.usaSemifinali = true;
                state.rules.usaFinale = true;
            }else if(state.rules.numeroQualificateFinali >= 4){
                state.rules.usaSemifinali = true;
                state.rules.usaFinale = true;
            }else if(state.rules.numeroQualificateFinali >= 2){
                state.rules.usaFinale = true;
            }
            break;
        case "svizzero":
            state.rules.formulaGironi = "svizzero";
            state.rules.formulaFinale = "classifica";
            state.rules.numeroQualificateFinali = 4;
            state.rules.usaSemifinali = true;
            state.rules.usaFinale = true;
            break;
        case "short":
            state.rules.formulaGironi = "shortFormat";
            state.rules.formulaFinale = "eliminazioneDiretta";
            state.rules.numeroQualificateFinali = 4;
            state.rules.usaQuarti = true;
            state.rules.usaSemifinali = true;
            state.rules.usaFinale = true;
            break;
        case "americano":
        case "mexicano":
        case "king":
            state.rules.formulaGironi = tipo === "king" ? "kingOfTheCourt" : tipo;
            state.rules.formulaFinale = "classifica";
            state.rules.numeroQualificateFinali = 1;
            break;
        case "manuale":
        case "personalizzato":
            state.rules.numeroQualificateFinali = 0;
            break;
    }

    state.mostraQuarti = state.rules.usaQuarti === true;
    state.rules.mostraQuarti = state.mostraQuarti;
    state.qRes = Array(4).fill("-");
    state.sTopRes = Array(2).fill("-");
    state.fTopRes = "-";
    state.finalTop = [];
    state.campioneTop = null;

    ["usaQuarti","usaSemifinali","usaFinale","ripescaggio"].forEach(id=>{
        const el = document.getElementById(id);
        if(el) el.checked = state.rules[id] === true;
    });

    if(typeof aggiornaDescrizioneTipoTorneo === "function") aggiornaDescrizioneTipoTorneo();
    if(typeof aggiornaPannelloRegole === "function") aggiornaPannelloRegole();
    if(typeof aggiornaNomeFormulaTorneo === "function") aggiornaNomeFormulaTorneo();

    localStorage.setItem("torneoState", JSON.stringify(state));
    if(typeof render === "function") render();
}
'''
          if 'function applicaModelloTorneo()' not in text:
              marker = 'function applyRules()'
              if marker not in text:
                  raise SystemExit('applyRules non trovato')
              text = text.replace(marker, applica + '\n' + marker, 1)

          # 2) When the saved pair count does not match the configured format,
          # rebuild only the active groups from real pairs and leave remaining slots empty.
          normalizer = r'''        /* FINAL BOVE NORMALIZZAZIONE GIRONI */
        const coppieReali = Array.isArray(state.coppie) ? state.coppie : [];
        const totaleConfigurato = numeroGironi * perGirone;
        const conteggioGironi = gironiAttivi.reduce((n,g)=>n + (Array.isArray(state[g]) ? state[g].length : 0), 0);
        const contieneSegnaposto = gironiAttivi.some(g =>
            (Array.isArray(state[g]) ? state[g] : []).some(x => /^Squadra\s+\d+$/i.test(String(x || '').trim()))
        );

        if(contieneSegnaposto || (coppieReali.length > 0 && coppieReali.length !== totaleConfigurato)){
            gironiAttivi.forEach(g => { state[g] = []; });
            coppieReali.slice(0, totaleConfigurato).forEach((c,i)=>{
                const indice = Math.floor(i / perGirone);
                if(indice < numeroGironi) state[lettereGironi[indice]].push(c);
            });
        }
'''
          marker = '        /*\n        ============================================================\n        10. GENERAZIONE PARTITE'
          if marker in text and 'FINAL BOVE NORMALIZZAZIONE GIRONI' not in text:
              text = text.replace(marker, normalizer + '\n' + marker, 1)

          # 3) renderClass: always show the configured rows for active groups.
          render_class = r'''function renderClass(){
    ensureRules();
    const gironi = ["A","B","C","D","E","F","G"];
    const perGirone = Math.max(1, Number(state.rules.squadrePerGirone) || 4);
    const qualificate = Math.max(0, Number(state.rules.qualificatePerGirone) || 0);

    function nomeClassifica(v){
        if(v === null || v === undefined) return "";
        if(typeof v === "object"){
            if(v.cognome) return String(v.cognome).trim();
            const g1=v.giocatore1||v.g1||v.player1||null, g2=v.giocatore2||v.g2||v.player2||null;
            const a=nomeClassifica(g1), b=nomeClassifica(g2);
            return a && b ? a+"/"+b : (a||b||"");
        }
        const s=String(v).replace(/\s+/g," ").trim();
        if(!s) return "";
        return s.split("/").map(x=>x.trim().split(/\s+/).pop()).filter(Boolean).join("/");
    }

    gironi.forEach((tag,idx)=>{
        const tbody=document.getElementById(tag+"class");
        const card=document.getElementById("card"+tag);
        if(!tbody) return;
        if(idx >= Number(state.rules.numeroGironi || 0)){
            tbody.innerHTML="";
            if(card) card.style.display="none";
            return;
        }
        if(card) card.style.display="block";
        const squadre=Array.isArray(state[tag])?state[tag]:[];
        const risultati=Array.isArray(state[tag+"res"])?state[tag+"res"]:[];
        let classifica=[];
        if(squadre.length){ try{ classifica=calc(squadre,risultati)||[]; }catch(e){ console.error("calc "+tag,e); } }
        tbody.innerHTML="";
        for(let i=0;i<perGirone;i++){
            const x=classifica[i]||{n:"",pt:0,gf:0,gs:0,df:0};
            const tr=document.createElement("tr");
            [nomeClassifica(x.n||""), i<qualificate && x.n ? "▲" : x.n ? "▼" : "", Number(x.pt)||0, Number(x.gf)||0, Number(x.gs)||0, Number(x.df)||0].forEach((v,j)=>{
                const td=document.createElement("td"); td.textContent=String(v); if(j===1) td.style.textAlign="center"; tr.appendChild(td);
            });
            tbody.appendChild(tr);
        }
    });
}
'''
          text,n = re.subn(r'function renderClass\(\)\s*\{.*?\n\}\s*\n\s*function render\(\)', render_class+'\nfunction render()', text, count=1, flags=re.S)
          if n != 1: raise SystemExit('renderClass non trovato')

          # 4) renderTables: empty groups still get a full 4-team calendar skeleton.
          old = '''        let squadre =\n            state[tag];\n\n\n        if(\n            !Array.isArray(squadre) ||\n            squadre.length<2\n        ){\n\n            continue;\n\n        }\n\n\n        let partite=[];'''
          new = '''        let squadre = Array.isArray(state[tag]) ? state[tag] : [];
        const strutturaVuota = squadre.length < 2;
        const numeroPostiGirone = Math.max(2, Number(state.rules.squadrePerGirone) || 4);
        let partite=[];'''
          if old in text: text=text.replace(old,new,1)

          old2 = '''        /*\n            USA LE PARTITE GIÀ PRESENTI (ma controllando che non siano troncate a 12)\n        */\n\n        if(\n            state.partiteGironi &&\n            Array.isArray(\n                state.partiteGironi[tag]\n            ) &&\n            state.partiteGironi[tag].length>0 &&\n            state.partiteGironi[tag].length >= (squadre.length * (squadre.length - 1) / (state.rules.garaAndataRitorno ? 1 : 2)) // Forza ricalcolo se le vecchie partite erano parziali\n        ){\n\n            partite =\n                state.partiteGironi[tag];\n\n        }\n\n\n\n        /*\n            SE NON ESISTONO O ERANO TRONCATE,\n            CREA IL ROUND ROBIN COMPLETO SULLE 8 SQUADRE\n        */\n\n        else{\n\n            let rounds =\n                generaRoundRobin(\n                    squadre.length\n                );'''
          new2 = '''        if(strutturaVuota){
            let rounds=generaRoundRobin(numeroPostiGirone);
            rounds.forEach(round=>round.forEach(match=>partite.push({casa:match[0],ospite:match[1]})));
        }
        else if(state.partiteGironi && Array.isArray(state.partiteGironi[tag]) && state.partiteGironi[tag].length>0 && state.partiteGironi[tag].length >= (squadre.length*(squadre.length-1)/(state.rules.garaAndataRitorno?1:2))){
            partite=state.partiteGironi[tag];
        }
        else{
            let rounds=generaRoundRobin(squadre.length);'''
          if old2 in text: text=text.replace(old2,new2,1)

          # 5) Replace renderKO with a bracket that is visible even when no teams/results exist.
          render_ko = r'''function renderKO(){
    ensureRules();
    const q=document.getElementById("Q"), s=document.getElementById("S"), f=document.getElementById("finaleBox");
    if(!q||!s||!f) return;
    const qTable=q.closest("table"), sTable=s.closest("table"), fTable=f.closest("table");
    q.innerHTML=""; s.innerHTML=""; f.innerHTML="";
    document.querySelectorAll(".winner-box.top-win").forEach(e=>e.remove());
    if(!Array.isArray(state.qRes)) state.qRes=Array(4).fill("-");
    if(!Array.isArray(state.sTopRes)) state.sTopRes=Array(2).fill("-");
    if(typeof state.fTopRes!=="string") state.fTopRes="-";
    if(!Array.isArray(state.qCamp)) state.qCamp=[]; if(!Array.isArray(state.qTime)) state.qTime=[];
    if(!Array.isArray(state.sCamp)) state.sCamp=[]; if(!Array.isArray(state.sTime)) state.sTime=[];
    if(!Array.isArray(state.fCamp)) state.fCamp=[]; if(!Array.isArray(state.fTime)) state.fTime=[];

    function creaMatchKO(match,gruppo,index,risultato){
        const a=Array.isArray(match)&&match[0]?String(match[0]):"";
        const b=Array.isArray(match)&&match[1]?String(match[1]):"";
        const ck=gruppo==="q"?"qCamp":gruppo==="s"?"sCamp":"fCamp";
        const tk=gruppo==="q"?"qTime":gruppo==="s"?"sTime":"fTime";
        const campo=Array.isArray(state[ck])?(state[ck][index]??""):"";
        const ora=Array.isArray(state[tk])?(state[tk][index]??""):"";
        const ris=risultato&&risultato!=="-"?String(risultato):"";
        return `<tr><td><input type="text" value="${campo}" style="width:45px" onchange="updateCamp('${gruppo.toUpperCase()}',${index},this.value)"></td><td><input type="time" value="${ora}" onchange="updateTime('${gruppo.toUpperCase()}',${index},this.value)"></td><td class="match-cell"><div class="team-line">${a}</div><div class="vs-line"><b>VS</b></div><div class="team-line">${b}</div></td><td class="db-cell"><input value="${ris}" placeholder="Ris" oninput="updateKOResult('${gruppo.toUpperCase()}',${index},this.value)"></td></tr>`;
    }
    function show(t){if(t){t.style.display="table";t.style.width="100%";t.style.tableLayout="fixed";}}

    const expected=Math.max(0,Number(state.rules.numeroQualificateFinali)||((Number(state.rules.numeroGironi)||0)*(Number(state.rules.qualificatePerGirone)||0)));
    let qualificati=[]; try{ const x=getFinalQualified(); if(Array.isArray(x)) qualificati=x; }catch(e){ console.error(e); }
    const slots=Array.from({length:expected},(_,i)=>qualificati[i]||"");
    const usaQ=state.rules.usaQuarti===true && expected>=8;
    const usaS=state.rules.usaSemifinali===true;
    const usaF=state.rules.usaFinale===true;
    let semifinali=[];

    if(usaQ){
        const qmatches=[[slots[0],slots[7]],[slots[3],slots[4]],[slots[1],slots[6]],[slots[2],slots[5]]];
        qmatches.forEach((m,i)=>q.innerHTML+=creaMatchKO(m,"q",i,state.qRes[i]));
        show(qTable);
        const v=qmatches.map((m,i)=>getWinner(m,state.qRes[i])||"");
        semifinali=[[v[0],v[1]],[v[2],v[3]]];
    }else if(expected>=4){
        if(qTable) qTable.style.display="none";
        semifinali=[[slots[0],slots[3]],[slots[2],slots[1]]];
    }else{
        if(qTable) qTable.style.display="none";
    }

    let finalisti=[];
    if(usaS){
        while(semifinali.length<2 && expected>=4) semifinali.push(["",""]);
        semifinali.slice(0,2).forEach((m,i)=>{s.innerHTML+=creaMatchKO(m,"s",i,state.sTopRes[i]); const v=getWinner(m,state.sTopRes[i]); if(v) finalisti.push(v);});
        show(sTable);
    }else if(expected>=2){
        if(sTable) sTable.style.display="none";
        finalisti=[slots[0],slots[1]];
    }else if(sTable){sTable.style.display="none";}

    state.finalTop=[finalisti[0]||"",finalisti[1]||""];
    if(usaF){
        f.innerHTML=creaMatchKO(state.finalTop,"f",0,state.fTopRes); show(fTable);
        const campione=getWinner(state.finalTop,state.fTopRes);
        state.campioneTop=campione||null;
        if(campione&&fTable) fTable.insertAdjacentHTML("afterend",`<div class="winner-box top-win">🏆 CAMPIONE TORNEO:<br>${campione}</div>`);
    }else{if(fTable)fTable.style.display="none";state.campioneTop=null;}

    console.log("=== QUARTI CONFIGURATI ===",{attivi:usaQ,numeroRighe:q.querySelectorAll("tr").length,qualificati:qualificati.length,semifinali:semifinali.length,finalisti:finalisti.length});
}
'''
          text,n=re.subn(r'function renderKO\(\)\s*\{.*?\n\}\s*\n\s*function updateKOResult\(',render_ko+'\nfunction updateKOResult(',text,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderKO non trovato')

          p.write_text(text,encoding='utf-8')
          print('BOVE PATCH COMPLETA APPLICATA')

      - name: Syntax validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('Bove.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,s in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'bove_{i}.js'; f.write_text(s,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: print(r.stderr); raise SystemExit('JS syntax error')
          print('SINTASSI OK')
          PY

      - name: Commit repaired Bove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          if git diff --cached --quiet; then echo 'Nessuna modifica'; exit 0; fi
          git commit -m 'Repair Bove tournament structure and final bracket'
          git push
