name: Force admin cache v9
on:
  push:
    paths:
      - '.github/workflows/force-admin-cache-v9.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize admin script entrypoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          import re
          s=re.sub(r'admin-desktop-v3\.js\?v=[^\"\']+', 'admin-desktop-v3.js?v=9', s)
          s=re.sub(r'admin-organization-v1\.js\?v=[^\"\']+', 'admin-organization-v1.js?v=9', s)
          s=re.sub(r'admin-desktop\.css\?v=[^\"\']+', 'admin-desktop.css?v=9', s)
          p.write_text(s)
          PY
      - name: Commit admin cache-bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet || git commit -m 'fix: force fresh admin entrypoints'
          git push
