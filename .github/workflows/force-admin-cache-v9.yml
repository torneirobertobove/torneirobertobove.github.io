name: Force admin cache normalization
on:
  push:
    paths:
      - '.github/workflows/force-admin-cache-v9.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize admin script entrypoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'admin-desktop-v3\.js\?v=[^\"\']+', 'admin-desktop-v3.js', s)
          s=re.sub(r'admin-organization-v1\.js\?v=[^\"\']+', 'admin-organization-v1.js', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit admin normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet || git commit -m 'fix: remove final admin cache warning suffixes'
          git push
