name: Force admin cache normalization
on:
  push:
    paths:
      - '.github/workflows/force-admin-cache-v9.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize admin script entrypoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          for name,ver in [('admin-desktop-v3.js','14'),('admin-organization-v1.js','14'),('admin-function-fixes-v1.js','14'),('admin-random-pairs.js','2')]:
              s=re.sub(r'(?<![A-Za-z0-9_-])'+re.escape(name)+r'(?:\?v=[^"\']+)?',name+'?v='+ver,s)
          for name,ver in [('admin-desktop-v3.js','14'),('admin-organization-v1.js','14'),('admin-function-fixes-v1.js','14'),('admin-random-pairs.js','2')]:
              pat=re.compile(r'<script\s+src=["\']'+re.escape(name)+r'\?v=[^"\']+["\']\s*></script>',re.I)
              seen=False
              def keep(m):
                  nonlocal seen
                  if seen:return ''
                  seen=True
                  return m.group(0)
              s=pat.sub(keep,s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit admin normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet || git commit -m 'fix: deploy admin interaction runtime v14'
          git push
