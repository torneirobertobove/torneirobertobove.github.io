name: Fix tournament controls workflow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syntax
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/implement-tournament-controls.yml')
          s=p.read_text(encoding='utf-8')
          bad="if(!confirm('Confermi l\\'archiviazione del torneo \\\"'+(t.nome||'Torneo')+'\\\"?'))return false;"
          good='if(!confirm("Confermi l\'archiviazione del torneo \\""+(t.nome||"Torneo")+"\\"?"))return false;'
          if bad not in s:
              raise SystemExit('bad workflow text not found')
          p.write_text(s.replace(bad,good,1),encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git add .github/workflows/implement-tournament-controls.yml
          git rm -f .github/workflows/fix-controls-workflow.yml
          git commit -m 'Fix tournament controls workflow syntax'
          git push