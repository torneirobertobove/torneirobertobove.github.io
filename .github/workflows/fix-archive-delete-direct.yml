name: Fix archive delete direct
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Fix archive delete direct')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch archive delete handler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-random-pairs.js')
          s=p.read_text()
          old="""tree.querySelectorAll('[data-clean-delete]').forEach(b=>b.onclick=async e=>{e.preventDefault();e.stopPropagation();const fn=window.eliminaTorneo;if(typeof fn!=='function'){alert('Funzione eliminazione torneo non disponibile.');return;}const ok=await fn(b.getAttribute('data-clean-delete'));if(ok&&typeof window.openArchivioTornei==='function')setTimeout(()=>window.openArchivioTornei(),150);});"""
          new="""tree.querySelectorAll('[data-clean-delete]').forEach(b=>b.onclick=async e=>{e.preventDefault();e.stopPropagation();const id=b.getAttribute('data-clean-delete');const fn=window.eliminaTorneo;if(typeof fn!=='function'){alert('Funzione eliminazione torneo non disponibile.');return;}const ok=await fn(id);if(ok){const s=state();if(s&&Array.isArray(s.tornei))s.tornei=s.tornei.filter(t=>String(t.id)!==String(id));if(s&&s.torneoSelezionato!=null&&String(s.torneoSelezionato)===String(id))s.torneoSelezionato=null;renderArchive();if(typeof window.openArchivioTornei==='function')setTimeout(()=>window.openArchivioTornei(),150);}});"""
          if old not in s:
              raise SystemExit('archive delete handler pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-random-pairs.js
          git diff --cached --quiet || git commit -m 'Fix archive delete direct'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fix-archive-delete-direct.yml || true
          git commit -m 'Remove temporary archive delete workflow' || true
          git push || true
