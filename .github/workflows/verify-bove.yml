name: Verify Bove

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, 'BOVE VERIFY') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify and repair Bove.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')

          # 1) Do not allow global UI locking to disable the admin hamburger.
          s = re.sub(
              r"function bloccaGestionale\(\)\s*\{.*?\n\}",
              '''function bloccaGestionale(){

              window.__BOVE_ADMIN_AUTH_OK = false;

              document
                  .querySelectorAll('input, button, textarea, select')
                  .forEach(el => {

                      if(
                          el.closest("#adminHamburger") ||
                          el.classList.contains("back") ||
                          el.innerText === "Stampa"
                      ){
                          return;
                      }

                      el.disabled = true;
                      el.style.opacity = "0.6";
                  });
          }''',
              s, count=1, flags=re.S
          )

          # 2) Ensure the tournament loaded from Supabase can build couples from real participants.
          marker = '''                console.log(
                    "COPPIE CARICATE:",
                    state.coppie
                );
'''
          if marker in s and 'FALLBACK COPPIE DAGLI ISCRITTI REALI' not in s:
              insert = marker + '''
                /*
                ====================================================
                FALLBACK COPPIE DAGLI ISCRITTI REALI
                ====================================================
                */
                if(
                    state.coppie.length === 0 &&
                    Array.isArray(state.partecipanti) &&
                    state.partecipanti.length > 0
                ){

                    const nomePartecipante = function(p){
                        if(p == null) return "";
                        if(typeof p === "string" || typeof p === "number") return String(p).trim();
                        if(typeof p !== "object") return String(p).trim();
                        const nome = p.nome != null ? String(p.nome).trim() : "";
                        const cognome = p.cognome != null ? String(p.cognome).trim() : "";
                        if(nome && cognome) return nome + " " + cognome;
                        if(nome) return nome;
                        if(cognome) return cognome;
                        if(p.nome_giocatore != null) return String(p.nome_giocatore).trim();
                        if(p.email != null) return String(p.email).trim();
                        return "";
                    };

                    const coppieDaIscritti = [];

                    state.partecipanti.forEach(function(p){
                        if(p && typeof p === "object" && (p.giocatore1 || p.giocatore2)){
                            const n1 = nomePartecipante(p.giocatore1);
                            const n2 = nomePartecipante(p.giocatore2);
                            if(n1 || n2){
                                coppieDaIscritti.push({
                                    giocatore1: p.giocatore1 || {nome:n1},
                                    giocatore2: p.giocatore2 || {nome:n2}
                                });
                            }
                        }
                    });

                    if(coppieDaIscritti.length === 0){
                        for(let i=0; i+1<state.partecipanti.length; i+=2){
                            const g1 = state.partecipanti[i];
                            const g2 = state.partecipanti[i+1];
                            if(nomePartecipante(g1) || nomePartecipante(g2)){
                                coppieDaIscritti.push({giocatore1:g1, giocatore2:g2});
                            }
                        }
                    }

                    if(coppieDaIscritti.length > 0){
                        state.coppie = coppieDaIscritti;
                        console.log("COPPIE RICOSTRUITE DAGLI ISCRITTI:", state.coppie);
                    }
                }
'''
              s = s.replace(marker, insert, 1)

          # 3) Validate the file structure: no duplicate IDs for the known critical controls.
          for ident in ('adminMenuButton','adminMenu'):
              n = len(re.findall(r'id=["\\']'+re.escape(ident)+r'["\\']', s))
              if n != 1:
                  raise SystemExit(f'Duplicate/missing critical id {ident}: {n}')

          if not re.search(r'function\s+renderTables\s*\(', s):
              raise SystemExit('renderTables() missing')
          if not re.search(r'function\s+updateCamp\s*\(', s):
              raise SystemExit('updateCamp() missing')
          if not re.search(r'function\s+toggleAdminMenu\s*\(', s):
              raise SystemExit('toggleAdminMenu() missing')

          p.write_text(s, encoding='utf-8')
          print('Bove verification/repair completed')
          PY

      - name: JavaScript syntax test
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          s = Path('Bove.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S | re.I)
          Path('/tmp/bove-js.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('script blocks:', len(scripts))
          PY
          node --check /tmp/bove-js.js

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html
          git commit -m "BOVE VERIFY: repair and validate" || exit 0
          git push
