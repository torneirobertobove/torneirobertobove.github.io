name: Install approved admin desktop shell

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[admin-desktop-installed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject desktop assets into admin.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- ADMIN-DESKTOP-V2 -->'
          injection='''\n<!-- ADMIN-DESKTOP-V2 -->\n<link rel="stylesheet" href="admin-desktop.css?v=3">\n<script src="admin-desktop-v3.js?v=3"></script>\n'''
          if marker not in s:
              s=s.replace('</head>', injection+'</head>',1)
          else:
              import re
              s=re.sub(r'<link rel="stylesheet" href="admin-desktop\.css(?:\?v=[^"]+)?">', '<link rel="stylesheet" href="admin-desktop.css?v=3">', s)
              s=re.sub(r'<script src="admin-desktop-(?:v2\.js|js|v3\.js)(?:\?v=[^"]+)?"></script>', '<script src="admin-desktop-v3.js?v=3"></script>', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify desktop installation
        run: |
          grep -n "ADMIN-DESKTOP-V2\|admin-desktop-v3.js" admin.html
      - name: Commit installed layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html admin-desktop.css admin-desktop.js admin-desktop-v2.js admin-desktop-v3.js
          git diff --cached --quiet || git commit -m "feat: install approved admin desktop integration [admin-desktop-installed]"
          git push
