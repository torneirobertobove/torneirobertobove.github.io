name: Apply tabellone visual fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, '[KO layout]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix renderMatchCard KO
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('Bove.html')
          text = path.read_text(encoding='utf-8')

          new_render_match_card = r'''function renderMatchCard(titolo, match, tipo, index, risultato){

    /*
    ============================================================
    RIGA KO IDENTICA ALLA STRUTTURA DEI GIRONI
    Q / S / F sono TBODY: questa funzione deve restituire SEMPRE
    una singola <tr> con le stesse 4 colonne:
    Campo | Ora | Match | Ris
    ============================================================
    */

    const fase =
        (tipo === "Q" || tipo === "S" || tipo === "F")
            ? tipo
            : "F";

    const indice =
        Number.isInteger(Number(index))
            ? Number(index)
            : 0;

    function escapeHtml(value){

        return String(value ?? "")
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#39;");

    }

    function nomeSquadra(squadra){

        if(
            squadra === null ||
            squadra === undefined
        ){
            return "";
        }

        if(typeof squadra === "string"){
            return squadra.trim();
        }

        if(typeof squadra === "number"){
            return String(squadra);
        }

        if(typeof squadra !== "object"){
            return String(squadra).trim();
        }

        if(
            squadra.g1 !== undefined ||
            squadra.g2 !== undefined
        ){

            return (
                String(squadra.g1 || "") +
                " / " +
                String(squadra.g2 || "")
            ).trim();

        }

        if(
            squadra.giocatore1 ||
            squadra.giocatore2
        ){

            const g1 = squadra.giocatore1;
            const g2 = squadra.giocatore2;

            const n1 =
                typeof g1 === "object"
                    ? (
                        String(g1.nome || "") +
                        " " +
                        String(g1.cognome || "")
                    ).trim()
                    : String(g1 || "").trim();

            const n2 =
                typeof g2 === "object"
                    ? (
                        String(g2.nome || "") +
                        " " +
                        String(g2.cognome || "")
                    ).trim()
                    : String(g2 || "").trim();

            return (
                n1 +
                (n1 && n2 ? " / " : "") +
                n2
            ).trim();

        }

        if(squadra.nome !== undefined){
            return String(squadra.nome || "").trim();
        }

        if(squadra.nomeSquadra !== undefined){
            return String(squadra.nomeSquadra || "").trim();
        }

        if(squadra.squadra !== undefined){
            return String(squadra.squadra || "").trim();
        }

        return String(squadra).trim();

    }

    const squadra1 =
        Array.isArray(match)
            ? nomeSquadra(match[0])
            : nomeSquadra(match?.squadra1 || match?.team1);

    const squadra2 =
        Array.isArray(match)
            ? nomeSquadra(match[1])
            : nomeSquadra(match?.squadra2 || match?.team2);

    const campKey =
        fase === "Q"
            ? "qCamp"
            : fase === "S"
                ? "sCamp"
                : "fCamp";

    const timeKey =
        fase === "Q"
            ? "qTime"
            : fase === "S"
                ? "sTime"
                : "fTime";

    if(!Array.isArray(state[campKey])){
        state[campKey] = [];
    }

    if(!Array.isArray(state[timeKey])){
        state[timeKey] = [];
    }

    if(
        state[campKey][indice] === undefined ||
        state[campKey][indice] === null
    ){
        state[campKey][indice] = "";
    }

    if(
        state[timeKey][indice] === undefined ||
        state[timeKey][indice] === null
    ){
        state[timeKey][indice] = "";
    }

    let risultatoTesto =
        risultato !== undefined &&
        risultato !== null
            ? String(risultato).trim()
            : "-";

    if(!risultatoTesto || risultatoTesto === "-"){
        risultatoTesto = "";
    }

    const partiRis =
        risultatoTesto.split("-");

    const ris1 =
        partiRis[0] && partiRis[0] !== "-"
            ? partiRis[0].trim()
            : "";

    const ris2 =
        partiRis[1]
            ? partiRis[1].trim()
            : "";

    return `
<tr class="ko-match-row">

    <td>
        <input
            value="${escapeHtml(state[campKey][indice])}"
            style="width:45px"
            onchange="
                state['${campKey}'][${indice}]=this.value;
                updateAndSync();
            "
        >
    </td>

    <td>
        <input
            value="${escapeHtml(state[timeKey][indice])}"
            onchange="
                state['${timeKey}'][${indice}]=this.value;
                updateAndSync();
            "
        >
    </td>

    <td class="match-cell">

        <div class="team-line">
            ${escapeHtml(squadra1)}
        </div>

        <div class="vs-line">
            <b>VS</b>
        </div>

        <div class="team-line">
            ${escapeHtml(squadra2)}
        </div>

    </td>

    <td class="db-cell">

        <input
            value="${escapeHtml(ris1)}"
            oninput="
                updateKOResult(
                    '${fase}',
                    ${indice},
                    this.value + '-' + this.nextElementSibling.value
                )
            "
        >

        <input
            value="${escapeHtml(ris2)}"
            oninput="
                updateKOResult(
                    '${fase}',
                    ${indice},
                    this.previousElementSibling.value + '-' + this.value
                )
            "
        >

    </td>

</tr>
`;
}
'''

          pattern = re.compile(
              r'function renderMatchCard\(titolo, match, tipo, index, risultato\)\s*\{.*?\n\}\s*function aggiornaDescrizioneTipoTorneo\(\)',
              re.S
          )

          if not pattern.search(text):
              raise SystemExit('renderMatchCard non trovato')

          text = pattern.sub(
              new_render_match_card + '\nfunction aggiornaDescrizioneTipoTorneo()',
              text,
              count=1
          )

          path.write_text(text, encoding='utf-8')
          print('renderMatchCard corretto: restituisce una <tr> con Campo/Ora/Match/Ris')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bove.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica necessaria"
            exit 0
          fi
          git commit -m "[KO layout] correggi righe Campo Ora Match Ris"
          git push