name: Fix Bove loadState

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix Bove approved registrations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch approved registrations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Bove.html')
          s = p.read_text(encoding='utf-8')
          old = '''                    .eq(\n                        "approvato",\n                        true\n                    );'''
          new = '''                    .or(\n                        "stato.eq.approvato,approvato.eq.true"\n                    );'''
          if old not in s:
              raise SystemExit('Target iscritti non trovato')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('Bove.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,b in enumerate(blocks):
            f=Path(tempfile.gettempdir())/f'bove{i}.js'; f.write_text(b,encoding='utf-8')
            r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
            if r.returncode: raise SystemExit(r.stderr)
          print('JS SYNTAX OK')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Bove.html
          git commit -m 'Fix Bove approved registrations'
          git push
