name: Fix Supabase admin login
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-supabase-admin-login.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix package name
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          s=s.replace('https://cdn.jsdelivr.net/npm/@Supabase/supabase-js@2','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'fix: load Supabase SDK for admin login'
          git push
