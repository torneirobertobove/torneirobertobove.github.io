name: Finalize admin cache warnings

on:
  push:
    paths:
      - '.github/workflows/finalize-admin-cache-v0.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove verifier-warning cache suffixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('admin-organization-v1.js?v=12', 'admin-organization-v1.js')
          s = s.replace('admin-desktop-v3.js?v=12', 'admin-desktop-v3.js')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'fix: clear remaining admin cache warnings'
            git push
          fi
