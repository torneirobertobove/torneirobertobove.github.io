<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iscrizione Torneo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

:root{
--bg-image:url('https://torneirobertobove.github.io/sfondo2.jpg');
}


body{

margin:0;

background-image:var(--bg-image);

background-size:cover;

background-position:center;

background-attachment:fixed;

font-family:"Open Sans",Arial,sans-serif;

color:white;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

}



.card{

width:380px;

padding:30px;

border-radius:25px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(10px);

box-shadow:
0 8px 32px rgba(0,0,0,.4);

text-align:center;

}



.logo{

width:140px;

margin-bottom:10px;

}



h2{

margin-top:5px;

}



.info{

background:rgba(0,0,0,.25);

padding:15px;

border-radius:12px;

margin:12px 0;

font-size:15px;

}



button{

width:100%;

padding:13px;

margin-top:12px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

font-size:15px;

}



.btn{

background:white;

color:#004a99;

}



.back{

background:#333;

color:white;

}



button:hover{

opacity:.85;

}



.successo{

color:#22c55e;

font-weight:bold;

margin-top:15px;

}



.errore{

color:#ffeb3b;

font-weight:bold;

margin-top:15px;

}



</style>

</head>


<body>


<div class="card">


<img src="logo.jpg" class="logo">


<h2>
🏆 Iscrizione torneo
</h2>



<div id="datiTorneo">

Caricamento torneo...

</div>



<div id="datiUtente">

</div>



<button class="btn" onclick="confermaIscrizione()">

CONFERMA ISCRIZIONE

</button>



<button class="back" onclick="tornaTornei()">

⬅ Torna ai tornei

</button>



<div id="messaggio">

</div>


</div>
<script>


const sb = supabase.createClient(

"https://iybjvtmfaupgthqqsngd.supabase.co",

"sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",

{

auth:{

persistSession:true,

autoRefreshToken:true,

detectSessionInUrl:true

}

}

);



const torneoId = new URLSearchParams(

window.location.search

).get("torneo");



let torneo = null;

let utente = null;

let profilo = null;





async function inizializza(){


try{


if(!torneoId){


mostraMessaggio(

"❌ Torneo non selezionato",

"errore"

);


return;

}




const sessione =

await sb.auth.getSession();



const user =

sessione?.data?.session?.user;





if(!user){


mostraMessaggio(

"❌ Devi effettuare il login prima di iscriverti",

"errore"

);


return;

}





utente=user;





const {

data:torneoLetto,

error:erroreTorneo

}=

await sb

.from("tornei")

.select(

"id,nome,data,formula,configurazione,posti,stato"

)

.eq(

"id",

torneoId

)

.single();





if(erroreTorneo || !torneoLetto){


console.error(

"Errore caricamento torneo:",

erroreTorneo

);


mostraMessaggio(

"❌ Torneo non trovato",

"errore"

);


return;

}





torneo = torneoLetto;







const {

data:profiloLetto,

error:erroreProfilo

}=

await sb

.from("profili")

.select(

"nome,cognome,email,telefono,livello,note"

)

.eq(

"user_id",

user.id

)

.single();





if(erroreProfilo){


console.warn(

"Profilo non trovato:",

erroreProfilo

);


}





profilo = profiloLetto || null;





mostraDati();





}

catch(e){


console.error(

"Errore inizializzazione iscrizione:",

e

);



mostraMessaggio(

"❌ Errore caricamento pagina",

"errore"

);


}



}
    function getNumeroSquadre(){


let numero = 0;



if(

torneo &&

torneo.configurazione &&

torneo.configurazione.rules &&

torneo.configurazione.rules.numeroSquadre

){


numero = Number(

torneo.configurazione.rules.numeroSquadre

);


}



if(!numero && torneo.posti){


numero = Number(torneo.posti);


}



if(!numero){


numero = 8;


}



return numero;


}







function mostraDati(){



const boxTorneo =

document.getElementById(

"datiTorneo"

);



if(!boxTorneo || !torneo){

return;

}





const squadre = getNumeroSquadre();

const giocatori = squadre * 2;





boxTorneo.innerHTML = `


<div class="info">


🏆

<b>

${torneo.nome || "Torneo Padel"}

</b>



<br><br>


📅 Data:

${torneo.data || "-"}



<br>


🎾 Formula:

${torneo.formula || "Padel"}



<br>


👥 Posti disponibili:

${giocatori} giocatori



<br><br>


Stato:

${
torneo.stato === "chiuso"

?

"❌ Chiuso"

:

"🟢 Aperto"

}



</div>


`;







const boxUtente =

document.getElementById(

"datiUtente"

);





if(!boxUtente){

return;

}





if(profilo){


boxUtente.innerHTML = `


<div class="info">


👤 Giocatore



<br><br>



<b>

${profilo.nome || ""}

${profilo.cognome || ""}

</b>



<br>


📧 ${utente.email || ""}



</div>


`;



}

else{



boxUtente.innerHTML = `


<div class="info">


👤 Utente



<br><br>



<b>

${utente.email || ""}

</b>



</div>


`;



}



}
    async function confermaIscrizione(){


try{


if(!torneo || !utente){


mostraMessaggio(

"❌ Dati torneo o utente mancanti",

"errore"

);


return;

}




if(torneo.stato==="chiuso"){


mostraMessaggio(

"❌ Torneo chiuso",

"errore"

);


return;

}




const squadre = getNumeroSquadre();

const limite = squadre * 2;






const {

data:iscritti,

error:erroreLista

}=

await sb

.from("iscrizioni")

.select("id")

.eq(

"torneo_id",

torneo.id

);





if(erroreLista){


console.error(

"Errore controllo iscritti:",

erroreLista

);


mostraMessaggio(

"❌ Errore controllo disponibilità",

"errore"

);


return;

}






if(

iscritti &&

iscritti.length >= limite

){


mostraMessaggio(

"❌ Torneo completo",

"errore"

);


return;

}







const {

data:giaIscritto,

error:erroreGia

}=

await sb

.from("iscrizioni")

.select("id")

.eq(

"torneo_id",

torneo.id

)

.eq(

"user_id",

utente.id

);





if(erroreGia){


console.error(

"Errore controllo iscrizione:",

erroreGia

);


return;

}







if(

giaIscritto &&

giaIscritto.length>0

){


mostraMessaggio(

"⚠️ Sei già iscritto a questo torneo",

"errore"

);


return;

}








const nome =

profilo?.nome ||

utente.email.split("@")[0];





const cognome =

profilo?.cognome ||

"";






const alias =

cognome

?

cognome.substring(0,6).toUpperCase()

:

nome.substring(0,6).toUpperCase();








const {

data:nuovaIscrizione,

error:erroreInsert

}=

await sb

.from("iscrizioni")

.insert({


torneo_id:torneo.id,


user_id:utente.id,


nome_giocatore:alias,


nome:nome,


cognome:cognome,


email:utente.email || "",


telefono:profilo?.telefono || "",


livello:profilo?.livello || "",


note:profilo?.note || "",


categoria:"Open",


stato:"richiesta",


approvato:false,


data_iscrizione:

new Date().toISOString()



})

.select()

.single();







if(erroreInsert){


console.error(

"Errore inserimento iscrizione:",

erroreInsert

);



mostraMessaggio(

"❌ Errore iscrizione: "+erroreInsert.message,

"errore"

);


return;

}






console.log(

"ISCRIZIONE CREATA:",

nuovaIscrizione

);






mostraMessaggio(

"✅ Richiesta iscrizione inviata",

"successo"

);





setTimeout(()=>{


window.location.href="visitatore.html";


},1500);





}

catch(e){


console.error(

"Errore conferma iscrizione:",

e

);



mostraMessaggio(

"❌ Errore inatteso iscrizione",

"errore"

);


}



}
    function mostraMessaggio(testo,tipo){


const box =

document.getElementById(

"messaggio"

);



if(!box){

return;

}



box.className = tipo || "";



box.innerHTML =

"<p>"+testo+"</p>";



}







function tornaTornei(){


window.location.href =

"visitatore.html";


}








window.addEventListener(

"load",

()=>{


inizializza();


}

);
    </script>

</body>

</html>
