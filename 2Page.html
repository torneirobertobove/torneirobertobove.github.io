<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Principale</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
--bg-image:url('https://torneirobertobove.github.io/sfondo2.jpg');
}

body{

margin:0;

background-image:var(--bg-image);
background-size:cover;
background-position:center;
background-attachment:fixed;

font-family:sans-serif;

color:white;

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

}


.box{

width:350px;

padding:30px;

border-radius:25px;

background:rgba(255,255,255,0.15);

backdrop-filter:blur(10px);

box-shadow:
0 8px 32px rgba(0,0,0,.4);

text-align:center;

}


.logo{

width:140px;

margin-bottom:10px;

}


h2{

margin-top:5px;

}


.email{

font-size:13px;

opacity:.9;

margin-bottom:20px;

}


.btn{

width:100%;

margin-top:12px;

padding:13px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

background:white;

color:#004a99;

font-size:15px;

}


.btn:hover{

opacity:.85;

}


.logout{

width:100%;

margin-top:20px;

padding:12px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

background:#333;

color:white;

}


#status{

margin-top:15px;

min-height:20px;

color:#ffeb3b;

font-size:14px;

}


.hidden{

display:none;

}


/* HAMBURGER */

.menu-button{

position:fixed;

top:20px;

right:20px;

font-size:28px;

cursor:pointer;

z-index:1000;

}



.menu-panel{

position:fixed;

top:0;

right:-270px;

width:250px;

height:100vh;

background:rgba(0,0,0,.75);

backdrop-filter:blur(10px);

transition:.3s;

padding-top:70px;

z-index:999;

}



.menu-panel.open{

right:0;

}



.menu-item{

padding:15px 20px;

font-size:16px;

text-align:left;

cursor:pointer;

color:white;

}



.menu-item:hover{

background:rgba(255,255,255,.15);

}


.card-section{

margin-top:15px;

padding:15px;

border-radius:15px;

background:rgba(255,255,255,.10);

}

</style>

</head>


<body>


<div class="menu-button" onclick="toggleMenu()">

☰

</div>


<div class="menu-panel" id="menuPanel">


<div class="menu-item" onclick="location.href='2Page.html'">
⌂ Home
</div>


<div class="menu-item" onclick="location.href='tornei.html'">
▣ Tornei
</div>


<div class="menu-item" onclick="location.href='news.html'">
≡ News
</div>


<div class="menu-item" onclick="location.href='mercatino.html'">
□ Mercatino
</div>


<div class="menu-item" onclick="location.href='eventi.html'">
◷ Eventi
</div>


<div class="menu-item" onclick="location.href='informazioni.html'">
ⓘ Informazioni Club
</div>


<div class="menu-item" onclick="location.href='contatti.html'">
☎ Contatti
</div>


</div>


<div class="box">


<img src="logo.jpg" class="logo">


<h2 id="welcome">

Verifica in corso...

</h2>


<div class="email" id="emailBox"></div>
<div id="adminMenu" class="hidden">


<button 
class="btn"
onclick="apriGestioneTorneo()">

⚙️ Gestione Torneo

</button>


</div>



<div id="userMenu" class="hidden">


<div class="card-section">


<h3>

Calendario Tornei

</h3>


<p>

Consulta i tornei disponibili e procedi con l'iscrizione.

</p>


<button
class="btn"
onclick="location.href='tornei.html'">

▣ Iscrizione Tornei

</button>


</div>



<div class="card-section">


<h3>

News e Comunicazioni

</h3>


<p>

Ultime comunicazioni del club.

</p>


<button
class="btn"
onclick="location.href='news.html'">

≡ Leggi News

</button>


</div>


</div>


<button
class="logout"
onclick="logout()">

🚪 Esci

</button>


<div id="status"></div>


</div>




<script>


const sb = supabase.createClient(
"https://iybjvtmfaupgthqqsngd.supabase.co",
"sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);



function toggleMenu(){

document
.getElementById("menuPanel")
.classList
.toggle("open");

}




async function init(){

const {
data:{
session
}
}
=
await sb.auth.getSession();


if(!session){

window.location.href="index.html";

return;

}


const user=session.user;


document
.getElementById("welcome")
.innerHTML=
"Benvenuto";


document
.getElementById("emailBox")
.innerHTML=
user.email || "";



const {
data:profilo,
error
}
=
await sb
.from("profili")
.select(
"nome,cognome,telefono,ruolo"
)
.eq(
"user_id",
user.id
)
.maybeSingle();



console.log(
"PROFILO LETTO:",
profilo,
error
);



if(error){

document
.getElementById("status")
.innerHTML=
"Errore caricamento profilo";

return;

}



if(
!profilo ||
!profilo.nome ||
!profilo.cognome ||
!profilo.telefono
){

window.location.href="profilo.html";

return;

}



document
.getElementById("welcome")
.innerHTML=

"Benvenuto<br>"+
profilo.nome+
" "+
(profilo.cognome || "");



if(
profilo.ruolo==="admin"
){

document
.getElementById("adminMenu")
.classList.remove(
"hidden"
);



document
.getElementById("userMenu")
.classList.remove(
"hidden"
);



document
.getElementById("status")
.innerHTML=
"Accesso amministratore";


}

else{


document
.getElementById("userMenu")
.classList.remove(
"hidden"
);



document
.getElementById("status")
.innerHTML=
"Accesso giocatore";


}

}

  function apriGestioneTorneo(){


window.location.href=
"admin.html";


}





async function logout(){


await sb.auth.signOut();


window.location.href=
"index.html";


}





window.addEventListener(
"load",
()=>{

init();

}

);



</script>


</body>

</html>
