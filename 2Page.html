<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Principale</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:system-ui;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}


.card{

    background:#111827;
    padding:30px;
    border-radius:15px;
    border:1px solid #243041;
    text-align:center;
    width:90%;
    max-width:400px;

}


button{

    width:100%;
    padding:15px;
    margin:10px 0;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;

}


.admin-btn{

    background:#2563eb;
    color:white;

}


.user-btn{

    background:#10b981;
    color:white;

}


.profile-btn{

    background:#8b5cf6;
    color:white;

}


.player-btn{

    background:#f59e0b;
    color:white;

}


.logout{

    background:#ef4444;
    color:white;
    margin-top:20px;

}


button:hover{

    opacity:.8;

}


#status{

    color:#94a3b8;
    font-size:14px;
    margin-top:10px;

}

</style>

</head>


<body>


<div class="card">


<h2 id="welcome">
Verifica in corso...
</h2>


<div id="adminMenu" style="display:none">


<button 
class="admin-btn"
onclick="apriGestioneTorneo()">

⚙️ Gestione Torneo

</button>


</div>


<div id="userMenu" style="display:none">


<button
class="user-btn"
onclick="location.href='visitatore.html'">

🏆 Visualizza Tornei

</button>



<button
class="player-btn"
onclick="location.href='DashboardPlayer.html'">

🎾 Dashboard Giocatore

</button>



<button
class="profile-btn"
onclick="location.href='profilo.html'">

👤 Il mio Profilo

</button>


</div>




<button
class="logout"
onclick="logout()">

🚪 Esci

</button>


<div id="status"></div>


</div>





<script>

const sb = supabase.createClient(
"https://iybjvtmfaupgthqqsngd.supabase.co",
"sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);

console.log("CLIENT 2PAGE:",sb);
async function init(){

const {
data:{
session
}
}
=
await sb.auth.getSession();


if(!session){

window.location.href="index.html";

return;

}


const user=session.user;


document
.getElementById("welcome")
.innerHTML=

"Benvenuto<br><small>"+
user.email+
"</small>";



const {
data:profilo,
error
}
=
await sb

.from("profili")

.select(
"nome,cognome,ruolo"
)

.eq(
"user_id",
user.id
)

.maybeSingle();



console.log(
"PROFILO LETTO:",
profilo,
error
);



if(error){

console.error(
"Errore lettura profilo:",
error
);


document
.getElementById("status")
.innerHTML=
"Errore caricamento profilo";


return;

}




if(!profilo){

document
.getElementById("userMenu")
.style.display="block";


document
.getElementById("status")
.innerHTML=

"Completa il tuo profilo giocatore";


return;

}



if(profilo.ruolo==="admin"){


document
.getElementById("adminMenu")
.style.display="block";


document
.getElementById("userMenu")
.style.display="block";


document
.getElementById("status")
.innerHTML=

"Accesso amministratore";


}

else{


document
.getElementById("userMenu")
.style.display="block";


document
.getElementById("status")
.innerHTML=

"Accesso giocatore";


}


}

function apriGestioneTorneo(){

window.location.href="admin.html";

}




async function logout(){

await sb.auth.signOut();

window.location.href="index.html";

}




window.addEventListener("load",()=>{

init();

});


</script>


</body>

</html>
