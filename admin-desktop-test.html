<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Desktop — Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070a0f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.testbar{height:52px;background:#101722;border-bottom:1px solid #283241;display:flex;align-items:center;padding:0 18px;gap:12px}.testbar strong{font-size:15px}.testbar span{color:#8e9aaa;font-size:12px}.testbar button{margin-left:auto;border:1px solid #334052;background:#192230;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.frame{height:calc(100% - 52px);padding:12px}.frame iframe{width:100%;height:100%;border:1px solid #283241;border-radius:12px;background:#0b1017}
</style>
</head>
<body>
<div class="testbar"><strong>🧪 Admin Desktop — TEST</strong><span>Versione originale caricata dentro un contenitore di prova. Nessuna modifica ad admin.html.</span><button onclick="location.reload()">↻ Ricarica</button></div>
<div class="frame"><iframe id="adminFrame" src="admin.html" title="Admin originale"></iframe></div>
<script>
const frame=document.getElementById('adminFrame');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    const s=d.createElement('style');
    s.id='desktopTestStyle';
    s.textContent=`
      body{padding:0!important;background:#070a0f!important;overflow-x:hidden!important}
      .container{max-width:1500px!important;margin:0 auto!important;padding:18px!important}
      #areaAdmin{max-width:none!important}
      #areaAdmin>h1{background:#101722;border:1px solid #283241;border-radius:12px;padding:14px 18px;margin:0 0 14px!important}
      #areaAdmin>details,#areaAdmin>#gestioneTorneoAdmin{background:#111720!important;border:1px solid #283241!important;border-radius:12px!important;box-shadow:none!important}
      #areaAdmin>details{transition:.15s}
      #areaAdmin>details:hover{border-color:#3b4b61!important}
      summary{font-size:15px!important}
      details[open]{background:#111720!important}
      .nested-details{background:#0c121a!important;border-color:#283241!important}
      input,select,textarea{background:#0b1017!important;color:#fff!important;border-color:#334052!important}
      button{border-radius:8px!important}
      .lista-item{background:#0c121a!important;border:1px solid #283241!important}
    `;
    d.head.appendChild(s);
    console.log('✅ TEST DESKTOP: stile applicato all\'admin originale dentro iframe');
  }catch(e){console.error('❌ Impossibile applicare stile test:',e)}
});
</script>
</body>
</html>
