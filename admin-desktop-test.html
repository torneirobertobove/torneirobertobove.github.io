<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Desktop — Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070a0f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.topbar{height:54px;background:#101722;border-bottom:1px solid #283241;display:flex;align-items:center;padding:0 18px;gap:12px}.topbar strong{font-size:15px}.topbar span{color:#8e9aaa;font-size:12px}.frame{height:calc(100% - 54px);padding:10px}.frame iframe{width:100%;height:100%;border:1px solid #283241;border-radius:12px;background:#0b1017}
</style>
</head>
<body>
<div class="topbar"><strong>🧪 ADMIN DESKTOP — TEST</strong><span>Stiamo provando la nuova disposizione usando l'admin reale. Nessuna modifica a admin.html.</span></div>
<div class="frame"><iframe id="adminFrame" src="admin.html" title="Admin reale — test grafico"></iframe></div>
<script>
const frame=document.getElementById('adminFrame');
frame.addEventListener('load',()=>{
try{
const d=frame.contentDocument;
const s=d.createElement('style');
s.id='desktopTestStyle';
s.textContent=`
:root{--blue:#1769aa;--gold:#ffeb3b;--glass:#111820;--border:#293443;--text:#eef3f8;--green:#22c55e;--red:#ef4444}
html,body{background:#070a0f!important;color:#eef3f8!important;font-family:Arial,sans-serif!important}
body{padding:0!important;display:block!important;min-height:100vh!important}
#boxLoginAdmin{max-width:420px!important;margin:8vh auto!important;background:#111820!important;color:#fff!important;border:1px solid #293443!important;box-shadow:0 20px 60px #0009!important}
#areaAdmin{max-width:none!important;width:100%!important;padding:18px 22px!important;margin:0!important;background:#070a0f!important;color:#eef3f8!important}
#areaAdmin>h1{font-size:24px!important;margin:0 0 16px!important;padding:0 0 14px!important;border-bottom:1px solid #293443!important}
#areaAdmin>details,#gestioneTorneoAdmin{background:#111820!important;border:1px solid #293443!important;border-radius:12px!important;padding:14px!important;margin:0 0 14px!important;color:#eef3f8!important;box-shadow:0 8px 25px #0005!important}
#areaAdmin details summary{cursor:pointer!important;color:#fff!important;font-weight:800!important}
#areaAdmin input,#areaAdmin select,#areaAdmin textarea{background:#0a1017!important;color:#fff!important;border:1px solid #303c4b!important;border-radius:8px!important;padding:10px!important}
#areaAdmin button{border-radius:8px!important}
.card{background:#111820!important;border-color:#293443!important}
`;
d.head.appendChild(s);
console.log('🧪 Admin Desktop Test: CSS applicato alla pagina admin reale');
}catch(e){console.error('❌ Test grafico:',e)}
});
</script>
</body>
</html>
