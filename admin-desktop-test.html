<!doctype html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Desktop — Test reale</title><style>html,body{margin:0;width:100%;height:100%;background:#070a0f}#adminFrame{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="adminFrame" src="admin.html" title="Admin Desktop Test"></iframe><script>
const frame=document.getElementById('adminFrame');
let pronto=false;
function costruisciDesktop(){
 if(pronto)return;
 const w=frame.contentWindow,d=frame.contentDocument;
 const area=d.getElementById('areaAdmin');
 if(!area || area.classList.contains('hidden')) return;
 pronto=true;
 const style=d.createElement('style');
 style.id='desktopTestStyle';
 style.textContent=`
 html,body{background:#070a0f!important;color:#eef3f8!important;font-family:Arial,sans-serif!important;overflow-x:hidden!important}
 body{padding:0!important;min-height:100vh!important}
 .btn-indietro{display:none!important}
 #areaAdmin{display:grid!important;grid-template-columns:220px minmax(0,1fr)!important;grid-template-rows:auto 1fr!important;gap:16px!important;width:100%!important;max-width:none!important;margin:0!important;padding:16px!important;background:#070a0f!important}
 #areaAdmin>h1{grid-column:1/-1!important;margin:0!important;padding:0 0 14px!important;border-bottom:1px solid #293443!important;font-size:23px!important;color:#fff!important}
 #desktopTestNav{grid-column:1!important;grid-row:2!important;display:flex!important;flex-direction:column!important;gap:6px!important;background:#111820!important;border:1px solid #293443!important;border-radius:12px!important;padding:10px!important;height:max-content!important;position:sticky!important;top:12px!important}
 #desktopTestNav button{width:100%!important;margin:0!important;text-align:left!important;background:#171f2a!important;color:#fff!important;border:1px solid #293443!important;border-radius:8px!important;padding:10px 12px!important;cursor:pointer!important}
 #desktopTestNav button:hover{background:#202b39!important}
 #desktopTestMain{grid-column:2!important;grid-row:2!important;min-width:0!important}
 #desktopTestMain>details,#desktopTestMain>#gestioneTorneoAdmin{background:#111820!important;border:1px solid #293443!important;border-radius:12px!important;padding:14px!important;margin:0 0 12px!important;box-shadow:0 8px 24px #0005!important}
 #desktopTestMain details[open]{background:#111820!important}
 #desktopTestMain summary{color:#fff!important;font-weight:800!important;cursor:pointer!important}
 #desktopTestMain input,#desktopTestMain select,#desktopTestMain textarea{background:#0a1017!important;color:#fff!important;border:1px solid #303c4b!important;border-radius:8px!important}
 #desktopTestMain button{border-radius:8px!important}
 @media(max-width:850px){#areaAdmin{grid-template-columns:1fr!important}.desktopTestNav{position:static!important}#desktopTestNav{grid-column:1!important;grid-row:2!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important}#desktopTestMain{grid-column:1!important;grid-row:3!important}}
 `;
 d.head.appendChild(style);
 const nav=d.createElement('div');nav.id='desktopTestNav';
 const main=d.createElement('div');main.id='desktopTestMain';
 const title=area.querySelector(':scope > h1');
 const children=[...area.children];
 function addNav(label,target){const b=d.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{const el=d.getElementById(target);if(el){if(el.tagName==='DETAILS')el.open=true;el.scrollIntoView({behavior:'smooth',block:'start'})}};nav.appendChild(b)}
 addNav('➕ Nuovo torneo','desktopNuovoTorneo');
 addNav('📋 Tornei creati','desktopTornei');
 addNav('👥 Gestione torneo','gestioneTorneoAdmin');
 addNav('📰 News','desktopNews');
 addNav('🏆 Sponsor','desktopSponsor');
 const firstDetails=children.find(e=>e.tagName==='DETAILS');
 const details=children.filter(e=>e.tagName==='DETAILS');
 const gestione=d.getElementById('gestioneTorneoAdmin');
 if(firstDetails){firstDetails.id='desktopNuovoTorneo'}
 if(details[1])details[1].id='desktopTornei';
 if(details[2])details[2].id='desktopNews';
 if(details[3])details[3].id='desktopSponsor';
 area.insertBefore(nav,title.nextSibling);
 area.appendChild(main);
 [...area.children].filter(e=>e!==title&&e!==nav&&e!==main).forEach(e=>main.appendChild(e));
 if(gestione)main.appendChild(gestione);
 console.log('🧪 TEST DESKTOP REALE: nuova struttura applicata. Funzioni originali mantenute nel frame.');
}
frame.addEventListener('load',()=>{
 const check=()=>costruisciDesktop();
 check();
 const w=frame.contentWindow,d=frame.contentDocument;
 const area=d.getElementById('areaAdmin');
 if(area){new MutationObserver(check).observe(area,{attributes:true,attributeFilter:['class'],subtree:true,childList:true});}
 setTimeout(check,500);setTimeout(check,1500);
});
</script></body></html>
