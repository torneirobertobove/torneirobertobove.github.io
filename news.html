<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>News & Comunicazioni - Next Point Padel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff}body{background:linear-gradient(rgba(5,12,24,.70),rgba(5,12,24,.86)),url('sfondo2.jpg') center/cover fixed no-repeat;padding:24px 16px}.wrap{width:min(100%,1120px);margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.62}.title{font-size:32px;font-weight:800;margin-top:4px}.subtitle{font-size:14px;opacity:.7;margin-top:5px}.back,.filter{border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:9px 13px;cursor:pointer}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.filter.active{background:rgba(255,255,255,.20);border-color:rgba(255,255,255,.35)}.hero{display:grid;grid-template-columns:1.45fr 1fr;min-height:330px;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:rgba(15,23,42,.78);box-shadow:0 18px 50px rgba(0,0,0,.28);margin-bottom:22px}.hero-media{min-height:330px;background:linear-gradient(135deg,rgba(20,184,166,.22),rgba(15,23,42,.45));display:flex;align-items:center;justify-content:center;overflow:hidden}.hero-media img{width:100%;height:100%;object-fit:cover}.hero-placeholder{font-size:58px;opacity:.55}.hero-body{padding:30px;display:flex;flex-direction:column;justify-content:center}.badge{display:inline-flex;align-self:flex-start;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);border-radius:999px;padding:6px 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.hero h1{font-size:30px;line-height:1.08;margin:15px 0 9px}.date{font-size:12px;opacity:.58;margin-bottom:13px}.text{white-space:pre-wrap;line-height:1.55;color:rgba(255,255,255,.88)}.hero-link{display:inline-flex;align-self:flex-start;margin-top:20px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);border-radius:10px;padding:10px 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{min-height:250px;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:rgba(15,23,42,.78);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 32px rgba(0,0,0,.20)}.media{height:150px;background:linear-gradient(135deg,rgba(20,184,166,.18),rgba(15,23,42,.65));display:flex;align-items:center;justify-content:center;overflow:hidden}.media img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:40px;opacity:.45}.body{padding:16px;display:flex;flex:1;flex-direction:column}.body h2{margin:9px 0 7px;font-size:19px;line-height:1.2}.body .text{font-size:14px}.body .date{margin-top:auto;padding-top:14px;margin-bottom:0}.empty,.status{padding:24px;border-radius:16px;background:rgba(15,23,42,.72);border:1px solid rgba(255,255,255,.12);text-align:center;opacity:.78}.hidden{display:none!important}@media(max-width:800px){.hero{grid-template-columns:1fr}.hero-media{min-height:230px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){body{padding:16px 11px}.top{align-items:flex-start}.title{font-size:25px}.back{padding:8px 10px}.grid{grid-template-columns:1fr}.hero-body{padding:21px}.hero h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div><div class="brand">NEXT POINT PADEL</div><div class="title">News & Comunicazioni</div><div class="subtitle">Tornei, promozioni, eventi e novità del club</div></div><button class="back" onclick="history.length>1?history.back():location.href='2Page.html'">← Indietro</button></header>
<div id="filters" class="filters hidden"></div><div id="status" class="status">Caricamento contenuti...</div><section id="hero" class="hero hidden"></section><section id="grid" class="grid"></section>
</div>
<script>
const sb=window.sb=supabase.createClient("https://iybjvtmfaupgthqqsngd.supabase.co","sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let allItems=[];let activeType='Tutti';
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function dateOf(n){return n?.data||n?.created_at||n?.date||n?.timestamp||null}
function formatDate(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'})}
function typeOf(n){return String(n?.tipo||n?.type||'Comunicazione').trim()||'Comunicazione'}
function titleOf(n){return n?.titolo||n?.title||'News'}
function textOf(n){return n?.testo||n?.text||n?.content||''}
function imageOf(n){return n?.immagine||n?.image||n?.locandina||n?.poster||''}
function linkOf(n){return n?.link||n?.url||''}
function iconOf(type){const t=type.toLowerCase();if(t.includes('torneo'))return '🏆';if(t.includes('promo'))return '🔥';if(t.includes('evento'))return '📅';if(t.includes('ricordo'))return '📸';if(t.includes('prodott'))return '🎾';if(t.includes('articol'))return '📰';return '📢'}
function orderOf(n,i){const v=Number(n?.ordine);return Number.isFinite(v)?v:i}
function sortItems(items){return [...items].sort((a,b)=>{const fa=!!(a.inEvidenza||a.featured||a.evidenza),fb=!!(b.inEvidenza||b.featured||b.evidenza);if(fa!==fb)return fb-fa;const oa=orderOf(a,999999),ob=orderOf(b,999999);if(oa!==ob)return oa-ob;return new Date(dateOf(b)||0)-new Date(dateOf(a)||0)})}
function render(){
const filters=document.getElementById('filters'),hero=document.getElementById('hero'),grid=document.getElementById('grid');
const types=['Tutti',...new Set(allItems.map(typeOf))];
filters.innerHTML=types.map(t=>`<button class="filter ${t===activeType?'active':''}" data-type="${esc(t)}">${esc(t)}</button>`).join('');
filters.classList.toggle('hidden',allItems.length===0);filters.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{activeType=b.dataset.type;render()});
const items=sortItems(activeType==='Tutti'?allItems:allItems.filter(n=>typeOf(n)===activeType));hero.classList.add('hidden');grid.innerHTML='';
if(!items.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Non ci sono contenuti pubblicati in questa categoria.</div>';return}
const featured=items.find(n=>n.inEvidenza||n.featured||n.evidenza)||items[0],rest=items.filter(n=>n!==featured);hero.classList.remove('hidden');
hero.innerHTML=`<div class="hero-media">${imageOf(featured)?`<img src="${esc(imageOf(featured))}" alt="${esc(titleOf(featured))}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}<div class="hero-placeholder" style="${imageOf(featured)?'display:none':''}">${iconOf(typeOf(featured))}</div></div><div class="hero-body"><span class="badge">${esc(typeOf(featured))}</span><h1>${esc(titleOf(featured))}</h1>${formatDate(dateOf(featured))?`<div class="date">${esc(formatDate(dateOf(featured)))}</div>`:''}<div class="text">${esc(textOf(featured))}</div>${linkOf(featured)?`<a class="hero-link" href="${esc(linkOf(featured))}" target="_blank" rel="noopener noreferrer">Scopri di più →</a>`:''}</div>`;
grid.innerHTML=rest.map(n=>`<article class="card"><div class="media">${imageOf(n)?`<img src="${esc(imageOf(n))}" alt="${esc(titleOf(n))}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}<div class="placeholder" style="${imageOf(n)?'display:none':''}">${iconOf(typeOf(n))}</div></div><div class="body"><span class="badge">${esc(typeOf(n))}</span><h2>${esc(titleOf(n))}</h2><div class="text">${esc(textOf(n))}</div>${formatDate(dateOf(n))?`<div class="date">${esc(formatDate(dateOf(n)))}</div>`:''}${linkOf(n)?`<a class="hero-link" style="margin-top:12px" href="${esc(linkOf(n))}" target="_blank" rel="noopener noreferrer">Scopri di più →</a>`:''}</div></article>`).join('');
}
async function loadNews(){const status=document.getElementById('status');try{const {data,error}=await sb.from('tornei').select('configurazione');if(error)throw error;allItems=[];(data||[]).forEach(row=>{const list=Array.isArray(row?.configurazione?.news)?row.configurazione.news:[];list.forEach(n=>allItems.push(n))});allItems=sortItems(allItems);status.classList.add('hidden');render()}catch(err){console.error('Errore caricamento News:',err);status.textContent='Impossibile caricare le news.'}}
loadNews();
</script>
</body>
</html>
