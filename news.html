<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>News - Next Point Padel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Open Sans',Arial,sans-serif;color:#fff;background:linear-gradient(rgba(7,18,32,.76),rgba(7,18,32,.86)),url('sfondo2.jpg') center/cover fixed no-repeat}a{color:inherit;text-decoration:none}.page{width:min(1120px,calc(100% - 28px));margin:auto;padding:22px 0 42px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{font-size:20px;font-weight:700}.back{padding:9px 14px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(255,255,255,.08)}.hero,.news-card,.status{border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(10,25,43,.62);backdrop-filter:blur(12px);box-shadow:0 8px 25px rgba(0,0,0,.14)}.hero{padding:26px 24px;margin-bottom:20px}.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;color:rgba(255,255,255,.74)}#newsList{display:grid;gap:14px}.news-card{padding:20px}.news-head{display:flex;justify-content:space-between;gap:14px}.news-title{margin:0;font-size:19px}.news-date{font-size:12px;color:rgba(255,255,255,.6);white-space:nowrap}.news-text{margin:12px 0 0;white-space:pre-wrap;line-height:1.65;color:rgba(255,255,255,.86)}.status{text-align:center;padding:28px 18px;color:rgba(255,255,255,.72)}.error{color:#ffd0d0}@media(max-width:650px){.page{width:calc(100% - 18px);padding-top:12px}.hero{padding:20px 18px}.hero h1{font-size:25px}.news-card{padding:16px}.news-head{display:block}.news-date{display:block;margin-top:7px}}
</style>
</head>
<body><div class="page"><div class="topbar"><div class="brand">NEXT POINT PADEL</div><a class="back" href="2Page.html">← Torna alla Home</a></div><section class="hero"><h1>News e Comunicazioni</h1><p>Le ultime comunicazioni pubblicate dal club.</p></section><main id="newsList"><div class="status">Caricamento news...</div></main></div>
<script>
'use strict';
function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m))}
function fmt(v){const d=new Date(v);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('it-IT',{dateStyle:'medium',timeStyle:'short'}).format(d)}
function render(items){const r=document.getElementById('newsList');if(!items.length){r.innerHTML='<div class="status">Nessuna comunicazione pubblicata.</div>';return}r.innerHTML=items.map(n=>`<article class="news-card"><div class="news-head"><h2 class="news-title">${esc(n.titolo||'Comunicazione')}</h2><time class="news-date">${esc(fmt(n.data))}</time></div><div class="news-text">${esc(n.testo||'')}</div></article>`).join('')}
async function loadNews(){
 const r=document.getElementById('newsList');
 try{
  const cfg=window.NEXT_POINT_SUPABASE;
  if(!cfg||!cfg.url||!cfg.anonKey)throw new Error('Configurazione Supabase non disponibile');
  const sb=window.supabase.createClient(cfg.url,cfg.anonKey);
  const {data,error}=await sb.from('tornei').select('id,nome,configurazione').eq('pubblicato',true);
  if(error)throw error;
  const all=[];(data||[]).forEach(t=>{const n=t?.configurazione?.news; if(Array.isArray(n))n.forEach(x=>all.push({...x,torneoNome:t.nome||''}))});
  all.sort((a,b)=>new Date(b.data||0)-new Date(a.data||0));render(all);
 }catch(e){console.error('Errore caricamento News:',e);r.innerHTML='<div class="status error">Impossibile caricare le comunicazioni in questo momento.</div>'}
}
loadNews();
</script></body></html>
