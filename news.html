<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>News - Next Point Padel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff}body{background:linear-gradient(rgba(5,12,24,.72),rgba(5,12,24,.82)),url('sfondo2.jpg') center/cover fixed no-repeat;padding:24px 16px}.wrap{width:min(100%,900px);margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.title{font-size:28px;font-weight:700}.back{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:9px 14px;cursor:pointer}.status{padding:18px;border-radius:14px;background:rgba(15,23,42,.72);border:1px solid rgba(255,255,255,.12);text-align:center}.news{display:grid;gap:14px}.card{background:rgba(15,23,42,.78);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.2)}.card h2{margin:0 0 8px;font-size:20px}.date{font-size:12px;opacity:.65;margin-bottom:12px}.text{white-space:pre-wrap;line-height:1.55;color:rgba(255,255,255,.9)}.empty{opacity:.75}@media(max-width:600px){body{padding:16px 12px}.title{font-size:23px}.card{padding:15px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title">News</div>
    <button class="back" onclick="history.length>1?history.back():location.href='2Page.html'">← Indietro</button>
  </div>
  <div id="status" class="status">Caricamento news...</div>
  <div id="news" class="news"></div>
</div>
<script>
const sb=window.sb=supabase.createClient("https://iybjvtmfaupgthqqsngd.supabase.co","sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

function escapeHtml(value){
  return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}
function newsDate(item){
  return item?.created_at||item?.data||item?.date||item?.timestamp||null;
}
function formatDate(value){
  if(!value)return '';
  const d=new Date(value);
  return Number.isNaN(d.getTime())?'':d.toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'});
}
async function loadNews(){
  const status=document.getElementById('status');
  const box=document.getElementById('news');
  try{
    const {data,error}=await sb.from('tornei').select('configurazione');
    if(error)throw error;
    const all=[];
    (data||[]).forEach(row=>{
      const cfg=row?.configurazione;
      const list=Array.isArray(cfg?.news)?cfg.news:[];
      list.forEach(item=>all.push(item));
    });
    all.sort((a,b)=>{
      const da=new Date(newsDate(a)||0).getTime();
      const db=new Date(newsDate(b)||0).getTime();
      return db-da;
    });
    status.style.display='none';
    if(!all.length){
      box.innerHTML='<div class="status empty">Non ci sono news pubblicate.</div>';
      return;
    }
    box.innerHTML=all.map(item=>{
      const title=item?.title||item?.titolo||'News';
      const text=item?.text||item?.testo||item?.content||'';
      const date=formatDate(newsDate(item));
      return `<article class="card"><h2>${escapeHtml(title)}</h2>${date?`<div class="date">${escapeHtml(date)}</div>`:''}<div class="text">${escapeHtml(text)}</div></article>`;
    }).join('');
  }catch(err){
    console.error('Errore caricamento News:',err);
    status.textContent='Impossibile caricare le news.';
  }
}
loadNews();
</script>
</body>
</html>
