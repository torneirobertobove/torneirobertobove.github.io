<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>News | Next Point Padel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--glass:rgba(255,255,255,.9);--line:rgba(15,23,42,.09);--text:#172033;--muted:#667085;--accent:#0f766e;--shadow:0 18px 55px rgba(15,23,42,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Open Sans',Arial,sans-serif;color:var(--text)}
body{background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(241,245,249,.88)),url('sfondo2.jpg') center/cover fixed no-repeat;padding:24px 16px 48px}.page{max-width:1180px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{font-weight:800;letter-spacing:.04em;font-size:24px}.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);background:rgba(255,255,255,.82);border:1px solid var(--line);padding:10px 15px;border-radius:999px;box-shadow:0 8px 22px rgba(15,23,42,.08)}
.heroTitle{background:var(--glass);border:1px solid rgba(255,255,255,.75);border-radius:26px;padding:26px 30px;box-shadow:var(--shadow);margin-bottom:20px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-weight:800}.heroTitle h1{margin:7px 0 5px;font-size:38px;line-height:1.08}.heroTitle p{margin:0;color:var(--muted)}
.featured{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.9);border-radius:28px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:24px}.featuredMedia{width:100%;background:#eef2f5;display:flex;align-items:center;justify-content:center;overflow:hidden}.featuredMedia img{width:100%;height:auto;max-height:650px;object-fit:contain;display:block}.featuredNoImage{min-height:240px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700}.featuredBody{padding:26px 30px 30px}.badge{display:inline-flex;width:max-content;padding:6px 10px;border-radius:999px;background:#e7f6f3;color:var(--accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.featuredBody h2{font-size:34px;line-height:1.1;margin:13px 0 8px}.date{color:var(--muted);font-size:13px;margin-bottom:15px}.text{white-space:pre-line;color:#374151;line-height:1.7;max-width:900px}.cta{display:inline-flex;width:max-content;margin-top:20px;background:var(--accent);color:white;text-decoration:none;padding:11px 17px;border-radius:12px;font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}.filter{border:1px solid var(--line);background:rgba(255,255,255,.82);padding:8px 13px;border-radius:999px;cursor:pointer;color:#344054;font-weight:600}.filter.active{background:#172033;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.8);border-radius:22px;overflow:hidden;box-shadow:0 12px 35px rgba(15,23,42,.09);display:flex;flex-direction:column}.cardMedia{aspect-ratio:16/10;background:#eef2f5;display:flex;align-items:center;justify-content:center;overflow:hidden}.cardMedia img{width:100%;height:100%;object-fit:cover}.cardBody{padding:18px}.cardBody h3{margin:8px 0 7px;font-size:20px;line-height:1.2}.cardBody p{margin:0;color:#5b6472;line-height:1.55;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.smallDate{font-size:12px;color:var(--muted)}.empty{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:35px;text-align:center;color:var(--muted)}.loading{text-align:center;padding:50px;color:var(--muted)}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.heroTitle h1{font-size:31px}.featuredBody h2{font-size:29px}}
@media(max-width:560px){body{padding:14px 10px 35px}.top{align-items:flex-start}.brand{font-size:20px}.heroTitle{padding:21px}.featuredBody{padding:22px 20px}.featuredBody h2{font-size:27px}.grid{grid-template-columns:1fr}.featuredMedia img{max-height:none}}
</style>
</head>
<body>
<div class="page">
<div class="top"><div class="brand">NEXT POINT PADEL</div><a class="back" href="2Page.html">← Torna al sito</a></div>
<section class="heroTitle"><div class="eyebrow">Comunicazioni & contenuti</div><h1>News</h1><p>Tornei, promozioni, eventi, ricordi e novità del club.</p></section>
<main id="app"><div class="loading">Caricamento delle News…</div></main>
</div>
<script>
const SUPABASE_URL='https://iybjvtmfaupgthqqsngd.supabase.co';
const SUPABASE_KEY='sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let allNews=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function normalizeNews(row){const cfg=row?.configurazione||{};const arr=Array.isArray(cfg.news)?cfg.news:[];return arr.map((n,i)=>({...n,__torneo:row.nome||'',__torneoId:row.id,__index:i,__ordine:Number(n.ordine)||999999,__data:n.data||row.updated_at||row.data_torneo||row.data||''}))}
function formatDate(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'})}
function sortNews(a,b){if(Boolean(b.inEvidenza)!==Boolean(a.inEvidenza))return b.inEvidenza?1:-1;if(a.__ordine!==b.__ordine)return a.__ordine-b.__ordine;return String(b.__data).localeCompare(String(a.__data))}
function imageTag(src,alt,cls){return src?`<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:''}
function render(list=allNews){const app=document.getElementById('app');if(!list.length){app.innerHTML='<div class="empty">Non ci sono News pubblicate al momento.</div>';return}const featured=list.find(n=>n.inEvidenza)||list[0];const cats=['Tutte',...new Set(list.map(n=>n.tipo||'Comunicazione'))];const cards=list.filter(n=>n!==featured);app.innerHTML=`<section class="featured"><div class="featuredMedia">${featured.immagine?imageTag(featured.immagine,featured.titolo||'Locandina',''): '<div class="featuredNoImage">News in evidenza</div>'}</div><div class="featuredBody"><span class="badge">${esc(featured.tipo||'Comunicazione')}</span><h2>${esc(featured.titolo||'Senza titolo')}</h2><div class="date">${esc(formatDate(featured.__data))}${featured.__torneo?' · '+esc(featured.__torneo):''}</div><div class="text">${esc(featured.testo||'')}</div>${featured.link?`<a class="cta" href="${esc(featured.link)}" target="_blank" rel="noopener">Scopri di più →</a>`:''}</div></section><div class="filters">${cats.map((c,i)=>`<button class="filter ${i===0?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><section class="grid" id="newsGrid">${cards.map(cardHtml).join('')}</section>`;document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const cat=btn.dataset.cat;document.getElementById('newsGrid').innerHTML=list.filter(n=>n!==featured&&(cat==='Tutte'||(n.tipo||'Comunicazione')===cat)).map(cardHtml).join('')}))}
function cardHtml(n){return `<article class="card">${n.immagine?`<div class="cardMedia">${imageTag(n.immagine,n.titolo||'News','')}</div>`:''}<div class="cardBody"><span class="smallDate">${esc(n.tipo||'Comunicazione')} · ${esc(formatDate(n.__data))}</span><h3>${esc(n.titolo||'Senza titolo')}</h3><p>${esc(n.testo||'')}</p>${n.link?`<a class="cta" href="${esc(n.link)}" target="_blank" rel="noopener">Apri →</a>`:''}</div></article>`}
async function load(){const {data,error}=await sb.from('tornei').select('id,nome,data,data_torneo,updated_at,configurazione').order('updated_at',{ascending:false});if(error){document.getElementById('app').innerHTML='<div class="empty">Le News non sono momentaneamente disponibili.</div>';console.error(error);return}allNews=(data||[]).flatMap(normalizeNews).filter(n=>n.titolo||n.immagine||n.testo).sort(sortNews);render(allNews)}
load();
</script>
</body>
</html>
