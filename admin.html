<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Padel Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@Supabase/supabase-js@2"></script>
<style>
:root{--bg:#080b10;--panel:#111720;--panel2:#171e28;--line:#293241;--text:#f4f7fb;--muted:#9aa6b5;--accent:#35d07f;--blue:#4da3ff;--red:#ff5d6c;}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#172231 0,#080b10 45%);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;font-weight:700}.hidden{display:none!important}
#boxLoginAdmin{max-width:430px;margin:12vh auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px #0008}#boxLoginAdmin h1{text-align:center}#boxLoginAdmin input{width:100%;margin:6px 0;padding:11px;background:#0b1017;border:1px solid var(--line);border-radius:8px;color:white}.btn-green{background:var(--accent);color:#06130c}
#areaAdmin{max-width:1500px;margin:auto;padding:18px;min-height:100vh}#areaAdmin>h1{margin:0 0 16px;font-size:24px}.admin-shell{display:grid;grid-template-columns:230px 1fr;gap:16px}.admin-nav,.admin-main{background:rgba(17,23,32,.96);border:1px solid var(--line);border-radius:14px}.admin-nav{padding:12px;position:sticky;top:16px;height:max-content}.admin-nav button{display:block;width:100%;margin:5px 0;text-align:left;background:transparent;color:var(--text);border:1px solid transparent}.admin-nav button:hover,.admin-nav button.active{background:var(--panel2);border-color:var(--line)}.admin-main{padding:18px;min-height:75vh}.admin-section{background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;padding:14px}.admin-section summary{cursor:pointer;font-weight:800;font-size:16px}.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.admin-section input,.admin-section select,.admin-section textarea{width:100%;margin-top:5px;padding:10px;background:#0b1017;border:1px solid var(--line);border-radius:8px;color:white}.admin-section textarea{min-height:90px;resize:vertical}.admin-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.admin-actions button{background:#202a37;color:white}.admin-actions .btn-green{background:var(--accent);color:#06130c}.btn-red{background:var(--red)!important;color:white!important}.lista-item,.admin-card-dati{background:#0d131b;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#263140;color:#cbd5e1;font-size:12px}.admin-muted{color:var(--muted)}
@media(max-width:800px){.admin-shell{grid-template-columns:1fr}.admin-nav{position:static}.admin-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="boxLoginAdmin" class="card">
<h1>🎾 Admin Padel Manager</h1><div>🔐 Accesso Admin</div>
<label>Email amministratore</label><input id="adminEmail" type="email">
<label>Password</label><input id="adminPassword" type="password">
<button id="btnLoginAdmin" class="btn-green" onclick="loginAdmin()">Accedi</button>
<div id="loginMessaggio"></div>
</div>
<div id="areaAdmin" class="hidden">
<h1>🎾 Admin Padel Manager</h1>
<div class="admin-shell">
<nav class="admin-nav">
<button onclick="document.getElementById('nuovoTorneoPanel').open=true;document.getElementById('nuovoTorneoPanel').scrollIntoView()">➕ Nuovo torneo</button>
<button onclick="document.getElementById('torneiPanel').open=true;document.getElementById('torneiPanel').scrollIntoView()">📋 Tornei</button>
<button onclick="document.getElementById('gestioneTorneoAdmin').classList.remove('hidden');document.getElementById('gestioneTorneoAdmin').scrollIntoView()">👥 Iscritti / gestione</button>
<button onclick="document.getElementById('creaCoppieBox').scrollIntoView()">🔀 Coppie</button>
<button onclick="document.getElementById('linkBoveGenerato').scrollIntoView()">📋 Tabellone / Bove</button>
<button onclick="document.getElementById('whatsappPanel').scrollIntoView()">📲 WhatsApp</button>
<button onclick="document.getElementById('newsPanel').scrollIntoView()">📰 News</button>
<button onclick="document.getElementById('sponsorPanel').scrollIntoView()">🏆 Sponsor</button>
<button onclick="apriRegoleNuovoTorneo()">⚙️ Regole</button>
</nav>
<main class="admin-main">
<details id="nuovoTorneoPanel" class="admin-section"><summary>➕ Crea nuovo torneo</summary>
<div class="admin-grid"><div><label>Nome torneo</label><input id="adminNomeTorneo"></div><div><label>Data torneo</label><input id="adminDataTorneo" type="date"></div><div><label>Squadre</label><select id="adminPosti"><option>8</option><option>12</option><option>16</option><option>20</option><option>24</option></select></div><div><label>Giocatori ammessi</label><input id="adminGiocatori"></div></div>
<label>Descrizione</label><textarea id="adminDescrizione"></textarea><div class="admin-actions"><button class="btn-green" onclick="creaNuovoTorneo()">➕ CREA TORNEO</button></div></details>
<details id="torneiPanel" class="admin-section"><summary>📋 Tornei creati</summary><div id="listaTorneiAdmin"></div></details>
<div id="gestioneTorneoAdmin" class="admin-section hidden"><h2>⚙️ Gestione torneo</h2><div id="dettaglioTorneoAdmin"></div><div class="admin-actions"><button onclick="pubblicaTorneo()">📢 Pubblica torneo</button><button onclick="chiudiIscrizioniTorneo()">🔒 Chiudi iscrizioni</button><button onclick="caricaRichiesteIscrizione()">🔄 Aggiorna iscritti</button><button onclick="creaIscrittiTest()">🧪 Crea iscritti test</button><button onclick="inviaWhatsAppTutti()">📲 WhatsApp tutti</button><button onclick="inviaWhatsAppApprovati()">📲 Solo approvati</button><button onclick="generaLinkBove()">🔗 Genera link Bove</button><button onclick="apriBoveConTorneo(adminState.torneoSelezionato)">🚀 Apri torneo</button><button onclick="copiaLinkBove()">📋 Copia link</button></div><input id="linkBoveGenerato" readonly>
<h3>👤 Richieste giocatori</h3><div id="richiesteIscrizione"></div><h3>👥 Partecipanti approvati</h3><div id="partecipantiAdmin"></div>
<div id="schedaGiocatoreAdmin" class="hidden"><h3>👤 Dati giocatore</h3><input id="adminNomeGiocatore"><input id="adminEmailGiocatore"><input id="adminTelefonoGiocatore"><input id="adminLivelloGiocatore"><textarea id="adminNotaGiocatore"></textarea><div class="admin-actions"><button onclick="approvaGiocatore()">✅ Approva</button><button class="btn-red" onclick="rifiutaGiocatore()">❌ Rifiuta</button></div></div>
<h3>🔀 Coppie</h3><div id="creaCoppieBox"></div><div id="listaCoppieAdmin"></div>
<div id="whatsappPanel"><h3>📲 WhatsApp</h3><textarea id="messaggioWhatsApp"></textarea></div></div>
<details id="newsPanel" class="admin-section"><summary>📰 Gestione News</summary><input id="newsTitolo" placeholder="Titolo News"><textarea id="newsTesto" placeholder="Testo News"></textarea><input id="newsImmagine" placeholder="Immagine News (URL)"><div class="admin-actions"><button onclick="creaNews()">➕ Pubblica News</button></div><div id="listaNewsAdmin"></div></details>
<details id="sponsorPanel" class="admin-section"><summary>🏆 Gestione Sponsor</summary><input id="sponsorNome" placeholder="Nome sponsor / azienda"><input id="sponsorImmagine" placeholder="Immagine / Logo (URL)"><input id="sponsorVideo" placeholder="Video in loop (URL)"><input id="sponsorLink" placeholder="Link sponsor"><div class="admin-actions"><button onclick="salvaSponsor()">💾 Salva sponsor</button></div><div id="listaSponsorAdmin"></div></details>
</main></div></div>
<script>
/* LOGICA ORIGINALE PRESERVATA: il file di test usa la stessa struttura degli ID e delle funzioni dell'admin attuale. Le funzioni originali verranno reinserite integralmente nel test dopo la verifica grafica. */
</script>
</body>
</html>
