<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Padel Manager</title>
<style>html,body{margin:0;width:100%;height:100%;background:#070b11;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#070b11}</style>
</head>
<body>
<iframe id="adminFrame" src="admin-original-backup-2026-08-31.html" title="Admin Padel Manager"></iframe>
<script>
(function(){
const frame=document.getElementById('adminFrame');
function apply(){
 try{
  const d=frame.contentDocument,area=d&&d.getElementById('areaAdmin');
  if(!d||!area||area.classList.contains('hidden'))return;
  if(d.getElementById('adminDesktopSidebar'))return;
  const details=[...area.children].filter(e=>e.tagName==='DETAILS');
  const gestione=d.getElementById('gestioneTorneoAdmin');
  if(details.length<4||!gestione)return;
  const [nuovo,tornei,news,sponsor]=details;
  nuovo.id='desktopNuovoTorneo';tornei.id='desktopTornei';news.id='desktopNews';sponsor.id='desktopSponsor';
  const style=d.createElement('style');
  style.textContent=`html,body{background:#070b11!important;color:#eef3f8!important;overflow-x:hidden!important}body{padding:0!important;margin:0!important;min-height:100vh!important}.btn-indietro{display:none!important}.container{max-width:none!important;width:100%!important;margin:0!important;padding:0!important}#areaAdmin{width:100%!important;max-width:none!important;margin:0!important;padding:0!important;display:grid!important;grid-template-columns:240px minmax(0,1fr)!important;grid-template-rows:68px minmax(0,1fr)!important;min-height:100vh!important;background:#070b11!important}#areaAdmin>h1{display:none!important}#adminDesktopSidebar{grid-column:1!important;grid-row:1/3!important;background:#0d131c!important;border-right:1px solid #293646!important;padding:20px 14px!important;display:flex!important;flex-direction:column!important;gap:7px!important}#adminDesktopBrand{padding:3px 8px 20px!important;margin-bottom:10px!important;border-bottom:1px solid #293646!important;font-weight:800!important;letter-spacing:1px!important}#adminDesktopBrand small{display:block!important;color:#7f8b9a!important;font-size:10px!important;margin-top:4px!important}.adminDesktopNavBtn{width:100%!important;margin:0!important;padding:12px!important;border:1px solid transparent!important;border-radius:9px!important;background:transparent!important;color:#cbd5e1!important;text-align:left!important;font-weight:700!important;cursor:pointer!important}.adminDesktopNavBtn:hover,.adminDesktopNavBtn.active{background:#1b2735!important;border-color:#344456!important;color:#fff!important}#adminDesktopTopbar{grid-column:2!important;grid-row:1!important;background:#0d131c!important;border-bottom:1px solid #293646!important;padding:0 22px!important;display:flex!important;align-items:center!important}#adminDesktopTopbar strong{font-size:16px!important}#adminDesktopTopbar span{display:block!important;color:#7f8b9a!important;font-size:11px!important;margin-top:4px!important}#adminDesktopWorkspace{grid-column:2!important;grid-row:2!important;min-width:0!important;padding:22px!important;overflow:auto!important}#adminDesktopWorkspace>details,#adminDesktopWorkspace>#gestioneTorneoAdmin{max-width:1200px!important;margin:0 auto 14px!important;background:#111923!important;border:1px solid #293646!important;border-radius:12px!important;padding:14px!important;box-shadow:0 8px 30px rgba(0,0,0,.25)!important}#adminDesktopWorkspace summary{color:#fff!important;font-weight:800!important;cursor:pointer!important}#adminDesktopWorkspace input,#adminDesktopWorkspace select,#adminDesktopWorkspace textarea{background:#0a1017!important;color:#fff!important;border:1px solid #303d4c!important;border-radius:8px!important}#adminDesktopWorkspace button{border-radius:8px!important}@media(max-width:850px){#areaAdmin{display:block!important;min-height:100vh!important}#adminDesktopSidebar{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;border-right:0!important;border-bottom:1px solid #293646!important}#adminDesktopTopbar{height:64px!important}#adminDesktopWorkspace{padding:12px!important}}`;
  d.head.appendChild(style);
  const nav=d.createElement('aside');nav.id='adminDesktopSidebar';nav.innerHTML='<div id="adminDesktopBrand">🎾 ADMIN<small>PADEL MANAGER</small></div>';
  const top=d.createElement('header');top.id='adminDesktopTopbar';top.innerHTML='<div><strong>Gestione amministrazione</strong><span>Configurazione e gestione tornei</span></div>';
  const main=d.createElement('main');main.id='adminDesktopWorkspace';
  function add(icon,label,target){const b=d.createElement('button');b.type='button';b.className='adminDesktopNavBtn';b.textContent=icon+' '+label;b.onclick=function(){nav.querySelectorAll('.adminDesktopNavBtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');const e=d.getElementById(target);if(e){if(e.tagName==='DETAILS')e.open=true;e.scrollIntoView({behavior:'smooth',block:'start'})}};nav.appendChild(b);return b}
  add('➕','Nuovo torneo','desktopNuovoTorneo').classList.add('active');add('📋','Tornei creati','desktopTornei');add('👥','Gestione torneo','gestioneTorneoAdmin');add('📰','News','desktopNews');add('🏆','Sponsor','desktopSponsor');
  area.innerHTML='';area.append(nav,top,main);main.append(nuovo,tornei,gestione,news,sponsor);
  console.log('ADMIN DESKTOP OK — MOTORE ORIGINALE INVARIATO');
 }catch(e){console.error('Admin desktop:',e)}
}
frame.addEventListener('load',function(){setTimeout(apply,50);setTimeout(apply,500);setTimeout(apply,1500);});
setInterval(apply,1000);
})();
</script>
</body>
</html>
