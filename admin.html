<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Tournament Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{ --blue:#004a99; --gold:#ffeb3b; --glass:rgba(255,255,255,.15); --border:rgba(255,255,255,.25); --text:#555; --green:#16a34a; --red:#dc2626; --accent:#004a99; }
        *{ box-sizing:border-box; }
        html,body{ width:100%; min-height:100%; overflow-x:hidden; }
        body{ margin:0; padding:20px; min-height:100vh; background: linear-gradient(rgba(0,0,0,.20), rgba(0,0,0,.20)), url("sfondo_admin.jpg") center center / cover no-repeat fixed; font-family:"Open Sans",sans-serif; font-size:13px; line-height:18.57px; color:#fff; }
        .container{ width:100%; max-width:1000px; margin:auto; }
        .card{ background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); border-radius:14px; padding:20px; margin-bottom:15px; box-shadow:0 8px 25px rgba(0,0,0,.22); }
        h1,h2,h3{ color:#fff; font-weight:600; }
        h1{ font-size:22px; } h2{ font-size:18px; } h3{ font-size:16px; }
        input,select,textarea{ width:100%; padding:10px; margin:8px 0 15px; border-radius:8px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.9); color:#333; }
        button{ background:var(--accent); color:white; border:0; padding:10px 18px; border-radius:8px; cursor:pointer; margin:5px; }
        button:hover{ opacity:.85; }
        .btn-green{ background:var(--green); }
        .btn-red{ background:var(--red); }
        .hidden{ display:none; }
        .lista-item{ background:rgba(0,0,0,.25); padding:12px; border-radius:8px; margin:8px 0; }
        .badge{ background:rgba(0,0,0,.35); padding:5px 10px; border-radius:20px; display:inline-block; }
        details{ background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.35); border-radius:12px; padding:15px 20px; margin-bottom:15px; }
        summary{ cursor:pointer; font-weight:600; display:flex; align-items:center; justify-content:space-between; }
        .btn-indietro{ position:fixed; top:12px; right:12px; background:transparent; color:white; border:none; font-size:22px; cursor:pointer; }
    </style>
</head>
<body>
    <button class="btn-indietro" onclick="history.back()">→</button>
    <div class="container">
        <div id="boxLoginAdmin" class="card">
            <h1>🎾 Admin Padel Manager</h1>
            <h2>🔐 Accesso Admin</h2>
            <label>Email</label>
            <input id="adminEmail" type="email">
            <label>Password</label>
            <input id="adminPassword" type="password">
            <button type="button" id="btnLoginAdmin" class="btn-green">Accedi</button>
            <div id="loginMessaggio"></div>
        </div>

        <div id="areaAdmin" class="hidden">
            <h1>🎾 Admin Padel Manager</h1>
            <details>
                <summary>➕ Crea nuovo torneo</summary>
                <div>
                    <label>Nome torneo</label><input id="adminNomeTorneo">
                    <label>Data</label><input id="adminDataTorneo" type="date">
                    <label>Squadre</label>
                    <select id="adminPosti" onchange="aggiornaGiocatoriAdmin()">
                        <option value="8">8</option>
                        <option value="12">12</option>
                        <option value="16">16</option>
                        <option value="20">20</option>
                        <option value="24">24</option>
                    </select>
                    <input id="adminGiocatori" type="number" readonly>
                    <button onclick="creaNuovoTorneo()" class="btn-green">➕ CREA TORNEO</button>
                </div>
            </details>
            <details>
                <summary>📋 Tornei creati</summary>
                <div id="listaTorneiAdmin"></div>
            </details>
        </div>
    </div>

    <script>
        const sb = window.supabase.createClient(
            "https://iybjvtmfaupgthqqsngd.supabase.co",
            "sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl"
        );

        let adminState = { adminLoggato:false, tornei:[] };
        function salvaAdminState() { localStorage.setItem("padel_admin_state", JSON.stringify(adminState)); }
        
        async function caricaTorneiSupabase() {
            const { data } = await sb.from("tornei").select("*").order("id", { ascending:false });
            if(data) { adminState.tornei = data; salvaAdminState(); }
        }

        async function loginAdmin() {
            const email = document.getElementById("adminEmail").value.trim();
            const password = document.getElementById("adminPassword").value.trim();
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if(error) { document.getElementById("loginMessaggio").innerHTML = "Errore!"; return; }
            document.getElementById("boxLoginAdmin").style.display = "none";
            document.getElementById("areaAdmin").classList.remove("hidden");
            await caricaTorneiSupabase();
        }

        function aggiornaGiocatoriAdmin() {
            const squadre = Number(document.getElementById("adminPosti").value) || 8;
            document.getElementById("adminGiocatori").value = squadre * 2;
        }
        async function caricaRichiesteIscrizione() {
            if (!adminState.torneoSelezionato) return;
            try {
                const { data, error } = await sb.from("iscrizioni").select("*").eq("torneo_id", adminState.torneoSelezionato);
                if (error) throw error;
                
                window.iscrizioniTorneo = Array.isArray(data) ? data : [];
                const approvati = window.iscrizioniTorneo.filter(g => g.stato === "approvato");
                
                console.log(
                    "AGGIORNAMENTO ISCRITTI COMPLETATO:",
                    {
                        totale: window.iscrizioniTorneo.length,
                        approvati: approvati.length
                    }
                );
            } catch (e) {
                console.error("Errore caricamento richieste iscrizione:", e);
                alert("Errore nel caricamento delle iscrizioni.");
            }
        }

        // Listener per inizializzare le funzioni all'avvio
        document.addEventListener("DOMContentLoaded", () => {
            const btnLogin = document.getElementById("btnLoginAdmin");
            if (btnLogin) {
                btnLogin.addEventListener("click", loginAdmin);
            }
            // Inizializza il numero giocatori al caricamento
            aggiornaGiocatoriAdmin();
        });
    </script>
</body>
</html>
