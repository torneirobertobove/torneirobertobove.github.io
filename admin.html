<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gestione Tornei</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="admin-layout-v1.css?v=1"><script src="admin-functions.js?v=clean1"></script><script src="admin-function-fixes-v1.js?v=25"></script><script src="admin-auth-guard-v1.js?v=6"></script></head><body><div id="boxLoginAdmin" class="login-wrap"><div class="login-card"><h1>🏆 Gestione Tornei</h1><h2>Accesso amministratore</h2><label for="adminEmail">Email</label><input id="adminEmail" type="email" autocomplete="username"><label for="adminPassword">Password</label><input id="adminPassword" type="password" autocomplete="current-password"><button class="btn primary" onclick="loginAdmin()">Accedi</button><div id="loginMessaggio" class="login-msg"></div></div></div><div id="areaAdmin" class="app hidden"><aside class="sidebar"><div class="brand"><div class="brand-title">🏆 ADMIN TORNEI</div><div class="brand-sub">Console unica di gestione</div></div><div class="nav-group"><div class="nav-label">Torneo</div><nav class="nav"><button class="active" data-page="torneo">🏆 Gestione torneo</button><button data-page="iscritti">👥 Iscritti</button><button data-page="partecipanti">👤 Partecipanti</button><button data-page="coppie">🤝 Coppie</button><button data-page="dati">⚙️ Dati torneo</button></nav></div><div class="nav-group"><div class="nav-label">Campo</div><nav class="nav"><button id="sideTabellone">🏟️ Tabellone</button><button id="sideCalendario">📅 Calendario</button></nav></div><div class="nav-group"><div class="nav-label">Sistema</div><nav class="nav"><button id="sideRefresh">↻ Aggiorna</button></nav></div><div class="sidebar-footer">Amministratore<br><b id="adminEmailMini">-</b><button onclick="logoutAdmin()">Esci</button></div></aside><main class="main"><header class="topbar"><button class="btn mobile-menu" id="mobileMenu">☰</button><div class="topbar-title" id="topbarTitle">Gestione torneo</div><div class="topbar-spacer"></div><div class="topbar-actions"><button class="btn hide-mobile" id="topRefresh">↻ Aggiorna</button><button class="btn primary" id="topNew">＋ Nuovo torneo</button></div></header><section class="content"><div id="appContent"></div><input type="hidden" id="adminNomeTorneo"><input type="hidden" id="adminDataTorneo"><input type="hidden" id="adminPosti" value="8"><input type="hidden" id="adminGiocatori" value="16"><input type="hidden" id="adminDescrizione"><input type="hidden" id="linkBoveGenerato"></section></main></div><div class="mobile-overlay" id="mobileOverlay"><div class="mobile-drawer"><button class="mobile-close" id="mobileClose">×</button><div class="mobile-nav"><button data-page="torneo">🏆 Gestione torneo</button><button data-page="iscritti">👥 Iscritti</button><button data-page="partecipanti">👤 Partecipanti</button><button data-page="coppie">🤝 Coppie</button><button data-page="dati">⚙️ Dati torneo</button></div></div></div><script src="admin-layout-v2.js?v=1"></script><script src="admin-approval-sync-v1.js?v=1"></script><script>(function(){function openNew(){const b=document.getElementById('topNew');if(b){b.id='btnNuovoTorneo';b.click()}}document.getElementById('topNew')?.addEventListener('click',openNew);document.getElementById('sideRefresh')?.addEventListener('click',()=>window.refreshCleanAdmin?.());document.getElementById('topRefresh')?.addEventListener('click',()=>window.refreshCleanAdmin?.());document.getElementById('sideTabellone')?.addEventListener('click',()=>{const t=window.adminState?.tornei?.find(x=>String(x.id)===String(window.adminState?.torneoSelezionato));if(t)window.apriBoveConTorneo?.(t.id)});document.getElementById('sideCalendario')?.addEventListener('click',()=>alert('Il calendario del torneo selezionato resta nella gestione torneo esistente.'));document.getElementById('mobileMenu')?.addEventListener('click',()=>document.getElementById('mobileOverlay')?.classList.add('open'));document.getElementById('mobileClose')?.addEventListener('click',()=>document.getElementById('mobileOverlay')?.classList.remove('open'));document.querySelectorAll('.mobile-nav [data-page]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('mobileOverlay')?.classList.remove('open');window.openAdminPage?.(b.dataset.page)}));})();</script></body></html>
