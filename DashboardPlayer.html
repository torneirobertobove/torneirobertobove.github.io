<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Player</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
--bg-image:url('https://torneirobertobove.github.io/sfondo2.jpg');
}


body{

margin:0;

background-image:var(--bg-image);

background-size:cover;

background-position:center;

background-attachment:fixed;

font-family:sans-serif;

color:white;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}



.container{

width:100%;

max-width:500px;

}



.box{


background:rgba(255,255,255,0.15);


backdrop-filter:blur(10px);


padding:30px;


border-radius:25px;


box-shadow:

0 8px 32px rgba(0,0,0,.4);


}



.logo{


width:140px;


display:block;


margin:0 auto 10px;


}



h2{


text-align:center;


margin-top:5px;


}


.card{


background:rgba(0,0,0,0.25);


padding:15px;


border-radius:15px;


margin-top:15px;


}


h3{


margin-top:0;


color:#ffeb3b;


}


.news-item{


padding:10px 0;


border-bottom:1px solid rgba(255,255,255,.2);


}


.calendar-item{


background:rgba(255,255,255,.12);


padding:12px;


border-radius:10px;


margin:10px 0;


}


  button{

width:100%;

padding:13px;

margin-top:10px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}



.btn{

background:white;

color:#004a99;

}



.btn-back{

background:#333;

color:white;

}



.errore{

color:#ff5555;

text-align:center;

}



.caricamento{

text-align:center;

opacity:.8;

}



</style>

</head>


<body>


<div class="container">


<div class="box">


<img src="logo.jpg" class="logo">


<h2>
🎾 Dashboard Giocatore
</h2>


<div id="utenteInfo"
style="text-align:center;opacity:.9">

Caricamento profilo...

</div>


<div class="card">


<h3>
📰 News & Mercatino
</h3>


<div class="news-item">

Prossima apertura mercatino racchette usate.

</div>


<div class="news-item">

Aggiornamento regolamento tornei estate 2026.

</div>


</div>


<div class="card">


<h3>
📅 Calendario Tornei
</h3>


<div id="calendarioList">


<div class="caricamento">

Caricamento tornei...

</div>


</div>


</div>


<script>


const sb = supabase.createClient(

"https://iybjvtmfaupgthqqsngd.supabase.co",

"sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",

{

auth:{

persistSession:true,

autoRefreshToken:true,

detectSessionInUrl:true

}

}

);



async function inizializzaDashboard(){


const {

data:{
session
}

}

=

await sb.auth.getSession();



if(!session){


window.location.href="index.html";


return;


}



document.getElementById("utenteInfo").innerHTML=

"👤 "+session.user.email;



await caricaTornei();



}


  async function caricaTornei(){


const box=

document.getElementById(
"calendarioList"
);



const {

data,

error

}

=

await sb

.from("tornei")

.select(
"id,nome,data,posti,stato,pubblicato"
)

.eq(
"pubblicato",
true
)

.order(
"data",
{
ascending:true
}
);



if(error){


console.error(

"Errore caricamento tornei:",

error

);



box.innerHTML=

`

<div class="errore">

❌ Errore caricamento tornei

</div>

`;



return;


}




if(!data || data.length===0){


box.innerHTML=

`

<div class="calendar-item">

Nessun torneo disponibile

</div>

`;



return;


}




box.innerHTML="";




data.forEach(torneo=>{


let chiuso=

torneo.stato==="chiuso";




box.innerHTML +=



`

<div class="calendar-item">


<b>

🏆 ${torneo.nome || "Torneo senza nome"}

</b>


<br><br>


📅 ${torneo.data || "-"}


<br>


👥 Posti:

${torneo.posti || "-"}



<br>



${

chiuso

?

"❌ Iscrizioni chiuse"

:

"🟢 Iscrizioni aperte"

}



<button

class="btn"

onclick="vaiIscrizione(${torneo.id})"

${chiuso ? "disabled" : ""}

>


${

chiuso

?

"Chiuso"

:

"Iscriviti"

}


</button>



</div>

`;



});



}

  id="q8r4zs"
function vaiIscrizione(id){


window.location.href=

"iscrizione.html?torneo="+id;



}





inizializzaDashboard();




</script>



<button

class="btn-back"

onclick="location.href='2Page.html'"

>

⬅ Torna Dashboard

</button>



</div>


</div>


</body>


</html>
