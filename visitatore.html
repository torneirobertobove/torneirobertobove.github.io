<html lang="it">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tornei Disponibili</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
background:#0f172a;
color:#fff;
font-family:system-ui,-apple-system,sans-serif;
padding:20px;
}

.card{
background:#111827;
padding:20px;
border-radius:15px;
border:1px solid #243041;
max-width:700px;
margin:auto;
}

h2{
text-align:center;
color:#10b981;
}

.torneo-item{
background:#1f2937;
padding:15px;

border-radius:8px;
}

.btn-iscriviti{
background:#10b981;

border:0;

}

.lista{

.back-btn{

}

}

</style>

<body>


<div class="card">


<h2>
🏆 Tornei Disponibili
</h2>



<div id="lista-tornei">

<div class="caricamento">
Caricamento tornei...
</div>

</div>



<button class="back-btn" onclick="location.href='2Page.html'">

Torna alla Dashboard

</button>



</div>





<script>


const sb = supabase.createClient(

"https://iybjvtmfaupgthqqsngd.supabase.co",

);





async function verificaLogin(){


const {

data:{
user

}

}

=
await sb.auth.getUser();



if(!user){


window.location.href="login.html";

return null;


}


return user;


}






async function caricaTornei(){


const box=document.getElementById(
"lista-tornei"
);



box.innerHTML=`

<div class="caricamento">

⏳ Caricamento tornei...

</div>

`;





const {

data,

error

}

=
await sb

.from("tornei")

.select(
"id,nome,data,posti,stato,pubblicato,configurazione"
)

.eq(
"pubblicato",
true
)

.order(
"data",
{
ascending:true
}

);





console.log(
"TORNEI PUBBLICATI:",
data
);


console.log(
"ERRORE TORNEI:",
error
);





if(error){


box.innerHTML=`

<div class="torneo-item errore">

❌ Errore caricamento tornei

<br>

${error.message}

</div>

`;


return;

}





if(!data || data.length===0){


box.innerHTML=`

<div class="torneo-item">

Nessun torneo disponibile

</div>

`;


return;

}





box.innerHTML="";



for(const torneo of data){


await creaSchedaTorneo(torneo);


}



}

  async function creaSchedaTorneo(torneo){


const box=document.getElementById(
"lista-tornei"
);



let configurazione =
torneo.configurazione || {};



let numeroSquadre=8;



if(
configurazione.rules &&
configurazione.rules.numeroSquadre
){

numeroSquadre =
Number(configurazione.rules.numeroSquadre);

}


const massimoGiocatori =
Number(torneo.posti) ||
(numeroSquadre * 2);





const {

data:iscritti,

error

}

=
await sb

.from("iscrizioni")

.select(
"id,nome_giocatore,stato"
)

.eq(
"torneo_id",
torneo.id
)

.eq(
"stato",
"approvato"
);





if(error){

console.error(
"Errore iscrizioni:",
error
);

}



const listaIscritti =
iscritti || [];



const numeroIscritti =
listaIscritti.length;



const disponibili =
massimoGiocatori - numeroIscritti;



const chiuso =
numeroIscritti >= massimoGiocatori;





let listaHTML="";



if(listaIscritti.length){


listaIscritti.forEach(
(g,i)=>{


listaHTML += `

<div style="
padding:5px;
border-bottom:1px solid #374151">

${i+1})
${g.nome_completo || g.nome_giocatore || "Anonimo"}

</div>

`;

});


}

else{


listaHTML=

"<div style='color:#94a3b8'>Nessun giocatore iscritto</div>";



}







let squadreHTML="";



for(
let i=0;
i<listaIscritti.length-1;
i+=2
){


let g1 =
listaIscritti[i];


let g2 =
listaIscritti[i+1];



if(g1 && g2){


squadreHTML += `

<div style="
background:#064e3b;
padding:10px;
border-radius:8px;
margin-top:6px">

🎾 Squadra ${Math.floor(i/2)+1}

<br>

<b>
${g1.nome_completo || g1.nome_giocatore || "Giocatore 1"}
</b>

<br>

+

<br>

<b>
${g2.nome_completo || g2.nome_giocatore || "Giocatore 2"}
</b>


</div>

`;

}


}







box.innerHTML += `

<div class="torneo-item">


<h3 style="
color:#10b981;
margin-top:0">

🏆 ${torneo.nome}

</h3>




<div>

📅 Data:
<b>${torneo.data || "-"}</b>

</div>



<div style="margin-top:8px">

🎾 Formato:

<b>
${numeroSquadre} squadre
</b>

<br>

👥 Massimo:
<b>
${massimoGiocatori} giocatori
</b>

</div>




<div style="margin-top:8px">


👥 Iscritti:

<b>
${numeroIscritti}/${massimoGiocatori}
</b>


</div>




<div style="
margin-top:10px;
font-weight:bold">


${
chiuso

?

"<span style='color:#ef4444'>❌ ISCRIZIONI CHIUSE</span>"

:

"<span style='color:#22c55e'>✅ Posti disponibili: "+disponibili+"</span>"

}


</div>





<button

class="btn-iscriviti"

onclick="vaiIscrizione(${torneo.id})"

${chiuso ? "disabled" : ""}

>


${chiuso ? "Chiuso" : "Iscriviti"}


</button>





<div class="lista">


<h4>

👥 Lista iscritti

</h4>


${listaHTML}


</div>






<div class="lista">


<h4>

🎾 Squadre create

</h4>


${

squadreHTML ||

"<div style='color:#94a3b8'>In attesa della prima coppia</div>"

}


</div>




</div>


`;



}






function vaiIscrizione(id){


window.location.href =
"iscrizione.html?torneo="+id;


}







async function avviaPagina(){


try{


const user =
await verificaLogin();



if(!user)
return;



await caricaTornei();



}

catch(e){


console.error(
"ERRORE VISITATORE:",
e
);



document.getElementById(
"lista-tornei"
).innerHTML=

`

<div class="torneo-item errore">

❌ Errore:

<br>

${e.message}

</div>

`;



}


}





avviaPagina();



</script>
