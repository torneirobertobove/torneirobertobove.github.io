<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tornei Disponibili</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

:root{

--bg-image:url('https://torneirobertobove.github.io/sfondo2.jpg');

}


body{

margin:0;

background-image:var(--bg-image);

background-size:cover;

background-position:center;

background-attachment:fixed;

font-family:sans-serif;

color:white;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}



.box{

width:90%;

max-width:700px;

padding:30px;

border-radius:25px;

background:rgba(255,255,255,0.15);

backdrop-filter:blur(10px);

box-shadow:

0 8px 32px rgba(0,0,0,.4);

}



.logo{

display:block;

width:140px;

margin:0 auto 10px auto;

}



h2{

text-align:center;

margin-top:5px;

}



.torneo-item{

background:rgba(255,255,255,0.12);

padding:20px;

margin:15px 0;

border-radius:15px;

border:1px solid rgba(255,255,255,.2);

}



.torneo-item h3{

color:white;

}



.btn-iscriviti{

background:white;

color:#004a99;

border:0;

padding:13px;

border-radius:10px;

cursor:pointer;

width:100%;

margin-top:10px;

font-size:16px;

font-weight:bold;

}



.btn-iscriviti:disabled{

background:#555;

color:white;

cursor:not-allowed;

}



.lista{

background:rgba(0,0,0,.25);

padding:15px;

margin-top:15px;

border-radius:12px;

}



.lista h4{

margin:0 0 10px 0;

color:#ffeb3b;

}



.squadra{

background:rgba(0,74,153,.6);

padding:12px;

margin-top:8px;

border-radius:10px;

}



.back-btn{

background:#333;

color:white;

border:0;

padding:12px;

width:100%;

border-radius:10px;

margin-top:20px;

cursor:pointer;

font-size:16px;

}



.back-btn:hover{

opacity:.8;

}



.caricamento{

text-align:center;

color:#ffeb3b;

}



.errore{

color:#ff6b6b;

text-align:center;

}


</style>


</head>


<body>


<div class="box">


<img src="logo.jpg" class="logo">


<h2>
🏆 Tornei Disponibili
</h2>


<div id="lista-tornei">


<div class="caricamento">

Caricamento tornei...

</div>


</div>


<button 
class="back-btn" 
onclick="location.href='2Page.html'">

⬅ Torna alla Dashboard

</button>


</div>
<script>

const sb = supabase.createClient(
"https://iybjvtmfaupgthqqsngd.supabase.co",
"sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);


async function caricaTornei(){

const box=document.getElementById(
"lista-tornei"
);

if(!box)return;


box.innerHTML=`

<div class="caricamento">

⏳ Caricamento tornei...

</div>

`;



const {

data,

error

}

=

await sb

.from("tornei")

.select("*")

.eq(
"stato",
"pubblicato"
)

.order(
"data",
{
ascending:true
}
);



console.log(
"TORNEI PUBBLICATI:",
data
);



if(error){


box.innerHTML=`

<div class="torneo-item errore">

❌ Errore caricamento tornei

<br>

${error.message}

</div>

`;

return;

}




if(!data || data.length===0){


box.innerHTML=`

<div class="torneo-item">

Nessun torneo pubblicato trovato

</div>

`;

return;

}




box.innerHTML="";



for(const torneo of data){

await creaSchedaTorneo(torneo);

}


}




async function creaSchedaTorneo(torneo){


const box=document.getElementById(
"lista-tornei"
);



let configurazione =
torneo.configurazione || {};



let numeroSquadre=0;



if(
configurazione.rules &&
configurazione.rules.numeroSquadre
){

numeroSquadre=
Number(
configurazione.rules.numeroSquadre
);

}

else if(configurazione.numeroSquadre){

numeroSquadre=
Number(
configurazione.numeroSquadre
);

}

else if(configurazione.formato){

numeroSquadre=
Number(
configurazione.formato
);

}



if(!numeroSquadre){

numeroSquadre=8;

}




const massimoGiocatori=

Number(torneo.posti)

||

(numeroSquadre*2);





const {

data:iscritti,

error:errorIscritti

}

=

await sb

.from("iscrizioni")

.select(
"id,nome_giocatore,nome,cognome,email,stato"
)

.eq(
"torneo_id",
torneo.id
)

.eq(
"stato",
"approvato"
);





if(errorIscritti){

console.error(
"Errore caricamento iscritti:",
errorIscritti
);

}





const listaIscrittiSafe=

iscritti || [];



const numeroIscritti=

listaIscrittiSafe.length;



const disponibili=

massimoGiocatori-numeroIscritti;



const chiuso=

numeroIscritti>=massimoGiocatori;



let listaIscrittiHTML="";



listaIscrittiSafe.forEach((g,i)=>{


const nomeGiocatore=

g.nome_giocatore

||

(
(g.nome || "")+
" "+
(g.cognome || "")
).trim()

||

"Anonimo";



listaIscrittiHTML +=`

<div style="padding:5px 0;border-bottom:1px solid rgba(255,255,255,.2)">

${i+1}) ${nomeGiocatore}

</div>

`;


});



if(!listaIscrittiHTML){

listaIscrittiHTML=

"<div>Nessun giocatore iscritto</div>";

}




let squadreHTML="";



for(
let i=0;
i<listaIscrittiSafe.length-1;
i+=2
){


const g1=listaIscrittiSafe[i];

const g2=listaIscrittiSafe[i+1];



if(g1 && g2){


const nome1=

g1.nome_giocatore ||

((g1.nome||"")+" "+(g1.cognome||"")).trim();



const nome2=

g2.nome_giocatore ||

((g2.nome||"")+" "+(g2.cognome||"")).trim();



squadreHTML +=`

<div class="squadra">

🎾 Squadra ${Math.floor(i/2)+1}

<br>

<strong>${nome1}</strong>

<br>

+

<br>

<strong>${nome2}</strong>

</div>

`;


}


}





box.innerHTML +=`

<div class="torneo-item">


<h3>

🏆 ${torneo.nome || "Torneo senza nome"}

</h3>



<div>

📅 Data:

${torneo.data || "-"}

</div>



<div>

🎾 Formato:

${numeroSquadre} squadre

</div>



<div>

👥 Iscritti:

${numeroIscritti}/${massimoGiocatori}

</div>



<div style="margin-top:10px;font-weight:bold">

${
chiuso

?

"❌ ISCRIZIONI CHIUSE"

:

"✅ Posti disponibili: "+disponibili

}

</div>



<button

class="btn-iscriviti"

onclick="vaiIscrizione(${torneo.id})"

${chiuso ? "disabled":""}

>

${chiuso ? "Chiuso":"Iscriviti"}

</button>




<div class="lista">

<h4>

👥 Lista iscritti

</h4>

${listaIscrittiHTML}

</div>



<div class="lista">

<h4>

🎾 Squadre create

</h4>

${

squadreHTML ||

"In attesa della prima coppia"

}

</div>



</div>

`;


}





function vaiIscrizione(id){

window.location.href=

"iscrizione.html?torneo="+id;

}





async function avviaPagina(){


try{

await caricaTornei();


}

catch(e){

console.error(
"ERRORE VISITATORE:",
e
);


const box=
document.getElementById(
"lista-tornei"
);


if(box){

box.innerHTML=

`

<div class="torneo-item errore">

❌ ERRORE:

<br>

${e.message}

</div>

`;

}


}


}



avviaPagina();



</script>


</body>

</html>
