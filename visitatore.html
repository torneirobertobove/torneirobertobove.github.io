<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Roberto Bove Padel</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

:root{

--bg-image:url('https://torneirobertobove.github.io/sfondo2.jpg');

--glass:rgba(255,255,255,.15);

--border:rgba(255,255,255,.25);

--blue:#004a99;

--gold:#ffeb3b;

}


*{

box-sizing:border-box;

}



body{

margin:0;

background-image:var(--bg-image);

background-size:cover;

background-position:center;

background-attachment:fixed;

font-family:"Open Sans","Helvetica Neue",Arial,sans-serif;

color:white;

min-height:100vh;

}



.container{

width:95%;

max-width:900px;

margin:auto;

padding:15px;

}



.card{

background:var(--glass);

backdrop-filter:blur(10px);

border:1px solid var(--border);

border-radius:20px;

padding:20px;

margin-bottom:18px;

box-shadow:0 8px 32px rgba(0,0,0,.35);

}



header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

}



.logo{

width:120px;

}



.menu-btn{

background:none;

border:0;

color:white;

font-size:32px;

cursor:pointer;

}



.login-btn{

background:white;

color:var(--blue);

padding:10px 15px;

border-radius:12px;

font-weight:bold;

text-decoration:none;

}



.back-btn{

background:rgba(255,255,255,.9);

color:var(--blue);

border:0;

padding:8px 14px;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}



h1,h2,h3{

text-align:center;

}



.sezione-titolo{

color:var(--gold);

text-align:center;

}



.menu{

position:fixed;

top:0;

left:-300px;

width:280px;

height:100vh;

background:#111827;

padding:25px;

z-index:1000;

transition:.3s;

overflow-y:auto;

}



.menu.aperto{

left:0;

}



.menu a{

display:block;

color:white;

text-decoration:none;

padding:14px 5px;

border-bottom:1px solid rgba(255,255,255,.15);

}



.chiudi{

font-size:25px;

cursor:pointer;

margin-bottom:20px;

}


.news-item{

background:rgba(0,0,0,.25);

padding:15px;

border-radius:12px;

margin-bottom:12px;

}


.torneo-item{

background:rgba(255,255,255,.12);

padding:18px;

border-radius:15px;

margin-bottom:15px;

}


.btn-iscriviti{

width:100%;

background:white;

color:var(--blue);

padding:12px;

border:0;

border-radius:10px;

font-weight:bold;

cursor:pointer;

}


.btn-apri{

width:100%;

background:#16a34a;

color:white;

padding:12px;

border:0;

border-radius:10px;

font-weight:bold;

cursor:pointer;

margin-top:10px;

}


.btn-iscriviti:disabled{

background:#555;

color:white;

}


.hero{

text-align:center;

}


</style>


</head>
<body>


<button class="back-btn" onclick="history.back()">

⬅ Indietro

</button>



<div id="menu" class="menu">


<div class="chiudi" onclick="chiudiMenu()">

✖

</div>



<a href="#">

⌂ Home

</a>



<a href="#tornei">

♛ Tornei

</a>



<a href="#news">

▣ News

</a>



<a href="javascript:apriMercatino()">

□ Mercatino

</a>



<a href="#calendario">

▦ Eventi

</a>



<a href="javascript:apriContatti()">

○ Contatti

</a>


</div>





<div class="container">



<header>


<button class="menu-btn" onclick="apriMenu()">

☰

</button>



<img src="logo.jpg" class="logo">



<a href="index.html" class="login-btn">

👤

</a>



</header>







<div class="card" id="boxUtente">


⏳ Caricamento...


</div>







<div class="card" id="mioTorneo">



<h2 class="sezione-titolo">

🏆 Il mio torneo

</h2>



<div id="contenutoMioTorneo" class="news-item">


Caricamento torneo personale...


</div>



</div>







<div class="card" id="news">



<h2 class="sezione-titolo">

📰 News

</h2>




<div id="listaNewsVisitatore">



<div class="news-item">

Caricamento news...

</div>



</div>



</div>







<div class="card" id="tornei">



<h2 class="sezione-titolo">

🏆 Tornei disponibili

</h2>




<div id="lista-tornei">



<div class="news-item">

Caricamento tornei...

</div>



</div>



</div>







<div class="card" id="calendario">



<h2 class="sezione-titolo">

📅 Calendario eventi

</h2>




<div class="news-item">


Calendario tornei e appuntamenti in aggiornamento.


</div>



</div>





</div>





<script>





const sb = supabase.createClient(


"https://iybjvtmfaupgthqqsngd.supabase.co",


"sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",


{


auth:{


persistSession:true,


autoRefreshToken:true,


detectSessionInUrl:true


}


}


);








function apriMenu(){


const menu=document.getElementById("menu");



if(menu){


menu.classList.add("aperto");


}


}








function chiudiMenu(){


const menu=document.getElementById("menu");



if(menu){


menu.classList.remove("aperto");


}


}








function apriMercatino(){


window.location.href="mercatino.html";


}







function apriContatti(){


window.location.href="contatti.html";


}







    async function caricaNewsVisitatore(){


const box=document.getElementById(
"listaNewsVisitatore"
);



if(!box)return;




const {
data,
error
}=await sb


.from("news")


.select("*")



.eq(
"pubblicata",
true
)



.order(

"created_at",

{

ascending:false

}

);




if(error){


box.innerHTML=`

<div class="news-item">

❌ Errore caricamento news

</div>

`;

return;

}




if(!data || data.length===0){


box.innerHTML=`

<div class="news-item">

Nessuna news disponibile

</div>

`;

return;

}




box.innerHTML=data.map(n=>`


<div class="news-item">


<h3>

${n.titolo || ""}

</h3>



<p>

${n.testo || ""}

</p>



</div>


`).join("");



}









async function caricaTornei(){


const box=document.getElementById(
"lista-tornei"
);



if(!box)return;



const {

data,

error

}=await sb

.from("tornei")

.select("*")

.order(

"data",

{

ascending:true

}

);



if(error){


console.error(
"Errore caricamento tornei:",
error
);


box.innerHTML=`

<div class="torneo-item">

❌ Errore caricamento tornei

</div>

`;

return;

}





const torneiVisibili =

(data || []).filter(t =>

t.pubblicato !== false

);





if(torneiVisibili.length===0){


box.innerHTML=`

<div class="torneo-item">

Nessun torneo disponibile

</div>

`;

return;

}




box.innerHTML="";




torneiVisibili.forEach(torneo=>{



box.innerHTML+=`

<div class="torneo-item">


<h3>

🏆 ${torneo.nome || "Torneo"}

</h3>



<p>

📅 ${torneo.data || "-"}

</p>



<p>

🎾 Formula:

${

torneo.formula ||

torneo.configurazione?.rules?.tipoTorneo ||

"Padel"

}

</p>



<button

class="btn-iscriviti"

onclick="vaiIscrizione('${torneo.id}')"

>

ISCRIVITI

</button>



</div>

`;



});


}





function vaiIscrizione(id){


window.location.href=

"iscrizione.html?torneo="+

encodeURIComponent(id);


}







    async function mostraIlMioTorneo(){


const box=document.getElementById(
"contenutoMioTorneo"
);



if(!box)return;





const {

data:{
user

}

}=await sb.auth.getUser();





if(!user){


box.innerHTML=`

<div class="news-item">

🔐 Effettua il login per visualizzare il tuo torneo.

</div>

`;

return;

}







const {

data,

error

}=await sb


.from("iscrizioni")


.select(`

id,

torneo_id,

stato,


tornei(

id,

nome,

data,

formula,

configurazione

)

`)



.eq(

"user_id",

user.id

)

.order(

"data_iscrizione",

{

ascending:false

}

);







if(error){


console.error(

"Errore ricerca iscrizione:",

error

);



box.innerHTML=`

<div class="news-item">

❌ Errore caricamento iscrizione

</div>

`;

return;

}







if(!data || data.length===0){


box.innerHTML=`

<div class="news-item">

Non risulti iscritto a nessun torneo.

</div>

`;

return;

}








const iscrizione=data[0];



const torneo=iscrizione.tornei;







if(!torneo){


box.innerHTML=`

<div class="news-item">

❌ Torneo non trovato.

</div>

`;

return;

}









box.innerHTML=`


<div class="news-item">


<h3>

🏆 ${torneo.nome || "Torneo"}

</h3>





<p>

📅 ${torneo.data || "-"}

</p>





<p>

🎾 ${

torneo.formula ||

torneo.configurazione?.rules?.tipoTorneo ||

"Padel"

}

</p>





<p>

📌 Stato:

${iscrizione.stato || "iscritto"}

</p>





<button

class="btn-apri"

onclick='apriMioTorneo(${JSON.stringify(torneo)})'

>

🚀 Apri torneo

</button>





</div>


`;



}









function apriMioTorneo(torneo){



if(!torneo || !torneo.id){


alert(
"Torneo non valido"
);


return;

}






let dati={



idTorneo:

torneo.id,



nomeTorneo:

torneo.nome || "",



dataTorneo:

torneo.data || "",



formula:

torneo.formula || "",



configurazione:

torneo.configurazione || {}



};






/*

    APERTURA BOVE

    usa lo stesso formato
    usato da generaLinkBove()

*/



window.location.href=



"Bove.html?torneo="+



encodeURIComponent(

JSON.stringify(dati)

);



}
    async function caricaBoxUtente(){


const box=document.getElementById(
"boxUtente"
);



if(!box)return;





try{



const {

data

}=await sb.auth.getSession();





const sessione=data.session;






if(!sessione || !sessione.user){



box.innerHTML=`


<div class="news-item">


👤 Accesso non effettuato


<br><br>


Accedi per visualizzare iscrizioni e tornei personali.


</div>


`;



return;


}






const user=sessione.user;






box.innerHTML=`


<div class="news-item">


👤 Utente collegato


<br><br>


${user.email || ""}


</div>


`;





}



catch(e){



console.error(

"Errore caricamento sessione:",

e

);




box.innerHTML=`


<div class="news-item">


❌ Errore caricamento profilo


</div>


`;



}



}









async function avviaPagina(){



console.log(

"Avvio visitatore"

);






try{



await caricaBoxUtente();



}
catch(e){

console.error(

"Errore box utente:",

e

);

}







try{



await mostraIlMioTorneo();



}
catch(e){


console.error(

"Errore mio torneo:",

e

);


}







try{



await caricaNewsVisitatore();



}
catch(e){


console.error(

"Errore news:",

e

);


}







try{



await caricaTornei();



}
catch(e){


console.error(

"Errore tornei:",

e

);


}







console.log(

"Pagina visitatore caricata"

);



}






window.addEventListener(

"load",

avviaPagina

);
    
// CONTROLLO SUPABASE

if(typeof supabase==="undefined"){

console.error(
"Supabase non caricato"
);

}



// CONTROLLO GENERALE PAGINA


window.addEventListener(

"error",

function(e){


console.error(

"Errore pagina visitatore:",

e.message

);


}

);



// CONTROLLO PROMISE NON GESTITE


window.addEventListener(

"unhandledrejection",

function(e){


console.error(

"Errore asincrono visitatore:",

e.reason

);


}

);



</script>


</body>


</html>
