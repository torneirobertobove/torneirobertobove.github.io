<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Accesso Torneo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:system-ui;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.card{

    background:#111827;
    padding:30px;
    border-radius:15px;
    border:1px solid #243041;
    width:90%;
    max-width:400px;
    text-align:center;

}

button{

    width:100%;
    padding:15px;
    margin:10px 0;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;

}

.login{

    background:#10b981;
    color:white;

}

.registra{

    background:#2563eb;
    color:white;

}

h2{

    color:#10b981;

}

</style>

</head>


<body>


<div class="card">


<h2>
🏆 Torneo Padel Manager
</h2>


<p>
Accedi alla piattaforma
</p>



<button class="login"
onclick="location.href='login.html'">

🔐 Accedi

</button>



<button class="registra"
onclick="location.href='registrazione.html'">

📝 Registrati

</button>



</div>


</body>

</html>
