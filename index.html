<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roberto Bove Padel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
--bg-image:url('sfondo2.jpg');
}

body{

margin:0;

background-image:var(--bg-image);
background-size:cover;
background-position:center;
background-attachment:fixed;

font-family:sans-serif;

color:white;

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

}


.box{

width:350px;

padding:30px;

border-radius:25px;

background:rgba(255,255,255,0.15);

backdrop-filter:blur(10px);

box-shadow:
0 8px 32px rgba(0,0,0,.4);

text-align:center;

}


.logo{

width:140px;

margin-bottom:10px;

}


.firma{

font-style:italic;

font-size:.85rem;

margin-bottom:20px;

opacity:.9;

display:block;

}


input{

width:100%;

box-sizing:border-box;

padding:10px;

margin:7px 0;

border-radius:8px;

border:none;

color:#333;

}


.buttons{

display:flex;

gap:10px;

margin-top:15px;

}


.btn{

flex:1;

padding:13px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

background:white;

color:#004a99;

}


#status{

margin-top:15px;

min-height:20px;

color:#ffeb3b;

font-size:14px;

}


</style>

</head>


<body>


<div class="box">


<img src="logo.jpg" class="logo">


<span class="firma">

Roberto Bove<br>
Director & Event Organizer

</span>


<input
id="email"
type="email"
placeholder="Email">


<input
id="password"
type="password"
placeholder="Password">


<div class="buttons">


<button
class="btn"
id="loginBtn">

ACCEDI

</button>


<button
class="btn"
id="registerBtn">

REGISTRATI

</button>


</div>


<div id="status"></div>


</div>



<script>


const sb =
supabase.createClient(

"https://iybjvtmfaupgthqqsngd.supabase.co",

"sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl"

);



const status =
document.getElementById("status");



document
.getElementById("registerBtn")
.addEventListener(
"click",
async()=>{


const email =
document
.getElementById("email")
.value
.trim();



const password =
document
.getElementById("password")
.value;



if(!email || !password){

status.innerHTML=
"Inserisci email e password";

return;

}



status.innerHTML=
"Registrazione in corso...";



const {error}=

await sb.auth.signUp({

email,

password

});



if(error){

status.innerHTML=
"Errore: "+error.message;

return;

}



status.innerHTML=
"Registrazione completata. Ora puoi accedere.";


});





document
.getElementById("loginBtn")
.addEventListener(
"click",
async()=>{


const email =
document
.getElementById("email")
.value
.trim();



const password =
document
.getElementById("password")
.value;



if(!email || !password){

status.innerHTML=
"Inserisci email e password";

return;

}



status.innerHTML=
"Accesso in corso...";



const {error}=

await sb.auth.signInWithPassword({

email,

password

});



if(error){

status.innerHTML=
error.message;

return;

}



window.location.href=
"2Page.html";



});



</script>


</body>
</html>
