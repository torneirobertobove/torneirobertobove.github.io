<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next Point Padel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
--bg-image:url('sfondo2.jpg');
--blue:#004a99;
--gold:#ffeb3b;
--glass:rgba(255,255,255,.15);
--border:rgba(255,255,255,.25);
}

*{
box-sizing:border-box;
}

body{

margin:0;

background-image:var(--bg-image);
background-size:cover;
background-position:center;
background-attachment:fixed;

font-family:Arial,Helvetica,sans-serif;

color:white;

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

}


.container{

width:100%;
max-width:430px;

}



.box{

background:var(--glass);

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

border:1px solid var(--border);

border-radius:25px;

padding:30px;

box-shadow:
0 8px 32px rgba(0,0,0,.45);

text-align:center;

}



.logo{

width:150px;

margin-bottom:10px;

}



.club-name{

font-size:28px;

font-weight:bold;

margin:5px 0;

text-transform:uppercase;

}



.subtitle{

font-size:15px;

opacity:.9;

margin-bottom:20px;

}



.contacts{

font-size:14px;

line-height:1.7;

margin-bottom:20px;

}



.contacts a{

color:white;

text-decoration:none;

}



.title-login{

font-size:22px;

font-weight:bold;

margin:15px 0;

}



input{

width:100%;

padding:13px;

margin:8px 0;

border-radius:10px;

border:none;

font-size:15px;

color:#333;

}



.remember{

display:flex;

align-items:center;

justify-content:left;

gap:8px;

font-size:14px;

margin:12px 0;

}



.remember input{

width:auto;

margin:0;

}



.link{

color:white;

font-size:14px;

cursor:pointer;

text-decoration:underline;

margin:8px 0;

display:block;

}



.buttons{

display:flex;

gap:10px;

margin-top:15px;

}



.btn{

flex:1;

padding:13px;

border:none;

border-radius:12px;

background:white;

color:var(--blue);

font-weight:bold;

cursor:pointer;

font-size:14px;

}



.btn-reset{

width:100%;

margin-top:10px;

}


  .footer{

margin-top:20px;

padding-top:15px;

border-top:1px solid rgba(255,255,255,.25);

font-size:12px;

opacity:.9;

line-height:1.7;

}



.footer strong{

font-size:14px;

}


#status{

margin-top:15px;

min-height:20px;

color:var(--gold);

font-size:14px;

}

</style>

</head>

<body>


<div class="container">


<div class="box">



<img src="logo.jpg" class="logo">



<div class="club-name">

NEXT POINT PADEL

</div>



<div class="subtitle">

Tornei • Eventi • Competizioni di padel

</div>




<div class="title-login">

Accesso utenti

</div>


<input
id="email"
type="email"
placeholder="Email o cellulare">



<input
id="password"
type="password"
placeholder="Password">



<label class="remember">

<input
id="ricordami"
type="checkbox">

Resta connesso

</label>



<a class="link"
onclick="resetPassword()">

Hai dimenticato la password?

</a>




<div class="buttons">



<button
class="btn"
id="loginBtn">

ACCEDI

</button>



<button
class="btn"
id="registerBtn">

REGISTRATI

</button>



</div>




<button
class="btn btn-reset"
onclick="resetPassword()">

RESET PASSWORD

</button>




<div class="link">

Non sei iscritto? Registrati

</div>



<div id="status"></div>


<div class="footer">


<div class="contacts">

✉ <a href="mailto:info@nextpointpadel.it">
info@nextpointpadel.it
</a>

<br>

📞 +39 333444556

</div>


<br>


Cookie policy |

Privacy policy |

Condizioni d'uso |

Regolamento del Club


<br><br>


Copyright © 2026

<br>

NEXT POINT PADEL


</div>


</div>


</div>




<script>


const sb =
supabase.createClient(

"https://iybjvtmfaupgthqqsngd.supabase.co",

"sb_publishable_oLLML3_ne0I1dWKIinSRNA_K1Ao5SOl",

{

auth:{

persistSession:true,

autoRefreshToken:true,

detectSessionInUrl:true

}

}

);



const status =
document.getElementById("status");



document
.getElementById("registerBtn")
.addEventListener(

"click",

async()=>{


const email =
document
.getElementById("email")
.value
.trim();



const password =
document
.getElementById("password")
.value;



if(!email || !password){


status.innerHTML=

"Inserisci email e password";


return;


}



status.innerHTML=

"Registrazione in corso...";



const {

error

}

=

await sb.auth.signUp({

email,

password

});



if(error){


status.innerHTML=

"Errore: "+error.message;


return;


}



status.innerHTML=

"Registrazione completata. Ora puoi accedere.";


});



document
.getElementById("loginBtn")
.addEventListener(

"click",

async()=>{


const email =
document
.getElementById("email")
.value
.trim();



const password =
document
.getElementById("password")
.value;



if(!email || !password){


status.innerHTML=

"Inserisci email e password";


return;


}



status.innerHTML=

"Accesso in corso...";



const {

error

}

=

await sb.auth.signInWithPassword({

email,

password

});



if(error){


status.innerHTML=

error.message;


return;


}



window.location.href=

"2Page.html";


});




async function resetPassword(){


const email =
document
.getElementById("email")
.value
.trim();



if(!email){


status.innerHTML=

"Inserisci prima la tua email";


return;


}



status.innerHTML=

"Invio richiesta reset password...";



const {

error

}

=

await sb.auth.resetPasswordForEmail(

email,

{

redirectTo:

window.location.origin+

"/reset-password.html"

}

);



if(error){


status.innerHTML=

"Errore: "+error.message;


return;


}



status.innerHTML=

"✅ Controlla la tua email per reimpostare la password";


}



</script>


</body>

</html>
